function drawPiggySprite(x, y, facing, state) {
  ctx.save();
  ctx.translate(x, y);

  // Flip based on direction (default faces right)
  const dir = facing >= 0 ? 1 : -1;
  ctx.scale(dir, 1);

  // State-based modifiers
  let bodyColor = '#FFB6C1';
  let bodyDark = '#FF9CAD';
  if (state === 'scared') {
    bodyColor = '#FFD0D0';
  } else if (state === 'happy') {
    bodyColor = '#FFB0D0';
  } else if (state === 'farting') {
    bodyColor = '#CCFF99';
  }

  // BODY - oval shape
  ctx.fillStyle = bodyColor;
  ctx.beginPath();
  ctx.ellipse(0, 0, 28, 20, 0, 0, Math.PI * 2);
  ctx.fill();
  // Darker bottom half for 3D effect
  ctx.fillStyle = bodyDark;
  ctx.beginPath();
  ctx.ellipse(0, 5, 26, 12, 0, 0, Math.PI);
  ctx.fill();

  // COIN SLOT on top
  ctx.fillStyle = '#333';
  ctx.fillRect(-8, -22, 16, 3);
  ctx.fillStyle = '#555';
  ctx.fillRect(-6, -21, 12, 1);

  // LEGS (2 front, 2 back - offset for depth)
  // Tuck legs when airborne (60% height)
  const legH = player.grounded ? 12 : 7;
  const legOff = player.grounded ? 0 : 2; // pull up slightly when airborne
  ctx.fillStyle = '#FF9CAD';
  // Back legs (slightly behind)
  ctx.fillRect(-15, 12 + legOff, 7, legH);
  ctx.fillRect(8, 12 + legOff, 7, legH);
  // Front legs (slightly in front, darker)
  ctx.fillStyle = bodyDark;
  ctx.fillRect(-18, 14 + legOff, 7, legH);
  ctx.fillRect(11, 14 + legOff, 7, legH);
  // Hooves
  ctx.fillStyle = '#8B4513';
  ctx.fillRect(-18, 14 + legOff + legH - 1, 7, 3);
  ctx.fillRect(11, 14 + legOff + legH - 1, 7, 3);
  ctx.fillRect(-15, 12 + legOff + legH - 1, 7, 3);
  ctx.fillRect(8, 12 + legOff + legH - 1, 7, 3);

  // TAIL (curly!) - at the back
  ctx.strokeStyle = '#FF9CAD';
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-28, -5);
  ctx.quadraticCurveTo(-35, -15, -30, -18);
  ctx.quadraticCurveTo(-25, -21, -32, -12);
  ctx.stroke();

  // HEAD/SNOUT - protruding from front
  ctx.fillStyle = bodyColor;
  ctx.beginPath();
  ctx.arc(25, -5, 14, 0, Math.PI * 2);
  ctx.fill();

  // Snout (protruding oval)
  ctx.fillStyle = '#FFa0b0';
  ctx.beginPath();
  ctx.ellipse(35, -2, 9, 7, 0, 0, Math.PI * 2);
  ctx.fill();
  // Nostrils
  ctx.fillStyle = '#c06070';
  ctx.beginPath();
  ctx.ellipse(33, -3, 2, 2.5, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(37, -3, 2, 2.5, 0, 0, Math.PI * 2);
  ctx.fill();

  // EYES
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(28, -10, 5, 0, Math.PI * 2);
  ctx.fill();
  // Black pupil (moves slightly with facing)
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(29 + dir * 1, -10, 2.5, 0, Math.PI * 2);
  ctx.fill();
  // Eye highlight
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(30, -11.5, 1, 0, Math.PI * 2);
  ctx.fill();

  // Scared state: sweat drop, wider eyes
  if (state === 'scared') {
    ctx.fillStyle = '#66ccff';
    ctx.beginPath();
    ctx.moveTo(22, -18);
    ctx.quadraticCurveTo(20, -13, 22, -12);
    ctx.quadraticCurveTo(24, -13, 22, -18);
    ctx.fill();
  }

  // EARS - pointed triangles on top of head
  ctx.fillStyle = bodyColor;
  ctx.beginPath();
  ctx.moveTo(19, -16);
  ctx.lineTo(17, -28);
  ctx.lineTo(25, -18);
  ctx.closePath();
  ctx.fill();
  // Inner ear
  ctx.fillStyle = '#FF8CA0';
  ctx.beginPath();
  ctx.moveTo(20, -17);
  ctx.lineTo(18.5, -25);
  ctx.lineTo(24, -18);
  ctx.closePath();
  ctx.fill();

  // Second ear (behind, slightly visible)
  ctx.fillStyle = bodyDark;
  ctx.beginPath();
  ctx.moveTo(22, -16);
  ctx.lineTo(22, -27);
  ctx.lineTo(28, -17);
  ctx.closePath();
  ctx.fill();

  ctx.restore();
}

function drawPiggy() {
  const bobOffset = Math.sin(piggyBobTimer * 3) * 2; // subtle idle bob
  const poopSquat = isPooping ? 8 : 0; // squat down when pooping
  const drawY = player.y + shakeVisualOffset + bobOffset + poopSquat;

  ctx.save();
  ctx.translate(player.x, drawY);

  // Wobble for 2 cracks
  if (game.cracks >= 2) {
    const wobble = Math.sin(Date.now() / 80) * 0.06;
    ctx.rotate(wobble);
  }

  // Scale pulse on damage
  let scale = 1.0;
  if (piggyDamageTimer > 0) {
    scale = 1.0 + 0.15 * Math.sin(piggyDamageTimer / 0.3 * Math.PI);
  }
  ctx.scale(scale, scale);

  // Red tint overlay for damage
  if (piggyDamageTimer > 0) {
    ctx.globalAlpha = 0.7;
  }

  // Strained red tint when pooping
  if (isPooping) {
    ctx.globalAlpha = 0.85;
  }

  // Determine piggy state
  const piggyState = game.latchedDevil ? 'scared' : piggyDamageTimer > 0 ? 'scared' : isPooping ? 'scared' : 'normal';

  // Draw the hand-drawn piggy sprite
  drawPiggySprite(0, 0, player.facingSmooth, piggyState);
  ctx.globalAlpha = 1.0;

  // Red strain overlay when pooping
  if (isPooping) {
    ctx.globalAlpha = 0.25;
    ctx.fillStyle = '#cc3300';
    ctx.beginPath();
    ctx.arc(0, 0, 24, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1.0;
  }

  // Draw crack lines
  if (game.cracks >= 1) {
    ctx.strokeStyle = '#555';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-8, -12);
    ctx.lineTo(10, 10);
    ctx.stroke();
  }
  if (game.cracks >= 2) {
    ctx.strokeStyle = '#444';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(8, -14);
    ctx.lineTo(-6, 8);
    ctx.stroke();
  }

  ctx.restore();

  // Red tint flash on damage
  if (piggyDamageTimer > 0) {
    ctx.globalAlpha = piggyDamageTimer / 0.3 * 0.3;
    ctx.fillStyle = '#ff0000';
    ctx.beginPath();
    ctx.arc(player.x, drawY, 28, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1.0;
  }
}

function drawHUD() {
  // --- HUD with drop shadows and polished styling ---

  // Helper for drop shadow text
  function hudText(text, x, y, font, color, align) {
    ctx.textAlign = align || 'left';
    ctx.textBaseline = 'top';
    ctx.font = font;
    // Drop shadow
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fillText(text, x + 1, y + 2);
    // Main text
    ctx.fillStyle = color;
    ctx.fillText(text, x, y);
  }

  // Top-left: Score with bouncing coin icon
  const coinBounce = Math.sin(Math.max(0, scoreBounceFactor) * Math.PI) * 5;
  hudText('\u{1FA99}', 15, 12 - coinBounce, 'bold 24px sans-serif', '#fff', 'left');
  hudText(' Score: ' + game.score, 38, 14, 'bold 22px sans-serif', '#fff', 'left');

  // Top-center: Level with rounded background
  ctx.textAlign = 'center';
  const levelText = 'Level ' + game.level;
  ctx.font = 'bold 22px sans-serif';
  const levelTextW = ctx.measureText(levelText).width;
  // Rounded background pill
  const pillX = WIDTH / 2 - levelTextW / 2 - 14;
  const pillY = 8;
  const pillW = levelTextW + 28;
  const pillH = 28;
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.roundRect(pillX, pillY, pillW, pillH, 14);
  ctx.fill();
  hudText(levelText, WIDTH / 2, 10, 'bold 22px sans-serif', '#fff', 'center');

  // Timer bar below level text
  if (game.levelConfig) {
    const timerBarWidth = 160;
    const timerBarHeight = 10;
    const timerBarX = WIDTH / 2 - timerBarWidth / 2;
    const timerBarY = 40;
    const timerFill = Math.max(0, game.levelTimer / game.levelConfig.duration);

    ctx.fillStyle = '#333';
    ctx.beginPath();
    ctx.roundRect(timerBarX, timerBarY, timerBarWidth, timerBarHeight, 5);
    ctx.fill();

    let barColor;
    if (timerFill > 0.5) barColor = '#44cc44';
    else if (timerFill > 0.2) barColor = '#cccc44';
    else barColor = '#cc4444';

    ctx.fillStyle = barColor;
    ctx.beginPath();
    ctx.roundRect(timerBarX, timerBarY, timerBarWidth * timerFill, timerBarHeight, 5);
    ctx.fill();

    ctx.strokeStyle = 'rgba(0,0,0,0.3)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.roundRect(timerBarX, timerBarY, timerBarWidth, timerBarHeight, 5);
    ctx.stroke();

    // Time remaining
    hudText(Math.ceil(game.levelTimer) + 's', WIDTH / 2, 54, '14px sans-serif', 'rgba(255,255,255,0.8)', 'center');
  }

  // Top-right: Crack indicator with piggy icons
  ctx.textAlign = 'right';
  ctx.textBaseline = 'top';
  const crackStartX = WIDTH - 15;
  ctx.font = '22px sans-serif';
  for (let i = 0; i < 3; i++) {
    const cx = crackStartX - (2 - i) * 28;
    if (i < game.cracks) {
      // Cracked piggy (broken heart)
      ctx.globalAlpha = 0.9;
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.fillText('\u{1F494}', cx + 1, 16);
      ctx.fillText('\u{1F494}', cx, 14);
    } else {
      // Healthy piggy
      ctx.globalAlpha = 0.9;
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.fillText('\u{1F437}', cx + 1, 16);
      ctx.fillText('\u{1F437}', cx, 14);
    }
  }
  ctx.globalAlpha = 1.0;

  // Fart meter (below score)
  const fartY = 48;
  hudText('\u{1F4A8} ', 15, fartY, '20px sans-serif', '#88cc44', 'left');
  for (let i = 0; i < MAX_FARTS; i++) {
    const fx = 42 + i * 22;
    if (i < fartCharges) {
      // Full charge - green cloud
      ctx.fillStyle = '#66cc33';
      ctx.beginPath();
      ctx.arc(fx, fartY + 10, 8, 0, Math.PI * 2);
      ctx.fill();
      ctx.font = '12px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('\u{1F4A8}', fx, fartY + 10);
    } else {
      // Empty - gray circle
      ctx.fillStyle = 'rgba(100,100,100,0.4)';
      ctx.beginPath();
      ctx.arc(fx, fartY + 10, 8, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  // Show corn hint when low on farts
  if (fartCharges === 0) {
    const blink = Math.sin(Date.now() / 300) > 0;
    if (blink) {
      hudText('Uhvati \u{1F33D}!', 155, fartY + 2, 'bold 16px sans-serif', '#ffcc00', 'left');
    }
  }

  // Poop cooldown indicator
  if (poopCooldown > 0) {
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(WIDTH - 90, 95, 80, 12);
    ctx.fillStyle = '#886600';
    ctx.fillRect(WIDTH - 90, 95, 80 * (1 - poopCooldown / POOP_COOLDOWN), 12);
    ctx.font = '10px sans-serif';
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('\u{1F4A9} ' + Math.ceil(poopCooldown) + 's', WIDTH - 50, 101);
  } else if (game.level >= 3) {
    // Show ready indicator when poop is available (from level 3+)
    ctx.font = '10px sans-serif';
    ctx.fillStyle = '#886600';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('\u{1F4A9} OK', WIDTH - 50, 101);
  }

  // BTC display (below fart meter)
  ctx.font = 'bold 14px sans-serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.fillText('\u20BF ' + playerBTC, 16, 76);
  ctx.fillStyle = '#F7931A';
  ctx.fillText('\u20BF ' + playerBTC, 15, 75);

  // Player name (top-right, below crack indicators)
  if (playerName) {
    ctx.font = '12px sans-serif';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'top';
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fillText(playerName, WIDTH - 16, 46);
    ctx.fillStyle = '#aaa';
    ctx.fillText(playerName, WIDTH - 15, 45);
  }

  // Active shield indicator
  if (hasShield) {
    ctx.font = '18px sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillText('\uD83D\uDEE1\uFE0F', 155, 73);
  }
}

function drawShop() {
  // Dark background
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0, 0, WIDTH, HEIGHT);

  // Title
  ctx.font = 'bold 36px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#FFD700';
  ctx.fillText('\uD83C\uDFEA BANKA & SHOP', WIDTH / 2, 45);

  // BTC balance
  ctx.font = 'bold 24px sans-serif';
  ctx.fillStyle = '#F7931A';
  ctx.fillText('\u20BF ' + playerBTC + ' Bitcoin', WIDTH / 2, 80);

  // Item cards
  var cardW = 140;
  var cardH = 160;
  var startX = (WIDTH - SHOP_ITEMS.length * (cardW + 10)) / 2;

  for (var i = 0; i < SHOP_ITEMS.length; i++) {
    var item = SHOP_ITEMS[i];
    var x = startX + i * (cardW + 10);
    var y = 110;
    var canBuy = playerBTC >= item.cost;

    // Card background
    ctx.fillStyle = canBuy ? 'rgba(255,255,255,0.1)' : 'rgba(255,255,255,0.03)';
    ctx.fillRect(x, y, cardW, cardH);
    ctx.strokeStyle = canBuy ? '#FFD700' : '#333';
    ctx.lineWidth = 2;
    ctx.strokeRect(x, y, cardW, cardH);

    // Icon
    ctx.font = '36px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(item.icon, x + cardW / 2, y + 40);

    // Name
    ctx.font = 'bold 13px sans-serif';
    ctx.fillStyle = canBuy ? '#fff' : '#555';
    ctx.fillText(item.name, x + cardW / 2, y + 65);

    // Description
    ctx.font = '11px sans-serif';
    ctx.fillStyle = canBuy ? '#aaa' : '#444';
    ctx.fillText(item.desc, x + cardW / 2, y + 82);

    // Price
    ctx.font = 'bold 16px sans-serif';
    ctx.fillStyle = canBuy ? '#F7931A' : '#553300';
    ctx.fillText('\u20BF ' + item.cost, x + cardW / 2, y + 110);

    // Buy button
    if (canBuy) {
      ctx.fillStyle = '#F7931A';
      ctx.fillRect(x + 20, y + 125, cardW - 40, 28);
      ctx.fillStyle = '#000';
      ctx.font = 'bold 13px sans-serif';
      ctx.fillText('KUPI', x + cardW / 2, y + 143);
    }

    // Store rect for click detection
    item._rect = { x: x + 20, y: y + 125, w: cardW - 40, h: 28 };
  }

  // Skip button
  ctx.font = 'bold 20px sans-serif';
  ctx.fillStyle = '#4CAF50';
  var skipY = HEIGHT - 60;
  ctx.fillText('\u25B6 Nastavi na Level ' + (game.level + 1), WIDTH / 2, skipY);
  shopSkipRect = { x: WIDTH / 2 - 150, y: skipY - 20, w: 300, h: 35 };

  // Active power-ups display
  ctx.font = '14px sans-serif';
  ctx.fillStyle = '#aaa';
  ctx.textAlign = 'center';
  var activeText = 'Aktivno: ';
  if (scoreMultiplier > 1) activeText += '2x Score ';
  if (hasShield) activeText += '\uD83D\uDEE1\uFE0F ';
  if (turboFart) activeText += '\uD83D\uDCA8\uD83D\uDCA8 ';
  if (megaPoop) activeText += '\uD83D\uDCA9\uD83D\uDCA9 ';
  if (activeText === 'Aktivno: ') activeText += 'ni\u0161ta';
  ctx.fillText(activeText, WIDTH / 2, HEIGHT - 25);
}

function handleShopClick(e) {
  var rect = canvas.getBoundingClientRect();
  var clickX = (e.clientX - rect.left) * (WIDTH / rect.width);
  var clickY = (e.clientY - rect.top) * (HEIGHT / rect.height);

  // Check item buy buttons
  for (var si = 0; si < SHOP_ITEMS.length; si++) {
    var item = SHOP_ITEMS[si];
    if (item._rect && playerBTC >= item.cost) {
      var r = item._rect;
      if (clickX >= r.x && clickX <= r.x + r.w && clickY >= r.y && clickY <= r.y + r.h) {
        playerBTC -= item.cost;
        item.effect();
        return;
      }
    }
  }

  // Check skip button
  if (shopSkipRect) {
    var sr = shopSkipRect;
    if (clickX >= sr.x && clickX <= sr.x + sr.w && clickY >= sr.y && clickY <= sr.y + sr.h) {
      game.level++;
      startLevel();
    }
  }
}

canvas.addEventListener('click', function(e) {
  if (game.screen === 'shop') {
    handleShopClick(e);
  }
});

function draw() {
  if (game.screen === 'nameInput') {
    // nameInput uses HTML overlay, just draw dark background
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, 0, WIDTH, HEIGHT);
    return;
  }
  if (game.screen === 'intro') {
    drawIntro();
    return;
  }

  drawBackground();

  if (game.screen === 'title') {
    drawTitle();
  } else if (game.screen === 'playing') {
    drawPlayingScene();
  } else if (game.screen === 'levelComplete') {
    drawLevelComplete();
  } else if (game.screen === 'gameOver') {
    drawGameOver();
  } else if (game.screen === 'victory') {
    drawVictory();
  } else if (game.screen === 'shop') {
    drawShop();
  }

  // Pause overlay (drawn on top of everything)
  drawPauseMenu();
}

  ctx.beginPath();
  ctx.ellipse(0, -12, 8, 5, 0, 0, Math.PI * 2);

  ctx.beginPath();
  ctx.arc(3, -12, 1.5, 0, Math.PI * 2);

  ctx.beginPath();

  ctx.beginPath();
  ctx.arc(8, -21.5, 1, 0, Math.PI * 2);

  ctx.beginPath();

  ctx.fill();
  ctx.beginPath();

  ctx.lineTo(14, -38);
  ctx.lineTo(5, -29);
  ctx.closePath();
  ctx.fill();
  // Waving arm/hoof

  ctx.rotate(waveAngle - 0.8);

function getLevelEndText(level) {
  const texts = {
    1: { main: 'JUHUU! Jo\u0161 sam \u017Eiva! \u{1F389}', sub: 'Mislio sam da ne\u0107u pre\u017Eiveti ni prvi dan...' },
    2: { main: 'Pre\u017Eivesmo i ovo! *prrrrc* \u{1F4A8}', sub: 'Izvini za smrad, od straha je...' },
    3: { main: 'Ha! Prevarila sam ih! \u{1F92A}', sub: 'Glumila sam mrtvu, a oni poverovali!' },
    4: { main: 'Ko je car? JA sam car! \u{1F451}', sub: 'Neka mi neko da krunu!' },
    5: { main: 'Moji dragi nov\u010Di\u0107i... \u{1F495}', sub: 'Ne brinite, ja \u0107u vas \u010Duvati!' },
    6: { main: 'Njanjanja! Nisi me uhvatio! \u{1F61D}', sub: 'Be\u017Ei kasapine, be\u017Ei!' },
  };
  const lvl7plus = [
    { main: 'L-E-G-E-N-D-A! \u{1F3C6}', sub: 'Ovo ni Chuck Norris ne bi pre\u017Eiveo!' },
    { main: 'NEUNI\u0160TIVA! \u{1F4AA}', sub: 'Kasica za predsednika!' },
    { main: 'BESMRTNA! \u2B50', sub: 'Ovo zaslu\u017Euje Oskara!' },
    { main: 'NEPOKOLEBLJIVA! \u{1F525}', sub: '\u010Cak se i \u0111avoli pla\u0161e mene!' },
  ];
  if (texts[level]) return texts[level];
  return lvl7plus[(level - 7) % lvl7plus.length];
}

function drawLevelEndAnimation(level, timer) {
  const pigX = WIDTH / 2;
  const pigY = HEIGHT / 2 + 30;

  switch (level) {
    case 1: {
      // Bouncing piggy
      const bounceY = -Math.abs(Math.sin(timer * 4)) * (20 + timer * 5);
      drawPiggySprite(pigX, pigY + bounceY, 0, 'happy');
      break;
    }
    case 2: {
      // Farting piggy with growing green cloud
      drawPiggySprite(pigX, pigY, 0, 'farting');
      // Growing green cloud
      const cloudSize = Math.min(timer * 40, 120);
      const cloudGrad = ctx.createRadialGradient(pigX, pigY + 10, 0, pigX, pigY + 10, cloudSize);
      cloudGrad.addColorStop(0, 'rgba(80, 180, 30, 0.4)');
      cloudGrad.addColorStop(0.6, 'rgba(100, 200, 40, 0.2)');
      cloudGrad.addColorStop(1, 'rgba(120, 220, 50, 0)');
      ctx.fillStyle = cloudGrad;
      ctx.beginPath();
      ctx.arc(pigX - 20, pigY + 10, cloudSize, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(pigX + 15, pigY + 15, cloudSize * 0.8, 0, Math.PI * 2);
      ctx.fill();
      // Stink lines
      ctx.font = '20px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      for (let i = 0; i < 4; i++) {
        const angle = timer * 2 + i * 1.5;
        ctx.globalAlpha = 0.5;
        ctx.fillText('\u{1F4A8}', pigX - 30 + Math.cos(angle) * cloudSize * 0.5, pigY + Math.sin(angle) * cloudSize * 0.3);
      }
      ctx.globalAlpha = 1.0;
      break;
    }
    case 3: {
      // Play dead then spring up
      if (timer < 1.5) {
        // Lying on side with X eyes
        ctx.save();
        ctx.translate(pigX, pigY);
        ctx.rotate(Math.PI / 2);
        drawPiggySprite(0, 0, 0, 'normal');
        ctx.restore();
        // X eyes
        ctx.font = 'bold 16px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillStyle = '#000';
        ctx.fillText('X  X', pigX + 5, pigY - 10);
      } else {
        // Spring up!
        const springT = timer - 1.5;
        const springY = -Math.abs(Math.sin(springT * 6)) * 30;
        const springAngle = Math.sin(springT * 8) * 0.2;
        ctx.save();
        ctx.translate(pigX, pigY + springY);
        ctx.rotate(springAngle);
        drawPiggySprite(0, 0, 0, 'happy');
        ctx.restore();
        // Surprise effect
        if (springT < 0.5) {
          ctx.font = '30px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('\u2757', pigX + 30, pigY - 40 + springY);
        }
      }
      break;
    }
    case 4: {
      // Victory dance - sway left and right
      const swayX = Math.sin(timer * 3) * 30;
      const scalePulse = 1 + Math.sin(timer * 6) * 0.1;
      ctx.save();
      ctx.translate(pigX + swayX, pigY);
      ctx.scale(scalePulse, scalePulse);
      drawPiggySprite(0, 0, Math.sin(timer * 3), 'happy');
      ctx.restore();
      // Crown
      ctx.font = '30px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('\u{1F451}', pigX + swayX, pigY - 40);
      break;
    }
    case 5: {
      // Hugging coins
      drawPiggySprite(pigX, pigY, 1, 'happy');
      // Pile of coins
      ctx.font = '24px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const coinEmojis = ['\u{1FA99}', '\u{1F4B0}', '\u{1F4B5}', '\u{1FA99}', '\u{1FA99}'];
      for (let i = 0; i < coinEmojis.length; i++) {
        const cx = pigX + 40 + (i % 3) * 15 - 10;
        const cy = pigY + 10 - Math.floor(i / 3) * 20;
        ctx.fillText(coinEmojis[i], cx, cy);
      }
      // Hearts
      if (timer > 0.5) {
        ctx.font = '18px sans-serif';
        for (let i = 0; i < 3; i++) {
          const hx = pigX + 20 + Math.sin(timer * 2 + i * 2) * 20;
          const hy = pigY - 30 - i * 15 - timer * 5;
          ctx.globalAlpha = Math.max(0, 1 - timer * 0.15 + i * 0.1);
          ctx.fillText('\u2764\uFE0F', hx, hy);
        }
        ctx.globalAlpha = 1.0;
      }
      break;
    }
    case 6: {
      // Tongue out at butcher
      drawPiggySprite(pigX - 30, pigY, -1, 'happy');
      // Tongue
      ctx.fillStyle = '#ff6666';
      ctx.beginPath();
      ctx.ellipse(pigX - 65, pigY + 2, 6, 10, 0.2, 0, Math.PI * 2);
      ctx.fill();
      // Tiny butcher running away
      const butcherX = pigX + 80 + timer * 40;
      ctx.font = '24px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.globalAlpha = Math.max(0, 1 - timer * 0.2);
      ctx.fillText('\u{1F9D1}\u200D\u{1F373}', butcherX, pigY);
      ctx.font = '12px sans-serif';
      ctx.fillText('\u{1F4A8}', butcherX - 20, pigY);
      ctx.globalAlpha = 1.0;
      break;
    }
    default: {
      // Level 7+: Epic celebration - spinning piggy with confetti
      ctx.save();
      ctx.translate(pigX, pigY);
      ctx.rotate(timer * 3);
      const epicScale = 1 + Math.sin(timer * 5) * 0.15;
      ctx.scale(epicScale, epicScale);
      drawPiggySprite(0, 0, 0, 'happy');
      ctx.restore();
      // Extra confetti
      ctx.font = '18px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const confettiChars = ['\u{1F389}', '\u{1F38A}', '\u2728', '\u2B50', '\u{1F451}', '\u{1F4AB}'];
      for (let i = 0; i < 15; i++) {
        const angle = timer * 1.5 + i * 0.42;
        const dist = 60 + i * 10 + Math.sin(timer * 2 + i) * 20;
        const cx = pigX + Math.cos(angle) * dist;
        const cy = pigY + Math.sin(angle) * dist * 0.6;
        ctx.globalAlpha = 0.6 + 0.4 * Math.sin(timer * 4 + i);
        ctx.fillText(confettiChars[i % confettiChars.length], cx, cy);
      }
      ctx.globalAlpha = 1.0;
      break;
    }
  }
}

    ctx.fillText('Igra\u010D: ' + playerName, WIDTH / 2, HEIGHT / 2 + 40);
  }

    ctx.textAlign = 'center';
    ctx.fillText('\uD83C\uDFC6 TOP IGRA\u010CI', WIDTH / 2, HEIGHT - 170);

    for (var li = 0; li < Math.min(5, lb.length); li++) {

      ctx.fillStyle = li === 0 ? '#FFD700' : li === 1 ? '#C0C0C0' : li === 2 ? '#CD7F32' : '#aaa';
      ctx.fillText(medal + ' ' + entry.name + ' - ' + entry.score + ' pts (Lvl ' + entry.level + ')', WIDTH / 2, HEIGHT - 145 + li * 22);
    }

}

function drawPlayingScene() {
  ctx.save();
  // Apply screen shake
  applyScreenShake();

  drawGround();

  // Draw fart clouds (behind falling objects)
  for (const cloud of fartClouds) {
    ctx.save();
    ctx.globalAlpha = cloud.opacity;
    ctx.translate(cloud.x, cloud.y);
    ctx.scale(cloud.scale, cloud.scale);

    // Green stink cloud - multiple overlapping circles
    const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, 25);
    gradient.addColorStop(0, 'rgba(80, 180, 30, 0.6)');
    gradient.addColorStop(0.5, 'rgba(100, 200, 40, 0.3)');
    gradient.addColorStop(1, 'rgba(120, 220, 50, 0)');

    // Main cloud blob
    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.arc(0, 0, 25, 0, Math.PI * 2);
    ctx.fill();
    // Side blobs for cloud shape
    ctx.beginPath();
    ctx.arc(-12, -5, 18, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(12, -3, 20, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(0, -12, 16, 0, Math.PI * 2);
    ctx.fill();

    // Stink lines (wavy lines emanating from cloud)
    ctx.strokeStyle = 'rgba(80, 180, 30, ' + (cloud.opacity * 0.5) + ')';
    ctx.lineWidth = 2;
    for (let s = 0; s < 3; s++) {
      const angle = (s / 3) * Math.PI * 2 + cloud.wobble;
      ctx.beginPath();
      ctx.moveTo(Math.cos(angle) * 15, Math.sin(angle) * 15);
      ctx.quadraticCurveTo(
        Math.cos(angle + 0.3) * 30, Math.sin(angle + 0.3) * 30,
        Math.cos(angle + 0.6) * 20, Math.sin(angle + 0.6) * 20
      );
      ctx.stroke();
    }

    // Tiny 💨 emoji in center
    ctx.font = '16px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('\u{1F4A8}', 0, 0);

    ctx.restore();
  }

  // Falling objects
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const now = performance.now() / 1000;
  for (const obj of objects) {
    if (obj.type === 'coin' && obj.coinType) {
      // Draw custom coin graphics
      drawCoin(obj.x, obj.y, obj.width, obj.coinType, now);
    } else if (obj.type === 'special') {
      // Bills and moneybags - emoji with golden glow
      const sz = obj.width || 42;
      ctx.font = sz + 'px sans-serif';
      // Glowing aura
      const glowPulse = 12 + 6 * Math.sin(now * 6 + obj.x);
      ctx.shadowColor = obj.value >= 30 ? '#ff8800' : '#44cc44';
      ctx.shadowBlur = glowPulse;
      // Slight floating bob
      const bob = Math.sin(now * 3 + obj.x * 0.05) * 3;
      ctx.fillText(obj.emoji, obj.x, obj.y + bob);
      ctx.shadowBlur = 0;
    } else if (obj.type === 'bomb') {
      ctx.font = '36px sans-serif';
      // Pulsing glow on bombs
      const pulseR = 20 + 5 * Math.sin(now * 10);
      ctx.shadowColor = '#ff4400';
      ctx.shadowBlur = pulseR;
      ctx.fillText(obj.emoji, obj.x, obj.y);
      ctx.shadowBlur = 0;
    } else if (obj.type === 'corn') {
      ctx.font = '32px sans-serif';
      const cornGlow = 8 + 4 * Math.sin(now * 5);
      ctx.shadowColor = '#ffcc00';
      ctx.shadowBlur = cornGlow;
      ctx.fillText(obj.emoji, obj.x, obj.y);
      ctx.shadowBlur = 0;
    } else if (obj.type === 'butcher') {
      ctx.font = (obj.width || 50) + 'px sans-serif';
      // Menacing red glow
      const glowPulse = 8 + 4 * Math.sin(now * 4);
      ctx.shadowColor = '#cc0000';
      ctx.shadowBlur = glowPulse;
      ctx.fillText(obj.emoji, obj.x, obj.y);
      // Draw knives on sides
      ctx.font = '18px sans-serif';
      ctx.fillText('\u{1F52A}', obj.x - 22, obj.y - 10);
      ctx.fillText('\u{1F52A}', obj.x + 22, obj.y - 10);
      ctx.shadowBlur = 0;
    } else if (obj.type === 'devil') {
      const dSize = obj.width || 38;
      ctx.font = dSize + 'px sans-serif';
      ctx.fillText(obj.emoji, obj.x, obj.y);
    } else {
      ctx.font = '32px sans-serif';
      ctx.fillText(obj.emoji || '', obj.x, obj.y);
    }
  }

  // Lightning warning (pulsing yellow glow on cloud) - draw behind ground elements
  if (lightningWarning) {
    const pulse = Math.sin(Date.now() / 80) * 0.3 + 0.5;
    ctx.fillStyle = `rgba(255, 255, 100, ${pulse})`;
    ctx.beginPath();
    ctx.arc(lightningWarning.x, lightningWarning.y - 10, 25, 0, Math.PI * 2);
    ctx.fill();
  }

  // Draw poops with stink waves (behind enemies)
  for (const poop of poops) {
    ctx.save();
    ctx.font = '28px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('\u{1F4A9}', poop.x, poop.y);
    // Green stink waves rising
    const alpha = poop.life / POOP_DURATION;
    ctx.strokeStyle = `rgba(100, 200, 50, ${(Math.sin(poop.stinkTimer * 3) * 0.3 + 0.5) * alpha})`;
    ctx.lineWidth = 2;
    for (let i = 0; i < 3; i++) {
      ctx.beginPath();
      const ox = Math.sin(poop.stinkTimer * 2 + i * 2) * 10;
      ctx.moveTo(poop.x - 15 + ox, poop.y - 10 - i * 12);
      ctx.quadraticCurveTo(poop.x + ox, poop.y - 20 - i * 12, poop.x + 15 + ox, poop.y - 10 - i * 12);
      ctx.stroke();
    }
    ctx.restore();
  }

  // Ground enemies
  for (const e of groundEnemies) {
    if (e.type === 'wolf') {
      drawWolf(e.x, e.y, e.dir, e.animTimer);
    } else if (e.type === 'farmer') {
      drawFarmerSprite(e.x, e.y, e.dir, e.animTimer);
    } else {
      // Fox and carnivore keep emoji for now
      ctx.save();
      ctx.translate(e.x, e.y);
      if (e.dir < 0) ctx.scale(-1, 1);
      const bob = Math.sin(e.animTimer * 8) * 3;
      ctx.font = `${e.width}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(e.emoji, 0, bob);
      ctx.restore();
    }
  }

  // Draw vegan ally
  if (vegan && vegan.state !== 'dead') {
    // Green aura
    ctx.save();
    ctx.translate(vegan.x, vegan.y);
    const auraAlpha = Math.sin(vegan.auraTimer * 3) * 0.15 + 0.2;
    ctx.fillStyle = `rgba(100, 220, 100, ${auraAlpha})`;
    ctx.beginPath();
    ctx.arc(0, -5, 30, 0, Math.PI * 2);
    ctx.fill();
    // HP bar
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(-15, -40, 30, 5);
    ctx.fillStyle = vegan.hp > 1 ? '#4CAF50' : '#ff4444';
    ctx.fillRect(-15, -40, 30 * (vegan.hp / vegan.maxHp), 5);
    ctx.restore();
    // Draw the vegan sprite
    drawVeganSprite(vegan.x, vegan.y, vegan.dir, vegan.auraTimer, vegan.state);
  }

  // Player (piggy with visual states)
  drawPiggy();

  // Latched devil on top of player
  if (game.latchedDevil) {
    const devil = game.latchedDevil;
    const devilFontSize = devil.devilType === 'heavy' ? 44 : (devil.devilType === 'thief' ? 40 : 36);
    ctx.font = devilFontSize + 'px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    // Visual flair per type
    if (devil.devilType === 'butcher') {
      // Butcher-specific drawing
      ctx.font = '46px sans-serif';
      ctx.fillText(devil.emoji, devil.x, devil.y + shakeVisualOffset);

      // Two knives - alternating stabbing animation
      const knifePhase = devil.hammerAnimTimer * 4;
      const leftKnifeY = Math.sin(knifePhase) * 12;
      const rightKnifeY = Math.sin(knifePhase + Math.PI) * 12; // opposite phase

      ctx.font = '22px sans-serif';
      ctx.fillText('\u{1F52A}', devil.x - 28, devil.y - 10 + leftKnifeY + shakeVisualOffset);
      ctx.fillText('\u{1F52A}', devil.x + 28, devil.y - 10 + rightKnifeY + shakeVisualOffset);
    } else {
      if (devil.devilType === 'fast') {
        // Speed lines behind fast devil
        ctx.globalAlpha = 0.3;
        ctx.font = '14px sans-serif';
        for (let sl = 0; sl < 3; sl++) {
          ctx.fillText('\u2014', devil.x - 22 - sl * 8, devil.y - 5 + sl * 7 + shakeVisualOffset);
          ctx.fillText('\u2014', devil.x + 22 + sl * 8, devil.y - 5 + sl * 7 + shakeVisualOffset);
        }
        ctx.globalAlpha = 1.0;
        ctx.font = devilFontSize + 'px sans-serif';
      }

      ctx.fillText(devil.emoji, devil.x, devil.y + shakeVisualOffset);

      // Thief: show coin being stolen periodically
      if (devil.devilType === 'thief' && devil.stealTimer < 0.25) {
        ctx.font = '16px sans-serif';
        ctx.fillText('\u{1F4B0}', devil.x + 20, devil.y - 10 + shakeVisualOffset);
      }

      // Hammer animation (heavy has slower swing)
      const hammerRate = devil.devilType === 'heavy' ? 0.5 : 0.3;
      const hammerSide = Math.floor(devil.hammerAnimTimer / hammerRate) % 2 === 0 ? -1 : 1;
      ctx.font = '24px sans-serif';
      ctx.fillText('\u{1F528}', devil.x + hammerSide * 25, devil.y - 15 + shakeVisualOffset);
    }

    // Danger bar (red) - uses dynamic hammerTimeout
    const barWidth = 60;
    const barHeight = 8;
    const barX = player.x - barWidth / 2;
    const barY = player.y - 80;
    const fill = Math.min(devil.hammerTimer / devil.hammerTimeout, 1.0);

    ctx.fillStyle = '#333';
    ctx.fillRect(barX, barY, barWidth, barHeight);

    let barAlpha = 1.0;
    if (fill > 0.8) {
      barAlpha = 0.5 + 0.5 * Math.abs(Math.sin(Date.now() / 100));
    }
    ctx.globalAlpha = barAlpha;
    ctx.fillStyle = '#ff2222';
    ctx.fillRect(barX, barY, barWidth * fill, barHeight);
    ctx.globalAlpha = 1.0;

    ctx.strokeStyle = '#000';
    ctx.lineWidth = 1;
    ctx.strokeRect(barX, barY, barWidth, barHeight);

    // Shake progress bar (green) - reflects different shakeRequired
    const shakeBarY = barY + barHeight + 3;
    const shakeFill = Math.min(devil.shakeProgress / devil.shakeRequired, 1.0);

    ctx.fillStyle = '#333';
    ctx.fillRect(barX, shakeBarY, barWidth, barHeight);
    ctx.fillStyle = '#44ff44';
    ctx.fillRect(barX, shakeBarY, barWidth * shakeFill, barHeight);
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 1;
    ctx.strokeRect(barX, shakeBarY, barWidth, barHeight);

    // Shake hint text
    const hintAlpha = 0.5 + 0.5 * Math.abs(Math.sin(Date.now() / 200));
    ctx.globalAlpha = hintAlpha;
    ctx.font = 'bold 18px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffff00';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 3;
    ctx.strokeText('\u2B06\u2B07 SHAKE!', player.x, player.y - 95);
    ctx.fillText('\u2B06\u2B07 SHAKE!', player.x, player.y - 95);
    ctx.globalAlpha = 1.0;
    ctx.lineWidth = 1;

    // Devil type indicator
    if (devilTypeIndicator) {
      const indAlpha = Math.min(1.0, devilTypeIndicator.timer / 0.3);
      ctx.globalAlpha = indAlpha;
      ctx.font = 'bold 26px sans-serif';
      ctx.textAlign = 'center';
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 4;
      ctx.strokeText(devilTypeIndicator.text, player.x, player.y - 115);
      ctx.fillStyle = devilTypeIndicator.color;
      ctx.fillText(devilTypeIndicator.text, player.x, player.y - 115);
      ctx.globalAlpha = 1.0;
      ctx.lineWidth = 1;
    }
  }

  // Ejected coin animations
  for (const ec of ejectedCoins) {
    if (ec.phase === 'rising') {
      ctx.font = '28px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('\u{1FA99}', ec.x, ec.y);
    } else if (ec.phase === 'hit') {
      ctx.save();
      ctx.translate(ec.hitX, ec.hitY);
      ctx.rotate(ec.devilAngle);
      ctx.font = '36px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.globalAlpha = Math.max(0, 1.0 - ec.hitTimer / 0.6);
      ctx.fillText(ec.devilEmoji, 0, 0);
      ctx.restore();
      ctx.globalAlpha = 1.0;
    }
  }

  // Draw choking devils
  for (const cd of chokingDevils) {
    ctx.save();
    ctx.globalAlpha = cd.opacity;
    ctx.translate(cd.x, cd.y);

    // Shake/convulse while choking
    const shakeX = Math.sin(cd.coughTimer * 30) * 5;
    ctx.translate(shakeX, 0);

    // Draw devil emoji
    ctx.font = (cd.width || 38) + 'px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(cd.emoji, 0, 0);

    // Coughing text that pops up periodically
    if (Math.floor(cd.coughTimer * 5) % 2 === 0) {
      ctx.font = 'bold 14px sans-serif';
      ctx.fillStyle = '#44ff44';
      ctx.fillText('\u{1F922}', 20, -15);
    }

    // Green stink swirls around the devil
    ctx.font = '12px sans-serif';
    for (let s = 0; s < 3; s++) {
      const angle = cd.coughTimer * 3 + s * 2.1;
      const sx = Math.cos(angle) * 20;
      const sy = Math.sin(angle) * 15;
      ctx.fillText('\u{1F4A8}', sx, sy);
    }

    ctx.restore();
  }

  // Lightning bolts
  for (const bolt of lightningBolts) {
    // Screen flash
    if (bolt.flash > 0) {
      ctx.fillStyle = `rgba(255, 255, 255, ${bolt.flash * 0.3})`;
      ctx.fillRect(0, 0, WIDTH, HEIGHT);
    }
    // Draw jagged bolt
    ctx.strokeStyle = `rgba(255, 255, 100, ${Math.max(0, bolt.life / 0.3)})`;
    ctx.lineWidth = 4;
    ctx.shadowColor = '#ffff00';
    ctx.shadowBlur = 15;
    for (const seg of bolt.segments) {
      ctx.beginPath();
      ctx.moveTo(seg.x1, seg.y1);
      ctx.lineTo(seg.x2, seg.y2);
      ctx.stroke();
    }
    // Inner bright core
    ctx.strokeStyle = `rgba(255, 255, 255, ${Math.max(0, bolt.life / 0.3)})`;
    ctx.lineWidth = 2;
    for (const seg of bolt.segments) {
      ctx.beginPath();
      ctx.moveTo(seg.x1, seg.y1);
      ctx.lineTo(seg.x2, seg.y2);
      ctx.stroke();
    }
    ctx.shadowBlur = 0;
  }

  // Particles
  drawParticles();

  // Score pop-ups
  drawScorePopups();

  // Draw vegan death animation (on top of everything except UI)
  if (veganDeathAnim) {
    const da = veganDeathAnim;
    ctx.save();
    ctx.globalAlpha = da.opacity;
    ctx.translate(da.x, da.y);

    // Halo
    if (da.haloSize > 0) {
      ctx.strokeStyle = '#FFD700';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.ellipse(0, -35, 15 * da.haloSize, 5 * da.haloSize, 0, 0, Math.PI * 2);
      ctx.stroke();
    }

    // Angel wings
    if (da.wingSpread > 0) {
      ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
      // Left wing
      ctx.beginPath();
      ctx.moveTo(-5, -10);
      ctx.quadraticCurveTo(-30 * da.wingSpread, -30, -40 * da.wingSpread, -5);
      ctx.quadraticCurveTo(-25 * da.wingSpread, 0, -5, 5);
      ctx.fill();
      // Right wing
      ctx.beginPath();
      ctx.moveTo(5, -10);
      ctx.quadraticCurveTo(30 * da.wingSpread, -30, 40 * da.wingSpread, -5);
      ctx.quadraticCurveTo(25 * da.wingSpread, 0, 5, 5);
      ctx.fill();
    }

    // Vegan emoji rising
    ctx.font = '40px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('\u{1F607}', 0, 0);

    ctx.restore();

    // Message text
    if (da.timer > 1.0) {
      ctx.save();
      ctx.globalAlpha = Math.min(1, (da.timer - 1) / 1.0);
      ctx.font = 'bold 24px sans-serif';
      ctx.textAlign = 'center';
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 3;
      ctx.strokeText(da.msg, WIDTH / 2, HEIGHT / 2 - 50);
      ctx.fillStyle = '#ff4444';
      ctx.fillText(da.msg, WIDTH / 2, HEIGHT / 2 - 50);
      ctx.restore();
    }
  }

  // Success flash (green)
  if (successFlashTimer > 0) {
    ctx.globalAlpha = successFlashTimer / 0.4 * 0.25;
    ctx.fillStyle = '#00ff00';
    ctx.fillRect(0, 0, WIDTH, HEIGHT);
    ctx.globalAlpha = 1.0;
  }

  // Flash overlay (red for damage, gold for moneybag)
  if (flashTimer > 0) {
    ctx.globalAlpha = flashTimer / 0.3 * 0.4;
    ctx.fillStyle = flashColor || '#ff0000';
    ctx.fillRect(0, 0, WIDTH, HEIGHT);
    ctx.globalAlpha = 1.0;
  }

  ctx.restore(); // restore screen shake transform

  // HUD drawn outside shake transform so it stays stable
  drawHUD();
}

// --- Victory Scene Functions ---

function initVictoryScene() {
  victoryTimer = 0;
  victoryPiglets = [];
  victoryVegans = [];
  victoryAngels = [];
  victoryIntruderTimer = 0;

  // 12 piglet siblings
  for (let i = 0; i < 12; i++) {
    victoryPiglets.push({
      x: 150 + Math.random() * 500,
      y: HEIGHT - 120 + Math.random() * 40,
      vx: (Math.random() - 0.5) * 60,
      bouncePhase: Math.random() * Math.PI * 2,
      size: 18 + Math.random() * 8
    });
  }
  // Main piggy (bigger)
  victoryPiglets.push({
    x: WIDTH / 2,
    y: HEIGHT - 130,
    vx: 20,
    bouncePhase: 0,
    size: 32,
    isMain: true
  });

  // 3 vegans
  for (let i = 0; i < 3; i++) {
    victoryVegans.push({
      x: 200 + i * 200,
      y: HEIGHT - 140,
      dir: 1,
      heartTimer: Math.random() * 2
    });
  }

  // 4 armed angels on perimeter
  victoryAngels.push({ x: 50, y: HEIGHT - 180, dir: 1, fireTimer: 3 + Math.random() * 5, firing: false, fireAnim: 0 });
  victoryAngels.push({ x: WIDTH - 50, y: HEIGHT - 180, dir: -1, fireTimer: 5 + Math.random() * 5, firing: false, fireAnim: 0 });
  victoryAngels.push({ x: 120, y: HEIGHT - 220, dir: 1, fireTimer: 7 + Math.random() * 4, firing: false, fireAnim: 0 });
  victoryAngels.push({ x: WIDTH - 120, y: HEIGHT - 220, dir: -1, fireTimer: 2 + Math.random() * 6, firing: false, fireAnim: 0 });

  playVictoryMusic();
}

function playVictoryMusic() {
  if (!audioCtx) return;
  const ctx2 = audioCtx;
  const now = ctx2.currentTime;
  // C major peaceful melody - idyllic farm feel
  const melody = [
    { freq: 523, dur: 0.45 }, // C5
    { freq: 659, dur: 0.45 }, // E5
    { freq: 784, dur: 0.45 }, // G5
    { freq: 659, dur: 0.45 }, // E5
    { freq: 523, dur: 0.45 }, // C5
    { freq: 587, dur: 0.45 }, // D5
    { freq: 659, dur: 0.45 }, // E5
    { freq: 523, dur: 0.9 },  // C5 (held)
  ];
  let t = 0;
  melody.forEach((note) => {
    const osc = ctx2.createOscillator();
    const gain = ctx2.createGain();
    osc.type = 'sine';
    osc.frequency.value = note.freq;
    gain.gain.setValueAtTime(0.08, now + t);
    gain.gain.exponentialRampToValueAtTime(0.01, now + t + note.dur - 0.05);
    osc.connect(gain);
    gain.connect(ctx2.destination);
    osc.start(now + t);
    osc.stop(now + t + note.dur);
    t += note.dur;
  });
}

function stopVictoryMusic() {
  if (victoryMusicTimeout) {
    clearTimeout(victoryMusicTimeout);
    victoryMusicTimeout = null;
  }
}

function playGunshotSound() {
  if (!audioCtx) return;
  const ctx2 = audioCtx;
  const now = ctx2.currentTime;
  // Sharp crack
  const osc = ctx2.createOscillator();
  const gain = ctx2.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(200, now);
  osc.frequency.exponentialRampToValueAtTime(50, now + 0.1);
  gain.gain.setValueAtTime(0.3, now);
  gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
  osc.connect(gain);
  gain.connect(ctx2.destination);
  osc.start(now);
  osc.stop(now + 0.2);
}

function drawVictory() {
  // Sky gradient
  const skyGrad = ctx.createLinearGradient(0, 0, 0, HEIGHT * 0.6);
  skyGrad.addColorStop(0, '#87CEEB');
  skyGrad.addColorStop(1, '#E0F7FF');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, WIDTH, HEIGHT);

  // Sun (bigger, brighter)
  ctx.fillStyle = '#FFD700';
  ctx.beginPath();
  ctx.arc(WIDTH - 80, 70, 45, 0, Math.PI * 2);
  ctx.fill();
  // Sun rays (rotating)
  ctx.strokeStyle = '#FFD700';
  ctx.lineWidth = 3;
  for (let i = 0; i < 12; i++) {
    const angle = (i / 12) * Math.PI * 2 + victoryTimer / 3;
    ctx.beginPath();
    ctx.moveTo(WIDTH - 80 + Math.cos(angle) * 50, 70 + Math.sin(angle) * 50);
    ctx.lineTo(WIDTH - 80 + Math.cos(angle) * 68, 70 + Math.sin(angle) * 68);
    ctx.stroke();
  }

  // Clouds
  for (const cloud of skyClouds) {
    ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
    ctx.beginPath();
    ctx.arc(cloud.x, cloud.y, cloud.w * 0.25, 0, Math.PI * 2);
    ctx.arc(cloud.x + cloud.w * 0.25, cloud.y - cloud.w * 0.12, cloud.w * 0.3, 0, Math.PI * 2);
    ctx.arc(cloud.x + cloud.w * 0.5, cloud.y, cloud.w * 0.22, 0, Math.PI * 2);
    ctx.fill();
  }

  // Rolling green hills
  ctx.fillStyle = '#4CAF50';
  ctx.beginPath();
  ctx.moveTo(0, HEIGHT * 0.55);
  for (let x = 0; x <= WIDTH; x += 20) {
    ctx.lineTo(x, HEIGHT * 0.55 + Math.sin(x / 100 + 1) * 20);
  }
  ctx.lineTo(WIDTH, HEIGHT);
  ctx.lineTo(0, HEIGHT);
  ctx.fill();

  // Darker grass foreground
  ctx.fillStyle = '#388E3C';
  ctx.beginPath();
  ctx.moveTo(0, HEIGHT * 0.7);
  for (let x = 0; x <= WIDTH; x += 15) {
    ctx.lineTo(x, HEIGHT * 0.7 + Math.sin(x / 80 + 2) * 10);
  }
  ctx.lineTo(WIDTH, HEIGHT);
  ctx.lineTo(0, HEIGHT);
  ctx.fill();

  // Red American barn
  ctx.fillStyle = '#B22222';
  ctx.fillRect(WIDTH / 2 - 80, HEIGHT * 0.35, 160, 100);
  // Roof
  ctx.fillStyle = '#8B0000';
  ctx.beginPath();
  ctx.moveTo(WIDTH / 2 - 100, HEIGHT * 0.35);
  ctx.lineTo(WIDTH / 2, HEIGHT * 0.25);
  ctx.lineTo(WIDTH / 2 + 100, HEIGHT * 0.35);
  ctx.fill();
  // Barn door
  ctx.fillStyle = '#5B1010';
  ctx.fillRect(WIDTH / 2 - 20, HEIGHT * 0.35 + 40, 40, 60);
  // White X on barn
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(WIDTH / 2 - 60, HEIGHT * 0.35 + 10);
  ctx.lineTo(WIDTH / 2 + 60, HEIGHT * 0.35 + 90);
  ctx.moveTo(WIDTH / 2 + 60, HEIGHT * 0.35 + 10);
  ctx.lineTo(WIDTH / 2 - 60, HEIGHT * 0.35 + 90);
  ctx.stroke();

  // White picket fence
  ctx.fillStyle = '#fff';
  for (let x = 20; x < WIDTH - 20; x += 25) {
    ctx.fillRect(x, HEIGHT - 85, 6, 30);
    // Pointed top
    ctx.beginPath();
    ctx.moveTo(x, HEIGHT - 85);
    ctx.lineTo(x + 3, HEIGHT - 92);
    ctx.lineTo(x + 6, HEIGHT - 85);
    ctx.fill();
  }
  // Horizontal rails
  ctx.fillRect(10, HEIGHT - 75, WIDTH - 20, 4);
  ctx.fillRect(10, HEIGHT - 62, WIDTH - 20, 4);

  // Flowers
  const flowerColors = ['#FF69B4', '#FF6347', '#FFD700', '#FF4500', '#DA70D6'];
  for (let i = 0; i < 20; i++) {
    const fx = 50 + (i * 37) % (WIDTH - 100);
    const fy = HEIGHT - 50 + Math.sin(i * 1.7) * 10;
    ctx.fillStyle = flowerColors[i % flowerColors.length];
    ctx.beginPath();
    ctx.arc(fx, fy, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#228B22';
    ctx.fillRect(fx - 1, fy, 2, 8);
  }

  // Vegans petting piglets
  for (const v of victoryVegans) {
    ctx.font = '36px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText('\u{1F9D1}\u200D\u{1F33E}', v.x, v.y);
    // Floating hearts
    const heartY = v.y - 30 - (1.5 - v.heartTimer) * 20;
    const heartAlpha = Math.max(0, v.heartTimer / 1.5);
    ctx.globalAlpha = heartAlpha;
    ctx.font = '16px sans-serif';
    ctx.fillText('\u2764\uFE0F', v.x + 15, heartY);
    ctx.globalAlpha = 1;
  }

  // Piglets bouncing and playing
  for (const p of victoryPiglets) {
    const bounce = Math.abs(Math.sin(p.bouncePhase)) * 15;
    ctx.font = `${p.size}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText(p.isMain ? '\u{1F437}' : '\u{1F43D}', p.x, p.y - bounce);
  }

  // Armed angels on perimeter
  for (const a of victoryAngels) {
    ctx.save();
    ctx.translate(a.x, a.y);
    if (a.dir < 0) ctx.scale(-1, 1);

    // Angel emoji
    ctx.font = '40px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('\u{1F607}', 0, 0);

    // Ammo belt (brown diagonal stripe across chest)
    ctx.strokeStyle = '#8B4513';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(-12, -8);
    ctx.lineTo(12, 8);
    ctx.stroke();
    // Ammo dots on belt
    ctx.fillStyle = '#DAA520';
    for (let i = 0; i < 5; i++) {
      ctx.beginPath();
      ctx.arc(-10 + i * 5, -6 + i * 3.2, 2, 0, Math.PI * 2);
      ctx.fill();
    }

    // Machine gun
    ctx.fillStyle = '#333';
    ctx.fillRect(15, -4, 25, 6);
    ctx.fillRect(15, -7, 5, 10);

    // Muzzle flash when firing
    if (a.firing && a.fireAnim > 0.15) {
      ctx.fillStyle = '#FFD700';
      ctx.beginPath();
      ctx.moveTo(40, -1);
      ctx.lineTo(55, -8);
      ctx.lineTo(50, -1);
      ctx.lineTo(55, 6);
      ctx.closePath();
      ctx.fill();

      // "BANG!" text
      ctx.save();
      if (a.dir < 0) ctx.scale(-1, 1);
      ctx.font = 'bold 16px sans-serif';
      ctx.fillStyle = '#ff0000';
      ctx.textAlign = 'center';
      ctx.fillText('BANG!', 50, -20);
      ctx.restore();
    }

    ctx.restore();
  }

  // Title text
  ctx.font = 'bold 52px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 4;
  ctx.strokeText('SLOBODA! \u{1F437}', WIDTH / 2, 50);
  ctx.fillStyle = '#FFD700';
  ctx.fillText('SLOBODA! \u{1F437}', WIDTH / 2, 50);

  ctx.font = '22px sans-serif';
  ctx.fillStyle = '#fff';
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 2;
  const sub = 'Kasica i njena bra\u0107a i sestre \u017eive sre\u0107no zauvek...';
  ctx.strokeText(sub, WIDTH / 2, 85);
  ctx.fillText(sub, WIDTH / 2, 85);

  ctx.font = 'bold 28px sans-serif';
  ctx.fillStyle = '#FFD700';
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 3;
  ctx.strokeText('Final Score: ' + game.score, WIDTH / 2, 120);
  ctx.fillText('Final Score: ' + game.score, WIDTH / 2, 120);

  // Thank you message (fades in after 3 seconds)
  if (victoryTimer > 3) {
    ctx.globalAlpha = Math.min(1, (victoryTimer - 3) / 2);
    ctx.font = 'bold 24px sans-serif';
    ctx.fillStyle = '#ff6699';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2;
    ctx.strokeText('Hvala ti \u0161to si nam pomogao/la! \u2764\uFE0F', WIDTH / 2, 155);
    ctx.fillText('Hvala ti \u0161to si nam pomogao/la! \u2764\uFE0F', WIDTH / 2, 155);
    ctx.globalAlpha = 1;
  }

  // Click to continue hint (after 5 seconds)
  if (victoryTimer > 5) {
    ctx.globalAlpha = 0.5 + 0.5 * Math.sin(victoryTimer * 3);
    ctx.font = '18px sans-serif';
    ctx.fillStyle = '#fff';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2;
    ctx.strokeText('Klikni za nastavak', WIDTH / 2, HEIGHT - 15);
    ctx.fillText('Klikni za nastavak', WIDTH / 2, HEIGHT - 15);
    ctx.globalAlpha = 1;
  }
}

function drawLevelComplete() {
  // Celebratory background
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  // Sparkle effect
  const sparkleCount = 12;
  ctx.font = '20px sans-serif';
  for (let i = 0; i < sparkleCount; i++) {
    const angle = (Date.now() / 1000 + i * (Math.PI * 2 / sparkleCount));
    const radius = 120 + Math.sin(Date.now() / 300 + i) * 30;
    const sx = WIDTH / 2 + Math.cos(angle) * radius;
    const sy = HEIGHT / 2 - 30 + Math.sin(angle) * radius * 0.5;
    ctx.globalAlpha = 0.4 + 0.3 * Math.sin(Date.now() / 200 + i);
    ctx.fillText('\u2728', sx, sy);
  }
  ctx.globalAlpha = 1.0;

  // Particles (confetti)
  drawParticles();

  // Level-specific animation
  drawLevelEndAnimation(game.level, levelCompleteTimer);

  // Level-specific funny text
  const levelText = getLevelEndText(game.level);

  // Main funny text
  ctx.font = 'bold 36px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 4;
  ctx.strokeText(levelText.main, WIDTH / 2, HEIGHT / 2 - 100);
  ctx.fillStyle = '#fff';
  ctx.fillText(levelText.main, WIDTH / 2, HEIGHT / 2 - 100);
  ctx.lineWidth = 1;

  // Subtitle (smaller, fades in)
  const subAlpha = Math.min(1, Math.max(0, (levelCompleteTimer - 0.8) * 2));
  ctx.globalAlpha = subAlpha;
  ctx.font = 'italic 20px sans-serif';
  ctx.fillStyle = '#ddd';
  ctx.strokeStyle = 'rgba(0,0,0,0.5)';
  ctx.lineWidth = 2;
  ctx.strokeText(levelText.sub, WIDTH / 2, HEIGHT / 2 - 65);
  ctx.fillText(levelText.sub, WIDTH / 2, HEIGHT / 2 - 65);
  ctx.globalAlpha = 1.0;
  ctx.lineWidth = 1;

  // Level complete header
  ctx.font = 'bold 28px sans-serif';
  ctx.fillStyle = '#2d2d2d';
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 3;
  ctx.strokeText('Level ' + game.level + ' Complete! \u2728', WIDTH / 2, 40);
  ctx.fillText('Level ' + game.level + ' Complete! \u2728', WIDTH / 2, 40);
  ctx.lineWidth = 1;

  // Score
  ctx.font = '28px sans-serif';
  ctx.fillStyle = '#444';
  ctx.fillText('\u{1FA99} Score: ' + game.score + '   \u20BF ' + playerBTC, WIDTH / 2, HEIGHT - 80);

  // Next level prompt - now goes to shop
  const pulse = 0.5 + 0.5 * Math.abs(Math.sin(Date.now() / 500));
  ctx.globalAlpha = pulse;
  ctx.font = 'bold 22px sans-serif';
  ctx.fillStyle = '#333';
  ctx.fillText('Klikni za Shop \uD83C\uDFEA', WIDTH / 2, HEIGHT - 40);
  ctx.globalAlpha = 1.0;
}

function drawGameOver() {
  const t = gameOverTimer;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  // Dark fiery background
  const bgGrad = ctx.createLinearGradient(0, 0, 0, HEIGHT);
  bgGrad.addColorStop(0, '#1a0a00');
  bgGrad.addColorStop(0.5, '#3a1500');
  bgGrad.addColorStop(1, '#2a0800');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, WIDTH, HEIGHT);

  // Flickering fire at the bottom
  for (let i = 0; i < 12; i++) {
    const fx = WIDTH / 2 - 120 + i * 22;
    const flicker = Math.sin(t * 8 + i * 1.7) * 10 + Math.sin(t * 12 + i * 2.3) * 5;
    const fh = 40 + flicker;
    const fireGrad = ctx.createLinearGradient(fx, HEIGHT - 100, fx, HEIGHT - 100 - fh);
    fireGrad.addColorStop(0, 'rgba(255, 100, 0, 0.8)');
    fireGrad.addColorStop(0.4, 'rgba(255, 200, 0, 0.6)');
    fireGrad.addColorStop(1, 'rgba(255, 255, 100, 0)');
    ctx.fillStyle = fireGrad;
    ctx.beginPath();
    ctx.ellipse(fx, HEIGHT - 100, 15, fh, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  // Embers rising
  for (let i = 0; i < 8; i++) {
    const ex = WIDTH / 2 - 80 + (i * 47 + t * 30) % 160;
    const ey = HEIGHT - 120 - ((t * 40 + i * 60) % 200);
    const eAlpha = Math.max(0, 1 - ((t * 40 + i * 60) % 200) / 200);
    ctx.fillStyle = 'rgba(255, ' + Math.floor(150 + Math.sin(t * 5 + i) * 50) + ', 0, ' + (eAlpha * 0.8) + ')';
    ctx.beginPath();
    ctx.arc(ex, ey, 2, 0, Math.PI * 2);
    ctx.fill();
  }

  // --- ROAST PIG ON SPIT ---
  const spitCenterX = WIDTH / 2;
  const spitCenterY = HEIGHT / 2 + 20;
  const rotAngle = t * 1.5; // slow rotation

  // Spit pole (horizontal bar)
  ctx.strokeStyle = '#888';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(spitCenterX - 140, spitCenterY);
  ctx.lineTo(spitCenterX + 140, spitCenterY);
  ctx.stroke();

  // Spit supports (Y-shaped stands)
  ctx.strokeStyle = '#666';
  ctx.lineWidth = 5;
  // Left stand
  ctx.beginPath();
  ctx.moveTo(spitCenterX - 130, HEIGHT - 80);
  ctx.lineTo(spitCenterX - 130, spitCenterY + 10);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(spitCenterX - 140, spitCenterY - 10);
  ctx.lineTo(spitCenterX - 130, spitCenterY + 10);
  ctx.lineTo(spitCenterX - 120, spitCenterY - 10);
  ctx.stroke();
  // Right stand
  ctx.beginPath();
  ctx.moveTo(spitCenterX + 130, HEIGHT - 80);
  ctx.lineTo(spitCenterX + 130, spitCenterY + 10);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(spitCenterX + 120, spitCenterY - 10);
  ctx.lineTo(spitCenterX + 130, spitCenterY + 10);
  ctx.lineTo(spitCenterX + 140, spitCenterY - 10);
  ctx.stroke();

  // Rotating roast pig
  ctx.save();
  ctx.translate(spitCenterX, spitCenterY);
  const yScale = Math.cos(rotAngle);
  ctx.scale(1, yScale); // Compress vertically to simulate spit rotation

  // Roasted body (darker, golden-brown)
  const roastColor = '#C8852A';
  const roastDark = '#8B5E1A';
  ctx.fillStyle = roastColor;
  ctx.beginPath();
  ctx.ellipse(0, 0, 55, 28, 0, 0, Math.PI * 2);
  ctx.fill();
  // Darker shading
  ctx.fillStyle = roastDark;
  ctx.beginPath();
  ctx.ellipse(0, 8, 50, 15, 0, 0, Math.PI);
  ctx.fill();
  // Crispy skin lines
  ctx.strokeStyle = '#6B3A0A';
  ctx.lineWidth = 1;
  for (let i = 0; i < 5; i++) {
    ctx.beginPath();
    ctx.moveTo(-40 + i * 18, -10 + Math.sin(i * 1.2) * 5);
    ctx.quadraticCurveTo(-30 + i * 18, 5, -20 + i * 18, -8 + Math.sin(i * 1.5) * 3);
    ctx.stroke();
  }

  // Head
  ctx.fillStyle = roastColor;
  ctx.beginPath();
  ctx.arc(55, 0, 24, 0, Math.PI * 2);
  ctx.fill();
  // Snout
  ctx.fillStyle = roastDark;
  ctx.beginPath();
  ctx.ellipse(76, 3, 11, 8, 0, 0, Math.PI * 2);
  ctx.fill();
  // Closed X eyes (it's roasted!)
  ctx.strokeStyle = '#4A2500';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(53, -8); ctx.lineTo(59, -3); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(59, -8); ctx.lineTo(53, -3); ctx.stroke();
  // Ear
  ctx.fillStyle = '#A06820';
  ctx.beginPath();
  ctx.moveTo(49, -18);
  ctx.lineTo(45, -32);
  ctx.lineTo(55, -20);
  ctx.closePath();
  ctx.fill();

  // Legs sticking up (4 little legs)
  ctx.fillStyle = roastDark;
  const legOffsets = [[-30, -1], [-10, -1], [10, -1], [30, -1]];
  for (const [lx] of legOffsets) {
    ctx.fillRect(lx - 3, -28, 6, 12);
    // Hooves
    ctx.fillStyle = '#4A2500';
    ctx.fillRect(lx - 4, -31, 8, 4);
    ctx.fillStyle = roastDark;
  }

  // Tail (crispy curly)
  ctx.strokeStyle = '#8B5E1A';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(-55, 0);
  ctx.quadraticCurveTo(-65, -12, -58, -16);
  ctx.quadraticCurveTo(-52, -18, -62, -10);
  ctx.stroke();

  // Apple in mouth!
  ctx.fillStyle = '#cc2222';
  ctx.beginPath();
  ctx.arc(85, 4, 9, 0, Math.PI * 2);
  ctx.fill();
  // Apple stem
  ctx.strokeStyle = '#4a2200';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(85, -5);
  ctx.lineTo(86, -10);
  ctx.stroke();
  // Apple highlight
  ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
  ctx.beginPath();
  ctx.arc(83, 2, 2, 0, Math.PI * 2);
  ctx.fill();

  // Spit pole through the pig
  ctx.strokeStyle = '#aaa';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(-70, 0);
  ctx.lineTo(100, 0);
  ctx.stroke();

  ctx.restore();

  // Steam/smoke rising from pig
  for (let i = 0; i < 6; i++) {
    const smokeX = spitCenterX - 40 + i * 18 + Math.sin(t * 2 + i * 1.4) * 8;
    const smokeY = spitCenterY - 40 - ((t * 25 + i * 30) % 120);
    const smokeAlpha = Math.max(0, 0.4 - ((t * 25 + i * 30) % 120) / 120 * 0.4);
    const smokeSize = 8 + ((t * 25 + i * 30) % 120) / 120 * 15;
    ctx.fillStyle = 'rgba(200, 200, 200, ' + smokeAlpha + ')';
    ctx.beginPath();
    ctx.arc(smokeX, smokeY, smokeSize, 0, Math.PI * 2);
    ctx.fill();
  }

  // Title
  ctx.font = 'bold 48px sans-serif';
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 4;
  ctx.strokeText('\u{1F525} Game Over! \u{1F525}', WIDTH / 2, 60);
  ctx.fillStyle = '#ff4400';
  ctx.fillText('\u{1F525} Game Over! \u{1F525}', WIDTH / 2, 60);
  ctx.lineWidth = 1;

  // Sad message
  const msgAlpha = Math.min(1, Math.max(0, (t - 1) * 2));
  ctx.globalAlpha = msgAlpha;
  ctx.font = 'italic 22px sans-serif';
  ctx.fillStyle = '#ff9966';
  ctx.fillText('Kasica je zavr\u0161ila na ra\u017Enju...', WIDTH / 2, 105);
  ctx.globalAlpha = 1.0;

  // Score info
  ctx.font = '26px sans-serif';
  ctx.fillStyle = '#dda050';
  ctx.fillText('Level: ' + game.level + '   \u{1FA99} Score: ' + game.score, WIDTH / 2, HEIGHT - 55);

  // BTC earned
  ctx.font = '20px sans-serif';
  ctx.fillStyle = '#F7931A';
  ctx.fillText('\u20BF ' + playerBTC + ' Bitcoin zaradjeno', WIDTH / 2, HEIGHT - 30);

  // --- Laughing devils around the spit ---
  for (const d of gameOverDevils) {
    if (d.x < -50 || d.x > WIDTH + 50) continue;
    ctx.save();
    ctx.translate(d.x, d.y + Math.sin(t * 3 + d.phase) * 10);
    const scale = d.laughing ? 1.2 + Math.sin(t * 10) * 0.1 : 1.0;
    ctx.scale(scale, scale);
    ctx.font = '36px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(d.emoji, 0, 0);
    ctx.restore();
    // "HA HA" text floating up when laughing
    if (d.laughing) {
      ctx.save();
      ctx.font = 'bold 14px sans-serif';
      ctx.fillStyle = '#ff4444';
      ctx.textAlign = 'center';
      const haY = d.y - 30 - Math.sin(t * 5) * 10;
      ctx.globalAlpha = 0.7 + Math.sin(t * 8) * 0.3;
      ctx.fillText('HA HA HA!', d.x, haY);
      ctx.restore();
    }
  }

  // --- Angel ---
  if (resurrectionState !== 'none' && resurrectionState !== 'waiting' && resurrectionState !== 'waiting_sad' && resurrectionState !== 'done') {
    ctx.save();
    // Golden glow
    ctx.fillStyle = 'rgba(255, 215, 0, ' + (0.2 + Math.sin(t * 4) * 0.1) + ')';
    ctx.beginPath();
    ctx.arc(WIDTH / 2, angelY, 50, 0, Math.PI * 2);
    ctx.fill();
    // Angel emoji
    ctx.font = '48px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('\u{1F47C}', WIDTH / 2, angelY);
    // Sparkles around angel
    for (let i = 0; i < 6; i++) {
      const angle = t * 2 + i * Math.PI / 3;
      const sx = WIDTH / 2 + Math.cos(angle) * 35;
      const sy = angelY + Math.sin(angle) * 25;
      ctx.font = '14px sans-serif';
      ctx.fillText('\u{2728}', sx, sy);
    }
    ctx.restore();
  }

  // Resurrection text
  if (resurrectionState === 'resurrect') {
    ctx.save();
    ctx.font = 'bold 28px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.strokeStyle = '#000'; ctx.lineWidth = 3;
    ctx.strokeText('VASKRSNU\u0106E! -' + resurrectionCost + ' bodova', WIDTH / 2, HEIGHT - 80);
    ctx.fillStyle = '#FFD700';
    ctx.fillText('VASKRSNU\u0106E! -' + resurrectionCost + ' bodova', WIDTH / 2, HEIGHT - 80);
    ctx.restore();
  }

  // Sad angel text
  if (resurrectionState === 'angel_sad') {
    ctx.save();
    ctx.font = 'bold 20px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.strokeStyle = '#000'; ctx.lineWidth = 3;
    const msg = 'Nema\u0161 dovoljno para za opro\u0161taj grehova! (treba: ' + resurrectionCost + ')';
    ctx.strokeText(msg, WIDTH / 2, HEIGHT - 80);
    ctx.fillStyle = '#ff6666';
    ctx.fillText(msg, WIDTH / 2, HEIGHT - 80);
    ctx.restore();
  }

  // Restart prompt (only when resurrection sequence is done)
  if (resurrectionState === 'done') {
    const pulse = 0.5 + 0.5 * Math.abs(Math.sin(Date.now() / 500));
    ctx.globalAlpha = pulse;
    ctx.font = 'bold 22px sans-serif';
    ctx.fillStyle = '#ffcc66';
    ctx.textAlign = 'center';
    ctx.fillText('Klikni za novu igru', WIDTH / 2, HEIGHT - 20);
    ctx.globalAlpha = 1.0;
  }
}

// --- Name Input Handlers ---
document.getElementById('nameSubmitBtn').addEventListener('click', function() {
  const name = document.getElementById('playerNameInput').value.trim();
  if (name.length > 0) {
    playerName = name;
    localStorage.setItem('kasicaPlayerName', playerName);
    hideNameInput();
    game.screen = 'intro';
  }
});

document.getElementById('playerNameInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    document.getElementById('nameSubmitBtn').click();
  }
  e.stopPropagation();
});

// --- Initialize Game Screen ---
if (!playerName) {
  game.screen = 'nameInput';
  showNameInput();
} else {
  game.screen = 'intro';
}

// --- Game Loop ---
let lastTime = 0;
function gameLoop(timestamp) {
  let dt = (timestamp - lastTime) / 1000;
  if (dt > 0.1) dt = 0.1;
  lastTime = timestamp;

  update(dt);
  draw();

  // Show/hide mobile controls based on game state
  const pauseBtnEl = document.getElementById('pauseBtn');
  if (isMobile) {
    if (game.screen === 'playing') {
      touchControlsEl.classList.add('visible');
      pauseBtnEl.style.display = 'block';
    } else {
      touchControlsEl.classList.remove('visible');
      pauseBtnEl.style.display = 'none';
      // Release all keys when leaving playing state
      Object.keys(keys).forEach(k => keys[k] = false);
    }
  }

  requestAnimationFrame(gameLoop);
}

requestAnimationFrame((timestamp) => {
  lastTime = timestamp;
  gameLoop(timestamp);
});
</script>
