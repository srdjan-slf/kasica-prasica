      ctx.fillText(medal + ' ' + entry.name + ' - ' + entry.score + ' pts (Lvl ' + entry.level + ')', WIDTH / 2, HEIGHT - 145 + li * 22);
    }
  }
}

// --- Draw House ---
function drawHouse(house) {
  const ht = HOUSE_TYPES[house.type];
  const w = house.width;
  const h = house.height;
  const baseX = house.x - w / 2;
  const baseY = house.y - h;
  const dmgRatio = house.hp / house.maxHp;

  ctx.save();

  // Shake wobble when shakeTimer > 0
  if (house.shakeTimer > 0) {
    const wobble = Math.sin(house.shakeTimer * 40) * 3;
    ctx.translate(wobble, 0);
  }

  if (house.type === 'straw') {
    // --- STRAW HOUSE ---
    // Walls - golden straw color with straw line texture
    ctx.fillStyle = ht.wallColor;
    ctx.fillRect(baseX + 10, baseY + 30, w - 20, h - 30);
    // Straw lines texture
    ctx.strokeStyle = '#C4961A';
    ctx.lineWidth = 1;
    for (let sy = baseY + 34; sy < baseY + h - 4; sy += 5) {
      ctx.beginPath();
      ctx.moveTo(baseX + 12, sy);
      ctx.lineTo(baseX + w - 12, sy + (Math.random() - 0.5) * 3);
      ctx.stroke();
    }
    // Triangular roof with messy straw texture
    ctx.fillStyle = ht.roofColor;
    ctx.beginPath();
    ctx.moveTo(baseX - 5, baseY + 32);
    ctx.lineTo(baseX + w / 2, baseY - 5);
    ctx.lineTo(baseX + w + 5, baseY + 32);
    ctx.closePath();
    ctx.fill();
    // Straw wisps on roof
    ctx.strokeStyle = '#DAA520';
    ctx.lineWidth = 1.5;
    for (let r = 0; r < 8; r++) {
      const rx = baseX + 5 + Math.random() * (w - 10);
      const ry = baseY + 10 + Math.random() * 18;
      ctx.beginPath();
      ctx.moveTo(rx, ry);
      ctx.lineTo(rx + (Math.random() - 0.5) * 15, ry - 8 - Math.random() * 10);
      ctx.stroke();
    }
    // Door
    ctx.fillStyle = '#8B6914';
    ctx.fillRect(baseX + w / 2 - 8, baseY + h - 28, 16, 28);
    // Round window
    ctx.fillStyle = '#87CEEB';
    ctx.beginPath();
    ctx.arc(baseX + w * 0.75, baseY + 46, 7, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#8B6914';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  } else if (house.type === 'sticks') {
    // --- STICK HOUSE ---
    // Wooden plank walls
    ctx.fillStyle = ht.wallColor;
    ctx.fillRect(baseX + 8, baseY + 28, w - 16, h - 28);
    // Wood grain lines
    ctx.strokeStyle = '#6B3410';
    ctx.lineWidth = 1;
    for (let py = baseY + 30; py < baseY + h - 2; py += 7) {
      ctx.beginPath();
      ctx.moveTo(baseX + 8, py);
      ctx.lineTo(baseX + w - 8, py);
      ctx.stroke();
    }
    // Vertical plank divisions
    for (let px = baseX + 20; px < baseX + w - 10; px += 18) {
      ctx.beginPath();
      ctx.moveTo(px, baseY + 28);
      ctx.lineTo(px, baseY + h);
      ctx.stroke();
    }
    // Angled stick roof
    ctx.fillStyle = ht.roofColor;
    ctx.beginPath();
    ctx.moveTo(baseX - 6, baseY + 30);
    ctx.lineTo(baseX + w / 2, baseY - 2);
    ctx.lineTo(baseX + w + 6, baseY + 30);
    ctx.closePath();
    ctx.fill();
    // Stick lines on roof
    ctx.strokeStyle = '#6B3410';
    ctx.lineWidth = 2;
    for (let r = 0; r < 5; r++) {
      const rx = baseX + 10 + r * (w / 5);
      ctx.beginPath();
      ctx.moveTo(rx, baseY + 28);
      ctx.lineTo(baseX + w / 2, baseY);
      ctx.stroke();
    }
    // Wooden door
    ctx.fillStyle = '#6B3410';
    ctx.fillRect(baseX + w / 2 - 9, baseY + h - 30, 18, 30);
    ctx.strokeStyle = '#4A2508';
    ctx.lineWidth = 1;
    ctx.strokeRect(baseX + w / 2 - 9, baseY + h - 30, 18, 30);
    // Square window with cross frame
    ctx.fillStyle = '#87CEEB';
    ctx.fillRect(baseX + w * 0.7, baseY + 42, 14, 14);
    ctx.strokeStyle = '#6B3410';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(baseX + w * 0.7, baseY + 42, 14, 14);
    ctx.beginPath();
    ctx.moveTo(baseX + w * 0.7 + 7, baseY + 42);
    ctx.lineTo(baseX + w * 0.7 + 7, baseY + 56);
    ctx.moveTo(baseX + w * 0.7, baseY + 49);
    ctx.lineTo(baseX + w * 0.7 + 14, baseY + 49);
    ctx.stroke();
  } else {
    // --- BRICK HOUSE ---
    // Brick wall with mortar pattern
    ctx.fillStyle = ht.wallColor;
    ctx.fillRect(baseX + 6, baseY + 26, w - 12, h - 26);
    // Draw brick rows
    ctx.strokeStyle = '#D4A373';
    ctx.lineWidth = 1;
    let brickRow = 0;
    for (let by = baseY + 28; by < baseY + h - 2; by += 8) {
      const offset = (brickRow % 2 === 0) ? 0 : 10;
      for (let bx = baseX + 6 + offset; bx < baseX + w - 6; bx += 20) {
        ctx.strokeRect(bx, by, 18, 7);
      }
      brickRow++;
    }
    // Solid dark red roof
    ctx.fillStyle = ht.roofColor;
    ctx.beginPath();
    ctx.moveTo(baseX - 4, baseY + 28);
    ctx.lineTo(baseX + w / 2, baseY - 5);
    ctx.lineTo(baseX + w + 4, baseY + 28);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#5C0000';
    ctx.lineWidth = 2;
    ctx.stroke();
    // Chimney on top
    ctx.fillStyle = '#8B0000';
    ctx.fillRect(baseX + w * 0.65, baseY - 5, 12, 20);
    ctx.fillStyle = '#5C0000';
    ctx.fillRect(baseX + w * 0.65 - 2, baseY - 7, 16, 4);
    // Arched door
    ctx.fillStyle = '#5C0000';
    ctx.fillRect(baseX + w / 2 - 10, baseY + h - 32, 20, 32);
    ctx.beginPath();
    ctx.arc(baseX + w / 2, baseY + h - 32, 10, Math.PI, 0);
    ctx.fill();
    // Nice window
    ctx.fillStyle = '#87CEEB';
    ctx.fillRect(baseX + w * 0.7, baseY + 40, 16, 14);
    ctx.strokeStyle = '#5C0000';
    ctx.lineWidth = 2;
    ctx.strokeRect(baseX + w * 0.7, baseY + 40, 16, 14);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(baseX + w * 0.7 + 8, baseY + 40);
    ctx.lineTo(baseX + w * 0.7 + 8, baseY + 54);
    ctx.moveTo(baseX + w * 0.7, baseY + 47);
    ctx.lineTo(baseX + w * 0.7 + 16, baseY + 47);
    ctx.stroke();
  }

  // Damage: cracks/holes when hp < maxHp
  if (dmgRatio < 1.0) {
    ctx.strokeStyle = 'rgba(0,0,0,0.6)';
    ctx.lineWidth = 2;
    const crackCount = Math.ceil((1 - dmgRatio) * 5);
    for (let c = 0; c < crackCount; c++) {
      const cx = baseX + 15 + (c * 17) % (w - 30);
      const cy = baseY + 35 + (c * 13) % (h - 40);
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + 8, cy + 6);
      ctx.lineTo(cx + 4, cy + 14);
      ctx.lineTo(cx + 12, cy + 18);
      ctx.stroke();
    }
  }

  // Player peeking through window when inside
  if (player.inHouse === house) {
    const winX = house.type === 'brick' ? baseX + w * 0.7 + 8 : (house.type === 'sticks' ? baseX + w * 0.7 + 7 : baseX + w * 0.75);
    const winY = house.type === 'brick' ? baseY + 47 : (house.type === 'sticks' ? baseY + 49 : baseY + 46);
    ctx.font = '10px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('👀', winX, winY);
  }

  // HP bar above house
  const hpBarW = 40;
  const hpBarH = 4;
  const hpBarX = house.x - hpBarW / 2;
  const hpBarY = baseY - 10;
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(hpBarX, hpBarY, hpBarW, hpBarH);
  const hpColor = dmgRatio > 0.5 ? '#4CAF50' : (dmgRatio > 0.25 ? '#FFC107' : '#f44336');
  ctx.fillStyle = hpColor;
  ctx.fillRect(hpBarX, hpBarY, hpBarW * dmgRatio, hpBarH);

  // House type emoji label
  ctx.font = '14px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(ht.emoji, house.x, baseY - 18);

  ctx.restore();
}

function drawPlayingScene() {
  ctx.save();
  // Apply screen shake
  applyScreenShake();

  drawGround();

  // Draw fart clouds (behind falling objects)
  for (const cloud of fartClouds) {
    ctx.save();
    ctx.globalAlpha = cloud.opacity;
    ctx.translate(cloud.x, cloud.y);
    ctx.scale(cloud.scale, cloud.scale);

    // Green stink cloud - multiple overlapping circles
    const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, 25);
    gradient.addColorStop(0, 'rgba(80, 180, 30, 0.6)');
    gradient.addColorStop(0.5, 'rgba(100, 200, 40, 0.3)');
    gradient.addColorStop(1, 'rgba(120, 220, 50, 0)');

    // Main cloud blob
    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.arc(0, 0, 25, 0, Math.PI * 2);
    ctx.fill();
    // Side blobs for cloud shape
    ctx.beginPath();
    ctx.arc(-12, -5, 18, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(12, -3, 20, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(0, -12, 16, 0, Math.PI * 2);
    ctx.fill();

    // Stink lines (wavy lines emanating from cloud)
    ctx.strokeStyle = 'rgba(80, 180, 30, ' + (cloud.opacity * 0.5) + ')';
    ctx.lineWidth = 2;
    for (let s = 0; s < 3; s++) {
      const angle = (s / 3) * Math.PI * 2 + cloud.wobble;
      ctx.beginPath();
      ctx.moveTo(Math.cos(angle) * 15, Math.sin(angle) * 15);
      ctx.quadraticCurveTo(
        Math.cos(angle + 0.3) * 30, Math.sin(angle + 0.3) * 30,
        Math.cos(angle + 0.6) * 20, Math.sin(angle + 0.6) * 20
      );
      ctx.stroke();
    }

    // Tiny 💨 emoji in center
    ctx.font = '16px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('\u{1F4A8}', 0, 0);

    ctx.restore();
  }

  // Wet fart projectiles
  for (const wf of wetFartProjectiles) {
    ctx.save();
    ctx.translate(wf.x, wf.y);

    // Trail
    for (const t of wf.trail) {
      ctx.globalAlpha = t.alpha * 0.4;
      ctx.fillStyle = '#886622';
      ctx.beginPath();
      ctx.arc(t.x - wf.x, t.y - wf.y, t.size / 2, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.globalAlpha = Math.min(1, wf.life);

    // Main projectile - brown/green cloud
    const wobbleY = Math.sin(wf.wobble) * 6;

    // Outer glow
    ctx.fillStyle = 'rgba(100, 80, 20, 0.3)';
    ctx.beginPath();
    ctx.ellipse(0, wobbleY, 40, 25, 0, 0, Math.PI * 2);
    ctx.fill();

    // Main blob
    const wfGrad = ctx.createRadialGradient(0, wobbleY, 5, 0, wobbleY, 30);
    wfGrad.addColorStop(0, 'rgba(139, 119, 42, 0.9)');
    wfGrad.addColorStop(0.5, 'rgba(100, 80, 20, 0.7)');
    wfGrad.addColorStop(1, 'rgba(80, 60, 10, 0)');
    ctx.fillStyle = wfGrad;
    ctx.beginPath();
    ctx.ellipse(0, wobbleY, 35, 22, 0, 0, Math.PI * 2);
    ctx.fill();

    // Droplets
    ctx.fillStyle = '#665500';
    for (let d = 0; d < 4; d++) {
      const dx = Math.cos(wf.wobble + d * 1.5) * 20 * wf.dir;
      const dy = Math.sin(wf.wobble * 2 + d) * 12;
      ctx.beginPath();
      ctx.arc(dx, wobbleY + dy, 3, 0, Math.PI * 2);
      ctx.fill();
    }

    // Emoji in center
    ctx.font = '20px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('\u{1F4A9}', wf.dir * 5, wobbleY);

    // Stink lines ahead of projectile
    ctx.strokeStyle = 'rgba(100, 150, 50, 0.5)';
    ctx.lineWidth = 2;
    for (let s = 0; s < 3; s++) {
      const sx = wf.dir * (25 + s * 12);
      ctx.beginPath();
      ctx.moveTo(sx, wobbleY - 10 + Math.sin(wf.wobble + s) * 5);
      ctx.quadraticCurveTo(sx + wf.dir * 8, wobbleY + Math.cos(wf.wobble + s) * 8, sx + wf.dir * 15, wobbleY + 5);
      ctx.stroke();
    }

    ctx.restore();
  }

  // Piggy inflation animation (before wet fart fires)
  if (wetFartInflateTimer > 0) {
    const inflateScale = 1.0 + (0.6 - wetFartInflateTimer) * 0.8;
    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.scale(Math.min(1.5, inflateScale), Math.min(1.5, inflateScale));
    ctx.fillStyle = 'rgba(255, 0, 0, ' + (0.3 * (1 - wetFartInflateTimer / 0.6)) + ')';
    ctx.beginPath();
    ctx.arc(0, 0, 30, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // Draw airplanes
  for (const plane of airplanes) {
    ctx.save();
    ctx.translate(plane.x, plane.y);
    if (plane.dir < 0) ctx.scale(-1, 1);
    // Fuselage
    ctx.fillStyle = '#888';
    ctx.beginPath();
    ctx.ellipse(0, 0, 30, 10, 0, 0, Math.PI * 2);
    ctx.fill();
    // Wings - proper airplane wings
    ctx.fillStyle = '#777';
    // Main wing
    ctx.beginPath();
    ctx.moveTo(-5, 0);
    ctx.lineTo(-15, -22);  // left wing tip
    ctx.lineTo(5, -22);
    ctx.lineTo(15, 0);
    ctx.lineTo(15, 4);
    ctx.lineTo(5, 18);    // right wing (below)
    ctx.lineTo(-15, 18);
    ctx.lineTo(-5, 0);
    ctx.closePath();
    ctx.fill();
    // Wing struts
    ctx.strokeStyle = '#555';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, -20);
    ctx.lineTo(0, 16);
    ctx.stroke();
    // Tail
    ctx.beginPath();
    ctx.moveTo(-28, 0);
    ctx.lineTo(-35, -12);
    ctx.lineTo(-25, 0);
    ctx.fill();
    // Propeller
    const propAngle = Date.now() / 30;
    ctx.strokeStyle = '#444';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(30, -8 * Math.sin(propAngle));
    ctx.lineTo(30, 8 * Math.sin(propAngle));
    ctx.stroke();
    ctx.restore();
  }

  // Falling objects (scaled for mobile)
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const now = performance.now() / 1000;
  const ms = MOBILE_SCALE; // visual scale multiplier
  for (const obj of objects) {
    if (obj.type === 'coin' && obj.coinType) {
      // Draw custom coin graphics (scale via save/restore)
      ctx.save();
      ctx.translate(obj.x, obj.y);
      ctx.scale(ms, ms);
      ctx.translate(-obj.x, -obj.y);
      drawCoin(obj.x, obj.y, obj.width, obj.coinType, now);
      ctx.restore();
    } else if (obj.type === 'special') {
      // Bills and moneybags - emoji with golden glow
      const sz = Math.round((obj.width || 42) * ms);
      ctx.font = sz + 'px sans-serif';
      const glowPulse = 12 + 6 * Math.sin(now * 6 + obj.x);
      ctx.shadowColor = obj.value >= 30 ? '#ff8800' : '#44cc44';
      ctx.shadowBlur = glowPulse;
      const bob = Math.sin(now * 3 + obj.x * 0.05) * 3;
      ctx.fillText(obj.emoji, obj.x, obj.y + bob);
      ctx.shadowBlur = 0;
    } else if (obj.type === 'bomb') {
      ctx.font = Math.round(36 * ms) + 'px sans-serif';
      const pulseR = 20 + 5 * Math.sin(now * 10);
      ctx.shadowColor = '#ff4400';
      ctx.shadowBlur = pulseR;
      ctx.fillText(obj.emoji, obj.x, obj.y);
      ctx.shadowBlur = 0;
    } else if (obj.type === 'corn') {
      ctx.font = Math.round(32 * ms) + 'px sans-serif';
      const cornGlow = 8 + 4 * Math.sin(now * 5);
      ctx.shadowColor = '#ffcc00';
      ctx.shadowBlur = cornGlow;
      ctx.fillText(obj.emoji, obj.x, obj.y);
      ctx.shadowBlur = 0;
    } else if (obj.type === 'butcher') {
      // Draw parachute if active
      if (obj.hasParachute) {
        ctx.save();
        ctx.translate(obj.x, obj.y - (obj.height || 50)/2 * ms - 15 * ms);
        const ps = ms; // parachute scale
        ctx.fillStyle = '#ff4444';
        ctx.beginPath();
        ctx.arc(0, -15 * ps, 25 * ps, Math.PI, 0);
        ctx.fill();
        // Stripes
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(0, -15 * ps, 25 * ps, Math.PI, Math.PI + 0.5);
        ctx.lineTo(0, -15 * ps);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(0, -15 * ps, 25 * ps, Math.PI + 1.0, Math.PI + 1.5);
        ctx.lineTo(0, -15 * ps);
        ctx.fill();
        // Ropes
        ctx.strokeStyle = '#888';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(-22 * ps, -10 * ps);
        ctx.lineTo(0, 15 * ps);
        ctx.moveTo(22 * ps, -10 * ps);
        ctx.lineTo(0, 15 * ps);
        ctx.moveTo(-12 * ps, -14 * ps);
        ctx.lineTo(0, 15 * ps);
        ctx.moveTo(12 * ps, -14 * ps);
        ctx.lineTo(0, 15 * ps);
        ctx.stroke();
        ctx.restore();
      }
      ctx.font = Math.round((obj.width || 50) * ms) + 'px sans-serif';
      const glowPulse = 8 + 4 * Math.sin(now * 4);
      ctx.shadowColor = '#cc0000';
      ctx.shadowBlur = glowPulse;
      ctx.fillText(obj.emoji, obj.x, obj.y);
      ctx.font = Math.round(18 * ms) + 'px sans-serif';
      ctx.fillText('\u{1F52A}', obj.x - 22 * ms, obj.y - 10);
      ctx.fillText('\u{1F52A}', obj.x + 22 * ms, obj.y - 10);
      ctx.shadowBlur = 0;
    } else if (obj.type === 'devil') {
      const dSize = Math.round((obj.width || 38) * ms);
      drawDevilSprite(obj.x, obj.y, dSize, Date.now() / 1000, obj.devilType || 'normal');
    } else {
      ctx.font = Math.round(32 * ms) + 'px sans-serif';
      ctx.fillText(obj.emoji || '', obj.x, obj.y);
    }
    // Floating name label for falling devils/butchers
    if ((obj.type === 'devil' || obj.type === 'butcher') && obj.nameTimer > 0) {
      drawNameLabel(obj.x, obj.y - obj.height/2 - 10, obj.type === 'devil' ? 'Đavo' : 'Kasapin', obj.nameTimer);
    }
  }

  // Lightning warning - 3-phase visual
  if (lightningWarning) {
    const lw = lightningWarning;

    if (lw.phase === 1) {
      // Phase 1: Cloud darkens, subtle flickers
      const flicker = Math.random() > 0.92 ? 0.4 : 0.15;
      ctx.fillStyle = `rgba(80, 80, 120, ${flicker})`;
      ctx.beginPath();
      ctx.ellipse(lw.x, lw.y - 15, 50, 25, 0, 0, Math.PI * 2);
      ctx.fill();
      // Small "rumble" text
      const rumbleAlpha = Math.sin(lw.totalTimer * 6) * 0.3 + 0.4;
      ctx.font = 'bold 14px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillStyle = `rgba(200, 200, 255, ${rumbleAlpha})`;
      ctx.fillText('⛈️', lw.x, lw.y - 35);
    }
    else if (lw.phase === 2) {
      // Phase 2: DANGER! Bright pulsing column showing where bolt will strike
      const pulse = Math.sin(Date.now() / 60) * 0.4 + 0.6;

      // Pulsing danger column from cloud to ground
      ctx.save();
      const gradient = ctx.createLinearGradient(lw.x, lw.y, lw.x, HEIGHT - 30);
      gradient.addColorStop(0, `rgba(255, 255, 0, ${pulse * 0.4})`);
      gradient.addColorStop(0.5, `rgba(255, 200, 0, ${pulse * 0.2})`);
      gradient.addColorStop(1, `rgba(255, 100, 0, ${pulse * 0.3})`);
      ctx.fillStyle = gradient;
      ctx.fillRect(lw.x - 18, lw.y, 36, HEIGHT - 30 - lw.y);
      ctx.restore();

      // Flashing ⚡ icon at cloud
      ctx.font = `bold ${24 + pulse * 8}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.fillStyle = `rgba(255, 255, 0, ${pulse})`;
      ctx.fillText('⚡', lw.x, lw.y - 10);

      // Danger zone on ground
      ctx.fillStyle = `rgba(255, 50, 0, ${pulse * 0.5})`;
      ctx.beginPath();
      ctx.ellipse(lw.x, HEIGHT - 30, 35, 8, 0, 0, Math.PI * 2);
      ctx.fill();

      // "OPASNOST!" text
      if (Math.sin(Date.now() / 100) > 0) {
        ctx.font = 'bold 16px sans-serif';
        ctx.fillStyle = `rgba(255, 255, 0, ${pulse})`;
        ctx.strokeStyle = 'rgba(0, 0, 0, 0.8)';
        ctx.lineWidth = 3;
        ctx.strokeText('⚠️ MUNJA!', lw.x, HEIGHT - 50);
        ctx.fillText('⚠️ MUNJA!', lw.x, HEIGHT - 50);
      }
    }
  }

  // Draw houses (behind enemies but in front of ground)
  for (const h of houses) {
    drawHouse(h);
  }

  // Draw poops with stink waves (behind enemies)
  for (const poop of poops) {
    ctx.save();
    ctx.font = Math.round(28 * ms) + 'px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('\u{1F4A9}', poop.x, poop.y);
    // Green stink waves rising
    const alpha = poop.life / POOP_DURATION;
    ctx.strokeStyle = `rgba(100, 200, 50, ${(Math.sin(poop.stinkTimer * 3) * 0.3 + 0.5) * alpha})`;
    ctx.lineWidth = 2;
    for (let i = 0; i < 3; i++) {
      ctx.beginPath();
      const ox = Math.sin(poop.stinkTimer * 2 + i * 2) * 10;
      ctx.moveTo(poop.x - 15 + ox, poop.y - 10 - i * 12);
      ctx.quadraticCurveTo(poop.x + ox, poop.y - 20 - i * 12, poop.x + 15 + ox, poop.y - 10 - i * 12);
      ctx.stroke();
    }
    ctx.restore();
  }

  // Ground enemies (scaled for mobile)
  for (const e of groundEnemies) {
    if (e.type === 'wolf') {
      ctx.save(); ctx.translate(e.x, e.y); ctx.scale(ms, ms); ctx.translate(-e.x, -e.y);
      drawWolf(e.x, e.y, e.dir, e.animTimer);
      ctx.restore();
    } else if (e.type === 'carnivore') {
      ctx.save(); ctx.translate(e.x, e.y); ctx.scale(ms, ms); ctx.translate(-e.x, -e.y);
      drawCarnivoreSprite(e.x, e.y, e.dir, e.animTimer);
      ctx.restore();
    } else if (e.type === 'farmer') {
      ctx.save(); ctx.translate(e.x, e.y); ctx.scale(ms, ms); ctx.translate(-e.x, -e.y);
      drawFarmerSprite(e.x, e.y, e.dir, e.animTimer);
      ctx.restore();
    } else if (e.type === 'fox') {
      ctx.save(); ctx.translate(e.x, e.y); ctx.scale(ms, ms); ctx.translate(-e.x, -e.y);
      drawFoxSprite(e.x, e.y, e.dir, e.animTimer);
      ctx.restore();
    } else if (e.type === 'butcher_ground') {
      ctx.save(); ctx.translate(e.x, e.y); ctx.scale(ms, ms); ctx.translate(-e.x, -e.y);
      drawButcherGroundSprite(e.x, e.y, e.dir, e.animTimer);
      ctx.restore();
    } else {
      ctx.save();
      ctx.translate(e.x, e.y);
      ctx.scale(ms * (e.dir < 0 ? -1 : 1), ms);
      const bob = Math.sin(e.animTimer * 8) * 3;
      ctx.font = `${e.width}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(e.emoji, 0, bob);
      ctx.restore();
    }
    // Floating name label above ground enemy
    const enemyNames = { wolf: 'Vuk', fox: 'Lisica', carnivore: 'Mesožder', farmer: 'Farmer', butcher_ground: 'Kasapin' };
    if (e.nameTimer > 0) drawNameLabel(e.x, e.y - e.height/2 - 10, enemyNames[e.type] || e.type, e.nameTimer);
  }

  // Draw vegan ally
  if (vegan && vegan.state !== 'dead') {
    // Green aura
    ctx.save();
    ctx.translate(vegan.x, vegan.y);
    const auraAlpha = Math.sin(vegan.auraTimer * 3) * 0.15 + 0.2;
    ctx.fillStyle = `rgba(100, 220, 100, ${auraAlpha})`;
    ctx.beginPath();
    ctx.arc(0, -5, 30, 0, Math.PI * 2);
    ctx.fill();
    // HP bar
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(-15, -40, 30, 5);
    ctx.fillStyle = vegan.hp > 1 ? '#4CAF50' : '#ff4444';
    ctx.fillRect(-15, -40, 30 * (vegan.hp / vegan.maxHp), 5);
    ctx.restore();
    // Draw the vegan sprite
    drawVeganSprite(vegan.x, vegan.y, vegan.dir, vegan.auraTimer, vegan.state);
    if (vegan.nameTimer > 0) drawNameLabel(vegan.x, vegan.y - 35, 'Vegan 🌿', vegan.nameTimer);
  }

  // Player (piggy with visual states)
  drawPiggy();

  // Latched devil on top of player
  if (game.latchedDevil) {
    const devil = game.latchedDevil;
    const devilFontSize = devil.devilType === 'heavy' ? 44 : (devil.devilType === 'thief' ? 40 : 36);
    ctx.font = devilFontSize + 'px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    // Visual flair per type
    if (devil.devilType === 'butcher') {
      // Butcher-specific drawing
      ctx.font = '46px sans-serif';
      ctx.fillText(devil.emoji, devil.x, devil.y + shakeVisualOffset);

      // Two knives - alternating stabbing animation
      const knifePhase = devil.hammerAnimTimer * 4;
      const leftKnifeY = Math.sin(knifePhase) * 12;
      const rightKnifeY = Math.sin(knifePhase + Math.PI) * 12; // opposite phase

      ctx.font = '22px sans-serif';
      ctx.fillText('\u{1F52A}', devil.x - 28, devil.y - 10 + leftKnifeY + shakeVisualOffset);
      ctx.fillText('\u{1F52A}', devil.x + 28, devil.y - 10 + rightKnifeY + shakeVisualOffset);
    } else {
      drawDevilSprite(devil.x, devil.y + shakeVisualOffset, devilFontSize, devil.hammerAnimTimer, devil.devilType || 'normal');

      // Thief: show coin being stolen periodically
      if (devil.devilType === 'thief' && devil.stealTimer < 0.25) {
        ctx.font = '16px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('\u{1F4B0}', devil.x + 20, devil.y - 10 + shakeVisualOffset);
      }
    }

    // Danger bar (red) - uses dynamic hammerTimeout
    const barWidth = 60;
    const barHeight = 8;
    const barX = player.x - barWidth / 2;
    const barY = player.y - 80;
    const fill = Math.min(devil.hammerTimer / devil.hammerTimeout, 1.0);

    ctx.fillStyle = '#333';
    ctx.fillRect(barX, barY, barWidth, barHeight);

    let barAlpha = 1.0;
    if (fill > 0.8) {
      barAlpha = 0.5 + 0.5 * Math.abs(Math.sin(Date.now() / 100));
    }
    ctx.globalAlpha = barAlpha;
    ctx.fillStyle = '#ff2222';
    ctx.fillRect(barX, barY, barWidth * fill, barHeight);
    ctx.globalAlpha = 1.0;

    ctx.strokeStyle = '#000';
    ctx.lineWidth = 1;
    ctx.strokeRect(barX, barY, barWidth, barHeight);

    // Shake progress bar (green) - reflects different shakeRequired
    const shakeBarY = barY + barHeight + 3;
    const shakeFill = Math.min(devil.shakeProgress / devil.shakeRequired, 1.0);

    ctx.fillStyle = '#333';
    ctx.fillRect(barX, shakeBarY, barWidth, barHeight);
    ctx.fillStyle = '#44ff44';
    ctx.fillRect(barX, shakeBarY, barWidth * shakeFill, barHeight);
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 1;
    ctx.strokeRect(barX, shakeBarY, barWidth, barHeight);

    // Shake hint text
    const hintAlpha = 0.5 + 0.5 * Math.abs(Math.sin(Date.now() / 200));
    ctx.globalAlpha = hintAlpha;
    ctx.font = 'bold 18px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffff00';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 3;
    ctx.strokeText('\u2B06\u2B07 SHAKE!', player.x, player.y - 95);
    ctx.fillText('\u2B06\u2B07 SHAKE!', player.x, player.y - 95);
    ctx.globalAlpha = 1.0;
    ctx.lineWidth = 1;

    // Devil type indicator
    if (devilTypeIndicator) {
      const indAlpha = Math.min(1.0, devilTypeIndicator.timer / 0.3);
      ctx.globalAlpha = indAlpha;
      ctx.font = 'bold 26px sans-serif';
      ctx.textAlign = 'center';
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 4;
      ctx.strokeText(devilTypeIndicator.text, player.x, player.y - 115);
      ctx.fillStyle = devilTypeIndicator.color;
      ctx.fillText(devilTypeIndicator.text, player.x, player.y - 115);
      ctx.globalAlpha = 1.0;
      ctx.lineWidth = 1;
    }
  }

  // Ejected coin animations
  for (const ec of ejectedCoins) {
    if (ec.phase === 'rising') {
      ctx.font = '28px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('\u{1FA99}', ec.x, ec.y);
    } else if (ec.phase === 'hit') {
      ctx.save();
      ctx.translate(ec.hitX, ec.hitY);
      ctx.rotate(ec.devilAngle);
      ctx.font = '36px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.globalAlpha = Math.max(0, 1.0 - ec.hitTimer / 0.6);
      ctx.fillText(ec.devilEmoji, 0, 0);
      ctx.restore();
      ctx.globalAlpha = 1.0;
    }
  }

  // Draw choking devils
  for (const cd of chokingDevils) {
    ctx.save();
    ctx.globalAlpha = cd.opacity;
    ctx.translate(cd.x, cd.y);

    // Shake/convulse while choking
    const shakeX = Math.sin(cd.coughTimer * 30) * 5;
    ctx.translate(shakeX, 0);

    // Draw devil emoji
    ctx.font = (cd.width || 38) + 'px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(cd.emoji, 0, 0);

    // Coughing text that pops up periodically
    if (Math.floor(cd.coughTimer * 5) % 2 === 0) {
      ctx.font = 'bold 14px sans-serif';
      ctx.fillStyle = '#44ff44';
      ctx.fillText('\u{1F922}', 20, -15);
    }

    // Green stink swirls around the devil
    ctx.font = '12px sans-serif';
    for (let s = 0; s < 3; s++) {
      const angle = cd.coughTimer * 3 + s * 2.1;
      const sx = Math.cos(angle) * 20;
      const sy = Math.sin(angle) * 15;
      ctx.fillText('\u{1F4A8}', sx, sy);
    }

    ctx.restore();
  }

  // Lightning bolts
  for (const bolt of lightningBolts) {
    // Screen flash
    if (bolt.flash > 0) {
      ctx.fillStyle = `rgba(255, 255, 255, ${bolt.flash * 0.3})`;
      ctx.fillRect(0, 0, WIDTH, HEIGHT);
    }
    // Draw jagged bolt
    ctx.strokeStyle = `rgba(255, 255, 100, ${Math.max(0, bolt.life / 0.3)})`;
    ctx.lineWidth = 4;
    ctx.shadowColor = '#ffff00';
    ctx.shadowBlur = 15;
    for (const seg of bolt.segments) {
      ctx.beginPath();
      ctx.moveTo(seg.x1, seg.y1);
      ctx.lineTo(seg.x2, seg.y2);
      ctx.stroke();
    }
    // Inner bright core
    ctx.strokeStyle = `rgba(255, 255, 255, ${Math.max(0, bolt.life / 0.3)})`;
    ctx.lineWidth = 2;
    for (const seg of bolt.segments) {
      ctx.beginPath();
      ctx.moveTo(seg.x1, seg.y1);
      ctx.lineTo(seg.x2, seg.y2);
      ctx.stroke();
    }
    ctx.shadowBlur = 0;
  }

  // Particles
  drawParticles();

  // Score pop-ups
  drawScorePopups();

  // Speech bubbles (on top of characters)
  drawSpeechBubbles();

  // Draw vegan death animation (on top of everything except UI)
  if (veganDeathAnim) {
    const da = veganDeathAnim;
    ctx.save();
    ctx.globalAlpha = da.opacity;
    ctx.translate(da.x, da.y);

    // Halo
    if (da.haloSize > 0) {
      ctx.strokeStyle = '#FFD700';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.ellipse(0, -35, 15 * da.haloSize, 5 * da.haloSize, 0, 0, Math.PI * 2);
      ctx.stroke();
    }

    // Angel wings
    if (da.wingSpread > 0) {
      ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
      // Left wing
      ctx.beginPath();
      ctx.moveTo(-5, -10);
      ctx.quadraticCurveTo(-30 * da.wingSpread, -30, -40 * da.wingSpread, -5);
      ctx.quadraticCurveTo(-25 * da.wingSpread, 0, -5, 5);
      ctx.fill();
      // Right wing
      ctx.beginPath();
      ctx.moveTo(5, -10);
      ctx.quadraticCurveTo(30 * da.wingSpread, -30, 40 * da.wingSpread, -5);
      ctx.quadraticCurveTo(25 * da.wingSpread, 0, 5, 5);
      ctx.fill();
    }

    // Vegan emoji rising
    ctx.font = '40px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('\u{1F607}', 0, 0);

    ctx.restore();

    // Message text
    if (da.timer > 1.0) {
      ctx.save();
      ctx.globalAlpha = Math.min(1, (da.timer - 1) / 1.0);
      ctx.font = 'bold 24px sans-serif';
      ctx.textAlign = 'center';
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 3;
      ctx.strokeText(da.msg, WIDTH / 2, HEIGHT / 2 - 50);
      ctx.fillStyle = '#ff4444';
      ctx.fillText(da.msg, WIDTH / 2, HEIGHT / 2 - 50);
      ctx.restore();
    }
  }

  // Success flash (green)
  if (successFlashTimer > 0) {
    ctx.globalAlpha = successFlashTimer / 0.4 * 0.25;
    ctx.fillStyle = '#00ff00';
    ctx.fillRect(0, 0, WIDTH, HEIGHT);
    ctx.globalAlpha = 1.0;
  }

  // --- Draw Boss ---
  if (boss && boss.state !== 'dead') {
    drawBoss();
  }
  // --- Draw Boss Projectiles ---
  for (const bp of bossProjectiles) {
    ctx.font = bp.size + 'px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(bp.emoji, bp.x, bp.y);
  }

  // --- Aim trajectory line (dashed) ---
  if (aimingActive && wetFartCharges > 0 && !player.inHouse && game.screen === 'playing') {
    drawAimTrajectory();
  }

  // --- Boss intro banner: huge instructions overlay when boss appears ---
  if (boss && bossBannerTimer > 0) {
    drawBossBanner(bossBannerTimer);
  }
  // --- Persistent boss-fight reminder (small, top-left under HP bar) ---
  if (boss && boss.state === 'fighting' && bossBannerTimer <= 0) {
    drawBossHint();
  }

  // --- Draw Power-up Drops ---
  for (const pu of powerUpDrops) {
    const pt = POWER_UP_TYPES[pu.powerType];
    const bob = Math.sin((pu.bobTimer || 0) * 4) * 5;
    // Glow
    ctx.shadowColor = pt.color;
    ctx.shadowBlur = 15;
    ctx.font = '28px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(pt.emoji, pu.x, pu.y + bob);
    ctx.shadowBlur = 0;
    // Rotating ring
    ctx.strokeStyle = pt.color;
    ctx.lineWidth = 2;
    ctx.globalAlpha = 0.5;
    ctx.beginPath();
    ctx.arc(pu.x, pu.y + bob, 20, Date.now() / 500, Date.now() / 500 + Math.PI * 1.2);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // --- Draw Active Power-up Icons (bottom of screen) ---
  if (activePowerUps.length > 0) {
    for (let i = 0; i < activePowerUps.length; i++) {
      const ap = activePowerUps[i];
      const pt = POWER_UP_TYPES[ap.type];
      const px = 30 + i * 45;
      const py = HEIGHT - 60;
      // Timer bar
      const pct = ap.timer / ap.maxTimer;
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(px - 15, py + 12, 30, 4);
      ctx.fillStyle = pt.color;
      ctx.fillRect(px - 15, py + 12, 30 * pct, 4);
      // Icon
      ctx.font = '20px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(pt.emoji, px, py);
      // Blink when about to expire
      if (ap.timer < 2 && Math.sin(Date.now() / 100) > 0) {
        ctx.globalAlpha = 0.3;
        ctx.fillStyle = pt.color;
        ctx.beginPath();
        ctx.arc(px, py, 15, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
    }
  }

  // Flash overlay (red for damage, gold for moneybag)
  if (flashTimer > 0) {
    ctx.globalAlpha = flashTimer / 0.3 * 0.4;
    ctx.fillStyle = flashColor || '#ff0000';
    ctx.fillRect(0, 0, WIDTH, HEIGHT);
    ctx.globalAlpha = 1.0;
  }

  // Freeze overlay
  if (hasPowerUp('freeze')) {
    ctx.globalAlpha = 0.1;
    ctx.fillStyle = '#88DDFF';
    ctx.fillRect(0, 0, WIDTH, HEIGHT);
    ctx.globalAlpha = 1;
  }

  ctx.restore(); // restore screen shake transform

  // Mobile touch zones drawn on canvas (outside shake transform)
  if (isMobile && game.screen === 'playing') {
    drawMobileTouchZones();
  }

  // HUD drawn outside shake transform so it stays stable
  drawHUD();

  // Enemy intro - just show name as floating text (no black bar)
  if (enemyIntroActive) {
    const ei = enemyIntroActive;
    const alpha = ei.timer > 0.5 ? Math.min(1, (ei.duration - ei.timer + 0.5) / 0.5) : ei.timer / 0.5; // fade in 0.5s, fade out 0.5s
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.textAlign = 'center';
    // Icon + name in large text, no background
    ctx.font = 'bold 28px sans-serif';
    ctx.strokeStyle = 'rgba(0,0,0,0.8)';
    ctx.lineWidth = 4;
    ctx.strokeText(ei.icon + ' ' + ei.name, WIDTH / 2, 80);
    ctx.fillStyle = '#FFD700';
    ctx.fillText(ei.icon + ' ' + ei.name, WIDTH / 2, 80);
    // Description smaller
    ctx.font = '18px sans-serif';
    ctx.strokeStyle = 'rgba(0,0,0,0.7)';
    ctx.lineWidth = 3;
    ctx.strokeText(ei.desc, WIDTH / 2, 108);
    ctx.fillStyle = '#fff';
    ctx.fillText(ei.desc, WIDTH / 2, 108);
    ctx.restore();
  }
}

function playVictoryMusic() {
  if (!audioCtx) return;
  const ctx2 = audioCtx;
  const now = ctx2.currentTime;
  // C major peaceful melody - idyllic farm feel
  const melody = [
    { freq: 523, dur: 0.45 }, // C5
    { freq: 659, dur: 0.45 }, // E5
    { freq: 784, dur: 0.45 }, // G5
    { freq: 659, dur: 0.45 }, // E5
    { freq: 523, dur: 0.45 }, // C5
    { freq: 587, dur: 0.45 }, // D5
    { freq: 659, dur: 0.45 }, // E5
    { freq: 523, dur: 0.9 },  // C5 (held)
  ];
  let t = 0;
  melody.forEach((note) => {
    const osc = ctx2.createOscillator();
    const gain = ctx2.createGain();
    osc.type = 'sine';
    osc.frequency.value = note.freq;
    gain.gain.setValueAtTime(0.08, now + t);
    gain.gain.exponentialRampToValueAtTime(0.01, now + t + note.dur - 0.05);
    osc.connect(gain);
    gain.connect(ctx2.destination);
    osc.start(now + t);
    osc.stop(now + t + note.dur);
    t += note.dur;
  });
}

function stopVictoryMusic() {
  if (victoryMusicTimeout) {
    clearTimeout(victoryMusicTimeout);
    victoryMusicTimeout = null;
  }
}

function playGunshotSound() {
  if (!audioCtx) return;
  const ctx2 = audioCtx;
  const now = ctx2.currentTime;
  // Sharp crack
  const osc = ctx2.createOscillator();
  const gain = ctx2.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(200, now);
  osc.frequency.exponentialRampToValueAtTime(50, now + 0.1);
  gain.gain.setValueAtTime(0.3, now);
  gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
  osc.connect(gain);
  gain.connect(ctx2.destination);
  osc.start(now);
  osc.stop(now + 0.2);
}

function drawVictory() {
  // Sky gradient
  const skyGrad = ctx.createLinearGradient(0, 0, 0, HEIGHT * 0.6);
  skyGrad.addColorStop(0, '#87CEEB');
  skyGrad.addColorStop(1, '#E0F7FF');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, WIDTH, HEIGHT);

  // Sun (bigger, brighter)
  ctx.fillStyle = '#FFD700';
  ctx.beginPath();
  ctx.arc(WIDTH - 80, 70, 45, 0, Math.PI * 2);
  ctx.fill();
  // Sun rays (rotating)
  ctx.strokeStyle = '#FFD700';
  ctx.lineWidth = 3;
  for (let i = 0; i < 12; i++) {
    const angle = (i / 12) * Math.PI * 2 + victoryTimer / 3;
    ctx.beginPath();
    ctx.moveTo(WIDTH - 80 + Math.cos(angle) * 50, 70 + Math.sin(angle) * 50);
    ctx.lineTo(WIDTH - 80 + Math.cos(angle) * 68, 70 + Math.sin(angle) * 68);
    ctx.stroke();
  }

  // Clouds
  for (const cloud of skyClouds) {
    ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
    ctx.beginPath();
    ctx.arc(cloud.x, cloud.y, cloud.w * 0.25, 0, Math.PI * 2);
    ctx.arc(cloud.x + cloud.w * 0.25, cloud.y - cloud.w * 0.12, cloud.w * 0.3, 0, Math.PI * 2);
    ctx.arc(cloud.x + cloud.w * 0.5, cloud.y, cloud.w * 0.22, 0, Math.PI * 2);
    ctx.fill();
  }

  // Rolling green hills
  ctx.fillStyle = '#4CAF50';
  ctx.beginPath();
  ctx.moveTo(0, HEIGHT * 0.55);
  for (let x = 0; x <= WIDTH; x += 20) {
    ctx.lineTo(x, HEIGHT * 0.55 + Math.sin(x / 100 + 1) * 20);
  }
  ctx.lineTo(WIDTH, HEIGHT);
  ctx.lineTo(0, HEIGHT);
  ctx.fill();

  // Darker grass foreground
  ctx.fillStyle = '#388E3C';
  ctx.beginPath();
  ctx.moveTo(0, HEIGHT * 0.7);
  for (let x = 0; x <= WIDTH; x += 15) {
    ctx.lineTo(x, HEIGHT * 0.7 + Math.sin(x / 80 + 2) * 10);
  }
  ctx.lineTo(WIDTH, HEIGHT);
  ctx.lineTo(0, HEIGHT);
  ctx.fill();

  // Red American barn
  ctx.fillStyle = '#B22222';
  ctx.fillRect(WIDTH / 2 - 80, HEIGHT * 0.35, 160, 100);
  // Roof
  ctx.fillStyle = '#8B0000';
  ctx.beginPath();
  ctx.moveTo(WIDTH / 2 - 100, HEIGHT * 0.35);
  ctx.lineTo(WIDTH / 2, HEIGHT * 0.25);
  ctx.lineTo(WIDTH / 2 + 100, HEIGHT * 0.35);
  ctx.fill();
  // Barn door
  ctx.fillStyle = '#5B1010';
  ctx.fillRect(WIDTH / 2 - 20, HEIGHT * 0.35 + 40, 40, 60);
  // White X on barn
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(WIDTH / 2 - 60, HEIGHT * 0.35 + 10);
  ctx.lineTo(WIDTH / 2 + 60, HEIGHT * 0.35 + 90);
  ctx.moveTo(WIDTH / 2 + 60, HEIGHT * 0.35 + 10);
  ctx.lineTo(WIDTH / 2 - 60, HEIGHT * 0.35 + 90);
  ctx.stroke();

  // Barbed wire fence (on top of/replacing picket fence)
  ctx.strokeStyle = '#555';
  ctx.lineWidth = 2;
  // Main wire lines (3 horizontal)
  for (let wireY = 0; wireY < 3; wireY++) {
    const wy = HEIGHT - 90 - wireY * 20;
    ctx.beginPath();
    for (let wx = 0; wx < WIDTH; wx += 5) {
      ctx.lineTo(wx, wy + Math.sin(wx / 15) * 2);
    }
    ctx.stroke();
    // Barbs every 20px
    ctx.strokeStyle = '#666';
    ctx.lineWidth = 1.5;
    for (let bx = 10; bx < WIDTH; bx += 20) {
      const by = wy + Math.sin(bx / 15) * 2;
      ctx.beginPath();
      ctx.moveTo(bx - 3, by - 4);
      ctx.lineTo(bx + 3, by + 4);
      ctx.moveTo(bx + 3, by - 4);
      ctx.lineTo(bx - 3, by + 4);
      ctx.stroke();
    }
    ctx.strokeStyle = '#555';
    ctx.lineWidth = 2;
  }
  // Fence posts
  ctx.fillStyle = '#444';
  for (let px = 50; px < WIDTH; px += 100) {
    ctx.fillRect(px - 3, HEIGHT - 130, 6, 60);
  }

  // Flowers
  const flowerColors = ['#FF69B4', '#FF6347', '#FFD700', '#FF4500', '#DA70D6'];
  for (let i = 0; i < 20; i++) {
    const fx = 50 + (i * 37) % (WIDTH - 100);
    const fy = HEIGHT - 50 + Math.sin(i * 1.7) * 10;
    ctx.fillStyle = flowerColors[i % flowerColors.length];
    ctx.beginPath();
    ctx.arc(fx, fy, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#228B22';
    ctx.fillRect(fx - 1, fy, 2, 8);
  }

  // Anti-aircraft gun drawing function
  function drawAAGun(x, y, angle) {
    ctx.save();
    ctx.translate(x, y);
    // Base platform
    ctx.fillStyle = '#555';
    ctx.fillRect(-15, 0, 30, 8);
    // Rotating turret
    ctx.save();
    ctx.rotate(angle);
    // Gun barrel (long)
    ctx.fillStyle = '#444';
    ctx.fillRect(0, -3, 35, 6);
    // Muzzle flash (random)
    if (Math.random() > 0.7) {
      ctx.fillStyle = '#ff0';
      ctx.beginPath();
      ctx.arc(38, 0, 5, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
    // Ammo belt
    ctx.fillStyle = '#665500';
    ctx.fillRect(-10, -4, 12, 8);
    // Small wheels
    ctx.fillStyle = '#333';
    ctx.beginPath();
    ctx.arc(-10, 8, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(10, 8, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // Draw 2 AA guns
  const aaAngle = Math.sin(victoryTimer * 2) * 0.5 - 0.8; // sweeping upward
  drawAAGun(100, HEIGHT - 135, aaAngle);
  drawAAGun(WIDTH - 100, HEIGHT - 135, Math.PI + Math.sin(victoryTimer * 2.3) * 0.5 + 0.8);

  // Tracer bullets from AA guns
  ctx.strokeStyle = '#ff0';
  ctx.lineWidth = 2;
  for (let t = 0; t < 3; t++) {
    const tx = 100 + Math.cos(aaAngle) * (50 + t * 80 + (victoryTimer * 200) % 80);
    const ty = HEIGHT - 135 + Math.sin(aaAngle) * (50 + t * 80 + (victoryTimer * 200) % 80);
    if (ty > 0 && ty < HEIGHT) {
      ctx.beginPath();
      ctx.moveTo(tx, ty);
      ctx.lineTo(tx + Math.cos(aaAngle) * 15, ty + Math.sin(aaAngle) * 15);
      ctx.stroke();
    }
  }

  // Vegans petting piglets
  for (const v of victoryVegans) {
    ctx.font = '36px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText('\u{1F9D1}\u200D\u{1F33E}', v.x, v.y);
    // Floating hearts
    const heartY = v.y - 30 - (1.5 - v.heartTimer) * 20;
    const heartAlpha = Math.max(0, v.heartTimer / 1.5);
    ctx.globalAlpha = heartAlpha;
    ctx.font = '16px sans-serif';
    ctx.fillText('\u2764\uFE0F', v.x + 15, heartY);
    ctx.globalAlpha = 1;
  }

  // Piglets bouncing and playing
  for (const p of victoryPiglets) {
    const bounce = Math.abs(Math.sin(p.bouncePhase)) * 15;
    ctx.font = `${p.size}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText(p.isMain ? '\u{1F437}' : '\u{1F43D}', p.x, p.y - bounce);
  }

  // Armed angels on perimeter
  for (const a of victoryAngels) {
    ctx.save();
    ctx.translate(a.x, a.y);
    if (a.dir < 0) ctx.scale(-1, 1);

    // Angel emoji
    ctx.font = '40px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('\u{1F607}', 0, 0);

    // Ammo belt (brown diagonal stripe across chest)
    ctx.strokeStyle = '#8B4513';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(-12, -8);
    ctx.lineTo(12, 8);
    ctx.stroke();
    // Ammo dots on belt
    ctx.fillStyle = '#DAA520';
    for (let i = 0; i < 5; i++) {
      ctx.beginPath();
      ctx.arc(-10 + i * 5, -6 + i * 3.2, 2, 0, Math.PI * 2);
      ctx.fill();
    }

    // Machine gun
    ctx.fillStyle = '#333';
    ctx.fillRect(15, -4, 25, 6);
    ctx.fillRect(15, -7, 5, 10);

    // Muzzle flash when firing
    if (a.firing && a.fireAnim > 0.15) {
      ctx.fillStyle = '#FFD700';
      ctx.beginPath();
      ctx.moveTo(40, -1);
      ctx.lineTo(55, -8);
      ctx.lineTo(50, -1);
      ctx.lineTo(55, 6);
      ctx.closePath();
      ctx.fill();

      // "BANG!" text
      ctx.save();
      if (a.dir < 0) ctx.scale(-1, 1);
      ctx.font = 'bold 16px sans-serif';
      ctx.fillStyle = '#ff0000';
      ctx.textAlign = 'center';
      ctx.fillText('BANG!', 50, -20);
      ctx.restore();
    }

    ctx.restore();
  }

  // Title text
  ctx.font = 'bold 52px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 4;
  ctx.strokeText('SLOBODA! \u{1F437}', WIDTH / 2, 50);
  ctx.fillStyle = '#FFD700';
  ctx.fillText('SLOBODA! \u{1F437}', WIDTH / 2, 50);

  ctx.font = '22px sans-serif';
  ctx.fillStyle = '#fff';
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 2;
  const sub = 'Kasica i njena bra\u0107a i sestre \u017eive sre\u0107no zauvek...';
  ctx.strokeText(sub, WIDTH / 2, 85);
  ctx.fillText(sub, WIDTH / 2, 85);

  ctx.font = 'bold 28px sans-serif';
  ctx.fillStyle = '#FFD700';
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 3;
  ctx.strokeText('Final Score: ' + game.score, WIDTH / 2, 120);
  ctx.fillText('Final Score: ' + game.score, WIDTH / 2, 120);

  // Thank you message (fades in after 3 seconds)
  if (victoryTimer > 3) {
    ctx.globalAlpha = Math.min(1, (victoryTimer - 3) / 2);
    ctx.font = 'bold 24px sans-serif';
    ctx.fillStyle = '#ff6699';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2;
    ctx.strokeText('Hvala ti \u0161to si nam pomogao/la! \u2764\uFE0F', WIDTH / 2, 155);
    ctx.fillText('Hvala ti \u0161to si nam pomogao/la! \u2764\uFE0F', WIDTH / 2, 155);
    ctx.globalAlpha = 1;
  }

  // Click to continue hint (after 5 seconds)
  if (victoryTimer > 5) {
    ctx.globalAlpha = 0.5 + 0.5 * Math.sin(victoryTimer * 3);
    ctx.font = '18px sans-serif';
    ctx.fillStyle = '#fff';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2;
    ctx.strokeText('Klikni za nastavak', WIDTH / 2, HEIGHT - 15);
    ctx.fillText('Klikni za nastavak', WIDTH / 2, HEIGHT - 15);
    ctx.globalAlpha = 1;
  }
}

function drawGameOver() {
  const t = gameOverTimer;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  // Dark fiery background
  const bgGrad = ctx.createLinearGradient(0, 0, 0, HEIGHT);
  bgGrad.addColorStop(0, '#1a0a00');
  bgGrad.addColorStop(0.5, '#3a1500');
  bgGrad.addColorStop(1, '#2a0800');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, WIDTH, HEIGHT);

  // Flickering fire at the bottom
  for (let i = 0; i < 12; i++) {
    const fx = WIDTH / 2 - 120 + i * 22;
    const flicker = Math.sin(t * 8 + i * 1.7) * 10 + Math.sin(t * 12 + i * 2.3) * 5;
    const fh = 40 + flicker;
    const fireGrad = ctx.createLinearGradient(fx, HEIGHT - 100, fx, HEIGHT - 100 - fh);
    fireGrad.addColorStop(0, 'rgba(255, 100, 0, 0.8)');
    fireGrad.addColorStop(0.4, 'rgba(255, 200, 0, 0.6)');
    fireGrad.addColorStop(1, 'rgba(255, 255, 100, 0)');
    ctx.fillStyle = fireGrad;
    ctx.beginPath();
    ctx.ellipse(fx, HEIGHT - 100, 15, fh, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  // Embers rising
  for (let i = 0; i < 8; i++) {
    const ex = WIDTH / 2 - 80 + (i * 47 + t * 30) % 160;
    const ey = HEIGHT - 120 - ((t * 40 + i * 60) % 200);
    const eAlpha = Math.max(0, 1 - ((t * 40 + i * 60) % 200) / 200);
    ctx.fillStyle = 'rgba(255, ' + Math.floor(150 + Math.sin(t * 5 + i) * 50) + ', 0, ' + (eAlpha * 0.8) + ')';
    ctx.beginPath();
    ctx.arc(ex, ey, 2, 0, Math.PI * 2);
    ctx.fill();
  }

  // --- ROAST PIG ON SPIT ---
  const spitCenterX = WIDTH / 2;
  const spitCenterY = HEIGHT / 2 + 20;
  const rotAngle = t * 1.5; // slow rotation

  // Spit pole (horizontal bar)
  ctx.strokeStyle = '#888';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(spitCenterX - 140, spitCenterY);
  ctx.lineTo(spitCenterX + 140, spitCenterY);
  ctx.stroke();

  // Spit supports (Y-shaped stands)
  ctx.strokeStyle = '#666';
  ctx.lineWidth = 5;
  // Left stand
  ctx.beginPath();
  ctx.moveTo(spitCenterX - 130, HEIGHT - 80);
  ctx.lineTo(spitCenterX - 130, spitCenterY + 10);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(spitCenterX - 140, spitCenterY - 10);
  ctx.lineTo(spitCenterX - 130, spitCenterY + 10);
  ctx.lineTo(spitCenterX - 120, spitCenterY - 10);
  ctx.stroke();
  // Right stand
  ctx.beginPath();
  ctx.moveTo(spitCenterX + 130, HEIGHT - 80);
  ctx.lineTo(spitCenterX + 130, spitCenterY + 10);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(spitCenterX + 120, spitCenterY - 10);
  ctx.lineTo(spitCenterX + 130, spitCenterY + 10);
  ctx.lineTo(spitCenterX + 140, spitCenterY - 10);
  ctx.stroke();

  // Rotating roast pig
  ctx.save();
  ctx.translate(spitCenterX, spitCenterY);
  const yScale = Math.cos(rotAngle);
  ctx.scale(1, yScale); // Compress vertically to simulate spit rotation

  // Roasted body (darker, golden-brown)
  const roastColor = '#C8852A';
  const roastDark = '#8B5E1A';
  ctx.fillStyle = roastColor;
  ctx.beginPath();
  ctx.ellipse(0, 0, 55, 28, 0, 0, Math.PI * 2);
  ctx.fill();
  // Darker shading
  ctx.fillStyle = roastDark;
  ctx.beginPath();
  ctx.ellipse(0, 8, 50, 15, 0, 0, Math.PI);
  ctx.fill();
  // Crispy skin lines
  ctx.strokeStyle = '#6B3A0A';
  ctx.lineWidth = 1;
  for (let i = 0; i < 5; i++) {
    ctx.beginPath();
    ctx.moveTo(-40 + i * 18, -10 + Math.sin(i * 1.2) * 5);
    ctx.quadraticCurveTo(-30 + i * 18, 5, -20 + i * 18, -8 + Math.sin(i * 1.5) * 3);
    ctx.stroke();
  }

  // Head
  ctx.fillStyle = roastColor;
  ctx.beginPath();
  ctx.arc(55, 0, 24, 0, Math.PI * 2);
  ctx.fill();
  // Snout
  ctx.fillStyle = roastDark;
  ctx.beginPath();
  ctx.ellipse(76, 3, 11, 8, 0, 0, Math.PI * 2);
  ctx.fill();
  // Closed X eyes (it's roasted!)
  ctx.strokeStyle = '#4A2500';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(53, -8); ctx.lineTo(59, -3); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(59, -8); ctx.lineTo(53, -3); ctx.stroke();
  // Ear
  ctx.fillStyle = '#A06820';
  ctx.beginPath();
  ctx.moveTo(49, -18);
  ctx.lineTo(45, -32);
  ctx.lineTo(55, -20);
  ctx.closePath();
  ctx.fill();

  // Legs sticking up (4 little legs)
  ctx.fillStyle = roastDark;
  const legOffsets = [[-30, -1], [-10, -1], [10, -1], [30, -1]];
  for (const [lx] of legOffsets) {
    ctx.fillRect(lx - 3, -28, 6, 12);
    // Hooves
    ctx.fillStyle = '#4A2500';
    ctx.fillRect(lx - 4, -31, 8, 4);
    ctx.fillStyle = roastDark;
  }

  // Tail (crispy curly)
  ctx.strokeStyle = '#8B5E1A';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(-55, 0);
  ctx.quadraticCurveTo(-65, -12, -58, -16);
  ctx.quadraticCurveTo(-52, -18, -62, -10);
  ctx.stroke();

  // Apple in mouth!
  ctx.fillStyle = '#cc2222';
  ctx.beginPath();
  ctx.arc(85, 4, 9, 0, Math.PI * 2);
  ctx.fill();
  // Apple stem
  ctx.strokeStyle = '#4a2200';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(85, -5);
  ctx.lineTo(86, -10);
  ctx.stroke();
  // Apple highlight
  ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
  ctx.beginPath();
  ctx.arc(83, 2, 2, 0, Math.PI * 2);
  ctx.fill();

  // Spit pole through the pig
  ctx.strokeStyle = '#aaa';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(-70, 0);
  ctx.lineTo(100, 0);
  ctx.stroke();

  ctx.restore();

  // Steam/smoke rising from pig
  for (let i = 0; i < 6; i++) {
    const smokeX = spitCenterX - 40 + i * 18 + Math.sin(t * 2 + i * 1.4) * 8;
    const smokeY = spitCenterY - 40 - ((t * 25 + i * 30) % 120);
    const smokeAlpha = Math.max(0, 0.4 - ((t * 25 + i * 30) % 120) / 120 * 0.4);
    const smokeSize = 8 + ((t * 25 + i * 30) % 120) / 120 * 15;
    ctx.fillStyle = 'rgba(200, 200, 200, ' + smokeAlpha + ')';
    ctx.beginPath();
    ctx.arc(smokeX, smokeY, smokeSize, 0, Math.PI * 2);
    ctx.fill();
  }

  // Title
  ctx.font = 'bold 48px sans-serif';
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 4;
  ctx.strokeText('\u{1F525} Game Over! \u{1F525}', WIDTH / 2, 60);
  ctx.fillStyle = '#ff4400';
  ctx.fillText('\u{1F525} Game Over! \u{1F525}', WIDTH / 2, 60);
  ctx.lineWidth = 1;

  // Sad message
  const msgAlpha = Math.min(1, Math.max(0, (t - 1) * 2));
  ctx.globalAlpha = msgAlpha;
  ctx.font = 'italic 22px sans-serif';
  ctx.fillStyle = '#ff9966';
  ctx.fillText('Kasica je zavr\u0161ila na ra\u017Enju...', WIDTH / 2, 105);
  ctx.globalAlpha = 1.0;

  // Score info
  ctx.font = '26px sans-serif';
  ctx.fillStyle = '#dda050';
  ctx.fillText('Level: ' + game.level + '   \u{1FA99} Score: ' + game.score, WIDTH / 2, HEIGHT - 55);

  // BTC earned
  ctx.font = '20px sans-serif';
  ctx.fillStyle = '#F7931A';
  ctx.fillText('\u20BF ' + playerBTC + ' Bitcoin zaradjeno', WIDTH / 2, HEIGHT - 30);

  // --- Laughing devils around the spit ---
  for (const d of gameOverDevils) {
    if (d.x < -50 || d.x > WIDTH + 50) continue;
    ctx.save();
    ctx.translate(d.x, d.y + Math.sin(t * 3 + d.phase) * 10);
    const scale = d.laughing ? 1.2 + Math.sin(t * 10) * 0.1 : 1.0;
    ctx.scale(scale, scale);
    ctx.font = '36px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(d.emoji, 0, 0);
    ctx.restore();
    // "HA HA" text floating up when laughing
    if (d.laughing) {
      ctx.save();
      ctx.font = 'bold 14px sans-serif';
      ctx.fillStyle = '#ff4444';
      ctx.textAlign = 'center';
      const haY = d.y - 30 - Math.sin(t * 5) * 10;
      ctx.globalAlpha = 0.7 + Math.sin(t * 8) * 0.3;
      ctx.fillText('HA HA HA!', d.x, haY);
      ctx.restore();
    }
  }

  // --- Angel ---
  if (resurrectionState !== 'none' && resurrectionState !== 'waiting' && resurrectionState !== 'waiting_sad' && resurrectionState !== 'done') {
    ctx.save();
    // Golden glow
    ctx.fillStyle = 'rgba(255, 215, 0, ' + (0.2 + Math.sin(t * 4) * 0.1) + ')';
    ctx.beginPath();
    ctx.arc(WIDTH / 2, angelY, 50, 0, Math.PI * 2);
    ctx.fill();
    // Angel emoji
    ctx.font = '48px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('\u{1F47C}', WIDTH / 2, angelY);
    // Sparkles around angel
    for (let i = 0; i < 6; i++) {
      const angle = t * 2 + i * Math.PI / 3;
      const sx = WIDTH / 2 + Math.cos(angle) * 35;
      const sy = angelY + Math.sin(angle) * 25;
      ctx.font = '14px sans-serif';
      ctx.fillText('\u{2728}', sx, sy);
    }
    ctx.restore();
  }

  // Resurrection text
  if (resurrectionState === 'resurrect') {
    ctx.save();
    ctx.font = 'bold 28px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.strokeStyle = '#000'; ctx.lineWidth = 3;
    ctx.strokeText('VASKRSNU\u0106E! -' + resurrectionCost + ' bodova', WIDTH / 2, HEIGHT - 80);
    ctx.fillStyle = '#FFD700';
    ctx.fillText('VASKRSNU\u0106E! -' + resurrectionCost + ' bodova', WIDTH / 2, HEIGHT - 80);
    ctx.restore();
  }

  // Sad angel text
  if (resurrectionState === 'angel_sad') {
    ctx.save();
    ctx.font = 'bold 20px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.strokeStyle = '#000'; ctx.lineWidth = 3;
    const msg = 'Nema\u0161 dovoljno para za opro\u0161taj grehova! (treba: ' + resurrectionCost + ')';
    ctx.strokeText(msg, WIDTH / 2, HEIGHT - 80);
    ctx.fillStyle = '#ff6666';
    ctx.fillText(msg, WIDTH / 2, HEIGHT - 80);
    ctx.restore();
  }

  // Restart prompt - BIG TAP BUTTON (only when resurrection sequence is done)
  if (resurrectionState === 'done') {
    const pulse = 0.5 + 0.5 * Math.abs(Math.sin(Date.now() / 500));
    const btnW = isMobile ? 420 : 300;
    const btnH = isMobile ? 80 : 50;
    const btnX = WIDTH / 2 - btnW / 2;
    const btnY = HEIGHT - (isMobile ? 120 : 70);
    ctx.fillStyle = `rgba(255, 100, 50, ${0.3 + pulse * 0.3})`;
    ctx.strokeStyle = `rgba(255, 150, 50, ${0.5 + pulse * 0.4})`;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.roundRect(btnX, btnY, btnW, btnH, 15);
    ctx.fill();
    ctx.stroke();
    ctx.font = `bold ${isMobile ? 32 : 22}px sans-serif`;
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 3;
    ctx.strokeText('\uD83D\uDC46 Nova igra', WIDTH / 2, btnY + btnH / 2);
    ctx.fillText('\uD83D\uDC46 Nova igra', WIDTH / 2, btnY + btnH / 2);
    ctx.lineWidth = 1;
  }
}

// --- Name Input Handlers ---
document.getElementById('nameSubmitBtn').addEventListener('click', function() {
  const name = document.getElementById('playerNameInput').value.trim();
  if (name.length > 0) {
    playerName = name;
    localStorage.setItem('kasicaPlayerName', playerName);
    hideNameInput();
    game.screen = 'intro';
  }
});

document.getElementById('playerNameInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    document.getElementById('nameSubmitBtn').click();
  }
  e.stopPropagation();
});

// --- Initialize Game Screen ---
if (!playerName) {
  game.screen = 'nameInput';
  showNameInput();
} else {
  game.screen = 'intro';
}

// --- Game Loop ---
let lastTime = 0;
function gameLoop(timestamp) {
  let dt = (timestamp - lastTime) / 1000;
  if (dt > 0.1) dt = 0.1;
  lastTime = timestamp;

  try {
    update(dt);
    draw();
  } catch(err) {
    // Show error on screen instead of crashing
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, WIDTH, HEIGHT);
    ctx.fillStyle = '#ff0000';
    ctx.font = '20px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('GRESKA: ' + err.message, WIDTH/2, HEIGHT/2 - 20);
    ctx.fillStyle = '#fff';
    ctx.font = '14px monospace';
    ctx.fillText(err.stack ? err.stack.split('\n')[1] : '', WIDTH/2, HEIGHT/2 + 20);
    console.error('Game crash:', err);
  }

  // Show/hide mobile controls based on game state
  const pauseBtnEl = document.getElementById('pauseBtn');
  if (isMobile) {
    // DOM touch buttons are always hidden - canvas zones replace them
    touchControlsEl.classList.remove('visible');
    if (game.screen === 'playing') {
      pauseBtnEl.style.display = 'block';
    } else {
      pauseBtnEl.style.display = 'none';
      // Release all keys when leaving playing state
      Object.keys(keys).forEach(k => keys[k] = false);
      // Clear canvas touch state
      for (const tid in canvasTouches) delete canvasTouches[tid];
      for (const zid in activeZones) delete activeZones[zid];
      shakeZoneHeld = false;
      if (shakeRepeatTimer) { clearInterval(shakeRepeatTimer); shakeRepeatTimer = null; }
    }
  }

  requestAnimationFrame(gameLoop);
}

requestAnimationFrame((timestamp) => {
  lastTime = timestamp;
  gameLoop(timestamp);
});
</script>
</body>
</html>
