<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kasica Prasica</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
  }
  canvas {
    display: block;
    box-shadow: 0 0 40px rgba(0, 0, 0, 0.6);
  }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<script>
const WIDTH = 800;
const HEIGHT = 600;
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
canvas.width = WIDTH;
canvas.height = HEIGHT;

function resizeCanvas() {
  const scaleX = window.innerWidth / WIDTH;
  const scaleY = window.innerHeight / HEIGHT;
  const scale = Math.min(scaleX, scaleY);
  canvas.style.width = (WIDTH * scale) + 'px';
  canvas.style.height = (HEIGHT * scale) + 'px';
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// --- Level Configuration ---
function getLevelConfig(level) {
  return {
    duration: 30 + level * 5,
    fallSpeed: 120 + level * 20,
    spawnRate: Math.max(0.3, 1.0 - level * 0.1),
    devilCount: level,
    devilInterval: null, // calculated below
    bombChance: Math.min(0.25, 0.03 + level * 0.02),
    billChance: Math.min(0.3, 0.1 + level * 0.05),
    goldChance: Math.min(0.15, 0.05 + level * 0.02)
  };
}

// --- Game State ---
const game = {
  screen: 'title',
  score: 0,
  level: 1,
  cracks: 0,
  latchedDevil: null,
  levelTimer: 0,
  levelConfig: null,
  devilsSpawned: 0,
  devilSchedule: []
};

// --- Player ---
const player = {
  x: WIDTH / 2,
  y: HEIGHT - 80,
  width: 60,
  height: 60,
  speed: 300,
  emoji: '\u{1F437}'
};

// --- Falling Objects ---
const objects = [];
let spawnTimer = 0;
let flashTimer = 0;

// --- Shake Mechanic ---
let lastShakeKey = null;
let shakeVisualOffset = 0;
let shakeVisualTimer = 0;
const ejectedCoins = [];
let squealTimer = 0;
let successFlashTimer = 0;
let shakeHintTimer = 0;

// --- Title screen background coins ---
const titleCoins = [];
let titleCoinTimer = 0;

// --- Audio ---
let audioCtx = null;
function getAudioContext() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function playSqueal() {
  const ctx = getAudioContext();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'square';
  osc.frequency.setValueAtTime(800, ctx.currentTime);
  osc.frequency.linearRampToValueAtTime(1200, ctx.currentTime + 0.15);
  gain.gain.setValueAtTime(0.15, ctx.currentTime);
  gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.15);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start();
  osc.stop(ctx.currentTime + 0.15);
}

function playShakeSound() {
  const ctx = getAudioContext();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(400, ctx.currentTime);
  osc.frequency.linearRampToValueAtTime(600, ctx.currentTime + 0.05);
  gain.gain.setValueAtTime(0.1, ctx.currentTime);
  gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.05);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start();
  osc.stop(ctx.currentTime + 0.05);
}

function playLevelComplete() {
  const actx = getAudioContext();
  const notes = [523, 659, 784, 1047];
  notes.forEach((freq, i) => {
    const osc = actx.createOscillator();
    const gain = actx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, actx.currentTime + i * 0.12);
    gain.gain.setValueAtTime(0.12, actx.currentTime + i * 0.12);
    gain.gain.linearRampToValueAtTime(0, actx.currentTime + i * 0.12 + 0.3);
    osc.connect(gain);
    gain.connect(actx.destination);
    osc.start(actx.currentTime + i * 0.12);
    osc.stop(actx.currentTime + i * 0.12 + 0.3);
  });
}

// --- Coin Types ---
const COIN_TYPES = [
  { emoji: '\u{1FA99}', value: 1, weight: 60 },
  { emoji: '\u{1F4B5}', value: 5, weight: 25 },
  { emoji: '\u{1F4B0}', value: 10, weight: 15 }
];

function pickCoinType() {
  if (!game.levelConfig) return COIN_TYPES[0];
  const cfg = game.levelConfig;
  // Use level config chances to adjust weights
  const roll = Math.random();
  if (roll < cfg.goldChance) return COIN_TYPES[2]; // gold bag
  if (roll < cfg.goldChance + cfg.billChance) return COIN_TYPES[1]; // bill
  return COIN_TYPES[0]; // regular coin
}

function spawnObject() {
  const cfg = game.levelConfig;
  const fallSpeed = cfg ? cfg.fallSpeed : 150;
  const bombChance = cfg ? cfg.bombChance : 0.05;

  if (Math.random() < bombChance) {
    const size = 40;
    objects.push({
      type: 'bomb',
      x: Math.random() * (WIDTH - size) + size / 2,
      y: -size / 2,
      width: size,
      height: size,
      speed: fallSpeed * 1.2,
      emoji: '\u{1F4A3}',
      value: 0
    });
    return;
  }

  const type = pickCoinType();
  const size = 36;
  objects.push({
    type: 'coin',
    x: Math.random() * (WIDTH - size) + size / 2,
    y: -size / 2,
    width: size,
    height: size,
    speed: fallSpeed,
    emoji: type.emoji,
    value: type.value
  });
}

function spawnDevil() {
  const cfg = game.levelConfig;
  const fallSpeed = cfg ? cfg.fallSpeed : 100;
  const size = 40;
  objects.push({
    type: 'devil',
    emoji: '\u{1F608}',
    x: Math.random() * (WIDTH - size) + size / 2,
    y: -40,
    width: size,
    height: size,
    speed: fallSpeed * 0.7,
    latched: false,
    hammerTimer: 0,
    shakeProgress: 0,
    shakeRequired: 8,
    hammerAnimTimer: 0
  });
}

// --- Level Management ---
function startLevel() {
  const cfg = getLevelConfig(game.level);
  game.levelConfig = cfg;
  game.levelTimer = cfg.duration;
  game.devilsSpawned = 0;
  game.cracks = 0;
  game.latchedDevil = null;

  // Calculate devil spawn schedule: spread evenly, but not in first 5 seconds
  game.devilSchedule = [];
  if (cfg.devilCount > 0) {
    const availableTime = cfg.duration - 5; // exclude first 5 seconds
    const interval = availableTime / (cfg.devilCount + 1);
    for (let i = 1; i <= cfg.devilCount; i++) {
      // Time remaining when devil should spawn (counting down from duration)
      const spawnAt = cfg.duration - (5 + interval * i);
      game.devilSchedule.push(spawnAt);
    }
  }

  // Clear everything
  objects.length = 0;
  ejectedCoins.length = 0;
  spawnTimer = 0;
  flashTimer = 0;
  lastShakeKey = null;
  squealTimer = 0;
  successFlashTimer = 0;
  shakeHintTimer = 0;
  shakeVisualOffset = 0;
  shakeVisualTimer = 0;
  player.x = WIDTH / 2;

  game.screen = 'playing';
}

// --- Input ---
const keys = {};
window.addEventListener('keydown', (e) => {
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' '].includes(e.key)) {
    e.preventDefault();
  }
  keys[e.key] = true;

  // Shake detection when devil is latched
  if (game.latchedDevil && game.screen === 'playing') {
    if (e.key === 'ArrowUp' && lastShakeKey !== 'up') {
      game.latchedDevil.shakeProgress++;
      lastShakeKey = 'up';
      shakeVisualOffset = -5;
      shakeVisualTimer = 0.08;
      playShakeSound();
    } else if (e.key === 'ArrowDown' && lastShakeKey !== 'down') {
      game.latchedDevil.shakeProgress++;
      lastShakeKey = 'down';
      shakeVisualOffset = 5;
      shakeVisualTimer = 0.08;
      playShakeSound();
    }
  }

  if (e.key === ' ') {
    if (game.screen === 'title') {
      game.score = 0;
      game.level = 1;
      startLevel();
    } else if (game.screen === 'gameOver') {
      game.score = 0;
      game.level = 1;
      game.screen = 'title';
    } else if (game.screen === 'levelComplete') {
      game.level++;
      startLevel();
    }
  }
});
window.addEventListener('keyup', (e) => {
  keys[e.key] = false;
});

// --- AABB Collision ---
function aabb(a, b) {
  return (
    a.x - a.width / 2 < b.x + b.width / 2 &&
    a.x + a.width / 2 > b.x - b.width / 2 &&
    a.y - a.height / 2 < b.y + b.height / 2 &&
    a.y + a.height / 2 > b.y - b.height / 2
  );
}

// --- Update ---
function triggerDamage() {
  game.cracks++;
  game.score = Math.max(0, game.score - 5);
  flashTimer = 0.3;
  if (game.cracks >= 3) {
    game.screen = 'gameOver';
  }
}

function update(dt) {
  // Update title screen background coins
  if (game.screen === 'title') {
    titleCoinTimer += dt;
    if (titleCoinTimer >= 0.5) {
      titleCoinTimer -= 0.5;
      const emojis = ['\u{1FA99}', '\u{1F4B5}', '\u{1F4B0}'];
      titleCoins.push({
        x: Math.random() * WIDTH,
        y: -20,
        emoji: emojis[Math.floor(Math.random() * emojis.length)],
        speed: 60 + Math.random() * 40,
        alpha: 0.3 + Math.random() * 0.2
      });
    }
    for (let i = titleCoins.length - 1; i >= 0; i--) {
      titleCoins[i].y += titleCoins[i].speed * dt;
      if (titleCoins[i].y > HEIGHT + 30) {
        titleCoins.splice(i, 1);
      }
    }
    return;
  }

  if (game.screen !== 'playing') return;

  // Flash timer countdown
  if (flashTimer > 0) flashTimer -= dt;
  if (successFlashTimer > 0) successFlashTimer -= dt;
  if (shakeVisualTimer > 0) {
    shakeVisualTimer -= dt;
    if (shakeVisualTimer <= 0) shakeVisualOffset = 0;
  }

  // Level timer countdown
  game.levelTimer -= dt;
  if (game.levelTimer <= 0) {
    game.levelTimer = 0;
    // Level complete!
    objects.length = 0;
    ejectedCoins.length = 0;
    // Remove latched devil without damage
    if (game.latchedDevil) {
      game.latchedDevil = null;
      lastShakeKey = null;
      squealTimer = 0;
      shakeHintTimer = 0;
    }
    game.screen = 'levelComplete';
    playLevelComplete();
    return;
  }

  // Player movement
  if (keys['ArrowLeft']) {
    player.x -= player.speed * dt;
  }
  if (keys['ArrowRight']) {
    player.x += player.speed * dt;
  }
  // Clamp within bounds
  const halfW = player.width / 2;
  if (player.x < halfW) player.x = halfW;
  if (player.x > WIDTH - halfW) player.x = WIDTH - halfW;

  // Spawn timer (coins and bombs) using level config
  const spawnRate = game.levelConfig ? game.levelConfig.spawnRate : 1.0;
  spawnTimer += dt;
  if (spawnTimer >= spawnRate) {
    spawnTimer -= spawnRate;
    spawnObject();
  }

  // Devil spawn from schedule
  if (game.devilSchedule.length > 0) {
    // Check if levelTimer has passed the next scheduled devil time
    const nextDevilTime = game.devilSchedule[0];
    if (game.levelTimer <= nextDevilTime) {
      game.devilSchedule.shift();
      game.devilsSpawned++;
      spawnDevil();
    }
  }

  // Update latched devil
  if (game.latchedDevil) {
    const devil = game.latchedDevil;
    devil.x = player.x;
    devil.y = player.y - 45;
    devil.hammerTimer += dt;
    devil.hammerAnimTimer += dt;
    shakeHintTimer += dt;

    // Squeal timer
    squealTimer += dt;
    if (squealTimer >= 0.8) {
      squealTimer -= 0.8;
      playSqueal();
    }

    // Shake success - eject coin to knock devil off
    if (devil.shakeProgress >= devil.shakeRequired) {
      const flyDirection = (Math.random() < 0.5 ? -1 : 1);
      ejectedCoins.push({
        x: player.x,
        y: player.y - 20,
        startY: player.y - 20,
        targetX: devil.x,
        targetY: devil.y,
        phase: 'rising',
        timer: 0,
        riseDuration: 0.25,
        devilFlyX: flyDirection * (200 + Math.random() * 150),
        devilFlyY: -(200 + Math.random() * 100),
        devilEmoji: devil.emoji,
        devilW: devil.width,
        devilH: devil.height,
        devilAngle: 0,
        hitTimer: 0
      });

      game.score = Math.max(0, game.score - 3);
      game.latchedDevil = null;
      lastShakeKey = null;
      squealTimer = 0;
      shakeHintTimer = 0;
      successFlashTimer = 0.4;
    }
  }

  // Devil hammer timer expired - causes damage
  if (game.latchedDevil) {
    const devil = game.latchedDevil;
    if (devil.hammerTimer >= 5.0) {
      triggerDamage();
      objects.push({
        type: 'devil',
        emoji: devil.emoji,
        x: devil.x,
        y: devil.y,
        width: devil.width,
        height: devil.height,
        speed: 0,
        flyAway: true,
        flyAwayTimer: 0.5
      });
      game.latchedDevil = null;
      lastShakeKey = null;
      squealTimer = 0;
      shakeHintTimer = 0;
    }
  }

  // Update ejected coin animations
  for (let i = ejectedCoins.length - 1; i >= 0; i--) {
    const ec = ejectedCoins[i];
    ec.timer += dt;
    if (ec.phase === 'rising') {
      const t = Math.min(ec.timer / ec.riseDuration, 1.0);
      ec.y = ec.startY + t * (ec.targetY - ec.startY);
      if (t >= 1.0) {
        ec.phase = 'hit';
        ec.hitTimer = 0;
        ec.hitX = ec.x;
        ec.hitY = ec.targetY;
      }
    } else if (ec.phase === 'hit') {
      ec.hitTimer += dt;
      ec.devilAngle += dt * 10;
      ec.hitX += ec.devilFlyX * dt;
      ec.hitY += ec.devilFlyY * dt;
      if (ec.hitTimer > 0.6) {
        ejectedCoins.splice(i, 1);
      }
    }
  }

  // Update falling objects
  for (let i = objects.length - 1; i >= 0; i--) {
    const obj = objects[i];
    obj.y += obj.speed * dt;

    // Fly-away devils (animation only)
    if (obj.flyAway) {
      obj.flyAwayTimer -= dt;
      obj.y -= 300 * dt;
      obj.x += 150 * dt;
      if (obj.flyAwayTimer <= 0) {
        objects.splice(i, 1);
      }
      continue;
    }

    // Collision with player
    if (aabb(player, obj)) {
      if (obj.type === 'bomb') {
        triggerDamage();
        objects.splice(i, 1);
        continue;
      } else if (obj.type === 'devil') {
        if (!game.latchedDevil) {
          obj.latched = true;
          game.latchedDevil = {
            emoji: obj.emoji,
            x: player.x,
            y: player.y - 45,
            width: obj.width,
            height: obj.height,
            hammerTimer: 0,
            shakeProgress: 0,
            shakeRequired: 8,
            hammerAnimTimer: 0
          };
          lastShakeKey = null;
          squealTimer = 0;
          shakeHintTimer = 0;
        }
        objects.splice(i, 1);
        continue;
      } else {
        // Coin
        game.score += obj.value;
        objects.splice(i, 1);
        continue;
      }
    }

    // Off screen
    if (obj.y > HEIGHT + obj.height) {
      objects.splice(i, 1);
    }
  }
}

// --- Draw ---
function draw() {
  // Sky blue background
  ctx.fillStyle = '#87CEEB';
  ctx.fillRect(0, 0, WIDTH, HEIGHT);

  if (game.screen === 'title') {
    drawTitle();
  } else if (game.screen === 'playing') {
    drawPlaying();
  } else if (game.screen === 'levelComplete') {
    drawLevelComplete();
  } else if (game.screen === 'gameOver') {
    drawGameOver();
  }
}

function drawTitle() {
  // Background falling coins
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = '28px sans-serif';
  for (const coin of titleCoins) {
    ctx.globalAlpha = coin.alpha;
    ctx.fillText(coin.emoji, coin.x, coin.y);
  }
  ctx.globalAlpha = 1.0;

  // Title
  ctx.font = 'bold 52px sans-serif';
  ctx.fillStyle = '#2d2d2d';
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 4;
  ctx.strokeText('\u{1F437} Kasica Prasica \u{1F437}', WIDTH / 2, HEIGHT / 2 - 50);
  ctx.fillText('\u{1F437} Kasica Prasica \u{1F437}', WIDTH / 2, HEIGHT / 2 - 50);

  // Serbian subtitle
  ctx.font = '22px sans-serif';
  ctx.fillStyle = '#555';
  ctx.lineWidth = 1;
  ctx.fillText('Hvataj nov\u010di\u0107e! Izbegavaj bombe!', WIDTH / 2, HEIGHT / 2 + 10);

  // Start prompt (pulsing)
  const pulse = 0.5 + 0.5 * Math.abs(Math.sin(Date.now() / 500));
  ctx.globalAlpha = pulse;
  ctx.font = 'bold 26px sans-serif';
  ctx.fillStyle = '#333';
  ctx.fillText('Press SPACE to start', WIDTH / 2, HEIGHT / 2 + 60);
  ctx.globalAlpha = 1.0;
}

function drawPlaying() {
  // Green ground
  const groundHeight = 40;
  ctx.fillStyle = '#4CAF50';
  ctx.fillRect(0, HEIGHT - groundHeight, WIDTH, groundHeight);

  // Falling objects
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (const obj of objects) {
    if (obj.type === 'bomb') {
      ctx.font = '36px sans-serif';
    } else if (obj.type === 'devil') {
      ctx.font = '36px sans-serif';
    } else {
      ctx.font = '32px sans-serif';
    }
    ctx.fillText(obj.emoji, obj.x, obj.y);
  }

  // Player (with shake visual offset)
  ctx.font = '48px sans-serif';
  ctx.fillText(player.emoji, player.x, player.y + shakeVisualOffset);

  // Latched devil on top of player
  if (game.latchedDevil) {
    const devil = game.latchedDevil;
    ctx.font = '36px sans-serif';
    ctx.fillText(devil.emoji, devil.x, devil.y + shakeVisualOffset);

    // Hammer animation
    const hammerSide = Math.floor(devil.hammerAnimTimer / 0.3) % 2 === 0 ? -1 : 1;
    ctx.font = '24px sans-serif';
    ctx.fillText('\u{1F528}', devil.x + hammerSide * 25, devil.y - 15 + shakeVisualOffset);

    // Danger bar (red) above the piggy
    const barWidth = 60;
    const barHeight = 8;
    const barX = player.x - barWidth / 2;
    const barY = player.y - 80;
    const fill = Math.min(devil.hammerTimer / 5.0, 1.0);

    ctx.fillStyle = '#333';
    ctx.fillRect(barX, barY, barWidth, barHeight);

    let barAlpha = 1.0;
    if (fill > 0.8) {
      barAlpha = 0.5 + 0.5 * Math.abs(Math.sin(Date.now() / 100));
    }
    ctx.globalAlpha = barAlpha;
    ctx.fillStyle = '#ff2222';
    ctx.fillRect(barX, barY, barWidth * fill, barHeight);
    ctx.globalAlpha = 1.0;

    ctx.strokeStyle = '#000';
    ctx.lineWidth = 1;
    ctx.strokeRect(barX, barY, barWidth, barHeight);

    // Shake progress bar (green)
    const shakeBarY = barY + barHeight + 3;
    const shakeFill = Math.min(devil.shakeProgress / devil.shakeRequired, 1.0);

    ctx.fillStyle = '#333';
    ctx.fillRect(barX, shakeBarY, barWidth, barHeight);
    ctx.fillStyle = '#44ff44';
    ctx.fillRect(barX, shakeBarY, barWidth * shakeFill, barHeight);
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 1;
    ctx.strokeRect(barX, shakeBarY, barWidth, barHeight);

    // Shake hint text
    const hintAlpha = 0.5 + 0.5 * Math.abs(Math.sin(Date.now() / 200));
    ctx.globalAlpha = hintAlpha;
    ctx.font = 'bold 18px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffff00';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 3;
    ctx.strokeText('\u2B06\u2B07 SHAKE!', player.x, player.y - 95);
    ctx.fillText('\u2B06\u2B07 SHAKE!', player.x, player.y - 95);
    ctx.globalAlpha = 1.0;
    ctx.lineWidth = 1;
  }

  // Ejected coin animations
  for (const ec of ejectedCoins) {
    if (ec.phase === 'rising') {
      ctx.font = '28px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('\u{1FA99}', ec.x, ec.y);
    } else if (ec.phase === 'hit') {
      ctx.save();
      ctx.translate(ec.hitX, ec.hitY);
      ctx.rotate(ec.devilAngle);
      ctx.font = '36px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.globalAlpha = Math.max(0, 1.0 - ec.hitTimer / 0.6);
      ctx.fillText(ec.devilEmoji, 0, 0);
      ctx.restore();
      ctx.globalAlpha = 1.0;
    }
  }

  // Success flash (green)
  if (successFlashTimer > 0) {
    ctx.globalAlpha = successFlashTimer / 0.4 * 0.25;
    ctx.fillStyle = '#00ff00';
    ctx.fillRect(0, 0, WIDTH, HEIGHT);
    ctx.globalAlpha = 1.0;
  }

  // --- HUD ---
  // Top-left: Score
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold 24px sans-serif';
  ctx.fillStyle = '#2d2d2d';
  ctx.fillText('\u{1FA99} Score: ' + game.score, 15, 15);

  // Top-center: Level + timer bar
  ctx.textAlign = 'center';
  ctx.font = 'bold 22px sans-serif';
  ctx.fillStyle = '#2d2d2d';
  ctx.fillText('Level ' + game.level, WIDTH / 2, 12);

  // Timer bar below level text
  if (game.levelConfig) {
    const timerBarWidth = 160;
    const timerBarHeight = 10;
    const timerBarX = WIDTH / 2 - timerBarWidth / 2;
    const timerBarY = 38;
    const timerFill = Math.max(0, game.levelTimer / game.levelConfig.duration);

    // Background
    ctx.fillStyle = '#333';
    ctx.fillRect(timerBarX, timerBarY, timerBarWidth, timerBarHeight);

    // Fill - color shifts from green to yellow to red
    let barColor;
    if (timerFill > 0.5) barColor = '#44cc44';
    else if (timerFill > 0.2) barColor = '#cccc44';
    else barColor = '#cc4444';

    ctx.fillStyle = barColor;
    ctx.fillRect(timerBarX, timerBarY, timerBarWidth * timerFill, timerBarHeight);

    // Border
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 1;
    ctx.strokeRect(timerBarX, timerBarY, timerBarWidth, timerBarHeight);

    // Time remaining text
    ctx.font = '14px sans-serif';
    ctx.fillStyle = '#555';
    ctx.fillText(Math.ceil(game.levelTimer) + 's', WIDTH / 2, 52);
  }

  // Top-right: Crack indicator
  ctx.textAlign = 'right';
  ctx.textBaseline = 'top';
  ctx.font = '24px sans-serif';
  let crackText = '\u{1F437}';
  for (let i = 0; i < game.cracks; i++) {
    crackText += '\u{1F494}';
  }
  ctx.fillText(crackText, WIDTH - 15, 15);

  // Red flash overlay
  if (flashTimer > 0) {
    ctx.globalAlpha = flashTimer / 0.3 * 0.4;
    ctx.fillStyle = '#ff0000';
    ctx.fillRect(0, 0, WIDTH, HEIGHT);
    ctx.globalAlpha = 1.0;
  }
}

function drawLevelComplete() {
  // Celebratory background
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  // Sparkle effect
  const sparkleCount = 12;
  ctx.font = '20px sans-serif';
  for (let i = 0; i < sparkleCount; i++) {
    const angle = (Date.now() / 1000 + i * (Math.PI * 2 / sparkleCount));
    const radius = 120 + Math.sin(Date.now() / 300 + i) * 30;
    const sx = WIDTH / 2 + Math.cos(angle) * radius;
    const sy = HEIGHT / 2 - 30 + Math.sin(angle) * radius * 0.5;
    ctx.globalAlpha = 0.4 + 0.3 * Math.sin(Date.now() / 200 + i);
    ctx.fillText('\u2728', sx, sy);
  }
  ctx.globalAlpha = 1.0;

  ctx.font = 'bold 48px sans-serif';
  ctx.fillStyle = '#2d2d2d';
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 3;
  ctx.strokeText('Level ' + game.level + ' Complete! \u2728', WIDTH / 2, HEIGHT / 2 - 50);
  ctx.fillText('Level ' + game.level + ' Complete! \u2728', WIDTH / 2, HEIGHT / 2 - 50);
  ctx.lineWidth = 1;

  ctx.font = '32px sans-serif';
  ctx.fillStyle = '#444';
  ctx.fillText('\u{1FA99} Score: ' + game.score, WIDTH / 2, HEIGHT / 2 + 10);

  const pulse = 0.5 + 0.5 * Math.abs(Math.sin(Date.now() / 500));
  ctx.globalAlpha = pulse;
  ctx.font = 'bold 24px sans-serif';
  ctx.fillStyle = '#333';
  ctx.fillText('Press SPACE for Level ' + (game.level + 1), WIDTH / 2, HEIGHT / 2 + 60);
  ctx.globalAlpha = 1.0;
}

function drawGameOver() {
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  ctx.font = 'bold 48px sans-serif';
  ctx.fillStyle = '#2d2d2d';
  ctx.fillText('\u{1F494} Game Over! \u{1F494}', WIDTH / 2, HEIGHT / 2 - 60);

  ctx.font = '28px sans-serif';
  ctx.fillStyle = '#444';
  ctx.fillText('Level: ' + game.level, WIDTH / 2, HEIGHT / 2);

  ctx.font = '32px sans-serif';
  ctx.fillStyle = '#444';
  ctx.fillText('\u{1FA99} Final Score: ' + game.score, WIDTH / 2, HEIGHT / 2 + 40);

  const pulse = 0.5 + 0.5 * Math.abs(Math.sin(Date.now() / 500));
  ctx.globalAlpha = pulse;
  ctx.font = 'bold 24px sans-serif';
  ctx.fillStyle = '#666';
  ctx.fillText('Press SPACE to play again', WIDTH / 2, HEIGHT / 2 + 90);
  ctx.globalAlpha = 1.0;
}

// --- Game Loop ---
let lastTime = 0;
function gameLoop(timestamp) {
  let dt = (timestamp - lastTime) / 1000;
  if (dt > 0.1) dt = 0.1;
  lastTime = timestamp;

  update(dt);
  draw();
  requestAnimationFrame(gameLoop);
}

requestAnimationFrame((timestamp) => {
  lastTime = timestamp;
  gameLoop(timestamp);
});
</script>
</body>
