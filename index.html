}

function drawPlayingScene() {
  ctx.save();
  // Apply screen shake
  applyScreenShake();

  drawGround();

  // Draw fart clouds (behind falling objects)
  for (const cloud of fartClouds) {
    ctx.save();
    ctx.globalAlpha = cloud.opacity;
    ctx.translate(cloud.x, cloud.y);
    ctx.scale(cloud.scale, cloud.scale);

    // Green stink cloud - multiple overlapping circles
    const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, 25);
    gradient.addColorStop(0, 'rgba(80, 180, 30, 0.6)');
    gradient.addColorStop(0.5, 'rgba(100, 200, 40, 0.3)');
    gradient.addColorStop(1, 'rgba(120, 220, 50, 0)');

    // Main cloud blob
    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.arc(0, 0, 25, 0, Math.PI * 2);
    ctx.fill();
    // Side blobs for cloud shape
    ctx.beginPath();
    ctx.arc(-12, -5, 18, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(12, -3, 20, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(0, -12, 16, 0, Math.PI * 2);
    ctx.fill();

    // Stink lines (wavy lines emanating from cloud)
    ctx.strokeStyle = 'rgba(80, 180, 30, ' + (cloud.opacity * 0.5) + ')';
    ctx.lineWidth = 2;
    for (let s = 0; s < 3; s++) {
      const angle = (s / 3) * Math.PI * 2 + cloud.wobble;
      ctx.beginPath();
      ctx.moveTo(Math.cos(angle) * 15, Math.sin(angle) * 15);
      ctx.quadraticCurveTo(
        Math.cos(angle + 0.3) * 30, Math.sin(angle + 0.3) * 30,
        Math.cos(angle + 0.6) * 20, Math.sin(angle + 0.6) * 20
      );
      ctx.stroke();
    }

    // Tiny 💨 emoji in center
    ctx.font = '16px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('\u{1F4A8}', 0, 0);

    ctx.restore();
  }

  // Falling objects
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const now = performance.now() / 1000;
  for (const obj of objects) {
    if (obj.type === 'coin' && obj.coinType) {
      // Draw custom coin graphics
      drawCoin(obj.x, obj.y, obj.width, obj.coinType, now);
    } else if (obj.type === 'special') {
      // Bills and moneybags - emoji with golden glow
      const sz = obj.width || 42;
      ctx.font = sz + 'px sans-serif';
      // Glowing aura
      const glowPulse = 12 + 6 * Math.sin(now * 6 + obj.x);
      ctx.shadowColor = obj.value >= 30 ? '#ff8800' : '#44cc44';
      ctx.shadowBlur = glowPulse;
      // Slight floating bob
      const bob = Math.sin(now * 3 + obj.x * 0.05) * 3;
      ctx.fillText(obj.emoji, obj.x, obj.y + bob);
      ctx.shadowBlur = 0;
    } else if (obj.type === 'bomb') {
      ctx.font = '36px sans-serif';
      // Pulsing glow on bombs
      const pulseR = 20 + 5 * Math.sin(now * 10);
      ctx.shadowColor = '#ff4400';
      ctx.shadowBlur = pulseR;
      ctx.fillText(obj.emoji, obj.x, obj.y);
      ctx.shadowBlur = 0;
    } else if (obj.type === 'corn') {
      ctx.font = '32px sans-serif';
      const cornGlow = 8 + 4 * Math.sin(now * 5);
      ctx.shadowColor = '#ffcc00';
      ctx.shadowBlur = cornGlow;
      ctx.fillText(obj.emoji, obj.x, obj.y);
      ctx.shadowBlur = 0;
    } else if (obj.type === 'butcher') {
      ctx.font = (obj.width || 50) + 'px sans-serif';
      // Menacing red glow
      const glowPulse = 8 + 4 * Math.sin(now * 4);
      ctx.shadowColor = '#cc0000';
      ctx.shadowBlur = glowPulse;
      ctx.fillText(obj.emoji, obj.x, obj.y);
      // Draw knives on sides
      ctx.font = '18px sans-serif';
      ctx.fillText('\u{1F52A}', obj.x - 22, obj.y - 10);
      ctx.fillText('\u{1F52A}', obj.x + 22, obj.y - 10);
      ctx.shadowBlur = 0;
    } else if (obj.type === 'devil') {
      const dSize = obj.width || 38;
      ctx.font = dSize + 'px sans-serif';
      ctx.fillText(obj.emoji, obj.x, obj.y);
    } else {
      ctx.font = '32px sans-serif';
      ctx.fillText(obj.emoji || '', obj.x, obj.y);
    }
  }

  // Player (piggy with visual states)
  drawPiggy();

  // Latched devil on top of player
  if (game.latchedDevil) {
    const devil = game.latchedDevil;
    const devilFontSize = devil.devilType === 'heavy' ? 44 : (devil.devilType === 'thief' ? 40 : 36);
    ctx.font = devilFontSize + 'px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    // Visual flair per type
    if (devil.devilType === 'butcher') {
      // Butcher-specific drawing
      ctx.font = '46px sans-serif';
      ctx.fillText(devil.emoji, devil.x, devil.y + shakeVisualOffset);

      // Two knives - alternating stabbing animation
      const knifePhase = devil.hammerAnimTimer * 4;
      const leftKnifeY = Math.sin(knifePhase) * 12;
      const rightKnifeY = Math.sin(knifePhase + Math.PI) * 12; // opposite phase

      ctx.font = '22px sans-serif';
      ctx.fillText('\u{1F52A}', devil.x - 28, devil.y - 10 + leftKnifeY + shakeVisualOffset);
      ctx.fillText('\u{1F52A}', devil.x + 28, devil.y - 10 + rightKnifeY + shakeVisualOffset);
    } else {
      if (devil.devilType === 'fast') {
        // Speed lines behind fast devil
        ctx.globalAlpha = 0.3;
        ctx.font = '14px sans-serif';
        for (let sl = 0; sl < 3; sl++) {
          ctx.fillText('\u2014', devil.x - 22 - sl * 8, devil.y - 5 + sl * 7 + shakeVisualOffset);
          ctx.fillText('\u2014', devil.x + 22 + sl * 8, devil.y - 5 + sl * 7 + shakeVisualOffset);
        }
        ctx.globalAlpha = 1.0;
        ctx.font = devilFontSize + 'px sans-serif';
      }

      ctx.fillText(devil.emoji, devil.x, devil.y + shakeVisualOffset);

      // Thief: show coin being stolen periodically
      if (devil.devilType === 'thief' && devil.stealTimer < 0.25) {
        ctx.font = '16px sans-serif';
        ctx.fillText('\u{1F4B0}', devil.x + 20, devil.y - 10 + shakeVisualOffset);
      }

      // Hammer animation (heavy has slower swing)
      const hammerRate = devil.devilType === 'heavy' ? 0.5 : 0.3;
      const hammerSide = Math.floor(devil.hammerAnimTimer / hammerRate) % 2 === 0 ? -1 : 1;
      ctx.font = '24px sans-serif';
      ctx.fillText('\u{1F528}', devil.x + hammerSide * 25, devil.y - 15 + shakeVisualOffset);
    }

    // Danger bar (red) - uses dynamic hammerTimeout
    const barWidth = 60;
    const barHeight = 8;
    const barX = player.x - barWidth / 2;
    const barY = player.y - 80;
    const fill = Math.min(devil.hammerTimer / devil.hammerTimeout, 1.0);

    ctx.fillStyle = '#333';
    ctx.fillRect(barX, barY, barWidth, barHeight);

    let barAlpha = 1.0;
    if (fill > 0.8) {
      barAlpha = 0.5 + 0.5 * Math.abs(Math.sin(Date.now() / 100));
    }
    ctx.globalAlpha = barAlpha;
    ctx.fillStyle = '#ff2222';
    ctx.fillRect(barX, barY, barWidth * fill, barHeight);
    ctx.globalAlpha = 1.0;

    ctx.strokeStyle = '#000';
    ctx.lineWidth = 1;
    ctx.strokeRect(barX, barY, barWidth, barHeight);

    // Shake progress bar (green) - reflects different shakeRequired
    const shakeBarY = barY + barHeight + 3;
    const shakeFill = Math.min(devil.shakeProgress / devil.shakeRequired, 1.0);

    ctx.fillStyle = '#333';
    ctx.fillRect(barX, shakeBarY, barWidth, barHeight);
    ctx.fillStyle = '#44ff44';
    ctx.fillRect(barX, shakeBarY, barWidth * shakeFill, barHeight);
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 1;
    ctx.strokeRect(barX, shakeBarY, barWidth, barHeight);

    // Shake hint text
    const hintAlpha = 0.5 + 0.5 * Math.abs(Math.sin(Date.now() / 200));
    ctx.globalAlpha = hintAlpha;
    ctx.font = 'bold 18px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffff00';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 3;
    ctx.strokeText('\u2B06\u2B07 SHAKE!', player.x, player.y - 95);
    ctx.fillText('\u2B06\u2B07 SHAKE!', player.x, player.y - 95);
    ctx.globalAlpha = 1.0;
    ctx.lineWidth = 1;

    // Devil type indicator
    if (devilTypeIndicator) {
      const indAlpha = Math.min(1.0, devilTypeIndicator.timer / 0.3);
      ctx.globalAlpha = indAlpha;
      ctx.font = 'bold 26px sans-serif';
      ctx.textAlign = 'center';
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 4;
      ctx.strokeText(devilTypeIndicator.text, player.x, player.y - 115);
      ctx.fillStyle = devilTypeIndicator.color;
      ctx.fillText(devilTypeIndicator.text, player.x, player.y - 115);
      ctx.globalAlpha = 1.0;
      ctx.lineWidth = 1;
    }
  }

  // Ejected coin animations
  for (const ec of ejectedCoins) {
    if (ec.phase === 'rising') {
      ctx.font = '28px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('\u{1FA99}', ec.x, ec.y);
    } else if (ec.phase === 'hit') {
      ctx.save();
      ctx.translate(ec.hitX, ec.hitY);
      ctx.rotate(ec.devilAngle);
      ctx.font = '36px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.globalAlpha = Math.max(0, 1.0 - ec.hitTimer / 0.6);
      ctx.fillText(ec.devilEmoji, 0, 0);
      ctx.restore();
      ctx.globalAlpha = 1.0;
    }
  }

  // Draw choking devils
  for (const cd of chokingDevils) {
    ctx.save();
    ctx.globalAlpha = cd.opacity;
    ctx.translate(cd.x, cd.y);

    // Shake/convulse while choking
    const shakeX = Math.sin(cd.coughTimer * 30) * 5;
    ctx.translate(shakeX, 0);

    // Draw devil emoji
    ctx.font = (cd.width || 38) + 'px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(cd.emoji, 0, 0);

    // Coughing text that pops up periodically
    if (Math.floor(cd.coughTimer * 5) % 2 === 0) {
      ctx.font = 'bold 14px sans-serif';
      ctx.fillStyle = '#44ff44';
      ctx.fillText('\u{1F922}', 20, -15);
    }

    // Green stink swirls around the devil
    ctx.font = '12px sans-serif';
    for (let s = 0; s < 3; s++) {
      const angle = cd.coughTimer * 3 + s * 2.1;
      const sx = Math.cos(angle) * 20;
      const sy = Math.sin(angle) * 15;
      ctx.fillText('\u{1F4A8}', sx, sy);
    }

    ctx.restore();
  }

  // Particles
  drawParticles();

  // Score pop-ups
  drawScorePopups();

  // Success flash (green)
  if (successFlashTimer > 0) {
    ctx.globalAlpha = successFlashTimer / 0.4 * 0.25;
    ctx.fillStyle = '#00ff00';
    ctx.fillRect(0, 0, WIDTH, HEIGHT);
    ctx.globalAlpha = 1.0;
  }

  // Flash overlay (red for damage, gold for moneybag)
  if (flashTimer > 0) {
    ctx.globalAlpha = flashTimer / 0.3 * 0.4;
    ctx.fillStyle = flashColor || '#ff0000';
    ctx.fillRect(0, 0, WIDTH, HEIGHT);
    ctx.globalAlpha = 1.0;
  }

  ctx.restore(); // restore screen shake transform

  // HUD drawn outside shake transform so it stays stable
  drawHUD();
}

function drawLevelComplete() {
  // Celebratory background
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  // Sparkle effect
  const sparkleCount = 12;
  ctx.font = '20px sans-serif';
  for (let i = 0; i < sparkleCount; i++) {
    const angle = (Date.now() / 1000 + i * (Math.PI * 2 / sparkleCount));
    const radius = 120 + Math.sin(Date.now() / 300 + i) * 30;
    const sx = WIDTH / 2 + Math.cos(angle) * radius;
    const sy = HEIGHT / 2 - 30 + Math.sin(angle) * radius * 0.5;
    ctx.globalAlpha = 0.4 + 0.3 * Math.sin(Date.now() / 200 + i);
    ctx.fillText('\u2728', sx, sy);
  }
  ctx.globalAlpha = 1.0;

  // Particles (confetti)
  drawParticles();

  // Level-specific animation
  drawLevelEndAnimation(game.level, levelCompleteTimer);

  // Level-specific funny text
  const levelText = getLevelEndText(game.level);

  // Main funny text
  ctx.font = 'bold 36px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 4;
  ctx.strokeText(levelText.main, WIDTH / 2, HEIGHT / 2 - 100);
  ctx.fillStyle = '#fff';
  ctx.fillText(levelText.main, WIDTH / 2, HEIGHT / 2 - 100);
  ctx.lineWidth = 1;

  // Subtitle (smaller, fades in)
  const subAlpha = Math.min(1, Math.max(0, (levelCompleteTimer - 0.8) * 2));
  ctx.globalAlpha = subAlpha;
  ctx.font = 'italic 20px sans-serif';
  ctx.fillStyle = '#ddd';
  ctx.strokeStyle = 'rgba(0,0,0,0.5)';
  ctx.lineWidth = 2;
  ctx.strokeText(levelText.sub, WIDTH / 2, HEIGHT / 2 - 65);
  ctx.fillText(levelText.sub, WIDTH / 2, HEIGHT / 2 - 65);
  ctx.globalAlpha = 1.0;
  ctx.lineWidth = 1;

  // Level complete header
  ctx.font = 'bold 28px sans-serif';
  ctx.fillStyle = '#2d2d2d';
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 3;
  ctx.strokeText('Level ' + game.level + ' Complete! \u2728', WIDTH / 2, 40);
  ctx.fillText('Level ' + game.level + ' Complete! \u2728', WIDTH / 2, 40);
  ctx.lineWidth = 1;

  // Score
  ctx.font = '28px sans-serif';
  ctx.fillStyle = '#444';
  ctx.fillText('\u{1FA99} Score: ' + game.score, WIDTH / 2, HEIGHT - 80);

  // Next level prompt
  const pulse = 0.5 + 0.5 * Math.abs(Math.sin(Date.now() / 500));
  ctx.globalAlpha = pulse;
  ctx.font = 'bold 22px sans-serif';
  ctx.fillStyle = '#333';
  ctx.fillText('Klikni za Level ' + (game.level + 1), WIDTH / 2, HEIGHT - 40);
  ctx.globalAlpha = 1.0;
}

function drawGameOver() {
  const t = gameOverTimer;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  // Dark fiery background
  const bgGrad = ctx.createLinearGradient(0, 0, 0, HEIGHT);
  bgGrad.addColorStop(0, '#1a0a00');
  bgGrad.addColorStop(0.5, '#3a1500');
  bgGrad.addColorStop(1, '#2a0800');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, WIDTH, HEIGHT);

  // Flickering fire at the bottom
  for (let i = 0; i < 12; i++) {
    const fx = WIDTH / 2 - 120 + i * 22;
    const flicker = Math.sin(t * 8 + i * 1.7) * 10 + Math.sin(t * 12 + i * 2.3) * 5;
    const fh = 40 + flicker;
    const fireGrad = ctx.createLinearGradient(fx, HEIGHT - 100, fx, HEIGHT - 100 - fh);
    fireGrad.addColorStop(0, 'rgba(255, 100, 0, 0.8)');
    fireGrad.addColorStop(0.4, 'rgba(255, 200, 0, 0.6)');
    fireGrad.addColorStop(1, 'rgba(255, 255, 100, 0)');
    ctx.fillStyle = fireGrad;
    ctx.beginPath();
    ctx.ellipse(fx, HEIGHT - 100, 15, fh, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  // Embers rising
  for (let i = 0; i < 8; i++) {
    const ex = WIDTH / 2 - 80 + (i * 47 + t * 30) % 160;
    const ey = HEIGHT - 120 - ((t * 40 + i * 60) % 200);
    const eAlpha = Math.max(0, 1 - ((t * 40 + i * 60) % 200) / 200);
    ctx.fillStyle = 'rgba(255, ' + Math.floor(150 + Math.sin(t * 5 + i) * 50) + ', 0, ' + (eAlpha * 0.8) + ')';
    ctx.beginPath();
    ctx.arc(ex, ey, 2, 0, Math.PI * 2);
    ctx.fill();
  }

  // --- ROAST PIG ON SPIT ---
  const spitCenterX = WIDTH / 2;
  const spitCenterY = HEIGHT / 2 + 20;
  const rotAngle = t * 1.5; // slow rotation

  // Spit pole (horizontal bar)
  ctx.strokeStyle = '#888';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(spitCenterX - 140, spitCenterY);
  ctx.lineTo(spitCenterX + 140, spitCenterY);
  ctx.stroke();

  // Spit supports (Y-shaped stands)
  ctx.strokeStyle = '#666';
  ctx.lineWidth = 5;
  // Left stand
  ctx.beginPath();
  ctx.moveTo(spitCenterX - 130, HEIGHT - 80);
  ctx.lineTo(spitCenterX - 130, spitCenterY + 10);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(spitCenterX - 140, spitCenterY - 10);
  ctx.lineTo(spitCenterX - 130, spitCenterY + 10);
  ctx.lineTo(spitCenterX - 120, spitCenterY - 10);
  ctx.stroke();
  // Right stand
  ctx.beginPath();
  ctx.moveTo(spitCenterX + 130, HEIGHT - 80);
  ctx.lineTo(spitCenterX + 130, spitCenterY + 10);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(spitCenterX + 120, spitCenterY - 10);
  ctx.lineTo(spitCenterX + 130, spitCenterY + 10);
  ctx.lineTo(spitCenterX + 140, spitCenterY - 10);
  ctx.stroke();

  // Rotating roast pig
  ctx.save();
  ctx.translate(spitCenterX, spitCenterY);
  ctx.rotate(rotAngle);

  // Roasted body (darker, golden-brown)
  const roastColor = '#C8852A';
  const roastDark = '#8B5E1A';
  ctx.fillStyle = roastColor;
  ctx.beginPath();
  ctx.ellipse(0, 0, 55, 28, 0, 0, Math.PI * 2);
  ctx.fill();
  // Darker shading
  ctx.fillStyle = roastDark;
  ctx.beginPath();
  ctx.ellipse(0, 8, 50, 15, 0, 0, Math.PI);
  ctx.fill();
  // Crispy skin lines
  ctx.strokeStyle = '#6B3A0A';
  ctx.lineWidth = 1;
  for (let i = 0; i < 5; i++) {
    ctx.beginPath();
    ctx.moveTo(-40 + i * 18, -10 + Math.sin(i * 1.2) * 5);
    ctx.quadraticCurveTo(-30 + i * 18, 5, -20 + i * 18, -8 + Math.sin(i * 1.5) * 3);
    ctx.stroke();
  }

  // Head
  ctx.fillStyle = roastColor;
  ctx.beginPath();
  ctx.arc(50, 0, 18, 0, Math.PI * 2);
  ctx.fill();
  // Snout
  ctx.fillStyle = roastDark;
  ctx.beginPath();
  ctx.ellipse(64, 2, 8, 6, 0, 0, Math.PI * 2);
  ctx.fill();
  // Closed X eyes (it's roasted!)
  ctx.strokeStyle = '#4A2500';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(48, -6); ctx.lineTo(54, -1); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(54, -6); ctx.lineTo(48, -1); ctx.stroke();
  // Ear
  ctx.fillStyle = '#A06820';
  ctx.beginPath();
  ctx.moveTo(44, -14);
  ctx.lineTo(40, -26);
  ctx.lineTo(50, -16);
  ctx.closePath();
  ctx.fill();

  // Legs sticking up (4 little legs)
  ctx.fillStyle = roastDark;
  const legOffsets = [[-30, -1], [-10, -1], [10, -1], [30, -1]];
  for (const [lx] of legOffsets) {
    ctx.fillRect(lx - 3, -28, 6, 12);
    // Hooves
    ctx.fillStyle = '#4A2500';
    ctx.fillRect(lx - 4, -31, 8, 4);
    ctx.fillStyle = roastDark;
  }

  // Tail (crispy curly)
  ctx.strokeStyle = '#8B5E1A';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(-55, 0);
  ctx.quadraticCurveTo(-65, -12, -58, -16);
  ctx.quadraticCurveTo(-52, -18, -62, -10);
  ctx.stroke();

  // Apple in mouth!
  ctx.fillStyle = '#cc2222';
  ctx.beginPath();
  ctx.arc(70, 3, 6, 0, Math.PI * 2);
  ctx.fill();
  // Apple stem
  ctx.strokeStyle = '#4a2200';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(70, -3);
  ctx.lineTo(71, -7);
  ctx.stroke();
  // Apple highlight
  ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
  ctx.beginPath();
  ctx.arc(68, 1, 2, 0, Math.PI * 2);
  ctx.fill();

  // Spit pole through the pig
  ctx.strokeStyle = '#aaa';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(-70, 0);
  ctx.lineTo(80, 0);
  ctx.stroke();

  ctx.restore();

  // Steam/smoke rising from pig
  for (let i = 0; i < 6; i++) {
    const smokeX = spitCenterX - 40 + i * 18 + Math.sin(t * 2 + i * 1.4) * 8;
    const smokeY = spitCenterY - 40 - ((t * 25 + i * 30) % 120);
    const smokeAlpha = Math.max(0, 0.4 - ((t * 25 + i * 30) % 120) / 120 * 0.4);
    const smokeSize = 8 + ((t * 25 + i * 30) % 120) / 120 * 15;
    ctx.fillStyle = 'rgba(200, 200, 200, ' + smokeAlpha + ')';
    ctx.beginPath();
    ctx.arc(smokeX, smokeY, smokeSize, 0, Math.PI * 2);
    ctx.fill();
  }

  // Title
  ctx.font = 'bold 48px sans-serif';
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 4;
  ctx.strokeText('\u{1F525} Game Over! \u{1F525}', WIDTH / 2, 60);
  ctx.fillStyle = '#ff4400';
  ctx.fillText('\u{1F525} Game Over! \u{1F525}', WIDTH / 2, 60);
  ctx.lineWidth = 1;

  // Sad message
  const msgAlpha = Math.min(1, Math.max(0, (t - 1) * 2));
  ctx.globalAlpha = msgAlpha;
  ctx.font = 'italic 22px sans-serif';
  ctx.fillStyle = '#ff9966';
  ctx.fillText('Kasica je zavr\u0161ila na ra\u017Enju...', WIDTH / 2, 105);
  ctx.globalAlpha = 1.0;

  // Score info
  ctx.font = '26px sans-serif';
  ctx.fillStyle = '#dda050';
  ctx.fillText('Level: ' + game.level + '   \u{1FA99} Score: ' + game.score, WIDTH / 2, HEIGHT - 50);

  // Restart prompt
  const pulse = 0.5 + 0.5 * Math.abs(Math.sin(Date.now() / 500));
  ctx.globalAlpha = pulse;
  ctx.font = 'bold 22px sans-serif';
  ctx.fillStyle = '#ffcc66';
  ctx.fillText('Klikni za novu igru', WIDTH / 2, HEIGHT - 20);
  ctx.globalAlpha = 1.0;
}

// --- Game Loop ---
let lastTime = 0;
function gameLoop(timestamp) {
  let dt = (timestamp - lastTime) / 1000;
  if (dt > 0.1) dt = 0.1;
  lastTime = timestamp;

  update(dt);
  draw();
  requestAnimationFrame(gameLoop);
}

requestAnimationFrame((timestamp) => {
  lastTime = timestamp;
  gameLoop(timestamp);
});
</script>
</body>
</html>
