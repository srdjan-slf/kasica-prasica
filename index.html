// Wet-fart buttons that only appear during a boss fight on mobile.
// Two arrows so the player can pick which way to shoot.
const WETFART_W = 90;
const WETFART_H = 80;
const WETFART_LEFT = {
  id: 'wetfartL', key: 'q', icon: '\uD83D\uDCA6\u25C0', label: 'VLA\u017DAN',
  color: 'rgba(180,80,255,',
  x: PAD, y: JUMP_Y + JUMP_H + GAP, w: WETFART_W, h: WETFART_H
};
const WETFART_RIGHT = {
  id: 'wetfartR', key: 'e', icon: '\u25B6\uD83D\uDCA6', label: 'VLA\u017DAN',
  color: 'rgba(180,80,255,',
  x: WIDTH - PAD - WETFART_W, y: FART_Y + FART_H + GAP, w: WETFART_W, h: WETFART_H
};

// For hit-testing - inject wet-fart buttons during boss fights
function getZoneRects() {
  if (boss && boss.state === 'fighting') {
    return mobileZones.concat([WETFART_LEFT, WETFART_RIGHT]);
  }
  return mobileZones;
}

// Zone top = highest button position (for hit test boundary)
const TOUCH_ZONE_TOP = Math.min(...mobileZones.map(z => z.y)) - 10;

function touchToCanvas(touch) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (touch.clientX - rect.left) * WIDTH / rect.width,
    y: (touch.clientY - rect.top) * HEIGHT / rect.height
  };
}

// Track active canvas touches: touchId -> zoneId
const canvasTouches = {};
// Track which zones are currently active
const activeZones = {};

function getZoneAtPoint(cx, cy) {
  const zones = getZoneRects();
  // Find closest button if within its bounds
  for (const z of zones) {
    if (cx >= z.x && cx < z.x + z.w && cy >= z.y && cy < z.y + z.h) {
      return z;
    }
  }
  return null;
}

// Shake toggle state for alternating up/down on the shake zone
let shakeToggle = false;
let shakeZoneHeld = false;
let shakeRepeatTimer = null;

function activateZone(zone) {
  activeZones[zone.id] = true;
  if (zone.id === 'jump') {
    if (game.latchedDevil) {
      // Devil/butcher latched: rapid shake (alternate up/down)
      if (!shakeZoneHeld) {
        shakeZoneHeld = true;
        shakeToggle = false;
        doShakeTick();
        shakeRepeatTimer = setInterval(doShakeTick, 120);
      }
    } else {
      // Normal jump
      simulateKeyDown('ArrowUp');
    }
  } else if (zone.id === 'poop') {
    simulateKeyDown('Shift');
  } else if (zone.id === 'wetfartL' || zone.id === 'wetfartR') {
    // Fire a wet fart manually (don't depend on simulateKeyDown which only handles a few keys)
    if (game.screen === 'playing' && wetFartCharges > 0 && wetFartInflateTimer <= 0 && !player.inHouse) {
      wetFartCharges--;
      wetFartPendingDir = (zone.id === 'wetfartL') ? -1 : 1;
      wetFartInflateTimer = 0.6;
      if (speechBubbles.length < 3) {
        speechBubbles.push({ x: player.x, y: player.y - 80, text: 'Auu, usrah se! 💦', timer: 2.0, maxTimer: 2.0 });
      }
    }
  } else {
    simulateKeyDown(zone.key);
  }
}

function doShakeTick() {
  if (!shakeZoneHeld) return;
  const k = shakeToggle ? 'ArrowDown' : 'ArrowUp';
  const kOther = shakeToggle ? 'ArrowUp' : 'ArrowDown';
  simulateKeyUp(kOther);
  simulateKeyDown(k);
  shakeToggle = !shakeToggle;
}

function deactivateZone(zone) {
  delete activeZones[zone.id];
  if (zone.id === 'jump') {
    // Stop shake if it was active
    shakeZoneHeld = false;
    if (shakeRepeatTimer) { clearInterval(shakeRepeatTimer); shakeRepeatTimer = null; }
    simulateKeyUp('ArrowUp');
    simulateKeyUp('ArrowDown');
  } else if (zone.id === 'poop') {
    simulateKeyUp('Shift');
  } else if (zone.id === 'wetfartL' || zone.id === 'wetfartR') {
    // wet fart is one-shot - nothing to release
  } else {
    simulateKeyUp(zone.key);
  }
}

function recalcZonesFromTouches() {
  // Determine which zones should be active based on all current touches
  const nowActive = {};
  for (const tid in canvasTouches) {
    const zid = canvasTouches[tid];
    if (zid) nowActive[zid] = true;
  }
  const zones = getZoneRects();
  const zoneMap = {};
  for (const z of zones) zoneMap[z.id] = z;

  // Activate new zones
  for (const zid in nowActive) {
    if (!activeZones[zid]) {
      activateZone(zoneMap[zid]);
    }
  }
  // Deactivate released zones
  for (const zid in activeZones) {
    if (!nowActive[zid]) {
      deactivateZone(zoneMap[zid]);
    }
  }
}

// Canvas touch handlers for zone-based controls
// On non-playing screens, touch = tap = advance/click
// On playing screen, touch = zone-based controls with multi-touch
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  unlockAudio();

  // During gameplay: zone-based controls
  if (game.screen === 'playing' && isMobile) {
    for (const touch of e.changedTouches) {
      const pt = touchToCanvas(touch);
      const zone = getZoneAtPoint(pt.x, pt.y);
      canvasTouches[touch.identifier] = zone ? zone.id : null;
    }
    recalcZonesFromTouches();
  }
  // Non-playing screens: don't do anything on touchstart (wait for touchend = "tap")
}, { passive: false });

canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  if (game.screen !== 'playing' || !isMobile) return;

  for (const touch of e.changedTouches) {
    const pt = touchToCanvas(touch);
    const zone = getZoneAtPoint(pt.x, pt.y);
    canvasTouches[touch.identifier] = zone ? zone.id : null;
  }
  recalcZonesFromTouches();
}, { passive: false });

canvas.addEventListener('touchend', (e) => {
  e.preventDefault();

  // Non-playing screens: tap = click to advance
  if (game.screen !== 'playing') {
    // Pass real touch coordinates into the synthetic click event
    // so shop button hit-testing works correctly
    const touch = e.changedTouches[0];
    const clickEvent = new MouseEvent('click', {
      bubbles: true,
      cancelable: true,
      clientX: touch ? touch.clientX : 0,
      clientY: touch ? touch.clientY : 0
    });
    canvas.dispatchEvent(clickEvent);
    return;
  }

  if (!isMobile) return;

  for (const touch of e.changedTouches) {
    delete canvasTouches[touch.identifier];
  }
  recalcZonesFromTouches();
}, { passive: false });

canvas.addEventListener('touchcancel', (e) => {
  e.preventDefault();
  if (!isMobile) return;

  for (const touch of e.changedTouches) {
    delete canvasTouches[touch.identifier];
  }
  recalcZonesFromTouches();
}, { passive: false });

// --- Draw Mobile Touch Zones on Canvas (gamepad-style buttons) ---
function drawMobileTouchZones() {
  if (!isMobile) return;
  const zones = getZoneRects();

  for (const z of zones) {
    const isActive = !!activeZones[z.id];

    // Rounded button background
    ctx.fillStyle = z.color + (isActive ? '0.35)' : '0.12)');
    ctx.beginPath();
    ctx.roundRect(z.x, z.y, z.w, z.h, BTN_R);
    ctx.fill();

    // Button border
    ctx.strokeStyle = z.color + (isActive ? '0.8)' : '0.3)');
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(z.x, z.y, z.w, z.h, BTN_R);
    ctx.stroke();

    // Pressed effect - inner glow
    if (isActive) {
      ctx.fillStyle = 'rgba(255,255,255,0.08)';
      ctx.beginPath();
      ctx.roundRect(z.x + 4, z.y + 4, z.w - 8, z.h - 8, BTN_R - 4);
      ctx.fill();
    }

    // Icon
    ctx.globalAlpha = isActive ? 0.9 : 0.4;
    ctx.font = '40px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff';
    ctx.fillText(z.icon, z.x + z.w / 2, z.y + z.h * 0.4);

    // Label text below icon
    ctx.font = 'bold 14px sans-serif';
    ctx.globalAlpha = isActive ? 0.7 : 0.25;
    ctx.fillStyle = '#fff';
    ctx.fillText(z.label, z.x + z.w / 2, z.y + z.h * 0.75);

    ctx.globalAlpha = 1.0;
  }
}

// --- AABB Collision ---
function aabb(a, b) {
  return (
    a.x - a.width / 2 < b.x + b.width / 2 &&
    a.x + a.width / 2 > b.x - b.width / 2 &&
    a.y - a.height / 2 < b.y + b.height / 2 &&
    a.y + a.height / 2 > b.y - b.height / 2
  );
}

// --- Update ---
function triggerDamage(fromBomb) {
  if (player.inHouse && player.inHouse.hp > 0) {
    // Redirect damage to house
    player.inHouse.hp--;
    player.inHouse.shakeTimer = 0.3;
    spawnParticles(player.inHouse.x, player.inHouse.y - 40, '💥', 2, 60);
    return; // player is protected
  }
  if (hasShield) {
    hasShield = false;
    spawnParticles(player.x, player.y, '\uD83D\uDEE1\uFE0F', 4, 150);
    spawnScorePopup(player.x, player.y - 30, '\uD83D\uDEE1\uFE0F Blocked!', '#4488ff');
    triggerScreenShake(3, 0.15);
    return;
  }
  game.cracks++;
  game.score = Math.max(0, game.score - 5);
  flashTimer = 0.3;
  flashColor = '#ff0000';
  piggyDamageTimer = 0.3;
  spawnScorePopup(player.x, player.y - 40, '-5', '#ff4444');

  if (fromBomb) {
    // Bomb explosion particles
    const explosionEmojis = ['\u{1F4A5}', '\u{1F525}', '\u{1F4A5}', '\u{1F525}'];
    for (let i = 0; i < 7; i++) {
      spawnParticles(player.x, player.y, explosionEmojis[i % explosionEmojis.length], 1, 300);
    }
    triggerScreenShake(8, 0.3);
    playBombExplosion();
  }

  if (game.cracks >= (game.maxCracks || 3)) {
    isPaused = false;
    game.screen = 'gameOver';
    gameOverTimer = 0;
    stopMusic();
    playGameOver();
    saveToLeaderboard();
    // Initialize laughing devils
    gameOverDevils = [];
    for (let i = 0; i < 4; i++) {
      gameOverDevils.push({
        x: WIDTH * 0.2 + i * (WIDTH * 0.2),
        y: HEIGHT / 2 + 80,
        emoji: i % 2 === 0 ? '\u{1F608}' : '\u{1F47F}',
        phase: Math.random() * Math.PI * 2,
        laughTimer: Math.random() * 2,
        laughing: false,
        fleeing: false,
        fleeX: 0,
        fleeSpeed: 0
      });
    }
    resurrectionCost = 50 * game.level;
    const canAfford = game.score >= resurrectionCost;
    const angelChance = resurrectionCount === 0 ? 1.0 : 0.5;
    const angelAppears = resurrectionCount < 2 && Math.random() < angelChance;
    if (angelAppears && canAfford) {
      resurrectionState = 'waiting';
    } else if (angelAppears && !canAfford) {
      resurrectionState = 'waiting_sad';
    } else {
      resurrectionState = 'done';
    }
    resurrectionTimer = 0;
    angelY = -50;
  }
}

// --- Boss AI & Update ---
function updateBoss(dt) {
  if (!boss) return;
  boss.hitFlash = Math.max(0, boss.hitFlash - dt);
  boss.shakeTimer = Math.max(0, boss.shakeTimer - dt);

  // Tick the boss banner / hint pulse regardless of state
  if (bossBannerTimer > 0) bossBannerTimer = Math.max(0, bossBannerTimer - dt);
  bossHintPulse += dt;

  if (boss.state === 'entering') {
    // Fly in from top - drop further down so the boss is fully on-screen
    boss.y += 110 * dt;
    if (boss.y >= 90) {
      boss.y = 90;
      boss.state = 'fighting';
      bossActive = true;
      triggerEnemyIntro(boss.type === 'velikiVuk' ? 'wolf' : boss.type === 'megaKasapin' ? 'butcher' : boss.type === 'kraljDjavola' ? 'devil_fast' : 'farmer');
      spawnScorePopup(WIDTH / 2, HEIGHT / 3, '\u26A0\uFE0F BOSS: ' + boss.name + ' \u26A0\uFE0F', '#FF0000');
      triggerScreenShake(10, 0.5);
    }
    return;
  }

  // While the boss is alive and fighting, slowly regenerate ammo so the player
  // can keep shooting (otherwise it's easy to run out and feel stuck).
  if (boss.state === 'fighting') {
    bossWetFartRegenTimer += dt;
    if (bossWetFartRegenTimer >= 4 && wetFartCharges < MAX_WET_FARTS) {
      wetFartCharges++;
      bossWetFartRegenTimer = 0;
    }
    bossFartRegenTimer += dt;
    if (bossFartRegenTimer >= 2.5 && fartCharges < MAX_FARTS) {
      fartCharges++;
      bossFartRegenTimer = 0;
    }
  }

  if (boss.state === 'dying') {
    boss.deathTimer += dt;
    boss.y -= 30 * dt;
    if (boss.deathTimer > 3) {
      boss.state = 'dead';
      bossDefeatedThisLevel = true;
      bossActive = false;
      playerBTC += boss.reward;
      spawnScorePopup(boss.x, boss.y, '+' + boss.reward + ' \u20BF BOSS DEFEATED!', '#FFD700');
      for (let i = 0; i < 20; i++) {
        spawnParticles(boss.x + (Math.random()-0.5)*80, boss.y + (Math.random()-0.5)*80, '\u{1F4A5}', 1, 200);
      }
      triggerScreenShake(15, 0.8);
      boss = null;
    }
    return;
  }

  // Phase two at 50% hp
  if (!boss.phaseTwo && boss.hp <= boss.maxHp / 2) {
    boss.phaseTwo = true;
    boss.speed *= 1.4;
    spawnScorePopup(boss.x, boss.y - 40, 'PHASE 2! \u{1F525}', '#FF4400');
    triggerScreenShake(8, 0.4);
  }

  // Frozen check
  if (boss.stunTimer > 0) {
    boss.stunTimer -= dt;
    return;
  }

  // Movement AI
  const moveSpeed = boss.speed * (boss.phaseTwo ? 1.0 : 0.7);
  if (Math.abs(boss.x - boss.targetX) > 10) {
    boss.dir = boss.targetX > boss.x ? 1 : -1;
    boss.x += moveSpeed * boss.dir * dt;
  } else {
    // Pick new target
    if (Math.random() < 0.02) {
      boss.targetX = 60 + Math.random() * (WIDTH - 120);
    }
  }
  boss.x = Math.max(boss.size / 2, Math.min(WIDTH - boss.size / 2, boss.x));

  // Attack timer
  boss.attackTimer -= dt;
  if (boss.attackTimer <= 0) {
    // Choose random attack
    const attack = boss.attacks[Math.floor(Math.random() * boss.attacks.length)];
    executeBossAttack(boss, attack);
    boss.attackTimer = boss.phaseTwo ? 2 + Math.random() * 2 : 3 + Math.random() * 2.5;
  }

  // Boss takes damage from fart clouds
  for (let i = fartClouds.length - 1; i >= 0; i--) {
    const fc = fartClouds[i];
    if (Math.abs(fc.x - boss.x) < boss.size && Math.abs(fc.y - boss.y) < boss.size) {
      damageBoss(2);
      fartClouds.splice(i, 1);
    }
  }
  // Boss takes damage from wet fart projectiles
  for (let i = wetFartProjectiles.length - 1; i >= 0; i--) {
    const wf = wetFartProjectiles[i];
    if (Math.abs(wf.x - boss.x) < boss.size && Math.abs(wf.y - boss.y) < boss.size) {
      damageBoss(3);
      wetFartProjectiles.splice(i, 1);
    }
  }
  // Boss takes damage from poops (if it's near ground)
  for (const poop of poops) {
    if (boss.y > HEIGHT - 120 && Math.abs(poop.x - boss.x) < boss.size) {
      damageBoss(1);
      poop.life = 0;
    }
  }
}

function damageBoss(amount) {
  if (!boss || boss.state !== 'fighting') return;
  boss.hp -= amount;
  boss.hitFlash = 0.2;
  boss.shakeTimer = 0.15;
  spawnParticles(boss.x, boss.y, '\u{1F4A5}', 2, 80);
  if (boss.hp <= 0) {
    boss.hp = 0;
    boss.state = 'dying';
    boss.deathTimer = 0;
  }
}

function executeBossAttack(boss, attack) {
  const px = player.x;
  switch (attack) {
    case 'charge': // Rush toward player
      boss.targetX = px;
      boss.speed *= 2;
      setTimeout(() => { if (boss) boss.speed = BOSS_TYPES[boss.type] ? BOSS_TYPES[boss.type].speed * (boss.phaseTwo ? 1.4 : 1) : boss.speed / 2; }, 1500);
      break;
    case 'howl': // Summon 2 wolves
      for (let i = 0; i < 2; i++) {
        const fromLeft = Math.random() > 0.5;
        groundEnemies.push({
          type: 'wolf', emoji: '\u{1F43A}',
          x: fromLeft ? -30 : WIDTH + 30,
          y: HEIGHT - 55, width: 50, height: 50,
          speed: 80, dir: fromLeft ? 1 : -1,
          ai: 'straight', pauseTimer: 0, frozen: 0, nameTimer: 0
        });
      }
      spawnScorePopup(boss.x, boss.y - 30, 'AUUUUU! \u{1F43A}', '#888');
      break;
    case 'summon': // Summon minions
      for (let i = 0; i < (boss.phaseTwo ? 3 : 2); i++) {
        objects.push({
          type: 'devil', devilType: 'fast',
          x: boss.x + (Math.random()-0.5) * 100,
          y: boss.y + 20,
          width: 35, height: 35,
          speed: 200, value: 0,
          emoji: '\u{1F608}'
        });
      }
      break;
    case 'knives': // Throw knives in spread
      const count = boss.phaseTwo ? 5 : 3;
      for (let i = 0; i < count; i++) {
        const angle = -Math.PI / 2 + (i - (count-1)/2) * 0.3;
        bossProjectiles.push({
          x: boss.x, y: boss.y + boss.size / 2,
          vx: Math.cos(angle) * 200,
          vy: Math.sin(angle) * 200 + 100,
          life: 3, emoji: '\u{1F52A}', size: 20
        });
      }
      break;
    case 'slam': // Jump to player position
      boss.targetX = px;
      boss.speed = 400;
      setTimeout(() => {
        if (boss) {
          boss.speed = BOSS_TYPES[boss.type] ? BOSS_TYPES[boss.type].speed * (boss.phaseTwo ? 1.4 : 1) : 70;
          triggerScreenShake(12, 0.5);
          // Damage if player is near
          if (Math.abs(boss.x - player.x) < 80) triggerDamage(false);
        }
      }, 800);
      break;
    case 'fireball': // Fire projectile at player
      const dx = px - boss.x;
      const dy = (HEIGHT - 70) - boss.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      bossProjectiles.push({
        x: boss.x, y: boss.y + boss.size / 2,
        vx: (dx / dist) * 250,
        vy: (dy / dist) * 250,
        life: 3, emoji: '\u{1F525}', size: 25
      });
      if (boss.phaseTwo) {
        // Triple fireball in phase 2
        bossProjectiles.push({
          x: boss.x - 30, y: boss.y + boss.size / 2,
          vx: (dx / dist) * 220 - 40,
          vy: (dy / dist) * 220,
          life: 3, emoji: '\u{1F525}', size: 22
        });
        bossProjectiles.push({
          x: boss.x + 30, y: boss.y + boss.size / 2,
          vx: (dx / dist) * 220 + 40,
          vy: (dy / dist) * 220,
          life: 3, emoji: '\u{1F525}', size: 22
        });
      }
      break;
    case 'teleport': // Teleport to random position
      boss.x = 60 + Math.random() * (WIDTH - 120);
      spawnParticles(boss.x, boss.y, '\u{1F4A8}', 5, 120);
      // Immediate follow-up attack
      boss.attackTimer = 0.5;
      break;
    case 'rain': // Rain of fire from sky
      for (let i = 0; i < (boss.phaseTwo ? 8 : 5); i++) {
        setTimeout(() => {
          if (boss && boss.state === 'fighting') {
            bossProjectiles.push({
              x: Math.random() * WIDTH,
              y: -20,
              vx: 0, vy: 200 + Math.random() * 100,
              life: 3, emoji: '\u{1F525}', size: 20
            });
          }
        }, i * 200);
      }
      break;
    case 'pitchfork': // Throw pitchfork
      bossProjectiles.push({
        x: boss.x, y: boss.y + boss.size / 2,
        vx: (px - boss.x) * 0.8,
        vy: 180,
        life: 3, emoji: '\u{1F531}', size: 25
      });
      break;
    case 'trap': // Place trap on ground
      poops.push({
        x: px + (Math.random()-0.5) * 100,
        y: HEIGHT - 35,
        width: 30, height: 25,
        life: 6, stinkTimer: 0,
        isTrap: true, emoji: '\u{1FAA4}'
      });
      break;
  }
}

function update(dt) {
  // nameInput and shop screens don't need updates
  if (game.screen === 'nameInput' || game.screen === 'shop') return;

  // Always update clouds
  updateClouds(dt);

  // Update intro cutscene
  if (game.screen === 'intro') {
    playIntroMusic(introScene);
    introTimer += dt;
    introSkipHint += dt;
    // Auto-advance after 10 seconds
    if (introTimer >= 10) {
      if (introScene >= 5) {
        stopIntroMusic();
        game.screen = 'title';
        introScene = 0;
      } else {
        introScene++;
        introTimer = 0;
        introTextOpacity = 0;
        introFadeOut = 0;
      }
    }
    return;
  }

  // Update title screen background coins
  if (game.screen === 'title') {
    titleCoinTimer += dt;
    if (titleCoinTimer >= 0.5) {
      titleCoinTimer -= 0.5;
      const emojis = ['\u{1FA99}', '\u{1F4B5}', '\u{1F4B0}'];
      titleCoins.push({
        x: Math.random() * WIDTH,
        y: -20,
        emoji: emojis[Math.floor(Math.random() * emojis.length)],
        speed: 60 + Math.random() * 40,
        alpha: 0.3 + Math.random() * 0.2
      });
    }
    for (let i = titleCoins.length - 1; i >= 0; i--) {
      titleCoins[i].y += titleCoins[i].speed * dt;
      if (titleCoins[i].y > HEIGHT + 30) {
        titleCoins.splice(i, 1);
      }
    }
    return;
  }

  // Update particles on level complete screen too
  if (game.screen === 'levelComplete') {
    levelCompleteTimer += dt;
    updateParticles(dt);
    return;
  }

  // Update victory screen
  if (game.screen === 'victory') {
    victoryTimer += dt;

    // Update piglets (bounce and wander)
    for (const p of victoryPiglets) {
      p.x += p.vx * dt;
      p.bouncePhase += dt * 5;
      if (p.x < 100 || p.x > WIDTH - 100) p.vx *= -1;
    }

    // Update vegans (hearts)
    for (const v of victoryVegans) {
      v.heartTimer -= dt;
      if (v.heartTimer <= 0) {
        v.heartTimer = 1.5 + Math.random();
      }
    }

    // Update angels (occasional firing)
    for (const a of victoryAngels) {
      a.fireTimer -= dt;
      if (a.firing) {
        a.fireAnim -= dt;
        if (a.fireAnim <= 0) a.firing = false;
      }
      if (a.fireTimer <= 0 && !a.firing) {
        a.firing = true;
        a.fireAnim = 0.3;
        a.fireTimer = 4 + Math.random() * 8;
        playGunshotSound();
      }
    }

    // Replay music every 5 seconds
    victoryIntruderTimer += dt;
    if (victoryIntruderTimer > 5) {
      victoryIntruderTimer = 0;
      playVictoryMusic();
    }
    return;
  }

  // Update game over animation
  if (game.screen === 'gameOver') {
    gameOverTimer += dt;

    // Update laughing devils
    for (const d of gameOverDevils) {
      d.laughTimer -= dt;
      if (d.laughTimer <= 0 && !d.fleeing) {
        d.laughing = true;
        d.laughTimer = 1 + Math.random() * 2;
      }
      if (d.laughing && d.laughTimer > 0.5) d.laughing = false;
      if (d.fleeing) {
        d.x += d.fleeSpeed * dt;
      }
    }

    // Resurrection sequence
    if (resurrectionState === 'waiting' && gameOverTimer > 3.0) {
      resurrectionState = 'angel_descend';
      resurrectionTimer = 0;
    }
    if (resurrectionState === 'waiting_sad' && gameOverTimer > 3.0) {
      resurrectionState = 'angel_descend_sad';
      resurrectionTimer = 0;
    }

    if (resurrectionState === 'angel_descend' || resurrectionState === 'angel_descend_sad') {
      resurrectionTimer += dt;
      angelY = Math.min(HEIGHT / 2 - 80, -50 + resurrectionTimer * 100);
      if (angelY >= HEIGHT / 2 - 80) {
        if (resurrectionState === 'angel_descend') {
          resurrectionState = 'scatter_devils';
          resurrectionTimer = 0;
          for (const d of gameOverDevils) {
            d.fleeing = true;
            d.laughing = false;
            d.fleeSpeed = (d.x < WIDTH / 2 ? -1 : 1) * (300 + Math.random() * 200);
          }
        } else {
          resurrectionState = 'angel_sad';
          resurrectionTimer = 0;
        }
      }
    }

    if (resurrectionState === 'scatter_devils') {
      resurrectionTimer += dt;
      if (resurrectionTimer > 2.0) {
        resurrectionState = 'resurrect';
        resurrectionTimer = 0;
      }
    }

    if (resurrectionState === 'resurrect') {
      resurrectionTimer += dt;
      if (resurrectionTimer > 2.0) {
        game.score -= resurrectionCost;
        game.cracks = 0;
        resurrectionCount++;
        game.screen = 'playing';
        player.y = player.groundY;
        player.vy = 0;
        player.grounded = true;
        game.latchedDevil = null;
        player.inHouse = null;
        houses.length = 0;
        houseSpawnTimer = 8;
        resurrectionState = 'done';
        startMusic();
      }
    }

    if (resurrectionState === 'angel_sad') {
      resurrectionTimer += dt;
      if (resurrectionTimer > 3.0) {
        angelY -= 100 * dt;
      }
      if (resurrectionTimer > 5.0) {
        resurrectionState = 'done';
      }
    }

    return;
  }

  if (game.screen !== 'playing') return;

  // Update enemy intro popup (runs even when paused)
  if (enemyIntroActive) {
    enemyIntroActive.timer -= dt;
    enemyIntroActive.alpha = Math.min(1, enemyIntroActive.alpha + dt * 4);
    if (enemyIntroActive.timer <= 0) enemyIntroActive = null;
  }

  // Don't update gameplay while paused
  if (isPaused) return;

  // Piggy bob timer
  piggyBobTimer += dt;

  // Beat tracking for music oinks
  if (musicPlaying) {
    beatTimer += dt;
    if (beatTimer >= BEAT_DURATION) {
      beatTimer -= BEAT_DURATION;
      beatCount++;
      if (beatCount % 8 === 0) {
        playDoubleOink();
      } else if (beatCount % 4 === 0) {
        playOink();
      }
    }
  }

  // Flash timer countdown
  if (flashTimer > 0) flashTimer -= dt;
  if (successFlashTimer > 0) successFlashTimer -= dt;
  if (piggyDamageTimer > 0) piggyDamageTimer -= dt;
  if (scoreBounceFactor > 0) scoreBounceFactor -= dt * 4;
  if (shakeVisualTimer > 0) {
    shakeVisualTimer -= dt;
    if (shakeVisualTimer <= 0) shakeVisualOffset = 0;
  }

  // Update screen shake
  updateScreenShake(dt);

  // Update particles
  updateParticles(dt);

  // Update score pop-ups
  updateScorePopups(dt);

  // Update speech bubbles
  updateSpeechBubbles(dt);

  // Spawn speech bubbles randomly from ground enemies, latched devil, vegan
  if (Math.random() < 0.003) { // ~every 5-6 seconds on average
    // Ground enemies speak
    if (groundEnemies.length > 0) {
      const e = groundEnemies[Math.floor(Math.random() * groundEnemies.length)];
      spawnSpeechBubble(e.x, e.y, e.type);
    }
  }
  if (Math.random() < 0.004 && game.latchedDevil) {
    const d = game.latchedDevil;
    spawnSpeechBubble(d.x, d.y, d.devilType === 'butcher' ? 'butcher' : 'devil');
  }
  if (Math.random() < 0.003 && vegan && vegan.state !== 'dead') {
    spawnSpeechBubble(vegan.x, vegan.y, 'vegan');
  }
  // Falling devils occasionally taunt
  if (Math.random() < 0.001) {
    for (const obj of objects) {
      if (obj.type === 'devil' || obj.type === 'fast_devil' || obj.type === 'heavy_devil' || obj.type === 'thief_devil') {
        spawnSpeechBubble(obj.x, obj.y, 'devil');
        break;
      }
    }
  }

  // --- Update Ambient Particles ---
  for (const p of ambientParticles) {
    p.y += p.speed * dt;
    p.x += p.drift * dt + Math.sin(Date.now() / 1000 + p.x) * 0.5;
    if (p.y > HEIGHT + 10) { p.y = -10; p.x = Math.random() * WIDTH; }
    if (p.x < -10) p.x = WIDTH + 10;
    if (p.x > WIDTH + 10) p.x = -10;
  }

  // --- Update Active Power-ups ---
  for (let i = activePowerUps.length - 1; i >= 0; i--) {
    activePowerUps[i].timer -= dt;
    if (activePowerUps[i].timer <= 0) {
      activePowerUps.splice(i, 1);
    }
  }

  // --- Update Falling Power-up Drops ---
  for (let i = powerUpDrops.length - 1; i >= 0; i--) {
    const pu = powerUpDrops[i];
    pu.y += pu.speed * dt;
    pu.bobTimer = (pu.bobTimer || 0) + dt;
    // Player collision
    if (aabb(player, pu) && !hasPowerUp(pu.powerType)) {
      activePowerUps.push({
        type: pu.powerType,
        timer: POWER_UP_TYPES[pu.powerType].duration,
        maxTimer: POWER_UP_TYPES[pu.powerType].duration
      });
      spawnScorePopup(pu.x, pu.y - 20, POWER_UP_TYPES[pu.powerType].name + '!', POWER_UP_TYPES[pu.powerType].color);
      spawnParticles(pu.x, pu.y, POWER_UP_TYPES[pu.powerType].emoji, 5, 100);
      // Freeze effect: stun all enemies
      if (pu.powerType === 'freeze') {
        for (const ge of groundEnemies) ge.frozen = 4;
        triggerScreenShake(5, 0.3);
      }
      powerUpDrops.splice(i, 1);
      continue;
    }
    if (pu.y > HEIGHT + 30) { powerUpDrops.splice(i, 1); }
  }

  // Magnet effect: attract coins toward player
  if (hasPowerUp('magnet')) {
    for (const obj of objects) {
      if (obj.type === 'coin' || obj.type === 'bill' || obj.type === 'moneybag' || obj.type === 'gold') {
        const dx = player.x - obj.x;
        const dy = player.y - obj.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 200 && dist > 5) {
          obj.x += (dx / dist) * 250 * dt;
          obj.y += (dy / dist) * 250 * dt;
        }
      }
    }
  }

  // Coin rain power-up: extra coins
  if (hasPowerUp('coinRain') && Math.random() < 0.1) {
    const ct = pickCoinType();
    objects.push({
      type: 'coin', emoji: ct.emoji,
      x: Math.random() * (WIDTH - 40) + 20,
      y: -20, width: ct.size, height: ct.size,
      speed: (game.levelConfig ? game.levelConfig.fallSpeed : 150) * 0.7,
      value: ct.value
    });
  }

  // Spawn power-up drops occasionally (from level 2+, not during boss)
  if (game.level >= 2 && !bossActive && Math.random() < 0.0008) {
    const types = Object.keys(POWER_UP_TYPES);
    const pType = types[Math.floor(Math.random() * types.length)];
    const pt = POWER_UP_TYPES[pType];
    powerUpDrops.push({
      powerType: pType,
      emoji: pt.emoji,
      x: Math.random() * (WIDTH - 60) + 30,
      y: -30,
      width: 35, height: 35,
      speed: 60 + Math.random() * 30,
      bobTimer: 0
    });
  }

  // --- Boss Update ---
  if (boss && boss.state !== 'dead') {
    updateBoss(dt);
  }
  // Update boss projectiles
  for (let i = bossProjectiles.length - 1; i >= 0; i--) {
    const bp = bossProjectiles[i];
    bp.x += bp.vx * dt;
    bp.y += bp.vy * dt;
    bp.life -= dt;
    if (bp.life <= 0 || bp.y > HEIGHT + 20 || bp.x < -20 || bp.x > WIDTH + 20) {
      bossProjectiles.splice(i, 1);
      continue;
    }
    // Hit player
    if (!hasPowerUp('invisibility') && Math.abs(bp.x - player.x) < 30 && Math.abs(bp.y - player.y) < 30) {
      triggerDamage(false);
      bossProjectiles.splice(i, 1);
    }
  }

  // Level timer countdown
  game.levelTimer -= dt;
  // Boss levels: don't end until boss is defeated
  if (boss && !bossDefeatedThisLevel && game.levelTimer < 5) {
    game.levelTimer = 5; // Keep going until boss is dead
  }
  if (game.levelTimer <= 0) {
    game.levelTimer = 0;
    objects.length = 0;
    ejectedCoins.length = 0;
    if (game.latchedDevil) {
      game.latchedDevil = null;
      lastShakeKey = null;
      squealTimer = 0;
      shakeHintTimer = 0;
      devilTypeIndicator = null;
    }
    stopMusic();
    if (game.level >= 10) {
      game.screen = 'victory';
      if (game.cracks === 0) { playerBTC += 5; }
      saveToLeaderboard();
      initVictoryScene();
    } else {
      game.screen = 'levelComplete';
      levelCompleteTimer = 0;
      playLevelComplete();
      // Flawless level bonus
      if (game.cracks === 0) {
        playerBTC += 5;
        spawnScorePopup(WIDTH / 2, HEIGHT / 2, '+5 \u20BF Flawless!', '#F7931A');
      }
      // Level complete confetti particles
      const confettiEmojis = ['\u{1F389}', '\u{1F38A}', '\u2728', '\u{1F389}', '\u{1F38A}', '\u2728'];
      for (let i = 0; i < 18; i++) {
        spawnParticles(
          WIDTH * 0.2 + Math.random() * WIDTH * 0.6,
          HEIGHT * 0.3 + Math.random() * 50,
          confettiEmojis[i % confettiEmojis.length],
          1, 350
        );
      }
    }
    return;
  }

  // Player movement (speed boost from power-up)
  const moveSpeed = player.speed * (hasPowerUp('speedBoost') ? 2 : 1);
  if (keys['ArrowLeft']) {
    player.x -= moveSpeed * dt;
    player.facing = -1;
  }
  if (keys['ArrowRight']) {
    player.x += moveSpeed * dt;
    player.facing = 1;
  }
  if (!keys['ArrowLeft'] && !keys['ArrowRight']) {
    player.facing = 0;
  }
  // Wet fart: turn butt toward firing direction
  if (wetFartInflateTimer > 0) {
    // wetFartPendingDir: -1 = fire left, 1 = fire right
    // Butt is opposite of face, so face OPPOSITE to fire direction
    player.facing = -wetFartPendingDir;
  }
  player.facingSmooth += (player.facing - player.facingSmooth) * 8 * dt;
  const halfW = player.width / 2;
  if (player.x < halfW) player.x = halfW;
  if (player.x > WIDTH - halfW) player.x = WIDTH - halfW;

  // Jump physics
  if (!player.grounded) {
    const grav = keys['ArrowDown'] ? player.slamGravity : player.gravity;
    player.vy += grav * dt;
    player.y += player.vy * dt;
    if (player.y >= player.groundY) {
      player.y = player.groundY;
      player.vy = 0;
      player.grounded = true;
    }
  } else {
    player.y = player.groundY;
  }

  // --- House Entry/Exit ---
  if (player.grounded) {
    if (player.inHouse) {
      // Check if player walked out
      const ih = player.inHouse;
      if (Math.abs(player.x - ih.x) > ih.width * 0.6 || ih.hp <= 0) {
        player.inHouse = null; // exited
      }
    } else {
      // Check if player walks into a house
      for (const h of houses) {
        if (Math.abs(player.x - h.x) < h.width * 0.4 && h.hp > 0) {
          player.inHouse = h;
          break;
        }
      }
    }
  }
  // Not grounded = not in house
  if (!player.grounded) player.inHouse = null;

  // Spawn timer
  const spawnRate = game.levelConfig ? game.levelConfig.spawnRate : 1.0;
  spawnTimer += dt;
  if (spawnTimer >= spawnRate) {
    spawnTimer -= spawnRate;
    spawnObject();
  }

  // Devil spawn from schedule
  if (game.devilSchedule.length > 0) {
    const nextDevilTime = game.devilSchedule[0];
    if (game.levelTimer <= nextDevilTime) {
      game.devilSchedule.shift();
      game.devilsSpawned++;
      spawnDevil();
    }
  }

  // Butcher spawn from schedule
  if (game.butcherSchedule && game.butcherSchedule.length > 0) {
    const nextButcherTime = game.butcherSchedule[0];
    if (game.levelTimer <= nextButcherTime) {
      game.butcherSchedule.shift();
      spawnButcher();
    }
  }

  // Update airplanes
  for (let i = airplanes.length - 1; i >= 0; i--) {
    const plane = airplanes[i];
    plane.x += plane.speed * plane.dir * dt;

    // Drop butcher when passing dropX
    if (!plane.dropped && ((plane.dir > 0 && plane.x >= plane.dropX) || (plane.dir < 0 && plane.x <= plane.dropX))) {
      plane.dropped = true;
      const cfg = getLevelConfig(game.level);
      const bd = plane.butcherData;
      const size = bd.size;
      const baseSpeed = bd.baseSpeed;
      const zigzagSpeed = 60 + Math.random() * 80;
      const zigzagFreq = 1.0 + Math.random() * 2;
      const zigzagPhase = Math.random() * Math.PI * 2;
      objects.push({
        type: 'butcher',
        emoji: '\u{1F9D1}\u200D\u{1F373}',
        x: plane.x,
        y: plane.y + 20,
        width: size, height: size,
        speed: baseSpeed * 0.525 * 0.3, // SLOW with parachute
        hasParachute: true,
        parachuteDetachY: 200 + Math.random() * 100,
        normalSpeed: baseSpeed * 0.525 * 1.3,
        latched: false, hammerTimer: 0, shakeProgress: 0,
        shakeRequired: 5 + Math.floor(game.level / 2),
        hammerTimeout: 6, hammerAnimTimer: 0,
        stealTimer: 0,
        zigzagSpeed, zigzagFreq, zigzagPhase,
        zigzagTime: 0,
        knifeTimer: 0,
        nameTimer: 3.5
      });
    }

    // Remove airplane when off screen
    if ((plane.dir > 0 && plane.x > WIDTH + 100) || (plane.dir < 0 && plane.x < -100)) {
      airplanes.splice(i, 1);
    }
  }

  // Update fart cooldown
  if (fartCooldown > 0) fartCooldown -= dt;

  // Poop: SHIFT key (or mobile Poop/Shift button) while grounded - not in house
  if (keys['Shift'] && player.grounded && poopCooldown <= 0 && !isPooping && !player.inHouse) {
    isPooping = true;
    poopAnimTimer = 0.6;
  }

  if (isPooping) {
    poopAnimTimer -= dt;
    if (poopAnimTimer <= 0) {
      isPooping = false;
      poopCooldown = POOP_COOLDOWN;
      var poopScale = megaPoop ? 1.5 : 1.0;
      poops.push({
        x: player.x,
        y: HEIGHT - 35,
        width: 30 * poopScale,
        height: 25 * poopScale,
        life: POOP_DURATION,
        stinkTimer: 0
      });
      playPoopSound();
      spawnParticles(player.x, HEIGHT - 35, '\u{1F4A9}', 3, 50);
      triggerScreenShake(4, 0.2);
    }
  }
  poopCooldown = Math.max(0, poopCooldown - dt);

  // Update fart clouds
  for (let i = fartClouds.length - 1; i >= 0; i--) {
    const cloud = fartClouds[i];
    cloud.y += cloud.vy * dt;              // fly upward
    cloud.wobble += dt * 4;                 // wobble side to side
    cloud.x += Math.sin(cloud.wobble) * 30 * dt;
    cloud.scale += dt * 0.5;                // grows bigger as it rises
    cloud.life -= dt;
    cloud.opacity = Math.min(0.8, cloud.life / 1.0);

    if (cloud.life <= 0) {
      fartClouds.splice(i, 1);
      continue;
    }

    // Check collision with falling devils
    for (let j = objects.length - 1; j >= 0; j--) {
      const obj = objects[j];
      if ((obj.type === 'devil' || obj.type === 'butcher') && !obj.latched && !obj.flyAway) {
        // Wide hitbox for the cloud
        const cloudW = cloud.width * cloud.scale;
        const cloudH = cloud.height * cloud.scale;
        if (Math.abs(cloud.x - obj.x) < (cloudW + obj.width) / 2 &&
            Math.abs(cloud.y - obj.y) < (cloudH + obj.height) / 2) {
          // Devil got FARTED ON!
          chokingDevils.push({
            emoji: obj.emoji,
            x: obj.x,
            y: obj.y,
            width: obj.width,
            timer: 1.5,          // choking animation duration
            coughTimer: 0,
            opacity: 1.0,
            greenTint: 1.0        // turns green from the stink
          });
          objects.splice(j, 1);
          playChokingSound();
          spawnParticles(obj.x, obj.y, '\u{1F922}', 3, 100);
          spawnParticles(obj.x, obj.y, '\u{1F480}', 2, 80);
          spawnScorePopup(obj.x, obj.y, '\u2620\uFE0F', '#44ff44');
          playerBTC += 1;
          spawnScorePopup(obj.x, obj.y - 20, '+1 \u20BF', '#F7931A');
          break; // one devil per cloud
        }
      }
    }
  }

  // Wet Fart inflation timer
  if (wetFartInflateTimer > 0) {
    wetFartInflateTimer -= dt;
    if (wetFartInflateTimer <= 0) {
      // FIRE! Create the wet fart projectile.
      // If aiming was active when shot was triggered, use the aim angle to launch
      // the projectile in an arcing trajectory (affected by gravity).
      const dir = wetFartPendingDir;
      const speed = 560;
      const useAim = aimingActive && Math.abs(aimDir - dir) < 0.5 && aimAngle > 0.05;
      const ang = useAim ? aimAngle : 0;
      const vx = Math.cos(ang) * speed * dir;
      const vy = -Math.sin(ang) * speed; // negative = upward
      wetFartProjectiles.push({
        x: player.x + dir * 30,
        y: player.y,
        dir: dir,
        vx: vx,
        vy: vy,
        gravity: useAim ? 380 : 0, // arc only when aimed up
        width: 60,
        height: 40,
        speed: speed,
        life: 3.0,
        wobble: 0,
        trail: []
      });
      playWetFartSound();
      triggerScreenShake(6, 0.3);
      spawnParticles(player.x, player.y, '\u{1F4A6}', 5, 80);
      spawnParticles(player.x, player.y, '\u{1F4A8}', 3, 60);
    }
  }

  // Update wet fart projectiles
  for (let i = wetFartProjectiles.length - 1; i >= 0; i--) {
    const wf = wetFartProjectiles[i];
    // Backwards compat: if vx/vy not set, derive from old dir/speed (horizontal flight)
    if (wf.vx === undefined) {
      wf.vx = (wf.speed || 500) * (wf.dir || 1);
      wf.vy = 0;
      wf.gravity = 0;
    }
    wf.vy += (wf.gravity || 0) * dt;
    wf.x += wf.vx * dt;
    wf.y += wf.vy * dt;
    wf.life -= dt;
    wf.wobble += dt * 15;

    // Add trail particles
    if (Math.random() < 0.3) {
      wf.trail.push({ x: wf.x, y: wf.y + Math.sin(wf.wobble) * 5, alpha: 0.6, size: 15 + Math.random() * 10 });
    }
    // Update trail
    for (let t = wf.trail.length - 1; t >= 0; t--) {
      wf.trail[t].alpha -= dt * 2;
      wf.trail[t].size *= 1.01;
      if (wf.trail[t].alpha <= 0) wf.trail.splice(t, 1);
    }

    // Kill ground enemies in path
    for (let e = groundEnemies.length - 1; e >= 0; e--) {
      const enemy = groundEnemies[e];
      if (Math.abs(wf.x - enemy.x) < (wf.width + enemy.width) / 2 && Math.abs(wf.y - enemy.y) < 40) {
        chokingDevils.push({
          emoji: enemy.emoji, x: enemy.x, y: enemy.y,
          width: enemy.width, timer: 2.0, coughTimer: 0,
          opacity: 1.0, greenTint: 1.0
        });
        groundEnemies.splice(e, 1);
        playChokingSound();
        spawnParticles(enemy.x, enemy.y, '\u{1F922}', 3, 80);
        spawnParticles(enemy.x, enemy.y, '\u{1F4A6}', 2, 60);
        spawnScorePopup(enemy.x, enemy.y, '\u{1F4A6}\u{1F480} POKOŠEN!', '#886600');
        playerBTC += 5;
        spawnScorePopup(enemy.x, enemy.y - 25, '+5 \u20BF', '#F7931A');
      }
    }

    // Also kill falling devils near ground level
    for (let o = objects.length - 1; o >= 0; o--) {
      const obj = objects[o];
      if ((obj.type === 'devil' || obj.type === 'butcher') && obj.y > HEIGHT - 100) {
        if (Math.abs(wf.x - obj.x) < (wf.width + obj.width) / 2) {
          spawnParticles(obj.x, obj.y, '\u{1F4A6}', 3, 80);
          spawnScorePopup(obj.x, obj.y, '\u{1F4A6}\u{1F480}', '#886600');
          playerBTC += 3;
          objects.splice(o, 1);
        }
      }
    }

    // Kill vegan too
    if (vegan && Math.abs(wf.x - vegan.x) < 40 && Math.abs(wf.y - vegan.y) < 40) {
      killVegan('wetfart');
    }

    // Remove if off screen or expired
    if (wf.life <= 0 || wf.x < -100 || wf.x > WIDTH + 100 || wf.y > HEIGHT + 100 || wf.y < -200) {
      wetFartProjectiles.splice(i, 1);
    }
  }

  // Update choking devils
  for (let i = chokingDevils.length - 1; i >= 0; i--) {
    const cd = chokingDevils[i];
    cd.timer -= dt;
    cd.coughTimer += dt;
    cd.opacity = Math.max(0, cd.timer / 1.0);
    cd.y -= 20 * dt; // slowly floats up while dying
    if (cd.timer <= 0) {
      chokingDevils.splice(i, 1);
    }
  }

  // Update latched devil
  if (game.latchedDevil) {
    const devil = game.latchedDevil;
    devil.x = player.x;
    devil.y = player.y - 40;
    devil.hammerTimer += dt;
    devil.hammerAnimTimer += dt;
    shakeHintTimer += dt;

    // Continuous screen shake while devil is latched (subtle; heavy/butcher shakes harder)
    if (screenShake.duration <= 0) {
      const shakeIntensity = (devil.devilType === 'heavy' || devil.devilType === 'butcher') ? 4 : 3;
      triggerScreenShake(shakeIntensity, 0.1);
    }

    // Squeal timer - butcher alternates squeal and knife sound faster
    squealTimer += dt;
    if (devil.devilType === 'butcher') {
      if (squealTimer >= 0.4) {
        squealTimer -= 0.4;
        // Alternate between squeal and knife sound
        if (Math.floor(devil.hammerAnimTimer / 0.4) % 2 === 0) {
          playSqueal();
        } else {
          playKnifeSound();
        }
      }
    } else {
      if (squealTimer >= 0.5) {
        squealTimer -= 0.5;
        playSqueal();
      }
    }

    // Thief devil steals coins every 0.5s
    if (devil.devilType === 'thief') {
      devil.stealTimer += dt;
      if (devil.stealTimer >= 0.5) {
        devil.stealTimer -= 0.5;
        game.score = Math.max(0, game.score - 2);
        spawnScorePopup(
          player.x + (Math.random() - 0.5) * 30,
          player.y - 60 - Math.random() * 20,
          '-2', '#cc44ff'
        );
      }
    }

    // Update devil type indicator timer
    if (devilTypeIndicator) {
      devilTypeIndicator.timer -= dt;
      if (devilTypeIndicator.timer <= 0) devilTypeIndicator = null;
    }

    // Shake success
    if (devil.shakeProgress >= devil.shakeRequired) {
      const flyDirection = (Math.random() < 0.5 ? -1 : 1);
      ejectedCoins.push({
        x: player.x,
        y: player.y - 20,
        startY: player.y - 20,
        targetX: devil.x,
        targetY: devil.y,
        phase: 'rising',
        timer: 0,
        riseDuration: 0.25,
        devilFlyX: flyDirection * (200 + Math.random() * 150),
        devilFlyY: -(200 + Math.random() * 100),
        devilEmoji: devil.emoji,
        devilW: devil.width,
        devilH: devil.height,
        devilAngle: 0,
        hitTimer: 0
      });

      game.score = Math.max(0, game.score - 3);
      spawnScorePopup(player.x, player.y - 50, '-3', '#ff4444');
      // Sparkle particles for devil knock-off
      for (let i = 0; i < 5; i++) {
        spawnParticles(player.x, player.y - 30, '\u2B50', 1, 180);
      }
      playShakeSuccess();

      game.latchedDevil = null;
      lastShakeKey = null;
      squealTimer = 0;
      shakeHintTimer = 0;
      successFlashTimer = 0.4;
      devilTypeIndicator = null;
    }
  }

  // Devil hammer timer expired
  if (game.latchedDevil) {
    const devil = game.latchedDevil;
    if (devil.hammerTimer >= devil.hammerTimeout) {
      triggerDamage(false);
      objects.push({
        type: devil.devilType === 'butcher' ? 'butcher' : 'devil',
        devilType: devil.devilType,
        emoji: devil.emoji,
        x: devil.x,
        y: devil.y,
        width: devil.width,
        height: devil.height,
        speed: 0,
        flyAway: true,
        flyAwayTimer: 0.5
      });
      game.latchedDevil = null;
      lastShakeKey = null;
      squealTimer = 0;
      shakeHintTimer = 0;
      devilTypeIndicator = null;
    }
  }

  // Update ejected coin animations
  for (let i = ejectedCoins.length - 1; i >= 0; i--) {
    const ec = ejectedCoins[i];
    ec.timer += dt;
    if (ec.phase === 'rising') {
      const t = Math.min(ec.timer / ec.riseDuration, 1.0);
      ec.y = ec.startY + t * (ec.targetY - ec.startY);
      if (t >= 1.0) {
        ec.phase = 'hit';
        ec.hitTimer = 0;
        ec.hitX = ec.x;
        ec.hitY = ec.targetY;
      }
    } else if (ec.phase === 'hit') {
      ec.hitTimer += dt;
      ec.devilAngle += dt * 10;
      ec.hitX += ec.devilFlyX * dt;
      ec.hitY += ec.devilFlyY * dt;
      if (ec.hitTimer > 0.6) {
        ejectedCoins.splice(i, 1);
      }
    }
  }

  // Update falling objects
  for (let i = objects.length - 1; i >= 0; i--) {
    const obj = objects[i];
    obj.y += obj.speed * dt;

    // Parachute detachment for butchers
    if (obj.hasParachute && obj.y >= obj.parachuteDetachY) {
      obj.hasParachute = false;
      obj.speed = obj.normalSpeed;
      spawnParticles(obj.x, obj.y, '🪂', 1, 50);
    }

    // Name timer for devils/butchers
    if ((obj.type === 'devil' || obj.type === 'butcher') && obj.nameTimer > 0) {
      obj.nameTimer = Math.max(0, obj.nameTimer - dt);
    }

    // Zigzag movement for devils
    if ((obj.type === 'devil' || obj.type === 'butcher') && !obj.latched && !obj.flyAway && obj.zigzagSpeed) {
      obj.zigzagTime += dt;
      // Unpredictable swerving using combined sine waves
      const swerve = Math.sin(obj.zigzagTime * obj.zigzagFreq + obj.zigzagPhase)
                    + 0.5 * Math.sin(obj.zigzagTime * obj.zigzagFreq * 2.3 + obj.zigzagPhase * 1.7);
      obj.x += swerve * obj.zigzagSpeed * dt;
      // Keep within canvas bounds
      if (obj.x < obj.width / 2) obj.x = obj.width / 2;
      if (obj.x > WIDTH - obj.width / 2) obj.x = WIDTH - obj.width / 2;
    }

    // Fly-away devils
    if (obj.flyAway) {
      obj.flyAwayTimer -= dt;
      obj.y -= 300 * dt;
      obj.x += 150 * dt;
      if (obj.flyAwayTimer <= 0) {
        objects.splice(i, 1);
      }
      continue;
    }

    // Collision with player
    if (aabb(player, obj)) {
      // House protection: bombs damage house, devils bounce off
      if (player.inHouse && player.inHouse.hp > 0 && (obj.type === 'bomb' || obj.type === 'devil' || obj.type === 'butcher')) {
        if (obj.type === 'bomb') {
          player.inHouse.hp = Math.max(0, player.inHouse.hp - 3);
          player.inHouse.shakeTimer = 0.4;
          spawnParticles(player.inHouse.x, player.inHouse.y - 40, '💥', 4, 100);
          triggerScreenShake(6, 0.2);
        } else {
          // Devil/butcher bounces off roof
          obj.flyAway = true;
          obj.flyAwayTimer = 1.0;
          spawnParticles(player.inHouse.x, player.inHouse.y - 60, '💫', 3, 80);
          player.inHouse.shakeTimer = 0.2;
        }
        objects.splice(i, 1);
        continue;
      }
      if (obj.type === 'bomb') {
        triggerDamage(true);
        objects.splice(i, 1);
        continue;
      } else if (obj.type === 'devil') {
        if (!game.latchedDevil) {
          obj.latched = true;
          game.latchedDevil = {
            emoji: obj.emoji,
            devilType: obj.devilType || 'fast',
            x: player.x,
            y: player.y - 40,
            width: obj.width,
            height: obj.height,
            hammerTimer: 0,
            shakeProgress: 0,
            shakeRequired: obj.shakeRequired || 8,
            hammerTimeout: obj.hammerTimeout || 5,
            hammerAnimTimer: 0,
            stealTimer: 0
          };
          lastShakeKey = null;
          squealTimer = 0;
          shakeHintTimer = 0;
          playDevilLatch();
          // Show devil type indicator
          const dt = obj.devilType || 'fast';
          if (dt === 'fast') {
            devilTypeIndicator = { text: '\u26A1 BRZI!', color: '#ffff00', timer: 1.5 };
          } else if (dt === 'heavy') {
            devilTypeIndicator = { text: '\u{1F4AA} TE\u0160KI!', color: '#ff4444', timer: 1.5 };
          } else if (dt === 'thief') {
            devilTypeIndicator = { text: '\u{1F911} LOPOV!', color: '#cc44ff', timer: 1.5 };
          }
        }
        objects.splice(i, 1);
        continue;
      } else if (obj.type === 'butcher') {
        if (!game.latchedDevil) {
          obj.latched = true;
          game.latchedDevil = {
            emoji: obj.emoji,
            devilType: 'butcher',
            x: player.x,
            y: player.y - 45,
            width: obj.width,
            height: obj.height,
            hammerTimer: 0,
            shakeProgress: 0,
            shakeRequired: obj.shakeRequired || 10,
            hammerTimeout: obj.hammerTimeout || 6,
            hammerAnimTimer: 0,
            stealTimer: 0
          };
          lastShakeKey = null;
          squealTimer = 0;
          shakeHintTimer = 0;
          playButcherLatch();
          devilTypeIndicator = { text: '\u{1F52A} KASAPIN!', color: '#cc0000', timer: 2.0 };
        }
        objects.splice(i, 1);
        continue;
      } else if (obj.type === 'material') {
        materials[obj.materialType]++;
        const matNames = { straw: 'Slama', logs: 'Balvan', bricks: 'Cigla' };
        const matColors = { straw: '#DAA520', logs: '#8B4513', bricks: '#B22222' };
        spawnScorePopup(obj.x, obj.y, matNames[obj.materialType] + ' +1', matColors[obj.materialType]);
        spawnParticles(obj.x, obj.y, obj.emoji, 3, 60);
        playCoinCollect();
        // Auto-build house when enough materials collected
        // Check from best to worst
        if (materials.bricks >= 10 && houses.length === 0) {
          buildHouse('brick');
        } else if (materials.logs >= 7 && houses.length === 0) {
          buildHouse('sticks');
        } else if (materials.straw >= 5 && houses.length === 0) {
          buildHouse('straw');
        }
        objects.splice(i, 1);
        continue;
      } else if (obj.type === 'corn') {
        fartCharges = Math.min(MAX_FARTS, fartCharges + 1);
        spawnParticles(obj.x, obj.y, '\u{1F33D}', 3, 100);
        spawnScorePopup(obj.x, obj.y - 10, '\u{1F4A8}+1', '#88cc44');
        playCoinCollect(); // reuse coin sound
        objects.splice(i, 1);
        continue;
      } else {
        // Coin collected
        game.score += obj.value * scoreMultiplier;
        scoreBounceFactor = 1.0;

        // Particles + sound based on value
        if (obj.value === 1) {
          spawnParticles(obj.x, obj.y, '\u2728', 3, 120);
          spawnScorePopup(obj.x, obj.y - 10, '+1', '#ffffff');
          playCoinCollect();
        } else if (obj.value === 5) {
          spawnParticles(obj.x, obj.y, '\u2728', 4, 150);
          spawnScorePopup(obj.x, obj.y - 10, '+5', '#44dd44');
          playBillCollect();
        } else if (obj.value === 10) {
          spawnParticles(obj.x, obj.y, '\u2728', 5, 180);
          spawnScorePopup(obj.x, obj.y - 10, '+10', '#ffd700');
          playGoldCollect();
        } else if (obj.value === 20) {
          spawnParticles(obj.x, obj.y, '\u{1F4B5}', 4, 200);
          spawnParticles(obj.x, obj.y, '\u2728', 5, 160);
          spawnScorePopup(obj.x, obj.y - 10, '+20', '#22cc55');
          playGoldCollect();
        } else if (obj.value === 30) {
          spawnParticles(obj.x, obj.y, '\u{1F4B0}', 3, 200);
          spawnParticles(obj.x, obj.y, '\u2728', 8, 220);
          spawnScorePopup(obj.x, obj.y - 10, '+30', '#ff6600');
          playGoldCollect();
          // Extra flash for moneybag!
          flashTimer = 0.15;
          flashColor = 'rgba(255,215,0,';
        }

        objects.splice(i, 1);
        continue;
      }
    }

    // Off screen
    if (obj.y > HEIGHT + obj.height) {
      objects.splice(i, 1);
    }
  }

  // --- Lightning System (Level 4+) - 3 PHASES ---
  // Phase 1: Cloud darkens + rumble sound (2.5s warning)
  // Phase 2: Bright flash + ⚡ danger zone indicator (1.0s)
  // Phase 3: STRIKE! Vertical bolt from cloud to ground
  if (game.level >= 4) {
    lightningSpawnTimer -= dt;
    if (lightningSpawnTimer <= 0 && !lightningWarning) {
      lightningSpawnTimer = 7 + Math.random() * 4;
      const cloud = skyClouds[Math.floor(Math.random() * skyClouds.length)];
      lightningWarning = {
        x: cloud.x + cloud.w * 0.25,
        y: cloud.y + 20,
        cloudIdx: skyClouds.indexOf(cloud),
        phase: 1,        // 1=rumble, 2=flash, 3=strike
        timer: 2.5,      // Phase 1 lasts 2.5s
        totalTimer: 0,
        thunderPlayed: false,
        flashPlayed: false
      };
    }

    if (lightningWarning) {
      const lw = lightningWarning;
      lw.timer -= dt;
      lw.totalTimer += dt;

      // Phase 1: Rumble - cloud darkens, low thunder sound
      if (lw.phase === 1) {
        if (!lw.thunderPlayed) {
          lw.thunderPlayed = true;
          playThunderRumble();
        }
        if (lw.timer <= 0) {
          lw.phase = 2;
          lw.timer = 1.2;  // Phase 2 lasts 1.2s - flash warning
        }
      }
      // Phase 2: Flash warning - bright pulsing zone, danger indicator
      else if (lw.phase === 2) {
        if (!lw.flashPlayed) {
          lw.flashPlayed = true;
          playThunderCrack();
        }
        if (lw.timer <= 0) {
          // Phase 3: STRIKE!
          lightningBolts.push({
            x: lw.x,
            y: lw.y,
            bottomY: lw.y,
            width: 20,
            height: 30,
            speed: 560,
            segments: generateLightningSegments(lw.x, lw.y, HEIGHT - 30),
            life: 0.4,
            flash: 1.0
          });
          lightningWarning = null;
          triggerScreenShake(8, 0.3);
          playThunderStrike();
        }
      }
    }

    // Update lightning bolts
    for (let i = lightningBolts.length - 1; i >= 0; i--) {
      const bolt = lightningBolts[i];
      bolt.life -= dt;
      bolt.flash -= dt * 2.5;

      // Collision with player
      if (bolt.life > 0.2) {
        const boltHitbox = { x: bolt.x, y: HEIGHT - 50, width: 30, height: 60 };
        if (aabb(player, boltHitbox)) {
          triggerDamage(true);
          bolt.life = 0.1;
        }
      }

      if (bolt.life <= 0) lightningBolts.splice(i, 1);
    }
  }

  // --- House System (no auto-spawn, player buys with K key) ---
  // Houses are summoned by pressing K - costs score points
  // Straw: 50, Sticks: 100, Brick: 200

  // Update house shake timers
  for (var hi = 0; hi < houses.length; hi++) {
    if (houses[hi].shakeTimer > 0) houses[hi].shakeTimer -= dt;
    if (houses[hi].attackTimer > 0) houses[hi].attackTimer -= dt;
  }
  // Remove destroyed houses
  for (var hi2 = houses.length - 1; hi2 >= 0; hi2--) {
    if (houses[hi2].hp <= 0) {
      var dh = houses[hi2];
      spawnParticles(dh.x, dh.y - 40, dh.type === 'straw' ? '🌾' : (dh.type === 'sticks' ? '🪵' : '🧱'), 8, 120);
      spawnParticles(dh.x, dh.y - 40, '💨', 4, 80);
      triggerScreenShake(5, 0.3);
      if (player.inHouse === dh) player.inHouse = null;
      houses.splice(hi2, 1);
    }
  }

  // --- Ground Enemies ---
  if (game.level >= 3) {
    groundEnemySpawnTimer -= dt;
    if (groundEnemySpawnTimer <= 0) {
      groundEnemySpawnTimer = Math.max(4.2, (7.7 - game.level * 0.3) * 1.33);
      const available = Object.entries(GROUND_ENEMY_TYPES)
        .filter(([_, t]) => game.level >= t.fromLevel);
      const [key, type] = available[Math.floor(Math.random() * available.length)];
      // Wolves spawn half as often, farmers/carnivores 40% less often
      if (key === 'wolf' && Math.random() < 0.7) {
        groundEnemySpawnTimer = 0.5;
      } else if ((key === 'farmer' || key === 'carnivore') && Math.random() < 0.4) {
        groundEnemySpawnTimer = 0.8;
      } else {
        const fromLeft = Math.random() > 0.5;
        groundEnemies.push({
          type: key,
          emoji: type.emoji,
          x: fromLeft ? -30 : WIDTH + 30,
          y: HEIGHT - 45,
          width: type.size,
          height: type.size,
          speed: type.speed,
          dir: fromLeft ? 1 : -1,
          ai: type.ai,
          pauseTimer: 0,
          animTimer: 0,
          nameTimer: 3.5
        });
        triggerEnemyIntro(key);
      }
    }
  }

  for (let i = groundEnemies.length - 1; i >= 0; i--) {
    const e = groundEnemies[i];
    e.animTimer += dt;
    e.nameTimer = Math.max(0, (e.nameTimer || 0) - dt);

    // Wolf blowing at house mechanic
    if (e.blowingAtHouse) {
      const bh = e.blowingAtHouse;
      if (bh.hp <= 0 || !player.inHouse || player.inHouse !== bh) {
        // House destroyed or player left - stop blowing
        e.blowingAtHouse = null;
        e.blowTimer = 0;
        e.blowCount = 0;
        bh.wolfBlowing = null;
      } else {
        e.blowTimer = (e.blowTimer || 0) + dt;
        if (e.blowTimer >= 1.5) {
          e.blowTimer = 0;
          e.blowCount = (e.blowCount || 0) + 1;
          bh.wolfBlowCount = (bh.wolfBlowCount || 0) + 1;
          bh.shakeTimer = 0.3;
          spawnParticles(bh.x, bh.y - 40, '💨', 4, 100);
          spawnSpeechBubble(e.x, e.y, 'wolf');
          triggerScreenShake(3, 0.2);
          var maxBlows = HOUSE_TYPES[bh.type].wolfBlows;
          if (bh.type === 'brick' && e.blowCount >= 5) {
            // Brick house: wolf gives up
            speechBubbles.push({ x: e.x, y: e.y - 50, text: 'Ne mogu... *kašalj*', timer: 2.5, maxTimer: 2.5 });
            e.blowingAtHouse = null;
            bh.wolfBlowing = null;
            // Wolf flees
            e.ai = 'straight';
            e.dir = e.x < WIDTH / 2 ? -1 : 1;
            e.speed = 150;
          } else if (bh.wolfBlowCount >= maxBlows) {
            bh.hp = 0; // destroyed!
            e.blowingAtHouse = null;
            bh.wolfBlowing = null;
          }
        }
        continue; // wolf stands still while blowing
      }
    }

    // Check if wolf should start blowing at a house
    if (e.type === 'wolf' && !e.blowingAtHouse && player.inHouse && player.inHouse.hp > 0) {
      var ph = player.inHouse;
      if (Math.abs(e.x - ph.x) < ph.width * 0.7 && !ph.wolfBlowing) {
        e.blowingAtHouse = ph;
        ph.wolfBlowing = e;
        e.blowTimer = 0;
        e.blowCount = 0;
        speechBubbles.push({ x: e.x, y: e.y - 50, text: 'Duvaćuuuuu!', timer: 2.0, maxTimer: 2.0 });
        continue;
      }
    }

    // Freeze/stun check
    if (e.frozen > 0) {
      e.frozen -= dt;
    } else if (hasPowerUp('freeze')) {
      // Don't move while freeze power-up is active
    } else {
      switch (e.ai) {
        case 'straight':
          e.x += e.speed * e.dir * dt;
          break;
        case 'chase':
          e.dir = player.x > e.x ? 1 : -1;
          e.x += e.speed * e.dir * dt;
          break;
        case 'cunning':
          if (e.pauseTimer > 0) {
            e.pauseTimer -= dt;
          } else {
            e.x += e.speed * e.dir * dt;
            if (Math.random() < 0.005) {
              e.pauseTimer = 0.3 + Math.random() * 0.5;
              e.dir *= -1;
            }
          }
          break;
        case 'relentless':
          e.dir = player.x > e.x ? 1 : -1;
          e.x += e.speed * e.dir * dt;
          break;
      }
    }

    // Remove if off-screen (only for straight runners, others stay)
    if (e.ai === 'straight' && (e.x < -80 || e.x > WIDTH + 80)) {
      groundEnemies.splice(i, 1);
      continue;
    }
    // Clamp chase/relentless/cunning enemies to screen bounds
    if (e.ai !== 'straight') {
      e.x = Math.max(-20, Math.min(WIDTH + 20, e.x));
    }

    // Collision with player - ONLY if player is on or near ground level
    // (player can jump OVER them, invisibility protects)
    if (player.grounded && !hasPowerUp('invisibility') && aabb(player, e)) {
      if (player.inHouse && player.inHouse.hp > 0) {
        // Player is sheltered - redirect damage to house
        player.inHouse.hp--;
        player.inHouse.shakeTimer = 0.3;
        spawnParticles(player.inHouse.x, player.inHouse.y - 40, '💥', 2, 60);
        groundEnemies.splice(i, 1);
      } else {
        triggerDamage(false);
        groundEnemies.splice(i, 1);
        spawnParticles(player.x, player.y, '\u{1F4A5}', 4, 80);
      }
    }
  }

  // Update poops and check collision with ground enemies
  for (let p = poops.length - 1; p >= 0; p--) {
    const poop = poops[p];
    poop.life -= dt;
    poop.stinkTimer += dt;
    if (poop.life <= 0) { poops.splice(p, 1); continue; }

    // Trap poops (from boss farmer) damage player
    if (poop.isTrap && player.grounded && aabb(player, poop)) {
      triggerDamage(false);
      poops.splice(p, 1);
      continue;
    }

    for (let e = groundEnemies.length - 1; e >= 0; e--) {
      if (aabb(poop, groundEnemies[e])) {
        const enemy = groundEnemies[e];
        chokingDevils.push({
          emoji: enemy.emoji,
          x: enemy.x, y: enemy.y,
          width: enemy.width,
          timer: 2.0, coughTimer: 0,
          opacity: 1.0, greenTint: 1.0
        });
        groundEnemies.splice(e, 1);
        playChokingSound();
        spawnParticles(enemy.x, enemy.y, '\u{1F922}', 4, 100);
        spawnParticles(enemy.x, enemy.y, '\u{1F4A9}', 2, 60);
        spawnScorePopup(enemy.x, enemy.y, '\u{1F480}\u{1F4A9}', '#885500');
        playerBTC += 3;
        spawnScorePopup(enemy.x, enemy.y - 20, '+3 \u20BF', '#F7931A');
      }
    }
  }

  // --- Vegan Ally Update (SUPER ACTIVE DEFENDER) ---
  if (vegan && vegan.state !== 'dead') {
    vegan.auraTimer += dt;
    vegan.nameTimer = Math.max(0, (vegan.nameTimer || 0) - dt);

    // Find nearest ANY ground threat (not just carnivore/farmer - ALL enemies!)
    let nearestThreat = null;
    let nearestDist = 400;  // wider detection range
    for (const e of groundEnemies) {
      const dist = Math.abs(e.x - player.x);
      if (dist < nearestDist) {
        nearestDist = dist;
        nearestThreat = e;
      }
    }

    if (nearestThreat) {
      vegan.state = 'defend';
      vegan.dir = nearestThreat.x > vegan.x ? 1 : -1;
      vegan.x += vegan.speed * 2.5 * vegan.dir * dt;  // faster charge!
      if (Math.abs(vegan.x - nearestThreat.x) < 35) {
        vegan.blockTimer -= dt;
        if (vegan.blockTimer <= 0) {
          vegan.blockTimer = 0.8;  // fights faster (was 1.5)
          spawnParticles(vegan.x, vegan.y, '✌️', 3, 80);
          spawnParticles(nearestThreat.x, nearestThreat.y, '💥', 2, 60);
          const idx = groundEnemies.indexOf(nearestThreat);
          if (idx >= 0) groundEnemies.splice(idx, 1);
          // Only loses HP against wolves and carnivores (tough enemies)
          if (nearestThreat.type === 'wolf' || nearestThreat.type === 'carnivore') {
            vegan.hp--;
            spawnScorePopup(vegan.x, vegan.y - 20, '💚 -1', '#66cc66');
          }
          if (vegan.hp <= 0) killVegan('enemy');
        }
      }
    } else {
      // Actively patrol near player (closer, more protective)
      vegan.state = 'patrol';
      const targetX = player.x + Math.sin(Date.now() / 1200) * 180;
      vegan.dir = targetX > vegan.x ? 1 : -1;
      vegan.x += vegan.speed * 0.8 * vegan.dir * dt;
    }

    if (vegan) vegan.x = Math.max(30, Math.min(WIDTH - 30, vegan.x));

    // Poop collision - kills vegan!
    for (const poop of poops) {
      if (vegan && aabb(vegan, poop)) {
        killVegan('poop');
        break;
      }
    }

    // Bomb/devil collision from falling objects - costs HP but doesn't insta-kill
    for (let i = objects.length - 1; i >= 0; i--) {
      const obj = objects[i];
      if (vegan && (obj.type === 'bomb' || obj.type === 'devil') && aabb(vegan, obj)) {
        vegan.hp -= 2;
        objects.splice(i, 1);
        spawnParticles(vegan.x, vegan.y, '💔', 3, 80);
        spawnScorePopup(vegan.x, vegan.y - 20, '💚 -2', '#cc6666');
        if (vegan.hp <= 0) killVegan(obj.type === 'bomb' ? 'bomb' : 'devil');
        break;
      }
    }
  }

  // Vegan death animation update
  if (veganDeathAnim) {
    veganDeathAnim.timer -= dt;
    veganDeathAnim.y -= 40 * dt;
    veganDeathAnim.wingSpread = Math.min(1, veganDeathAnim.wingSpread + dt * 2);
    veganDeathAnim.haloSize = Math.min(1, veganDeathAnim.haloSize + dt * 1.5);
    veganDeathAnim.opacity = Math.max(0, veganDeathAnim.timer / 2.0);
    if (veganDeathAnim.timer <= 0) veganDeathAnim = null;
  }

  // Vegan respawn: if dead, try again after 12 seconds
  if (!vegan && !veganDeathAnim && game.level >= 2) {
    veganRespawnTimer += dt;
    if (veganRespawnTimer >= 12) {
      veganRespawnTimer = 0;
      const fromLeft = Math.random() > 0.5;
      vegan = {
        x: fromLeft ? 40 : WIDTH - 40,
        y: HEIGHT - 50,
        width: 40, height: 50,
        hp: 5, maxHp: 5,
        dir: fromLeft ? 1 : -1, speed: 120,
        state: 'patrol',
        blockTimer: 0,
        auraTimer: 0,
        nameTimer: 3.5
      };
      spawnParticles(vegan.x, vegan.y, '🌿', 5, 100);
      spawnScorePopup(vegan.x, vegan.y - 30, 'Vegan se vratio! 🌱', '#44cc44');
      triggerEnemyIntro('vegan');
    }
  }
}

function killVegan(cause) {
  if (!vegan) return;
  const msg = cause === 'poop'
    ? 'O ne, USRAO si vegana! \u{1F4A9}\u{1F607}'
    : 'O ne, ubio si vegana! \u{1F607}';
  veganDeathAnim = {
    x: vegan.x, y: vegan.y,
    timer: 4.0,
    msg: msg,
    wingSpread: 0,
    haloSize: 0,
    opacity: 1.0
  };
  vegan = null;
  veganRespawnTimer = 0;  // reset respawn timer
  playVeganDeathSound();
  spawnParticles(veganDeathAnim.x, veganDeathAnim.y, '\u{1F607}', 5, 100);
}

function playVeganDeathSound() {
  try {
    const ctx = getAudioContext();
    const now = ctx.currentTime;
    // Sad minor chord progression
    [261, 311, 370].forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.15, now + i * 0.2);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 2.0 + i * 0.2);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now + i * 0.2);
      osc.stop(now + 2.5);
    });
  } catch(e) {}
}

// --- Draw ---
function drawBackground() {
  const b = currentBiome;
  // Vertical sky gradient using biome colors
  const grad = ctx.createLinearGradient(0, 0, 0, HEIGHT);
  grad.addColorStop(0, b.skyTop);
  grad.addColorStop(1, b.skyBottom);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, WIDTH, HEIGHT);

  // Lava glow for pakao biome
  if (b.hasLava) {
    const lavaGrad = ctx.createLinearGradient(0, HEIGHT - 80, 0, HEIGHT);
    lavaGrad.addColorStop(0, 'rgba(255,50,0,0)');
    lavaGrad.addColorStop(1, 'rgba(255,80,0,0.4)');
    ctx.fillStyle = lavaGrad;
    ctx.fillRect(0, HEIGHT - 80, WIDTH, 80);
    // Flickering lava pools
    const t = Date.now() / 1000;
    for (let i = 0; i < 6; i++) {
      const lx = (i * WIDTH / 5 + Math.sin(t + i) * 20) % WIDTH;
      const lo = 0.2 + Math.sin(t * 2 + i * 1.5) * 0.15;
      ctx.fillStyle = `rgba(255, ${60 + Math.sin(t * 3 + i) * 40}, 0, ${lo})`;
      ctx.beginPath();
      ctx.ellipse(lx, HEIGHT - 20, 30 + Math.sin(t + i) * 10, 8, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // Draw fluffy clouds using biome cloud color
  for (const cloud of skyClouds) {
    ctx.fillStyle = b.cloudColor + cloud.opacity + ')';
    ctx.beginPath();
    ctx.arc(cloud.x, cloud.y, cloud.w * 0.25, 0, Math.PI * 2);
    ctx.arc(cloud.x + cloud.w * 0.25, cloud.y - cloud.w * 0.12, cloud.w * 0.3, 0, Math.PI * 2);
    ctx.arc(cloud.x + cloud.w * 0.5, cloud.y, cloud.w * 0.22, 0, Math.PI * 2);
    ctx.fill();
  }

  // Sun/moon using biome sun color
  ctx.fillStyle = b.sunColor;
  ctx.beginPath();
  ctx.arc(WIDTH - 60, 50, 30, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = b.sunColor;
  ctx.lineWidth = 2;
  for (let i = 0; i < 8; i++) {
    const angle = (i / 8) * Math.PI * 2 + Date.now() / 3000;
    ctx.beginPath();
    ctx.moveTo(WIDTH - 60 + Math.cos(angle) * 35, 50 + Math.sin(angle) * 35);
    ctx.lineTo(WIDTH - 60 + Math.cos(angle) * 48, 50 + Math.sin(angle) * 48);
    ctx.stroke();
  }

  // Ambient particles (biome-specific)
  drawAmbientParticles();
}

function drawAmbientParticles() {
  const type = currentBiome.ambientParticles;
  if (!type) return;
  const t = Date.now() / 1000;
  for (const p of ambientParticles) {
    ctx.globalAlpha = p.opacity;
    if (type === 'leaves') {
      ctx.fillStyle = `hsl(${100 + Math.sin(t + p.x) * 30}, 60%, 35%)`;
      ctx.beginPath();
      ctx.ellipse(p.x, p.y, p.size, p.size * 0.5, Math.sin(t + p.x) * 0.5, 0, Math.PI * 2);
      ctx.fill();
    } else if (type === 'snow') {
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * 0.7, 0, Math.PI * 2);
      ctx.fill();
    } else if (type === 'embers') {
      ctx.fillStyle = `rgb(255, ${100 + Math.sin(t * 3 + p.x) * 60}, 0)`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * 0.5, 0, Math.PI * 2);
      ctx.fill();
    } else if (type === 'smog') {
      ctx.fillStyle = `rgba(100, 100, 100, ${p.opacity * 0.3})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * 2, 0, Math.PI * 2);
      ctx.fill();
    } else if (type === 'sparkles') {
      const sparkle = Math.sin(t * 4 + p.x * 0.1) > 0.5 ? 1 : 0.2;
      ctx.fillStyle = `rgba(255, 255, 200, ${sparkle * p.opacity})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * 0.4, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
}

function drawGround() {
  const b = currentBiome;
  const groundY = HEIGHT - 40;
  const groundHeight = 40;
  ctx.fillStyle = b.groundColor;
  ctx.fillRect(0, groundY, WIDTH, groundHeight);
  ctx.fillStyle = b.groundStripe;
  for (let x = 0; x < WIDTH; x += 20) {
    if ((x / 20) % 2 === 0) {
      ctx.fillRect(x, groundY, 10, groundHeight);
    }
  }
  ctx.font = '14px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.globalAlpha = 0.5;
  for (let x = 15; x < WIDTH; x += 55) {
    ctx.fillText(b.groundEmoji, x, groundY + 6);
  }
  ctx.globalAlpha = 1.0;
}

// --- Hand-drawn Wolf (BIG SCARY HEAD with snapping jaws) ---
function drawWolf(x, y, dir, animTimer) {
  ctx.save();
  ctx.translate(x, y);
  if (dir < 0) ctx.scale(-1, 1);

  const legPhase = animTimer * 10;
  // Jaw snapping - opens and closes rhythmically
  const jawOpen = Math.abs(Math.sin(animTimer * 6)) * 10;

  // Body - gray oval, muscular
  ctx.fillStyle = '#5a5a5a';
  ctx.beginPath();
  ctx.ellipse(-4, -8, 30, 15, 0, 0, Math.PI * 2);
  ctx.fill();
  // Darker spine
  ctx.fillStyle = '#444';
  ctx.beginPath();
  ctx.ellipse(-4, -14, 26, 7, 0, Math.PI, 0);
  ctx.fill();
  // Fur texture lines
  ctx.strokeStyle = '#4a4a4a';
  ctx.lineWidth = 1;
  for (let i = -20; i < 15; i += 6) {
    ctx.beginPath();
    ctx.moveTo(i, -18);
    ctx.lineTo(i + 2, -8);
    ctx.stroke();
  }

  // Tail - big bushy
  ctx.fillStyle = '#555';
  ctx.beginPath();
  ctx.moveTo(-32, -10);
  ctx.quadraticCurveTo(-46, -28, -38, -34);
  ctx.quadraticCurveTo(-30, -28, -30, -12);
  ctx.fill();
  // Tail tip - white
  ctx.fillStyle = '#888';
  ctx.beginPath();
  ctx.arc(-37, -32, 5, 0, Math.PI * 2);
  ctx.fill();

  // Legs - animated walking
  ctx.fillStyle = '#4a4a4a';
  const fl1 = Math.sin(legPhase) * 9;
  const fl2 = Math.sin(legPhase + Math.PI) * 9;
  const bl1 = Math.sin(legPhase + Math.PI / 2) * 9;
  const bl2 = Math.sin(legPhase + Math.PI * 1.5) * 9;
  // Back legs (thicker)
  ctx.fillRect(-16 + bl1, 2, 6, 17);
  ctx.fillRect(-8 + bl2, 2, 6, 17);
  // Front legs
  ctx.fillRect(10 + fl1, 2, 6, 17);
  ctx.fillRect(18 + fl2, 2, 6, 17);
  // Paws with claws
  ctx.fillStyle = '#333';
  ctx.fillRect(9 + fl1, 17, 8, 4);
  ctx.fillRect(17 + fl2, 17, 8, 4);
  ctx.fillRect(-17 + bl1, 17, 8, 4);
  ctx.fillRect(-9 + bl2, 17, 8, 4);
  // Claws
  ctx.fillStyle = '#222';
  [fl1, fl2].forEach((f, i) => {
    const bx = (i === 0 ? 9 : 17) + f;
    for (let c = 0; c < 3; c++) {
      ctx.fillRect(bx + c * 3, 20, 2, 3);
    }
  });

  // === BIG HEAD ===
  // Head base - much larger
  ctx.fillStyle = '#6a6a6a';
  ctx.beginPath();
  ctx.ellipse(28, -16, 18, 16, -0.1, 0, Math.PI * 2);
  ctx.fill();
  // Cheek fur
  ctx.fillStyle = '#777';
  ctx.beginPath();
  ctx.arc(22, -8, 8, 0, Math.PI * 2);
  ctx.fill();

  // === SNOUT / JAWS (top jaw fixed, bottom jaw opens) ===
  // Top jaw / snout
  ctx.fillStyle = '#7a7a7a';
  ctx.beginPath();
  ctx.moveTo(34, -20);
  ctx.lineTo(52, -14);
  ctx.lineTo(52, -10);
  ctx.lineTo(34, -8);
  ctx.closePath();
  ctx.fill();
  // Nose tip
  ctx.fillStyle = '#333';
  ctx.beginPath();
  ctx.ellipse(52, -12, 4, 3, 0, 0, Math.PI * 2);
  ctx.fill();
  // Nostrils
  ctx.fillStyle = '#111';
  ctx.beginPath();
  ctx.ellipse(53, -13, 1.5, 1, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(53, -11, 1.5, 1, 0, 0, Math.PI * 2);
  ctx.fill();

  // Bottom jaw - ANIMATED (opens/closes)
  ctx.save();
  ctx.translate(34, -8);
  ctx.rotate(jawOpen * 0.03);  // jaw opens downward
  ctx.fillStyle = '#6a6a6a';
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(18, -1 + jawOpen * 0.3);
  ctx.lineTo(16, 4 + jawOpen * 0.5);
  ctx.lineTo(0, 4);
  ctx.closePath();
  ctx.fill();
  // Bottom teeth - jagged
  ctx.fillStyle = '#fff';
  for (let t = 2; t < 16; t += 4) {
    ctx.beginPath();
    ctx.moveTo(t, 0);
    ctx.lineTo(t + 1.5, -4);
    ctx.lineTo(t + 3, 0);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();

  // Top teeth - hanging down from upper jaw, sharp
  ctx.fillStyle = '#fff';
  for (let t = 0; t < 5; t++) {
    const tx = 36 + t * 3.5;
    const tLen = t === 0 || t === 4 ? 5 : (t === 2 ? 8 : 6); // fangs longer!
    ctx.beginPath();
    ctx.moveTo(tx, -8);
    ctx.lineTo(tx + 1.2, -8 + tLen);
    ctx.lineTo(tx - 1.2, -8 + tLen);
    ctx.closePath();
    ctx.fill();
  }
  // Extra big fangs
  ctx.fillStyle = '#f0f0f0';
  ctx.beginPath();
  ctx.moveTo(36, -8);
  ctx.lineTo(37.5, 1);
  ctx.lineTo(34.5, 1);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(50, -9);
  ctx.lineTo(51.5, -1);
  ctx.lineTo(48.5, -1);
  ctx.closePath();
  ctx.fill();

  // Drool when jaw open wide
  if (jawOpen > 6) {
    ctx.strokeStyle = 'rgba(200,220,255,0.6)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(42, -2);
    ctx.quadraticCurveTo(41, 6 + jawOpen * 0.3, 43, 10 + jawOpen * 0.4);
    ctx.stroke();
  }

  // === EYES - glowing red, menacing ===
  // Eye glow
  ctx.shadowColor = '#ff0000';
  ctx.shadowBlur = 8;
  ctx.fillStyle = '#ff2200';
  ctx.beginPath();
  ctx.ellipse(30, -22, 4.5, 4, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
  // Pupil - slit like a predator
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(30.5, -22, 1.5, 3.5, 0, 0, Math.PI * 2);
  ctx.fill();
  // Eye shine
  ctx.fillStyle = '#ff8866';
  ctx.beginPath();
  ctx.arc(31.5, -23.5, 1.2, 0, Math.PI * 2);
  ctx.fill();

  // Angry eyebrow
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(24, -26);
  ctx.lineTo(35, -28);
  ctx.stroke();

  // === EARS - tall pointed ===
  ctx.fillStyle = '#555';
  ctx.beginPath();
  ctx.moveTo(18, -26);
  ctx.lineTo(12, -44);
  ctx.lineTo(24, -28);
  ctx.closePath();
  ctx.fill();
  // Inner ear
  ctx.fillStyle = '#8a6060';
  ctx.beginPath();
  ctx.moveTo(18, -27);
  ctx.lineTo(14, -40);
  ctx.lineTo(23, -29);
  ctx.closePath();
  ctx.fill();
  // Second ear (behind)
  ctx.fillStyle = '#444';
  ctx.beginPath();
  ctx.moveTo(24, -26);
  ctx.lineTo(22, -42);
  ctx.lineTo(30, -27);
  ctx.closePath();
  ctx.fill();

  ctx.restore();
}

// --- Hand-drawn Fox ---
function drawFoxSprite(x, y, dir, animTimer) {
  ctx.save();

  if (dir < 0) ctx.scale(-1, 1);

  ctx.ellipse(22, -12, 13, 12, -0.1, 0, Math.PI * 2);
  ctx.fill();
  // White cheek patches

  ctx.beginPath();
  ctx.ellipse(20, -5, 7, 5, 0.1, 0, Math.PI * 2);

  // === POINTED MUZZLE - longer and narrower than wolf ===

  ctx.lineTo(48, -10);
  ctx.lineTo(48, -7);
  ctx.lineTo(30, -4);

  ctx.fill();
  // White muzzle underside
  ctx.fillStyle = '#fff';

  ctx.lineTo(46, -5);
  ctx.lineTo(30, -3);
