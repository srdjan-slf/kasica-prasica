<script>
const WIDTH = 1200;
const HEIGHT = 600;
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
canvas.width = WIDTH;
canvas.height = HEIGHT;

function resizeCanvas() {
  const isMobile = 'ontouchstart' in window || window.innerWidth < 800;
  const touchH = 0; // touch zones are now drawn on canvas, no DOM reservation needed
  const availW = window.innerWidth;
  const availH = window.innerHeight - touchH;

  if (isMobile) {
    // Mobile: fill available width, scale height proportionally
    canvas.style.width = availW + 'px';
    const proportionalH = availW * HEIGHT / WIDTH;
    // If proportional height fits, use it; otherwise fill available height
    if (proportionalH <= availH) {
      canvas.style.height = proportionalH + 'px';
    } else {
      canvas.style.height = availH + 'px';
      canvas.style.width = (availH * WIDTH / HEIGHT) + 'px';
    }
  } else {
    // Desktop: fit within window preserving aspect ratio
    const scale = Math.min(availW / WIDTH, availH / HEIGHT);
    canvas.style.width = (WIDTH * scale) + 'px';
    canvas.style.height = (HEIGHT * scale) + 'px';
  }
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);
window.addEventListener('orientationchange', () => { setTimeout(resizeCanvas, 100); });

function toggleFullscreen() {
  const elem = document.documentElement;

  // Check if already fullscreen
  const isFS = document.fullscreenElement || document.webkitFullscreenElement;

  if (!isFS) {
    // Try standard Fullscreen API (works on Android Chrome, desktop)
    if (elem.requestFullscreen) {
      elem.requestFullscreen({ navigationUI: 'hide' }).catch(() => {
        // Fallback: try webkit version
        if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
        else fakeFullscreen();
      });
    } else if (elem.webkitRequestFullscreen) {
      elem.webkitRequestFullscreen();
    } else {
      // iOS Safari: no Fullscreen API - use fake fullscreen
      fakeFullscreen();
    }
  } else {
    if (document.exitFullscreen) {
      document.exitFullscreen().catch(() => {});
    } else if (document.webkitExitFullscreen) {
      document.webkitExitFullscreen();
    }
  }
}

// Fake fullscreen for iOS Safari - scroll to hide address bar + lock orientation hint
let isFakeFS = false;
function fakeFullscreen() {
  if (isFakeFS) {
    // Exit fake fullscreen
    isFakeFS = false;
    document.body.style.height = '';
    document.body.style.overflow = '';
    window.scrollTo(0, 0);
    return;
  }
  isFakeFS = true;
  // Scroll trick to hide Safari address bar
  document.body.style.height = '100.1vh';
  document.body.style.overflow = 'hidden';
  window.scrollTo(0, 1);
  setTimeout(() => {
    window.scrollTo(0, 0);
    document.body.style.height = '100vh';
  }, 100);

  // Try to lock screen orientation to landscape if available
  if (screen.orientation && screen.orientation.lock) {
    screen.orientation.lock('landscape').catch(() => {});
  }
}

// Detect iOS Safari (no Fullscreen API support)
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isStandalone = window.navigator.standalone === true ||
  window.matchMedia('(display-mode: fullscreen)').matches ||
  window.matchMedia('(display-mode: standalone)').matches;

// Show iOS "Add to Home Screen" hint using safe DOM methods
function showIOSHint() {
  const hint = document.createElement('div');
  hint.id = 'iosHint';
  hint.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;z-index:9999;' +
    'background:rgba(0,0,0,0.85);display:flex;align-items:center;justify-content:center;' +
    'flex-direction:column;color:white;font-size:18px;text-align:center;padding:20px;';

  const icon = document.createElement('div');
  icon.style.cssText = 'font-size:48px;margin-bottom:15px';
  icon.textContent = '\u{1F4F1}';
  hint.appendChild(icon);

  const title = document.createElement('div');
  title.style.cssText = 'font-size:22px;font-weight:bold;margin-bottom:10px';
  title.textContent = 'Pun ekran na iPhone/iPad';
  hint.appendChild(title);

  const msg1 = document.createElement('div');
  msg1.style.cssText = 'margin-bottom:8px';
  msg1.textContent = 'Pritisni \u2B06\uFE0F (Share) dugme';
  hint.appendChild(msg1);

  const msg2 = document.createElement('div');
  msg2.style.cssText = 'margin-bottom:15px;font-weight:bold';
  msg2.textContent = 'pa izaberi "Add to Home Screen"';
  hint.appendChild(msg2);

  const sub = document.createElement('div');
  sub.style.cssText = 'font-size:14px;color:#aaa;margin-bottom:20px';
  sub.textContent = 'Igrica \u0107e se otvoriti bez browser trake!';
  hint.appendChild(sub);

  const btn = document.createElement('button');
  btn.style.cssText = 'padding:12px 30px;font-size:18px;border-radius:8px;border:none;' +
    'background:#FFD700;color:#000;font-weight:bold;cursor:pointer';
  btn.textContent = 'OK, razumem';
  btn.addEventListener('click', function() { hint.remove(); });
  hint.appendChild(btn);

  document.body.appendChild(hint);
}

// Fullscreen button - use touchend for mobile (required for user gesture)
const fsBtn = document.getElementById('fullscreenBtn');
fsBtn.addEventListener('touchend', function(e) {
  e.preventDefault();
  e.stopPropagation();
  if (isIOS && !isStandalone && !document.fullscreenElement) {
    fakeFullscreen();
    showIOSHint();
  } else {
    toggleFullscreen();
  }
}, { passive: false });
fsBtn.addEventListener('click', function(e) {
  if (!('ontouchstart' in window)) toggleFullscreen();
});

// --- Level Configuration (with difficulty tuning) ---
function getLevelConfig(level) {
  // 30% HARDER: faster falls, more devils, more bombs, tighter spawns
  let spawnRate, fallSpeed, devilCount, bombChance, billChance, goldChance, duration;

  if (level === 1) {
    duration = 35;
    fallSpeed = 120;
    spawnRate = 0.65;
    devilCount = 2;
    bombChance = 0.08;
    billChance = 0.12;
    goldChance = 0.04;
  } else if (level === 2) {
    duration = 40;
    fallSpeed = 143;
    spawnRate = 0.55;
    devilCount = 3;
    bombChance = 0.12;
    billChance = 0.18;
    goldChance = 0.06;
  } else if (level === 3) {
    duration = 40;
    fallSpeed = 164;
    spawnRate = 0.46;
    devilCount = 5;
    bombChance = 0.14;
    billChance = 0.22;
    goldChance = 0.08;
  } else if (level === 4) {
    duration = 45;
    fallSpeed = 194;
    spawnRate = 0.39;
    devilCount = 7;
    bombChance = 0.18;
    billChance = 0.22;
    goldChance = 0.09;
  } else if (level === 5) {
    duration = 45;
    fallSpeed = 224;
    spawnRate = 0.33;
    devilCount = 9;
    bombChance = 0.21;
    billChance = 0.28;
    goldChance = 0.12;
  } else if (level === 6) {
    duration = 50;
    fallSpeed = 247;
    spawnRate = 0.27;
    devilCount = 12;
    bombChance = 0.23;
    billChance = 0.28;
    goldChance = 0.12;
  } else if (level === 7) {
    duration = 50;
    fallSpeed = 269;
    spawnRate = 0.23;
    devilCount = 14;
    bombChance = 0.26;
    billChance = 0.28;
    goldChance = 0.14;
  } else {
    // Level 8+: Gets progressively brutal
    duration = 45 + level * 3;
    fallSpeed = Math.min(414, Math.round((234 + (level - 7) * 23) * 1.15));
    spawnRate = Math.max(0.13, (0.27 - (level - 7) * 0.025) * 0.85);
    devilCount = Math.min(24, 14 + (level - 7) * 3);
    bombChance = Math.min(0.39, 0.26 + (level - 7) * 0.026);
    billChance = 0.28;
    goldChance = 0.14;
  }

  return { duration, fallSpeed, spawnRate, devilCount, bombChance, billChance, goldChance };
}

function saveToLeaderboard() {
  const entry = {
    name: playerName,
    score: game.score,
    level: game.level,
    btc: playerBTC,
    date: new Date().toISOString().split('T')[0]
  };
  let leaderboard = JSON.parse(localStorage.getItem('kasicaLeaderboard') || '[]');
  leaderboard.push(entry);
  leaderboard.sort(function(a, b) { return b.score - a.score; });
  leaderboard = leaderboard.slice(0, 20);
  localStorage.setItem('kasicaLeaderboard', JSON.stringify(leaderboard));
  totalBTC += playerBTC;
  localStorage.setItem('kasicaTotalBTC', totalBTC.toString());
}

function drawNameLabel(x, y, name, timer) {
  if (timer <= 0) return;
  const alpha = timer > 0.5 ? 1.0 : timer / 0.5; // fade out in last 0.5s
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.textAlign = 'center';
  ctx.font = 'bold 12px sans-serif';
  ctx.strokeStyle = 'rgba(0,0,0,0.7)';
  ctx.lineWidth = 3;
  ctx.strokeText(name, x, y - 5);
  ctx.fillStyle = '#FFD700';
  ctx.fillText(name, x, y - 5);
  ctx.restore();
}

function spawnSpeechBubble(x, y, type) {
  const lines = SPEECH_LINES[type];
  if (!lines) return;
  // Don't spawn too many at once
  if (speechBubbles.length >= 3) return;
  const text = lines[Math.floor(Math.random() * lines.length)];
  speechBubbles.push({ x, y: y - 40, text, timer: 5.0, maxTimer: 5.0 });
}

function updateSpeechBubbles(dt) {
  for (let i = speechBubbles.length - 1; i >= 0; i--) {
    speechBubbles[i].timer -= dt;
    speechBubbles[i].y -= 8 * dt; // float upward slowly
    if (speechBubbles[i].timer <= 0) speechBubbles.splice(i, 1);
  }
}

function drawSpeechBubbles() {
  for (const sb of speechBubbles) {
    const alpha = Math.min(1, sb.timer / 1.0); // fade out in last 1.0s
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.font = 'bold 16px sans-serif';
    const metrics = ctx.measureText(sb.text);
    const tw = metrics.width + 20;
    const th = 26;
    const bx = Math.max(tw/2, Math.min(WIDTH - tw/2, sb.x));

    // Bubble background
    ctx.fillStyle = 'rgba(255, 255, 255, 0.92)';
    ctx.beginPath();
    const rx = bx - tw/2, ry = sb.y - th/2;
    ctx.roundRect(rx, ry, tw, th, 8);
    ctx.fill();
    // Border
    ctx.strokeStyle = 'rgba(0,0,0,0.3)';
    ctx.lineWidth = 1;
    ctx.stroke();
    // Tail triangle
    ctx.fillStyle = 'rgba(255, 255, 255, 0.92)';
    ctx.beginPath();
    ctx.moveTo(bx - 6, sb.y + th/2);
    ctx.lineTo(bx, sb.y + th/2 + 8);
    ctx.lineTo(bx + 6, sb.y + th/2);
    ctx.closePath();
    ctx.fill();

    // Text
    ctx.fillStyle = '#222';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(sb.text, bx, sb.y);
    ctx.restore();
  }
}

// --- Particle System ---
const particles = [];
const MAX_PARTICLES = 100;

function spawnParticles(x, y, emoji, count, spread) {
  for (let i = 0; i < count; i++) {
    if (particles.length >= MAX_PARTICLES) break;
    particles.push({
      x, y,
      emoji: emoji,
      size: 12 + Math.random() * 8,
      vx: (Math.random() - 0.5) * (spread || 200),
      vy: -Math.random() * 250 - 50,
      gravity: 400,
      life: 1.0,
      decay: 0.8 + Math.random() * 0.5
    });
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt;
    p.vy += p.gravity * dt;
    p.y += p.vy * dt;
    p.life -= p.decay * dt;
    if (p.life <= 0) {
      particles.splice(i, 1);
    }
  }
}

function drawParticles() {
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.font = p.size + 'px sans-serif';
    ctx.fillText(p.emoji, p.x, p.y);
  }
  ctx.globalAlpha = 1.0;
}

// --- Screen Shake ---
let screenShake = { intensity: 0, duration: 0 };
function triggerScreenShake(intensity, duration) {
  screenShake.intensity = intensity;
  screenShake.duration = duration;
}

function updateScreenShake(dt) {
  if (screenShake.duration > 0) {
    screenShake.duration -= dt;
    if (screenShake.duration <= 0) {
      screenShake.intensity = 0;
      screenShake.duration = 0;
    }
  }
}

function applyScreenShake() {
  if (screenShake.intensity > 0 && screenShake.duration > 0) {
    const offsetX = (Math.random() - 0.5) * 2 * screenShake.intensity;
    const offsetY = (Math.random() - 0.5) * 2 * screenShake.intensity;
    ctx.translate(offsetX, offsetY);
    return true;
  }
  return false;
}

// --- Score Pop-ups ---
const scorePopups = [];

function spawnScorePopup(x, y, text, color) {
  scorePopups.push({
    x, y,
    text: text,
    color: color,
    life: 1.0,
    vy: -80
  });
}

function updateScorePopups(dt) {
  for (let i = scorePopups.length - 1; i >= 0; i--) {
    const p = scorePopups[i];
    p.y += p.vy * dt;
    p.life -= 0.8 * dt;
    if (p.life <= 0) {
      scorePopups.splice(i, 1);
    }
  }
}

function drawScorePopups() {
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (const p of scorePopups) {
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.font = 'bold 22px sans-serif';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 3;
    ctx.strokeText(p.text, p.x, p.y);
    ctx.fillStyle = p.color;
    ctx.fillText(p.text, p.x, p.y);
  }
  ctx.globalAlpha = 1.0;
  ctx.lineWidth = 1;
}

const lightningBolts = [];

function generateLightningSegments(startX, startY, endY) {
  const segments = [];
  let x = startX;
  let y = startY;
  const step = 30;
  while (y < endY) {
    const nextX = x + (Math.random() - 0.5) * 40;
    const nextY = Math.min(y + step, endY);
    segments.push({ x1: x, y1: y, x2: nextX, y2: nextY });
    x = nextX;
    y = nextY;
  }
  return segments;
}

function updateClouds(dt) {
  for (const cloud of skyClouds) {
    cloud.x += cloud.speed * dt;
    if (cloud.x > WIDTH + cloud.w) cloud.x = -cloud.w;
  }
}

// --- Audio ---
let audioCtx = null;
let audioUnlocked = false;
function getAudioContext() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
// Unlock audio on ANY user interaction (click, touch, key)
function unlockAudio() {
  if (audioUnlocked) return;
  try {
    const ctx = getAudioContext();
    if (ctx.state === 'suspended') ctx.resume();
    // Play a silent buffer to fully unlock
    const buf = ctx.createBuffer(1, 1, 22050);
    const src = ctx.createBufferSource();
    src.buffer = buf;
    src.connect(ctx.destination);
    src.start(0);
    audioUnlocked = true;
    // If game is already playing but music hasn't started, start it now
    if (game.screen === 'playing' && !musicPlaying) {
      startMusic();
    }
    // If on intro screen, start intro music
    if (game.screen === 'intro') {
      forceRestartIntroMusic();
    }
  } catch(e) {}
}
document.addEventListener('click', unlockAudio, { passive: true });
document.addEventListener('touchstart', unlockAudio, { passive: true });
document.addEventListener('touchend', unlockAudio, { passive: true });
document.addEventListener('keydown', unlockAudio, { once: false });

// --- Intro Scene Music ---
function stopIntroMusic() {
  currentIntroMusic = -1;
  if (introMusicTimeout) { clearTimeout(introMusicTimeout); introMusicTimeout = null; }
  introMusicNodes.forEach(n => { try { n.stop(); } catch(e) {} });
  introMusicNodes = [];
}

function scheduleIntroLoop(sceneIndex, duration) {
  introMusicTimeout = setTimeout(() => {
    if (currentIntroMusic === sceneIndex) {
      introMusicNodes.forEach(n => { try { n.stop(); } catch(e) {} });
      introMusicNodes = [];
      currentIntroMusic = -1;
      playIntroMusic(sceneIndex);
    }
  }, duration * 1000 - 50);
}

function playHappyFarmTheme(actx, now, nodes, master) {
  master.gain.value = 0.08;
  const duration = 8;
  const beatLen = 0.5;

  // Sine pad: soft C major chord (C4+E4+G4)
  [261.6, 329.6, 392.0].forEach(freq => {
    const pad = actx.createOscillator();
    pad.type = 'sine';
    pad.frequency.value = freq;
    const padGain = actx.createGain();
    padGain.gain.value = 0.15;
    pad.connect(padGain);
    padGain.connect(master);
    pad.start(now);
    pad.stop(now + duration);
    nodes.push(pad);
  });

  // Triangle wave melody: bouncy C major arpeggio
  const melodyNotes = [523.3, 659.3, 784.0, 1046.5, 784.0, 659.3, 523.3, 659.3,
                       784.0, 1046.5, 784.0, 659.3, 523.3, 784.0, 1046.5, 784.0];
  const melOsc = actx.createOscillator();
  melOsc.type = 'triangle';
  const melGain = actx.createGain();
  melGain.gain.value = 0.25;
  melOsc.connect(melGain);
  melGain.connect(master);
  for (let i = 0; i < melodyNotes.length; i++) {
    const t = now + i * beatLen;
    melOsc.frequency.setValueAtTime(melodyNotes[i], t);
    melGain.gain.setValueAtTime(0.25, t);
    melGain.gain.linearRampToValueAtTime(0.12, t + beatLen * 0.8);
  }
  melOsc.start(now);
  melOsc.stop(now + duration);
  nodes.push(melOsc);

  // Bird chirps
  for (let i = 0; i < 8; i++) {
    const chirpTime = now + 0.5 + i * 0.9 + Math.sin(i * 3.7) * 0.3;
    const chirpFreq = 2500 + Math.sin(i * 2.1) * 800;
    const chirp = actx.createOscillator();
    chirp.type = 'sine';
    chirp.frequency.setValueAtTime(chirpFreq, chirpTime);
    chirp.frequency.linearRampToValueAtTime(chirpFreq * 1.3, chirpTime + 0.04);
    chirp.frequency.linearRampToValueAtTime(chirpFreq * 0.9, chirpTime + 0.08);
    const chirpGain = actx.createGain();
    chirpGain.gain.setValueAtTime(0, chirpTime);
    chirpGain.gain.linearRampToValueAtTime(0.15, chirpTime + 0.01);
    chirpGain.gain.linearRampToValueAtTime(0, chirpTime + 0.1);
    chirp.connect(chirpGain);
    chirpGain.connect(master);
    chirp.start(chirpTime);
    chirp.stop(chirpTime + 0.12);
    nodes.push(chirp);
  }

  scheduleIntroLoop(0, duration);
}

function playDarkTheme(actx, now, nodes, master) {
  master.gain.value = 0.07;
  const duration = 8;
  const beatLen = 1.0;

  // Square wave low drone: alternating C2 and Db2
  const drone = actx.createOscillator();
  drone.type = 'square';
  const droneGain = actx.createGain();
  droneGain.gain.value = 0.3;
  drone.connect(droneGain);
  droneGain.connect(master);
  for (let i = 0; i < 8; i++) {
    drone.frequency.setValueAtTime(i % 2 === 0 ? 65.41 : 69.30, now + i * beatLen);
  }
  drone.start(now);
  drone.stop(now + duration);
  nodes.push(drone);

  // Sawtooth slow melody: Eb3-Db3-C3-B2 descending chromatic
  const darkMelody = [155.6, 138.6, 130.8, 123.5, 155.6, 138.6, 130.8, 123.5];
  const melOsc = actx.createOscillator();
  melOsc.type = 'sawtooth';
  const melGain = actx.createGain();
  melGain.gain.value = 0.2;
  melOsc.connect(melGain);
  melGain.connect(master);
  for (let i = 0; i < darkMelody.length; i++) {
    melOsc.frequency.setValueAtTime(darkMelody[i], now + i * beatLen);
  }
  melOsc.start(now);
  melOsc.stop(now + duration);
  nodes.push(melOsc);

  // Low rumble noise bursts
  for (let i = 0; i < 4; i++) {
    const rumbleTime = now + i * 2 + 0.5;
    const bufSize = actx.sampleRate * 0.5;
    const buf = actx.createBuffer(1, bufSize, actx.sampleRate);
    const data = buf.getChannelData(0);
    for (let s = 0; s < bufSize; s++) data[s] = (Math.random() * 2 - 1);
    const noise = actx.createBufferSource();
    noise.buffer = buf;
    const lpf = actx.createBiquadFilter();
    lpf.type = 'lowpass';
    lpf.frequency.value = 200;
    const nGain = actx.createGain();
    nGain.gain.setValueAtTime(0, rumbleTime);
    nGain.gain.linearRampToValueAtTime(0.3, rumbleTime + 0.1);
    nGain.gain.linearRampToValueAtTime(0, rumbleTime + 0.5);
    noise.connect(lpf);
    lpf.connect(nGain);
    nGain.connect(master);
    noise.start(rumbleTime);
    noise.stop(rumbleTime + 0.5);
    nodes.push(noise);
  }

  // Heartbeat: two quick low thumps every 2 seconds
  for (let i = 0; i < 4; i++) {
    const hbTime = now + i * 2;
    for (let j = 0; j < 2; j++) {
      const thumpTime = hbTime + j * 0.25;
      const kick = actx.createOscillator();
      kick.type = 'sine';
      kick.frequency.setValueAtTime(80, thumpTime);
      kick.frequency.linearRampToValueAtTime(30, thumpTime + 0.15);
      const kickGain = actx.createGain();
      kickGain.gain.setValueAtTime(0.6, thumpTime);
      kickGain.gain.linearRampToValueAtTime(0, thumpTime + 0.2);
      kick.connect(kickGain);
      kickGain.connect(master);
      kick.start(thumpTime);
      kick.stop(thumpTime + 0.2);
      nodes.push(kick);
    }
  }

  scheduleIntroLoop(1, duration);
}

function playHopeTheme(actx, now, nodes, master) {
  master.gain.value = 0.08;
  const duration = 8;

  // Triangle melody: minor to major transition
  // First half: C4-Eb4-G4-C5 (minor feel), second half: C4-E4-G4-C5 (major!)
  const hopeNotes = [
    261.6, 311.1, 392.0, 523.3,  // C minor arpeggio
    261.6, 329.6, 392.0, 523.3,  // C major arpeggio!
    329.6, 392.0, 523.3, 659.3,  // ascending higher
    392.0, 523.3, 659.3, 784.0   // even higher - rising hope
  ];
  const noteDur = duration / hopeNotes.length;
  const melOsc = actx.createOscillator();
  melOsc.type = 'triangle';
  const melGain = actx.createGain();
  melOsc.connect(melGain);
  melGain.connect(master);
  for (let i = 0; i < hopeNotes.length; i++) {
    const t = now + i * noteDur;
    melOsc.frequency.setValueAtTime(hopeNotes[i], t);
    // Crescendo effect: volume builds over time
    const vol = 0.15 + (i / hopeNotes.length) * 0.15;
    melGain.gain.setValueAtTime(vol, t);
  }
  melOsc.start(now);
  melOsc.stop(now + duration);
  nodes.push(melOsc);

  // Sine pad: builds up, adds notes over time
  const padFreqs = [261.6, 329.6, 392.0];
  padFreqs.forEach((freq, idx) => {
    const pad = actx.createOscillator();
    pad.type = 'sine';
    pad.frequency.value = freq;
    const padGain = actx.createGain();
    // Each note fades in later for building effect
    padGain.gain.setValueAtTime(0, now);
    padGain.gain.linearRampToValueAtTime(0.12, now + idx * 1.5 + 1.5);
    pad.connect(padGain);
    padGain.connect(master);
    pad.start(now);
    pad.stop(now + duration);
    nodes.push(pad);
  });

  // Light percussion: soft hi-hat every beat, tempo accelerates
  for (let i = 0; i < 16; i++) {
    // Tempo: starts at ~100 BPM (0.6s), accelerates to ~130 BPM (0.46s)
    const beatTime = now + i * (0.6 - i * 0.009);
    if (beatTime >= now + duration) break;
    const hhBuf = actx.createBuffer(1, actx.sampleRate * 0.03, actx.sampleRate);
    const hhData = hhBuf.getChannelData(0);
    for (let s = 0; s < hhData.length; s++) hhData[s] = (Math.random() * 2 - 1) * (1 - s / hhData.length);
    const hh = actx.createBufferSource();
    hh.buffer = hhBuf;
    const hhFilter = actx.createBiquadFilter();
    hhFilter.type = 'highpass';
    hhFilter.frequency.value = 7000;
    const hhGain = actx.createGain();
    hhGain.gain.setValueAtTime(0.3 + i * 0.02, beatTime);
    hhGain.gain.linearRampToValueAtTime(0, beatTime + 0.03);
    hh.connect(hhFilter);
    hhFilter.connect(hhGain);
    hhGain.connect(master);
    hh.start(beatTime);
    hh.stop(beatTime + 0.03);
    nodes.push(hh);
  }

  scheduleIntroLoop(currentIntroMusic, duration);
}

function forceRestartIntroMusic() {
  // Called after user gesture unlocks audio - force music for current scene
  currentIntroMusic = -1; // reset so playIntroMusic won't skip
}

function playIntroMusic(sceneIndex) {
  if (currentIntroMusic === sceneIndex) return;
  stopIntroMusic();
  if (!audioUnlocked) return; // browser hasn't had user gesture yet
  currentIntroMusic = sceneIndex;

  try {
    const actx = getAudioContext();
    const now = actx.currentTime;
    const nodes = [];
    const master = actx.createGain();
    master.connect(actx.destination);

    switch(sceneIndex) {
      case 0: playHappyFarmTheme(actx, now, nodes, master); break;
      case 1: playDarkTheme(actx, now, nodes, master); break;
      case 2: playSadTheme(actx, now, nodes, master); break;
      case 3: case 4: playHopeTheme(actx, now, nodes, master); break;
      case 5: playTutorialTheme(actx, now, nodes, master); break;
    }

    introMusicNodes = nodes;
  } catch(e) {}
}

function playSqueal() {
  try {
  const actx = getAudioContext();
  const t = actx.currentTime;
  const duration = 0.5;

  // Layer 1: Main vocal scream - starts at 600Hz, sweeps to 1500Hz
  const osc1 = actx.createOscillator();
  osc1.type = 'sawtooth';
  osc1.frequency.setValueAtTime(600, t);
  osc1.frequency.linearRampToValueAtTime(1500, t + 0.08);
  osc1.frequency.linearRampToValueAtTime(1200, t + 0.2);
  osc1.frequency.linearRampToValueAtTime(1800, t + 0.35);
  osc1.frequency.linearRampToValueAtTime(700, t + duration);

  // Formant filter for vocal/animal quality
  const formant1 = actx.createBiquadFilter();
  formant1.type = 'bandpass';
  formant1.frequency.value = 1200;
  formant1.Q.value = 4;

  // Amplitude tremolo (fast volume oscillation for screaming quality)
  const tremolo = actx.createOscillator();
  tremolo.frequency.value = 25;
  const tremoloGain = actx.createGain();
  tremoloGain.gain.value = 0.15;
  tremolo.connect(tremoloGain);

  const gain1 = actx.createGain();
  gain1.gain.setValueAtTime(0, t);
  gain1.gain.linearRampToValueAtTime(0.35, t + 0.02);
  gain1.gain.setValueAtTime(0.35, t + 0.15);
  gain1.gain.linearRampToValueAtTime(0.2, t + 0.35);
  gain1.gain.linearRampToValueAtTime(0, t + duration);
  tremoloGain.connect(gain1.gain);

  osc1.connect(formant1);
  formant1.connect(gain1);
  gain1.connect(actx.destination);
  osc1.start(t);
  osc1.stop(t + duration);
  tremolo.start(t);
  tremolo.stop(t + duration);

  // Layer 2: Higher harmonic for piercing screech
  const osc2 = actx.createOscillator();
  osc2.type = 'square';
  osc2.frequency.setValueAtTime(1200, t);
  osc2.frequency.linearRampToValueAtTime(2400, t + 0.06);
  osc2.frequency.linearRampToValueAtTime(1800, t + 0.2);
  osc2.frequency.linearRampToValueAtTime(2800, t + 0.4);
  osc2.frequency.linearRampToValueAtTime(1000, t + duration);

  const formant2 = actx.createBiquadFilter();
  formant2.type = 'bandpass';
  formant2.frequency.value = 2200;
  formant2.Q.value = 3;

  const gain2 = actx.createGain();
  gain2.gain.setValueAtTime(0, t);
  gain2.gain.linearRampToValueAtTime(0.18, t + 0.03);
  gain2.gain.linearRampToValueAtTime(0.12, t + 0.3);
  gain2.gain.linearRampToValueAtTime(0, t + duration);

  osc2.connect(formant2);
  formant2.connect(gain2);
  gain2.connect(actx.destination);
  osc2.start(t);
  osc2.stop(t + duration);

  // Layer 3: Sub-harmonic growl underneath
  const osc3 = actx.createOscillator();
  osc3.type = 'sawtooth';
  osc3.frequency.setValueAtTime(300, t);
  osc3.frequency.linearRampToValueAtTime(500, t + 0.1);
  osc3.frequency.linearRampToValueAtTime(350, t + duration);
  const gain3 = actx.createGain();
  gain3.gain.setValueAtTime(0.1, t);
  gain3.gain.linearRampToValueAtTime(0.05, t + 0.3);
  gain3.gain.linearRampToValueAtTime(0, t + duration);
  osc3.connect(gain3);
  gain3.connect(actx.destination);
  osc3.start(t);
  osc3.stop(t + duration);

  // Noise burst for breathy texture
  const bufferSize = actx.sampleRate * 0.4;
  const buffer = actx.createBuffer(1, bufferSize, actx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) {
    data[i] = (Math.random() * 2 - 1) * 0.3;
  }
  const noise = actx.createBufferSource();
  noise.buffer = buffer;
  const hpFilter = actx.createBiquadFilter();
  hpFilter.type = 'highpass';
  hpFilter.frequency.value = 2500;
  const noiseGain = actx.createGain();
  noiseGain.gain.setValueAtTime(0.1, t);
  noiseGain.gain.linearRampToValueAtTime(0.05, t + 0.2);
  noiseGain.gain.linearRampToValueAtTime(0, t + 0.4);
  noise.connect(hpFilter);
  hpFilter.connect(noiseGain);
  noiseGain.connect(actx.destination);
  noise.start(t);
  noise.stop(t + 0.4);
  } catch (e) {}
}

function playFartSound() {
  try {
    const ctx = getAudioContext();
    const t = ctx.currentTime;

    // Low rumbling base - the main "brrrrp"
    const osc1 = ctx.createOscillator();
    const gain1 = ctx.createGain();
    osc1.type = 'sawtooth';
    osc1.frequency.setValueAtTime(80, t);
    osc1.frequency.linearRampToValueAtTime(60, t + 0.1);
    osc1.frequency.linearRampToValueAtTime(100, t + 0.2);
    osc1.frequency.linearRampToValueAtTime(40, t + 0.4);
    // Vibrato for the "flapping" quality
    const vibrato = ctx.createOscillator();
    vibrato.frequency.value = 25; // fast wobble
    const vibGain = ctx.createGain();
    vibGain.gain.value = 30;
    vibrato.connect(vibGain);
    vibGain.connect(osc1.frequency);

    gain1.gain.setValueAtTime(0.3, t);
    gain1.gain.linearRampToValueAtTime(0.4, t + 0.08);
    gain1.gain.linearRampToValueAtTime(0.2, t + 0.25);
    gain1.gain.linearRampToValueAtTime(0, t + 0.45);

    // Low pass filter for muffled quality
    const lpf = ctx.createBiquadFilter();
    lpf.type = 'lowpass';
    lpf.frequency.value = 400;

    osc1.connect(lpf);
    lpf.connect(gain1);
    gain1.connect(ctx.destination);
    vibrato.start(t);
    osc1.start(t);
    osc1.stop(t + 0.45);
    vibrato.stop(t + 0.45);

    // Noise burst for the "pffft" texture
    const bufSize = ctx.sampleRate * 0.3;
    const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) {
      data[i] = (Math.random() * 2 - 1) * (1 - i/bufSize) * 0.5;
    }
    const noise = ctx.createBufferSource();
    noise.buffer = buf;
    const nGain = ctx.createGain();
    nGain.gain.setValueAtTime(0.15, t);
    nGain.gain.linearRampToValueAtTime(0, t + 0.3);
    const nFilter = ctx.createBiquadFilter();
    nFilter.type = 'lowpass';
    nFilter.frequency.value = 300;
    noise.connect(nFilter);
    nFilter.connect(nGain);
    nGain.connect(ctx.destination);
    noise.start(t);
    noise.stop(t + 0.3);

    // High pitched squeak at the end (like a real fart ending)
    const squeak = ctx.createOscillator();
    const squeakGain = ctx.createGain();
    squeak.type = 'sine';
    squeak.frequency.setValueAtTime(600, t + 0.3);
    squeak.frequency.linearRampToValueAtTime(900, t + 0.38);
    squeakGain.gain.setValueAtTime(0, t + 0.3);
    squeakGain.gain.linearRampToValueAtTime(0.08, t + 0.33);
    squeakGain.gain.linearRampToValueAtTime(0, t + 0.4);
    squeak.connect(squeakGain);

function playThunderRumble() {
  // Low rumbling sound - distant thunder
  try {
    const actx = getAudioContext();
    const now = actx.currentTime;
    // Brown noise burst for rumble
    const bufferSize = actx.sampleRate * 2;
    const buffer = actx.createBuffer(1, bufferSize, actx.sampleRate);
    const data = buffer.getChannelData(0);
    let lastOut = 0;
    for (let i = 0; i < bufferSize; i++) {
      const white = Math.random() * 2 - 1;
      lastOut = (lastOut + (0.02 * white)) / 1.02;
      data[i] = lastOut * 3.5;
    }
    const noise = actx.createBufferSource();
    noise.buffer = buffer;
    // Low-pass filter for deep rumble
    const filter = actx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(80, now);
    filter.frequency.exponentialRampToValueAtTime(40, now + 2);
    const gain = actx.createGain();
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(0.4, now + 0.3);
    gain.gain.linearRampToValueAtTime(0.2, now + 1.0);
    gain.gain.linearRampToValueAtTime(0, now + 2.0);
    noise.connect(filter);
    filter.connect(gain);
    gain.connect(actx.destination);
    noise.start(now);
    noise.stop(now + 2.0);
  } catch(e) {}
}

// --- Background Music System ---
let musicPlaying = false;
let musicNodes = null;
let beatCount = 0;
let beatTimer = 0;
const BPM = 140;
const BEAT_DURATION = 60 / BPM;
let musicLoopTimeout = null;

function playOink(delay) {
  try {
    const actx = getAudioContext();
    const t = actx.currentTime + (delay || 0);
    const duration = 0.25;

    // Main vocal - sawtooth for richness
    const voice = actx.createOscillator();
    voice.type = 'sawtooth';
    voice.frequency.setValueAtTime(180, t);
    voice.frequency.linearRampToValueAtTime(280, t + 0.06);
    voice.frequency.linearRampToValueAtTime(200, t + 0.15);
    voice.frequency.linearRampToValueAtTime(150, t + duration);

    // Vibrato for organic feel
    const vibrato = actx.createOscillator();
    vibrato.frequency.value = 6;
    const vibratoGain = actx.createGain();
    vibratoGain.gain.value = 15;
    vibrato.connect(vibratoGain);
    vibratoGain.connect(voice.frequency);

    // Nasal resonance filter
    const nasal = actx.createBiquadFilter();
    nasal.type = 'bandpass';
    nasal.frequency.value = 1000;
    nasal.Q.value = 3;

    // Envelope
    const env = actx.createGain();
    env.gain.setValueAtTime(0, t);
    env.gain.linearRampToValueAtTime(0.25, t + 0.02);
    env.gain.setValueAtTime(0.25, t + 0.08);
    env.gain.linearRampToValueAtTime(0, t + duration);

    // Oink master gain (louder than music)
    const oinkMaster = actx.createGain();
    oinkMaster.gain.value = 0.5;

    voice.connect(nasal);
    nasal.connect(env);
    env.connect(oinkMaster);
    oinkMaster.connect(actx.destination);
    vibrato.start(t);
    voice.start(t);
    voice.stop(t + duration);
    vibrato.stop(t + duration);
  } catch (e) {}
}

function playDoubleOink() {
  playOink(0);
  playOink(0.18);
}

function startMusic() {
  if (musicPlaying) return;
  // Ensure audio context is active
  try {
    const ctx = getAudioContext();
    if (ctx.state === 'suspended') ctx.resume();
  } catch(e) {}
  musicPlaying = true;
  beatCount = 0;
  beatTimer = 0;
  scheduleMusicalBar();
}

function stopMusic() {
  musicPlaying = false;
  if (musicLoopTimeout) {
    clearTimeout(musicLoopTimeout);
    musicLoopTimeout = null;
  }
  if (musicNodes) {
    musicNodes.forEach(n => { try { n.stop(); } catch(e) {} });
    musicNodes = null;
  }
}

function scheduleMusicalBar() {
  if (!musicPlaying) return;
  try {
    const actx = getAudioContext();
    const now = actx.currentTime;
    const nodes = [];
    const masterGain = actx.createGain();
    masterGain.gain.value = 0.12;
    masterGain.connect(actx.destination);

    const beatLen = BEAT_DURATION;
    const barLen = beatLen * 4;
    const totalBars = 4;
    const totalDuration = barLen * totalBars;

    // --- Bass line (square wave, low) ---
    // 4 bars: C2-C2-Eb2-G2 | Ab1-Ab1-G1-F1 | C2-C2-Eb2-G2 | Ab1-Ab1-G1-F1
    const bassNotes = [
      65.41, 65.41, 77.78, 98.00,
      51.91, 51.91, 49.00, 43.65,
      65.41, 65.41, 77.78, 98.00,
      51.91, 51.91, 49.00, 43.65
    ];
    const bassOsc = actx.createOscillator();
    bassOsc.type = 'square';
    const bassGain = actx.createGain();
    bassGain.gain.value = 0.35;
    bassOsc.connect(bassGain);
    bassGain.connect(masterGain);
    for (let i = 0; i < bassNotes.length; i++) {
      const t = now + i * beatLen;
      bassOsc.frequency.setValueAtTime(bassNotes[i], t);
    }
    bassOsc.start(now);
    bassOsc.stop(now + totalDuration);
    nodes.push(bassOsc);

    // --- Melody (triangle wave, higher octave) ---
    // 8th notes = beatLen/2, 32 notes total for 4 bars
    const melodyNotes = [
      // Bar 1: C4-Eb4-G4-C5 ascending playful
      261.6, 311.1, 392.0, 523.3, 392.0, 311.1, 261.6, 311.1,
      // Bar 2: Bb3-G3-Eb4-C4
      233.1, 196.0, 311.1, 261.6, 311.1, 392.0, 523.3, 392.0,
      // Bar 3: Ab3-Bb3-C4-Eb4
      207.7, 233.1, 261.6, 311.1, 392.0, 523.3, 392.0, 311.1,
      // Bar 4: G3-Eb3-C4-G3 resolution
      196.0, 155.6, 261.6, 196.0, 261.6, 311.1, 261.6, 196.0
    ];
    const melOsc = actx.createOscillator();
    melOsc.type = 'triangle';
    const melGain = actx.createGain();
    melGain.gain.value = 0.25;
    melOsc.connect(melGain);
    melGain.connect(masterGain);
    const eighthNote = beatLen / 2;
    for (let i = 0; i < melodyNotes.length; i++) {
      const t = now + i * eighthNote;
      melOsc.frequency.setValueAtTime(melodyNotes[i], t);
      // Add slight volume pulse per note for bounce
      melGain.gain.setValueAtTime(0.25, t);
      melGain.gain.linearRampToValueAtTime(0.15, t + eighthNote * 0.8);
    }
    melOsc.start(now);
    melOsc.stop(now + totalDuration);
    nodes.push(melOsc);

    // --- Percussion ---
    // Kick on beats 1,3 - low noise burst
    // Snare on beats 2,4 - mid noise burst
    // Hi-hat on every beat - high noise short
    for (let bar = 0; bar < totalBars; bar++) {
      for (let beat = 0; beat < 4; beat++) {
        const t = now + (bar * 4 + beat) * beatLen;

        // Hi-hat (every beat)
        const hhBuf = actx.createBuffer(1, actx.sampleRate * 0.03, actx.sampleRate);
        const hhData = hhBuf.getChannelData(0);
        for (let s = 0; s < hhData.length; s++) hhData[s] = (Math.random() * 2 - 1) * (1 - s / hhData.length);
        const hh = actx.createBufferSource();
        hh.buffer = hhBuf;
        const hhFilter = actx.createBiquadFilter();
        hhFilter.type = 'highpass';
        hhFilter.frequency.value = 7000;
        const hhGain = actx.createGain();
        hhGain.gain.setValueAtTime(0.6, t);
        hhGain.gain.linearRampToValueAtTime(0, t + 0.03);
        hh.connect(hhFilter);
        hhFilter.connect(hhGain);
        hhGain.connect(masterGain);
        hh.start(t);
        hh.stop(t + 0.03);
        nodes.push(hh);

        if (beat === 0 || beat === 2) {
          // Kick
          const kickOsc = actx.createOscillator();
          kickOsc.type = 'sine';
          kickOsc.frequency.setValueAtTime(150, t);
          kickOsc.frequency.linearRampToValueAtTime(40, t + 0.1);
          const kickGain = actx.createGain();
          kickGain.gain.setValueAtTime(0.7, t);
          kickGain.gain.linearRampToValueAtTime(0, t + 0.1);
          kickOsc.connect(kickGain);
          kickGain.connect(masterGain);
          kickOsc.start(t);
          kickOsc.stop(t + 0.1);
          nodes.push(kickOsc);
        }

        if (beat === 1 || beat === 3) {
          // Snare
          const snBuf = actx.createBuffer(1, actx.sampleRate * 0.08, actx.sampleRate);
          const snData = snBuf.getChannelData(0);
          for (let s = 0; s < snData.length; s++) snData[s] = (Math.random() * 2 - 1) * (1 - s / snData.length);
          const sn = actx.createBufferSource();
          sn.buffer = snBuf;
          const snFilter = actx.createBiquadFilter();
          snFilter.type = 'bandpass';
          snFilter.frequency.value = 3000;
          snFilter.Q.value = 1;
          const snGain = actx.createGain();
          snGain.gain.setValueAtTime(0.5, t);
          snGain.gain.linearRampToValueAtTime(0, t + 0.08);
          sn.connect(snFilter);
          snFilter.connect(snGain);
          snGain.connect(masterGain);
          sn.start(t);
          sn.stop(t + 0.08);
          nodes.push(sn);
        }
      }
    }

    // Store nodes so we can stop them
    if (musicNodes) {
      musicNodes.forEach(n => { try { n.stop(); } catch(e) {} });
    }
    musicNodes = nodes;

    // Schedule next bar slightly before current ends
    const scheduleAhead = totalDuration * 1000 - 100;
    musicLoopTimeout = setTimeout(() => {
      if (musicPlaying) scheduleMusicalBar();
    }, scheduleAhead);

  } catch (e) {}
}

// --- Coin Types (drawn as real coins, not emoji) ---
const COIN_TYPES = [
  { type: 'bronze', value: 1, weight: 60, colors: ['#CD7F32', '#A0522D', '#8B4513'], label: '1' },
  { type: 'silver', value: 5, weight: 25, colors: ['#C0C0C0', '#A8A8A8', '#808080'], label: '5' },
  { type: 'gold',   value: 10, weight: 15, colors: ['#FFD700', '#DAA520', '#B8860B'], label: '10' }
];

function drawCoin(x, y, size, coinType, time) {
  const r = size / 2;
  // Shimmer effect
  const shimmer = 0.08 * Math.sin(time * 5 + x * 0.1);

  // Outer ring (darker)
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fillStyle = coinType.colors[2];
  ctx.fill();
  ctx.closePath();

  // Inner face (main color + shimmer)
  ctx.beginPath();
  ctx.arc(x, y, r * 0.85, 0, Math.PI * 2);
  const grad = ctx.createRadialGradient(x - r * 0.2, y - r * 0.2, 0, x, y, r * 0.85);
  grad.addColorStop(0, lightenColor(coinType.colors[0], 0.3 + shimmer));
  grad.addColorStop(0.7, coinType.colors[0]);
  grad.addColorStop(1, coinType.colors[1]);
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.closePath();

  // Shine highlight (top-left)
  ctx.beginPath();
  ctx.arc(x - r * 0.25, y - r * 0.25, r * 0.3, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,' + (0.4 + shimmer) + ')';
  ctx.fill();
  ctx.closePath();

  // Value text
  ctx.font = 'bold ' + (r * 1.1) + 'px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = coinType.colors[2];
  ctx.fillText(coinType.label, x + 1, y + 1); // shadow
  ctx.fillStyle = '#fff';
  ctx.fillText(coinType.label, x, y);
  ctx.textBaseline = 'alphabetic'; // restore default
}

function lightenColor(hex, amount) {
  const num = parseInt(hex.slice(1), 16);
  let r = Math.min(255, ((num >> 16) & 0xFF) + Math.floor(255 * amount));
  let g = Math.min(255, ((num >> 8) & 0xFF) + Math.floor(255 * amount));
  let b = Math.min(255, (num & 0xFF) + Math.floor(255 * amount));
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}

function pickCoinType() {
  if (!game.levelConfig) return COIN_TYPES[0];
  const cfg = game.levelConfig;
  const r = Math.random();
  if (r < cfg.goldChance * 1.5) return COIN_TYPES[2];      // 50% more gold
  if (r < cfg.goldChance * 1.5 + cfg.billChance * 1.3) return COIN_TYPES[1]; // 30% more silver
  return COIN_TYPES[0]; // Less bronze (remainder)
}

function spawnObject() {

  const fallSpeed = cfg ? cfg.fallSpeed : 150;
  const bombChance = cfg ? cfg.bombChance : 0.05;

  if (Math.random() < bombChance) {
    const size = 40;
    objects.push({
      type: 'bomb',
      x: Math.random() * (WIDTH - size) + size / 2,
      y: -size / 2,
      width: size,
      height: size,
      speed: fallSpeed * 1.3,
      emoji: '\u{1F4A3}',
      value: 0
    });
    triggerEnemyIntro('bomb');
    return;
  }

  if (fartCharges < MAX_FARTS && Math.random() < 0.06) {

    objects.push({
      type: 'corn',
      emoji: '\u{1F33D}',

      y: -cornSize / 2,
      width: cornSize,
      height: cornSize,
      speed: fallSpeed * 0.8,
      value: 0
    });

  }

    objects.push({
      type: 'material', materialType: 'bricks',
      emoji: '🧱', x: Math.random() * (WIDTH - 80) + 40,
      y: -30, width: 40, height: 40,
      speed: fallSpeed * 0.85, value: 0
    });

  } else if (matRoll < 0.06) {
    // Log (uncommon, 3%)
    objects.push({
      type: 'material', materialType: 'logs',
      emoji: '🪵', x: Math.random() * (WIDTH - 80) + 40,
      y: -30, width: 42, height: 42,
      speed: fallSpeed * 0.8, value: 0
    });
    return;
  } else if (matRoll < 0.11) {
    // Straw (common, 5%)

      type: 'material', materialType: 'straw',
      emoji: '🌾', x: Math.random() * (WIDTH - 80) + 40,

    });

  }

    objects.push({

      specialType: sp,

function playButcherLatch() {
  try {
    const ctx = getAudioContext();
    const t = ctx.currentTime;
    // Metallic knife sharpening sound
    const noise = ctx.createBufferSource();
    const bufSize = ctx.sampleRate * 0.4;
    const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.sin(i / bufSize * Math.PI);
    }
    noise.buffer = buf;
    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.setValueAtTime(3000, t);
    bp.frequency.linearRampToValueAtTime(1500, t + 0.3);
    bp.Q.value = 8;
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.2, t);
    gain.gain.linearRampToValueAtTime(0, t + 0.4);
    noise.connect(bp);
    bp.connect(gain);
    gain.connect(ctx.destination);
    noise.start(t);
    noise.stop(t + 0.4);

    // Low menacing tone
    const osc = ctx.createOscillator();
    const oGain = ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(120, t);
    osc.frequency.linearRampToValueAtTime(80, t + 0.5);
    oGain.gain.setValueAtTime(0.15, t);
    oGain.gain.linearRampToValueAtTime(0, t + 0.5);
    osc.connect(oGain);
    oGain.connect(ctx.destination);
    osc.start(t);
    osc.stop(t + 0.5);
  } catch(e) {}
}

function playKnifeSound() {
  try {
    const ctx = getAudioContext();
    const t = ctx.currentTime;
    // Quick metallic "shink"
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(2000, t);
    osc.frequency.linearRampToValueAtTime(4000, t + 0.03);
    osc.frequency.linearRampToValueAtTime(1000, t + 0.08);
    gain.gain.setValueAtTime(0.08, t);
    gain.gain.linearRampToValueAtTime(0, t + 0.08);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(t);
    osc.stop(t + 0.08);
  } catch(e) {}
}

// --- Level Management ---
function startLevel() {
  const cfg = getLevelConfig(game.level);
  game.levelConfig = cfg;
  game.levelTimer = cfg.duration;
  game.devilsSpawned = 0;
  game.latchedDevil = null;
  game.lastScore = game.score;

  // Set biome for this level
  currentBiome = getBiomeForLevel(game.level);
  initAmbientParticles();

  // Boss setup
  boss = null;
  bossActive = false;
  bossDefeatedThisLevel = false;
  bossProjectiles = [];
  const bossKey = getBossForLevel(game.level);
  if (bossKey) {
    const bt = BOSS_TYPES[bossKey];
    boss = {
      type: bossKey,
      name: bt.name,
      emoji: bt.emoji,
      hp: bt.hp, maxHp: bt.maxHp,
      x: WIDTH / 2, y: -bt.size,
      width: bt.size, height: bt.size,
      size: bt.size,
      speed: bt.speed,
      attacks: bt.attacks,
      color: bt.color,
      accent: bt.accent || '#FF3333',
      reward: bt.reward,
      state: 'entering', // entering, fighting, dying
      attackTimer: 3,
      currentAttack: null,
      attackAnimTimer: 0,
      dir: 1,
      targetX: WIDTH / 2,
      stunTimer: 0,
      hitFlash: 0,
      phaseTwo: false, // below 50% hp
      deathTimer: 0,
      shakeTimer: 0
    };
    // Boss levels get extra time and a full loadout of farts to encourage shooting
    game.levelTimer += 20;
    wetFartCharges = MAX_WET_FARTS;
    fartCharges = MAX_FARTS;
    // Show large instructions banner for 6 seconds when boss appears
    bossBannerTimer = 6.0;
    bossWetFartRegenTimer = 0;
    bossFartRegenTimer = 0;
  }

  // Power-ups reset
  powerUpDrops = [];
  // Don't clear activePowerUps - let them carry over briefly

  // Calculate devil spawn schedule - start early, come in waves!
  game.devilSchedule = [];
  if (cfg.devilCount > 0) {
    const availableTime = cfg.duration - 3; // start after just 3 seconds
    const interval = availableTime / (cfg.devilCount + 1);
    for (let i = 1; i <= cfg.devilCount; i++) {
      // Add some randomness so devils don't come perfectly evenly
      const jitter = (Math.random() - 0.5) * interval * 0.4;
      const spawnAt = cfg.duration - (3 + interval * i) + jitter;
      game.devilSchedule.push(Math.max(1, spawnAt));
    }
    game.devilSchedule.sort((a, b) => b - a); // sort descending (highest time first)
  }

  // Calculate butcher spawn schedule - butchers appear from level 2+
  game.butcherSchedule = [];
  if (game.level >= 2) {
    const butcherCount = Math.max(0, Math.floor(game.level / 2)); // 1 at level 2-3, 2 at level 4-5, etc.
    if (butcherCount > 0) {
      const availableTime = cfg.duration - 8;
      const interval = availableTime / (butcherCount + 1);
      for (let i = 1; i <= butcherCount; i++) {
        const jitter = (Math.random() - 0.5) * interval * 0.3;
        const spawnAt = cfg.duration - (8 + interval * i) + jitter;
        game.butcherSchedule.push(Math.max(2, spawnAt));
      }
      game.butcherSchedule.sort((a, b) => b - a);
    }
  }

  // Reset fart state
  fartCharges = MAX_FARTS; // refill farts each level
  // Reset per-level power-ups (shield persists)
  scoreMultiplier = 1;
  turboFart = false;
  megaPoop = false;
  fartClouds.length = 0;
  chokingDevils.length = 0;
  fartCooldown = 0;

  // Clear everything
  objects.length = 0;
  ejectedCoins.length = 0;
  particles.length = 0;
  scorePopups.length = 0;
  spawnTimer = 0;
  flashTimer = 0;
  lastShakeKey = null;
  squealTimer = 0;
  successFlashTimer = 0;
  shakeHintTimer = 0;
  shakeVisualOffset = 0;
  shakeVisualTimer = 0;
  screenShake.intensity = 0;
  screenShake.duration = 0;
  lightningBolts.length = 0;
  lightningWarning = null;
  lightningSpawnTimer = 5;
  groundEnemies.length = 0;
  groundEnemySpawnTimer = 3;
  airplanes.length = 0;
  speechBubbles.length = 0;
  poops.length = 0;
  poopCooldown = 0;
  isPooping = false;
  poopAnimTimer = 0;
  wetFartProjectiles.length = 0;
  wetFartInflateTimer = 0;
  // Do NOT reset wetFartCharges - they persist between levels
  vegan = null;
  veganDeathAnim = null;
  veganRespawnTimer = 0;
  // Vegan always spawns from level 2+
  if (game.level >= 2) {
    vegan = {
      x: WIDTH / 2 + (Math.random() - 0.5) * 200,
      y: HEIGHT - 50,
      width: 40, height: 50,
      hp: 5, maxHp: 5,
      dir: 1, speed: 120,
      state: 'patrol',
      blockTimer: 0,
      auraTimer: 0,
      nameTimer: 3.5
    };
    triggerEnemyIntro('vegan');
  }
  // materials persist between levels (NOT reset here)
  piggyDamageTimer = 0;
  scoreBounceFactor = 0;
  houses.length = 0;
  houseSpawnTimer = 8;
  player.inHouse = null;
  player.x = WIDTH / 2;
  player.y = player.groundY;
  player.vy = 0;
  player.grounded = true;
  player.facing = 0;
  player.facingSmooth = 0;

  isPaused = false;
  showHelp = false;
  game.screen = 'playing';
  startMusic();
}

      spawnScorePopup(player.x, player.y - 40, '\u{1F47C} NASTAVAK!', '#00ff88');
      startMusic();
    }
    return;
  }

  // Don't process game keys during name input or shop
  if (game.screen === 'nameInput' || game.screen === 'shop') return;
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' '].includes(e.key)) {
    e.preventDefault();
  }

  // Help overlay - ESC
  if (e.key === 'Escape' && game.screen === 'playing') {
    if (showHelp) {
      showHelp = false;
      isPaused = false;
    } else {
      showHelp = true;
      isPaused = true;
    }
    e.preventDefault();
    return;
  }

  // Pause toggle - P only
  if ((e.key === 'p' || e.key === 'P') && game.screen === 'playing') {
    isPaused = !isPaused;
    e.preventDefault();
    return;
  }

  // Don't process gameplay keys while paused
  if (isPaused) return;

  // Wet Fart - Q (left) / E (right)
  if ((e.key === 'q' || e.key === 'Q' || e.key === 'e' || e.key === 'E') && game.screen === 'playing') {
    e.preventDefault();
    if (wetFartCharges > 0 && wetFartInflateTimer <= 0 && !player.inHouse) {
      wetFartCharges--;
      wetFartPendingDir = (e.key === 'q' || e.key === 'Q') ? -1 : 1;
      // If aiming is active, lock the current aim direction
      if (aimingActive) {
        aimDir = wetFartPendingDir;
      }
      wetFartInflateTimer = 0.6; // inflate for 0.6 seconds before firing
      // Speech bubble - push directly
      if (speechBubbles.length < 3) {
        speechBubbles.push({ x: player.x, y: player.y - 80, text: 'Auu, usrah se! 💦', timer: 2.0, maxTimer: 2.0 });
      }
    }
    return;
  }

  // Aim mode: hold Ctrl to enable, ↑/↓ adjust angle, ←/→ flip aim direction
  if ((e.ctrlKey || e.metaKey) && game.screen === 'playing' && !player.inHouse) {
    if (e.key === 'ArrowUp' || e.key === 'ArrowDown' || e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
      aimingActive = true;
      if (e.key === 'ArrowUp') {
        aimAngle = Math.min(AIM_MAX, aimAngle + 0.12);
      } else if (e.key === 'ArrowDown') {
        aimAngle = Math.max(AIM_MIN, aimAngle - 0.12);
      } else if (e.key === 'ArrowLeft') {
        aimDir = -1;
      } else if (e.key === 'ArrowRight') {
        aimDir = 1;
      }
      e.preventDefault();
      return;
    }
  }

  keys[e.key] = true;

  // Jump (only when grounded and no latched devil)
  if (e.key === 'ArrowUp' && game.screen === 'playing' && player.grounded && !game.latchedDevil) {
    player.vy = player.jumpForce;
    player.grounded = false;
  }

  // Shake detection when devil is latched
  if (game.latchedDevil && game.screen === 'playing') {
    if (e.key === 'ArrowUp' && lastShakeKey !== 'up') {
      game.latchedDevil.shakeProgress++;
      lastShakeKey = 'up';
      shakeVisualOffset = -5;
      shakeVisualTimer = 0.08;
      playShakeSound();
    } else if (e.key === 'ArrowDown' && lastShakeKey !== 'down') {
      game.latchedDevil.shakeProgress++;
      lastShakeKey = 'down';
      shakeVisualOffset = 5;
      shakeVisualTimer = 0.08;
      playShakeSound();
    }
  }

  // SUMMON HOUSE from collected materials with K
  if ((e.key === 'k' || e.key === 'K') && game.screen === 'playing' && houses.length === 0) {
    // Pick best house player can afford from materials
    if (materials.bricks >= 10) {
      buildHouse('brick');
    } else if (materials.logs >= 7) {
      buildHouse('sticks');
    } else if (materials.straw >= 5) {
      buildHouse('straw');
    } else {
      spawnScorePopup(player.x, player.y - 40, 'Nema dovoljno materijala!', '#ff4444');
    }
    e.preventDefault();
    return;
  }

  // Fart mechanic - SPACE during gameplay (not while in house)
  if (e.key === ' ' && game.screen === 'playing') {
    if (fartCharges > 0 && fartCooldown <= 0 && !player.inHouse) {
      fartCharges--;
      fartCooldown = 0.5; // half second cooldown
      // Spawn fart cloud at piggy's butt (behind/below the piggy)
      const fartScale = turboFart ? 1.5 : 1.0;
      fartClouds.push({
        x: player.x,
        y: player.y + 15,  // starts at butt level
        width: 50 * fartScale,
        height: 40 * fartScale,
        vy: -250,           // flies upward fast
        life: 2.0,          // lasts 2 seconds
        opacity: 0.8,
        scale: 1.0,
        wobble: 0            // for wobbly movement
      });
      playFartSound();
      // Spawn green stink particles at butt
      spawnParticles(player.x, player.y + 20, '\u{1F4A8}', 5, 80);
      spawnParticles(player.x, player.y + 15, '\u{1F49A}', 3, 60);
      // Small screen shake for comedy
      triggerScreenShake(3, 0.15);
    }
    e.preventDefault();
    return; // don't fall through to title/gameover handlers
  }

  if (e.key === ' ') {
    if (game.screen === 'intro') {
      // First key press: just unlock audio and start music
      if (!audioUnlocked) {
        unlockAudio();
        forceRestartIntroMusic();
        return;
      }
      if (introScene >= 5) {
        stopIntroMusic();
        game.screen = 'title';
        introScene = 0;
      } else {
        introScene++;
        introTimer = 0;
        introTextOpacity = 0;
        introFadeOut = 0;
        forceRestartIntroMusic();
      }
      return;
    }
    if (game.screen === 'title') {
      playOink();
      game.score = 0;
      game.level = 1;
      game.cracks = 0;
      game.maxCracks = 3;
      materials = { straw: 0, logs: 0, bricks: 0 };
      playerBTC = 0;
      scoreMultiplier = 1; hasShield = false; turboFart = false; megaPoop = false;
      wetFartCharges = 5; wetFartProjectiles.length = 0; wetFartInflateTimer = 0;
      startLevel();
    } else if (game.screen === 'gameOver') {
      game.score = 0;
      game.level = 1;
      game.screen = 'title';
      Object.keys(introducedEnemies).forEach(k => delete introducedEnemies[k]);
      enemyIntroActive = null;
    } else if (game.screen === 'levelComplete') {
      game.screen = 'shop';
    } else if (game.screen === 'victory') {
      stopVictoryMusic();
      game.screen = 'title';
    }
  }
});

// Setup touch handlers for each button
document.querySelectorAll('.touch-btn').forEach(btn => {
  const keyName = btn.dataset.key;

  btn.addEventListener('touchstart', (e) => {
    e.preventDefault();
    unlockAudio();
    // Track this touch
    for (const touch of e.changedTouches) {
      activeTouches[touch.identifier] = keyName;
    }
    btn.classList.add('active');
    simulateKeyDown(keyName);
  }, { passive: false });

  btn.addEventListener('touchend', (e) => {
    e.preventDefault();
    for (const touch of e.changedTouches) {
      delete activeTouches[touch.identifier];
    }
    // Only release key if no other touch is holding this button
    const stillHeld = Object.values(activeTouches).includes(keyName);
    if (!stillHeld) {
      btn.classList.remove('active');
      simulateKeyUp(keyName);
    }
  }, { passive: false });

  btn.addEventListener('touchcancel', (e) => {
    e.preventDefault();
    for (const touch of e.changedTouches) {
      delete activeTouches[touch.identifier];
    }
    btn.classList.remove('active');
    simulateKeyUp(keyName);
  }, { passive: false });
});

// --- Mobile Touch Zones (canvas-based, gamepad-style layout) ---
const MOBILE_SCALE = isMobile ? 1.4 : 1.0;

// Layout:
//   Left side:          Right side:
//    [◀ LEVO]            [💩 SERI]
//    [▲ SKOK]            [▶ DESNO]
//                        [💨 PRDNI]
// SKOK below LEVO, GOVNO above DESNO, PRDEŽ below DESNO

const BTN_R = 18;
const PAD = 10;
const GAP = 8;  // gap between stacked buttons

// LEVO / DESNO - same width, centered vertically
const DIR_W = 140;
const DIR_H = 160;
const DIR_Y = Math.floor((HEIGHT - DIR_H) / 2);

// SKOK - below LEVO, same width
const JUMP_H = 100;
const JUMP_Y = DIR_Y + DIR_H + GAP;

// SERI (poop) - above DESNO, same width as DESNO
const POOP_H = 100;
const POOP_Y = DIR_Y - GAP - POOP_H;

// PRDNI (fart) - below DESNO, same width as DESNO
const FART_H = 100;
const FART_Y = DIR_Y + DIR_H + GAP;

const mobileZones = [
  // LEVO
  { id: 'left',  key: 'ArrowLeft',  icon: '\u25C0', label: 'LEVO',
    color: 'rgba(100,150,255,',
    x: PAD, y: DIR_Y, w: DIR_W, h: DIR_H },
  // SKOK - below LEVO
  { id: 'jump',  key: 'ArrowUp',    icon: '\u25B2\u25BC', label: 'SKOK',
    color: 'rgba(255,220,50,',
    x: PAD, y: JUMP_Y, w: DIR_W, h: JUMP_H },
  // SERI - above DESNO
  { id: 'poop',  key: 'Shift',       icon: '\uD83D\uDCA9', label: 'SERI',
    color: 'rgba(136,102,0,',
    x: WIDTH - PAD - DIR_W, y: POOP_Y, w: DIR_W, h: POOP_H },
  // DESNO
  { id: 'right', key: 'ArrowRight', icon: '\u25B6', label: 'DESNO',
    color: 'rgba(100,150,255,',
    x: WIDTH - PAD - DIR_W, y: DIR_Y, w: DIR_W, h: DIR_H },
  // PRDNI - below DESNO
  { id: 'fart',  key: ' ',          icon: '\uD83D\uDCA8', label: 'PRDNI',
    color: 'rgba(100,200,50,',
    x: WIDTH - PAD - DIR_W, y: FART_Y, w: DIR_W, h: FART_H }
