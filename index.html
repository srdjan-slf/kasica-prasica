const WIDTH = 800;
const HEIGHT = 600;
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
canvas.width = WIDTH;
canvas.height = HEIGHT;

function resizeCanvas() {
  const scaleX = window.innerWidth / WIDTH;
  const scaleY = window.innerHeight / HEIGHT;
  const scale = Math.min(scaleX, scaleY);
  canvas.style.width = (WIDTH * scale) + 'px';
  canvas.style.height = (HEIGHT * scale) + 'px';
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// --- Level Configuration (with difficulty tuning) ---
function getLevelConfig(level) {
  // HARD MODE: tons of devils, fast bombs, chaos!
  let spawnRate, fallSpeed, devilCount, bombChance, billChance, goldChance, duration;

  if (level === 1) {
    duration = 30;
    fallSpeed = 220;
    spawnRate = 0.5;
    devilCount = 5;
    bombChance = 0.12;
    billChance = 0.10;
    goldChance = 0.03;
  } else if (level === 2) {
    duration = 35;
    fallSpeed = 270;
    spawnRate = 0.4;
    devilCount = 8;
    bombChance = 0.18;
    billChance = 0.15;
    goldChance = 0.05;
  } else if (level === 3) {
    duration = 35;
    fallSpeed = 320;
    spawnRate = 0.35;
    devilCount = 12;
    bombChance = 0.22;
    billChance = 0.20;
    goldChance = 0.07;
  } else if (level === 4) {
    duration = 40;
    fallSpeed = 370;
    spawnRate = 0.28;
    devilCount = 16;
    bombChance = 0.28;
    billChance = 0.20;
    goldChance = 0.08;
  } else if (level === 5) {
    duration = 40;
    fallSpeed = 420;
    spawnRate = 0.22;
    devilCount = 20;
    bombChance = 0.32;
    billChance = 0.25;
    goldChance = 0.10;
  } else if (level === 6) {
    duration = 45;
    fallSpeed = 470;
    spawnRate = 0.18;
    devilCount = 25;
    bombChance = 0.35;
    billChance = 0.25;
    goldChance = 0.10;
  } else if (level === 7) {
    duration = 45;
    fallSpeed = 520;
    spawnRate = 0.15;
    devilCount = 30;
    bombChance = 0.38;
    billChance = 0.25;
    goldChance = 0.12;
  } else {
    // Level 8+: ABSOLUTE CHAOS
    duration = 40 + level * 3;
    fallSpeed = 480 + level * 35;
    spawnRate = Math.max(0.10, 0.15 - (level - 7) * 0.01);
    devilCount = 25 + level * 3;
    bombChance = Math.min(0.50, 0.35 + (level - 7) * 0.03);
    billChance = 0.25;
    goldChance = 0.12;
  }

  return { duration, fallSpeed, spawnRate, devilCount, bombChance, billChance, goldChance };
}

// --- Particle System ---
const particles = [];
const MAX_PARTICLES = 100;

function spawnParticles(x, y, emoji, count, spread) {
  for (let i = 0; i < count; i++) {
    if (particles.length >= MAX_PARTICLES) break;
    particles.push({
      x, y,
      emoji: emoji,
      size: 12 + Math.random() * 8,
      vx: (Math.random() - 0.5) * (spread || 200),
      vy: -Math.random() * 250 - 50,
      gravity: 400,
      life: 1.0,
      decay: 0.8 + Math.random() * 0.5
    });
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt;
    p.vy += p.gravity * dt;
    p.y += p.vy * dt;
    p.life -= p.decay * dt;
    if (p.life <= 0) {
      particles.splice(i, 1);
    }
  }
}

function drawParticles() {
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.font = p.size + 'px sans-serif';
    ctx.fillText(p.emoji, p.x, p.y);
  }
  ctx.globalAlpha = 1.0;
}

// --- Screen Shake ---
let screenShake = { intensity: 0, duration: 0 };
function triggerScreenShake(intensity, duration) {
  screenShake.intensity = intensity;
  screenShake.duration = duration;
}

function updateScreenShake(dt) {
  if (screenShake.duration > 0) {
    screenShake.duration -= dt;
    if (screenShake.duration <= 0) {
      screenShake.intensity = 0;
      screenShake.duration = 0;
    }
  }
}

function applyScreenShake() {
  if (screenShake.intensity > 0 && screenShake.duration > 0) {
    const offsetX = (Math.random() - 0.5) * 2 * screenShake.intensity;
    const offsetY = (Math.random() - 0.5) * 2 * screenShake.intensity;
    ctx.translate(offsetX, offsetY);
    return true;
  }
  return false;
}

// --- Score Pop-ups ---
const scorePopups = [];

function spawnScorePopup(x, y, text, color) {
  scorePopups.push({
    x, y,
    text: text,
    color: color,
    life: 1.0,
    vy: -80
  });
}

function updateScorePopups(dt) {
  for (let i = scorePopups.length - 1; i >= 0; i--) {
    const p = scorePopups[i];
    p.y += p.vy * dt;
    p.life -= 0.8 * dt;
    if (p.life <= 0) {
      scorePopups.splice(i, 1);
    }
  }
}

function drawScorePopups() {
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (const p of scorePopups) {
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.font = 'bold 22px sans-serif';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 3;
    ctx.strokeText(p.text, p.x, p.y);
    ctx.fillStyle = p.color;
    ctx.fillText(p.text, p.x, p.y);
  }
  ctx.globalAlpha = 1.0;
  ctx.lineWidth = 1;
}

// --- Background Clouds ---
const clouds = [

  { x: 600, y: 40, speed: 10, size: 32 },

function updateClouds(dt) {
  for (const c of clouds) {
    c.x += c.speed * dt;
    if (c.x > WIDTH + 50) c.x = -50;
  }
}

// --- Piggy Visual State ---
let piggyBobTimer = 0;

// --- HUD bounce ---
let scoreBounceFactor = 0;

// --- Title screen background coins ---
const titleCoins = [];
let titleCoinTimer = 0;

// --- Audio ---
let audioCtx = null;
let audioUnlocked = false;
function getAudioContext() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
// Unlock audio on ANY user interaction (click, touch, key)
function unlockAudio() {
  if (audioUnlocked) return;
  const ctx = getAudioContext();
  if (ctx.state === 'suspended') ctx.resume();
  // Play a silent buffer to fully unlock
  const buf = ctx.createBuffer(1, 1, 22050);
  const src = ctx.createBufferSource();
  src.buffer = buf;
  src.connect(ctx.destination);
  src.start(0);
  audioUnlocked = true;
}
document.addEventListener('click', unlockAudio);
document.addEventListener('touchstart', unlockAudio);
document.addEventListener('keydown', unlockAudio, { once: false });

// --- Intro Scene Music ---
function stopIntroMusic() {
  currentIntroMusic = -1;
  if (introMusicTimeout) { clearTimeout(introMusicTimeout); introMusicTimeout = null; }
  introMusicNodes.forEach(n => { try { n.stop(); } catch(e) {} });
  introMusicNodes = [];
}

function scheduleIntroLoop(sceneIndex, duration) {
  introMusicTimeout = setTimeout(() => {
    if (currentIntroMusic === sceneIndex) {
      introMusicNodes.forEach(n => { try { n.stop(); } catch(e) {} });
      introMusicNodes = [];
      currentIntroMusic = -1;
      playIntroMusic(sceneIndex);
    }
  }, duration * 1000 - 50);
}

function playHappyFarmTheme(actx, now, nodes, master) {
  master.gain.value = 0.08;
  const duration = 8;
  const beatLen = 0.5;

  // Sine pad: soft C major chord (C4+E4+G4)
  [261.6, 329.6, 392.0].forEach(freq => {
    const pad = actx.createOscillator();
    pad.type = 'sine';
    pad.frequency.value = freq;
    const padGain = actx.createGain();
    padGain.gain.value = 0.15;
    pad.connect(padGain);
    padGain.connect(master);
    pad.start(now);
    pad.stop(now + duration);
    nodes.push(pad);
  });

  // Triangle wave melody: bouncy C major arpeggio
  const melodyNotes = [523.3, 659.3, 784.0, 1046.5, 784.0, 659.3, 523.3, 659.3,
                       784.0, 1046.5, 784.0, 659.3, 523.3, 784.0, 1046.5, 784.0];
  const melOsc = actx.createOscillator();
  melOsc.type = 'triangle';
  const melGain = actx.createGain();
  melGain.gain.value = 0.25;
  melOsc.connect(melGain);
  melGain.connect(master);
  for (let i = 0; i < melodyNotes.length; i++) {
    const t = now + i * beatLen;
    melOsc.frequency.setValueAtTime(melodyNotes[i], t);
    melGain.gain.setValueAtTime(0.25, t);
    melGain.gain.linearRampToValueAtTime(0.12, t + beatLen * 0.8);
  }
  melOsc.start(now);
  melOsc.stop(now + duration);
  nodes.push(melOsc);

  // Bird chirps
  for (let i = 0; i < 8; i++) {
    const chirpTime = now + 0.5 + i * 0.9 + Math.sin(i * 3.7) * 0.3;
    const chirpFreq = 2500 + Math.sin(i * 2.1) * 800;
    const chirp = actx.createOscillator();
    chirp.type = 'sine';
    chirp.frequency.setValueAtTime(chirpFreq, chirpTime);
    chirp.frequency.linearRampToValueAtTime(chirpFreq * 1.3, chirpTime + 0.04);
    chirp.frequency.linearRampToValueAtTime(chirpFreq * 0.9, chirpTime + 0.08);
    const chirpGain = actx.createGain();
    chirpGain.gain.setValueAtTime(0, chirpTime);
    chirpGain.gain.linearRampToValueAtTime(0.15, chirpTime + 0.01);
    chirpGain.gain.linearRampToValueAtTime(0, chirpTime + 0.1);
    chirp.connect(chirpGain);
    chirpGain.connect(master);
    chirp.start(chirpTime);
    chirp.stop(chirpTime + 0.12);
    nodes.push(chirp);
  }

  scheduleIntroLoop(0, duration);
}

function playDarkTheme(actx, now, nodes, master) {
  master.gain.value = 0.07;
  const duration = 8;
  const beatLen = 1.0;

  // Square wave low drone: alternating C2 and Db2
  const drone = actx.createOscillator();
  drone.type = 'square';
  const droneGain = actx.createGain();
  droneGain.gain.value = 0.3;
  drone.connect(droneGain);
  droneGain.connect(master);
  for (let i = 0; i < 8; i++) {
    drone.frequency.setValueAtTime(i % 2 === 0 ? 65.41 : 69.30, now + i * beatLen);
  }
  drone.start(now);
  drone.stop(now + duration);
  nodes.push(drone);

  // Sawtooth slow melody: Eb3-Db3-C3-B2 descending chromatic
  const darkMelody = [155.6, 138.6, 130.8, 123.5, 155.6, 138.6, 130.8, 123.5];
  const melOsc = actx.createOscillator();
  melOsc.type = 'sawtooth';
  const melGain = actx.createGain();
  melGain.gain.value = 0.2;
  melOsc.connect(melGain);
  melGain.connect(master);
  for (let i = 0; i < darkMelody.length; i++) {
    melOsc.frequency.setValueAtTime(darkMelody[i], now + i * beatLen);
  }
  melOsc.start(now);
  melOsc.stop(now + duration);
  nodes.push(melOsc);

  // Low rumble noise bursts
  for (let i = 0; i < 4; i++) {
    const rumbleTime = now + i * 2 + 0.5;
    const bufSize = actx.sampleRate * 0.5;
    const buf = actx.createBuffer(1, bufSize, actx.sampleRate);
    const data = buf.getChannelData(0);
    for (let s = 0; s < bufSize; s++) data[s] = (Math.random() * 2 - 1);
    const noise = actx.createBufferSource();
    noise.buffer = buf;
    const lpf = actx.createBiquadFilter();
    lpf.type = 'lowpass';
    lpf.frequency.value = 200;
    const nGain = actx.createGain();
    nGain.gain.setValueAtTime(0, rumbleTime);
    nGain.gain.linearRampToValueAtTime(0.3, rumbleTime + 0.1);
    nGain.gain.linearRampToValueAtTime(0, rumbleTime + 0.5);
    noise.connect(lpf);
    lpf.connect(nGain);
    nGain.connect(master);
    noise.start(rumbleTime);
    noise.stop(rumbleTime + 0.5);
    nodes.push(noise);
  }

  // Heartbeat: two quick low thumps every 2 seconds
  for (let i = 0; i < 4; i++) {
    const hbTime = now + i * 2;
    for (let j = 0; j < 2; j++) {
      const thumpTime = hbTime + j * 0.25;
      const kick = actx.createOscillator();
      kick.type = 'sine';
      kick.frequency.setValueAtTime(80, thumpTime);
      kick.frequency.linearRampToValueAtTime(30, thumpTime + 0.15);
      const kickGain = actx.createGain();
      kickGain.gain.setValueAtTime(0.6, thumpTime);
      kickGain.gain.linearRampToValueAtTime(0, thumpTime + 0.2);
      kick.connect(kickGain);
      kickGain.connect(master);
      kick.start(thumpTime);
      kick.stop(thumpTime + 0.2);
      nodes.push(kick);
    }
  }

  scheduleIntroLoop(1, duration);
}

function playSadTheme(actx, now, nodes, master) {
  master.gain.value = 0.06;
  const duration = 9.6;

  // Sine wave melody: slow descending phrases in C minor
  const sadNotes = [261.6, 311.1, 293.7, 261.6, 233.1, 207.7, 196.0, 261.6];
  const melOsc = actx.createOscillator();
  melOsc.type = 'sine';
  const melGain = actx.createGain();
  melOsc.connect(melGain);
  melGain.connect(master);
  for (let i = 0; i < sadNotes.length; i++) {
    const t = now + i * 1.2;
    melOsc.frequency.setValueAtTime(sadNotes[i], t);
    // Volume envelope: fade in/out per note
    melGain.gain.setValueAtTime(0, t);
    melGain.gain.linearRampToValueAtTime(0.25, t + 0.15);
    melGain.gain.setValueAtTime(0.25, t + 0.6);
    melGain.gain.linearRampToValueAtTime(0, t + 1.1);
  }
  melOsc.start(now);
  melOsc.stop(now + duration);
  nodes.push(melOsc);

  // Triangle wave accompaniment: simple fifths, whole notes
  const accNotes = [[130.8, 196.0], [207.7, 311.1], [130.8, 196.0], [207.7, 311.1]];
  for (let ch = 0; ch < 2; ch++) {
    const accOsc = actx.createOscillator();
    accOsc.type = 'triangle';
    const accGain = actx.createGain();
    accGain.gain.value = 0.15;
    accOsc.connect(accGain);
    accGain.connect(master);
    for (let i = 0; i < accNotes.length; i++) {
      accOsc.frequency.setValueAtTime(accNotes[i][ch], now + i * 2.4);
    }
    accOsc.start(now);
    accOsc.stop(now + duration);
    nodes.push(accOsc);
  }

  // Rain effect: very quiet high-frequency noise
  const rainBufSize = actx.sampleRate * Math.ceil(duration);
  const rainBuf = actx.createBuffer(1, rainBufSize, actx.sampleRate);
  const rainData = rainBuf.getChannelData(0);
  for (let s = 0; s < rainBufSize; s++) rainData[s] = (Math.random() * 2 - 1);
  const rain = actx.createBufferSource();
  rain.buffer = rainBuf;
  const hpf = actx.createBiquadFilter();
  hpf.type = 'highpass';
  hpf.frequency.value = 8000;
  const rainGain = actx.createGain();
  rainGain.gain.value = 0.03;
  rain.connect(hpf);
  hpf.connect(rainGain);
  rainGain.connect(master);
  rain.start(now);
  rain.stop(now + duration);
  nodes.push(rain);

  scheduleIntroLoop(2, duration);
}

function playHopeTheme(actx, now, nodes, master) {
  master.gain.value = 0.08;
  const duration = 8;

  // Triangle melody: minor to major transition
  // First half: C4-Eb4-G4-C5 (minor feel), second half: C4-E4-G4-C5 (major!)
  const hopeNotes = [
    261.6, 311.1, 392.0, 523.3,  // C minor arpeggio
    261.6, 329.6, 392.0, 523.3,  // C major arpeggio!
    329.6, 392.0, 523.3, 659.3,  // ascending higher
    392.0, 523.3, 659.3, 784.0   // even higher - rising hope
  ];
  const noteDur = duration / hopeNotes.length;
  const melOsc = actx.createOscillator();
  melOsc.type = 'triangle';
  const melGain = actx.createGain();
  melOsc.connect(melGain);
  melGain.connect(master);
  for (let i = 0; i < hopeNotes.length; i++) {
    const t = now + i * noteDur;
    melOsc.frequency.setValueAtTime(hopeNotes[i], t);
    // Crescendo effect: volume builds over time
    const vol = 0.15 + (i / hopeNotes.length) * 0.15;
    melGain.gain.setValueAtTime(vol, t);
  }
  melOsc.start(now);
  melOsc.stop(now + duration);
  nodes.push(melOsc);

  // Sine pad: builds up, adds notes over time
  const padFreqs = [261.6, 329.6, 392.0];
  padFreqs.forEach((freq, idx) => {
    const pad = actx.createOscillator();
    pad.type = 'sine';
    pad.frequency.value = freq;
    const padGain = actx.createGain();
    // Each note fades in later for building effect
    padGain.gain.setValueAtTime(0, now);
    padGain.gain.linearRampToValueAtTime(0.12, now + idx * 1.5 + 1.5);
    pad.connect(padGain);
    padGain.connect(master);
    pad.start(now);
    pad.stop(now + duration);
    nodes.push(pad);
  });

  // Light percussion: soft hi-hat every beat, tempo accelerates
  for (let i = 0; i < 16; i++) {
    // Tempo: starts at ~100 BPM (0.6s), accelerates to ~130 BPM (0.46s)
    const beatTime = now + i * (0.6 - i * 0.009);
    if (beatTime >= now + duration) break;
    const hhBuf = actx.createBuffer(1, actx.sampleRate * 0.03, actx.sampleRate);
    const hhData = hhBuf.getChannelData(0);
    for (let s = 0; s < hhData.length; s++) hhData[s] = (Math.random() * 2 - 1) * (1 - s / hhData.length);
    const hh = actx.createBufferSource();
    hh.buffer = hhBuf;
    const hhFilter = actx.createBiquadFilter();
    hhFilter.type = 'highpass';
    hhFilter.frequency.value = 7000;
    const hhGain = actx.createGain();
    hhGain.gain.setValueAtTime(0.3 + i * 0.02, beatTime);
    hhGain.gain.linearRampToValueAtTime(0, beatTime + 0.03);
    hh.connect(hhFilter);
    hhFilter.connect(hhGain);
    hhGain.connect(master);
    hh.start(beatTime);
    hh.stop(beatTime + 0.03);
    nodes.push(hh);
  }

  scheduleIntroLoop(currentIntroMusic, duration);
}

function playTutorialTheme(actx, now, nodes, master) {
  master.gain.value = 0.04;
  const duration = 10;

  // Gentle sine pad in C major, very quiet
  [261.6, 329.6, 392.0].forEach(freq => {
    const pad = actx.createOscillator();
    pad.type = 'sine';
    pad.frequency.value = freq;
    const padGain = actx.createGain();
    padGain.gain.value = 0.15;
    pad.connect(padGain);
    padGain.connect(master);
    pad.start(now);
    pad.stop(now + duration);
    nodes.push(pad);
  });

  scheduleIntroLoop(5, duration);
}

function forceRestartIntroMusic() {
  // Called after user gesture unlocks audio - force music for current scene
  currentIntroMusic = -1; // reset so playIntroMusic won't skip
}

function playIntroMusic(sceneIndex) {
  if (currentIntroMusic === sceneIndex) return;
  stopIntroMusic();
  if (!audioUnlocked) return; // browser hasn't had user gesture yet
  currentIntroMusic = sceneIndex;

  try {
    const actx = getAudioContext();
    const now = actx.currentTime;
    const nodes = [];
    const master = actx.createGain();
    master.connect(actx.destination);

    switch(sceneIndex) {
      case 0: playHappyFarmTheme(actx, now, nodes, master); break;
      case 1: playDarkTheme(actx, now, nodes, master); break;
      case 2: playSadTheme(actx, now, nodes, master); break;
      case 3: case 4: playHopeTheme(actx, now, nodes, master); break;
      case 5: playTutorialTheme(actx, now, nodes, master); break;
    }

    introMusicNodes = nodes;
  } catch(e) {}
}

function playSqueal() {
  try {
  const actx = getAudioContext();
  const t = actx.currentTime;
  const duration = 0.5;

  // Layer 1: Main vocal scream - starts at 600Hz, sweeps to 1500Hz
  const osc1 = actx.createOscillator();
  osc1.type = 'sawtooth';
  osc1.frequency.setValueAtTime(600, t);
  osc1.frequency.linearRampToValueAtTime(1500, t + 0.08);
  osc1.frequency.linearRampToValueAtTime(1200, t + 0.2);
  osc1.frequency.linearRampToValueAtTime(1800, t + 0.35);
  osc1.frequency.linearRampToValueAtTime(700, t + duration);

  // Formant filter for vocal/animal quality
  const formant1 = actx.createBiquadFilter();
  formant1.type = 'bandpass';
  formant1.frequency.value = 1200;
  formant1.Q.value = 4;

  // Amplitude tremolo (fast volume oscillation for screaming quality)
  const tremolo = actx.createOscillator();
  tremolo.frequency.value = 25;
  const tremoloGain = actx.createGain();
  tremoloGain.gain.value = 0.15;
  tremolo.connect(tremoloGain);

  const gain1 = actx.createGain();
  gain1.gain.setValueAtTime(0, t);
  gain1.gain.linearRampToValueAtTime(0.35, t + 0.02);
  gain1.gain.setValueAtTime(0.35, t + 0.15);
  gain1.gain.linearRampToValueAtTime(0.2, t + 0.35);
  gain1.gain.linearRampToValueAtTime(0, t + duration);
  tremoloGain.connect(gain1.gain);

  osc1.connect(formant1);
  formant1.connect(gain1);
  gain1.connect(actx.destination);
  osc1.start(t);
  osc1.stop(t + duration);
  tremolo.start(t);
  tremolo.stop(t + duration);

  // Layer 2: Higher harmonic for piercing screech
  const osc2 = actx.createOscillator();
  osc2.type = 'square';
  osc2.frequency.setValueAtTime(1200, t);
  osc2.frequency.linearRampToValueAtTime(2400, t + 0.06);
  osc2.frequency.linearRampToValueAtTime(1800, t + 0.2);
  osc2.frequency.linearRampToValueAtTime(2800, t + 0.4);
  osc2.frequency.linearRampToValueAtTime(1000, t + duration);

  const formant2 = actx.createBiquadFilter();
  formant2.type = 'bandpass';
  formant2.frequency.value = 2200;
  formant2.Q.value = 3;

  const gain2 = actx.createGain();
  gain2.gain.setValueAtTime(0, t);
  gain2.gain.linearRampToValueAtTime(0.18, t + 0.03);
  gain2.gain.linearRampToValueAtTime(0.12, t + 0.3);
  gain2.gain.linearRampToValueAtTime(0, t + duration);

  osc2.connect(formant2);
  formant2.connect(gain2);
  gain2.connect(actx.destination);
  osc2.start(t);
  osc2.stop(t + duration);

  // Layer 3: Sub-harmonic growl underneath
  const osc3 = actx.createOscillator();
  osc3.type = 'sawtooth';
  osc3.frequency.setValueAtTime(300, t);
  osc3.frequency.linearRampToValueAtTime(500, t + 0.1);
  osc3.frequency.linearRampToValueAtTime(350, t + duration);
  const gain3 = actx.createGain();
  gain3.gain.setValueAtTime(0.1, t);
  gain3.gain.linearRampToValueAtTime(0.05, t + 0.3);
  gain3.gain.linearRampToValueAtTime(0, t + duration);
  osc3.connect(gain3);
  gain3.connect(actx.destination);
  osc3.start(t);
  osc3.stop(t + duration);

  // Noise burst for breathy texture
  const bufferSize = actx.sampleRate * 0.4;
  const buffer = actx.createBuffer(1, bufferSize, actx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) {
    data[i] = (Math.random() * 2 - 1) * 0.3;
  }
  const noise = actx.createBufferSource();
  noise.buffer = buffer;
  const hpFilter = actx.createBiquadFilter();
  hpFilter.type = 'highpass';
  hpFilter.frequency.value = 2500;
  const noiseGain = actx.createGain();
  noiseGain.gain.setValueAtTime(0.1, t);
  noiseGain.gain.linearRampToValueAtTime(0.05, t + 0.2);
  noiseGain.gain.linearRampToValueAtTime(0, t + 0.4);
  noise.connect(hpFilter);
  hpFilter.connect(noiseGain);
  noiseGain.connect(actx.destination);
  noise.start(t);
  noise.stop(t + 0.4);
  } catch (e) {}
}

// --- Background Music System ---
let musicPlaying = false;
let musicNodes = null;
let beatCount = 0;
let beatTimer = 0;
const BPM = 140;
const BEAT_DURATION = 60 / BPM;
let musicLoopTimeout = null;

function playOink(delay) {
  try {
    const actx = getAudioContext();
    const t = actx.currentTime + (delay || 0);
    const duration = 0.25;

    // Main vocal - sawtooth for richness
    const voice = actx.createOscillator();
    voice.type = 'sawtooth';
    voice.frequency.setValueAtTime(180, t);
    voice.frequency.linearRampToValueAtTime(280, t + 0.06);
    voice.frequency.linearRampToValueAtTime(200, t + 0.15);
    voice.frequency.linearRampToValueAtTime(150, t + duration);

    // Vibrato for organic feel
    const vibrato = actx.createOscillator();
    vibrato.frequency.value = 6;
    const vibratoGain = actx.createGain();
    vibratoGain.gain.value = 15;
    vibrato.connect(vibratoGain);
    vibratoGain.connect(voice.frequency);

    // Nasal resonance filter
    const nasal = actx.createBiquadFilter();
    nasal.type = 'bandpass';
    nasal.frequency.value = 1000;
    nasal.Q.value = 3;

    // Envelope
    const env = actx.createGain();
    env.gain.setValueAtTime(0, t);
    env.gain.linearRampToValueAtTime(0.25, t + 0.02);
    env.gain.setValueAtTime(0.25, t + 0.08);
    env.gain.linearRampToValueAtTime(0, t + duration);

    // Oink master gain (louder than music)
    const oinkMaster = actx.createGain();
    oinkMaster.gain.value = 0.5;

    voice.connect(nasal);
    nasal.connect(env);
    env.connect(oinkMaster);
    oinkMaster.connect(actx.destination);
    vibrato.start(t);
    voice.start(t);
    voice.stop(t + duration);
    vibrato.stop(t + duration);
  } catch (e) {}
}

function playDoubleOink() {
  playOink(0);
  playOink(0.18);
}

function startMusic() {
  if (musicPlaying) return;
  musicPlaying = true;
  beatCount = 0;
  beatTimer = 0;
  scheduleMusicalBar();
}

function stopMusic() {
  musicPlaying = false;
  if (musicLoopTimeout) {
    clearTimeout(musicLoopTimeout);
    musicLoopTimeout = null;
  }
  if (musicNodes) {
    musicNodes.forEach(n => { try { n.stop(); } catch(e) {} });
    musicNodes = null;
  }
}

function scheduleMusicalBar() {
  if (!musicPlaying) return;
  try {
    const actx = getAudioContext();
    const now = actx.currentTime;
    const nodes = [];
    const masterGain = actx.createGain();
    masterGain.gain.value = 0.12;
    masterGain.connect(actx.destination);

    const beatLen = BEAT_DURATION;
    const barLen = beatLen * 4;
    const totalBars = 4;
    const totalDuration = barLen * totalBars;

    // --- Bass line (square wave, low) ---
    // 4 bars: C2-C2-Eb2-G2 | Ab1-Ab1-G1-F1 | C2-C2-Eb2-G2 | Ab1-Ab1-G1-F1
    const bassNotes = [
      65.41, 65.41, 77.78, 98.00,
      51.91, 51.91, 49.00, 43.65,
      65.41, 65.41, 77.78, 98.00,
      51.91, 51.91, 49.00, 43.65
    ];
    const bassOsc = actx.createOscillator();
    bassOsc.type = 'square';
    const bassGain = actx.createGain();
    bassGain.gain.value = 0.35;
    bassOsc.connect(bassGain);
    bassGain.connect(masterGain);
    for (let i = 0; i < bassNotes.length; i++) {
      const t = now + i * beatLen;
      bassOsc.frequency.setValueAtTime(bassNotes[i], t);
    }
    bassOsc.start(now);
    bassOsc.stop(now + totalDuration);
    nodes.push(bassOsc);

    // --- Melody (triangle wave, higher octave) ---
    // 8th notes = beatLen/2, 32 notes total for 4 bars
    const melodyNotes = [
      // Bar 1: C4-Eb4-G4-C5 ascending playful
      261.6, 311.1, 392.0, 523.3, 392.0, 311.1, 261.6, 311.1,
      // Bar 2: Bb3-G3-Eb4-C4
      233.1, 196.0, 311.1, 261.6, 311.1, 392.0, 523.3, 392.0,
      // Bar 3: Ab3-Bb3-C4-Eb4
      207.7, 233.1, 261.6, 311.1, 392.0, 523.3, 392.0, 311.1,
      // Bar 4: G3-Eb3-C4-G3 resolution
      196.0, 155.6, 261.6, 196.0, 261.6, 311.1, 261.6, 196.0
    ];
    const melOsc = actx.createOscillator();
    melOsc.type = 'triangle';
    const melGain = actx.createGain();
    melGain.gain.value = 0.25;
    melOsc.connect(melGain);
    melGain.connect(masterGain);
    const eighthNote = beatLen / 2;
    for (let i = 0; i < melodyNotes.length; i++) {
      const t = now + i * eighthNote;
      melOsc.frequency.setValueAtTime(melodyNotes[i], t);
      // Add slight volume pulse per note for bounce
      melGain.gain.setValueAtTime(0.25, t);
      melGain.gain.linearRampToValueAtTime(0.15, t + eighthNote * 0.8);
    }
    melOsc.start(now);
    melOsc.stop(now + totalDuration);
    nodes.push(melOsc);

    // --- Percussion ---
    // Kick on beats 1,3 - low noise burst
    // Snare on beats 2,4 - mid noise burst
    // Hi-hat on every beat - high noise short
    for (let bar = 0; bar < totalBars; bar++) {
      for (let beat = 0; beat < 4; beat++) {
        const t = now + (bar * 4 + beat) * beatLen;

        // Hi-hat (every beat)
        const hhBuf = actx.createBuffer(1, actx.sampleRate * 0.03, actx.sampleRate);
        const hhData = hhBuf.getChannelData(0);
        for (let s = 0; s < hhData.length; s++) hhData[s] = (Math.random() * 2 - 1) * (1 - s / hhData.length);
        const hh = actx.createBufferSource();
        hh.buffer = hhBuf;
        const hhFilter = actx.createBiquadFilter();
        hhFilter.type = 'highpass';
        hhFilter.frequency.value = 7000;
        const hhGain = actx.createGain();
        hhGain.gain.setValueAtTime(0.6, t);
        hhGain.gain.linearRampToValueAtTime(0, t + 0.03);
        hh.connect(hhFilter);
        hhFilter.connect(hhGain);
        hhGain.connect(masterGain);
        hh.start(t);
        hh.stop(t + 0.03);
        nodes.push(hh);

        if (beat === 0 || beat === 2) {
          // Kick
          const kickOsc = actx.createOscillator();
          kickOsc.type = 'sine';
          kickOsc.frequency.setValueAtTime(150, t);
          kickOsc.frequency.linearRampToValueAtTime(40, t + 0.1);
          const kickGain = actx.createGain();
          kickGain.gain.setValueAtTime(0.7, t);
          kickGain.gain.linearRampToValueAtTime(0, t + 0.1);
          kickOsc.connect(kickGain);
          kickGain.connect(masterGain);
          kickOsc.start(t);
          kickOsc.stop(t + 0.1);
          nodes.push(kickOsc);
        }

        if (beat === 1 || beat === 3) {
          // Snare
          const snBuf = actx.createBuffer(1, actx.sampleRate * 0.08, actx.sampleRate);
          const snData = snBuf.getChannelData(0);
          for (let s = 0; s < snData.length; s++) snData[s] = (Math.random() * 2 - 1) * (1 - s / snData.length);
          const sn = actx.createBufferSource();
          sn.buffer = snBuf;
          const snFilter = actx.createBiquadFilter();
          snFilter.type = 'bandpass';
          snFilter.frequency.value = 3000;
          snFilter.Q.value = 1;
          const snGain = actx.createGain();
          snGain.gain.setValueAtTime(0.5, t);
          snGain.gain.linearRampToValueAtTime(0, t + 0.08);
          sn.connect(snFilter);
          snFilter.connect(snGain);
          snGain.connect(masterGain);
          sn.start(t);
          sn.stop(t + 0.08);
          nodes.push(sn);
        }
      }
    }

    // Store nodes so we can stop them
    if (musicNodes) {
      musicNodes.forEach(n => { try { n.stop(); } catch(e) {} });
    }
    musicNodes = nodes;

    // Schedule next bar slightly before current ends
    const scheduleAhead = totalDuration * 1000 - 100;
    musicLoopTimeout = setTimeout(() => {
      if (musicPlaying) scheduleMusicalBar();
    }, scheduleAhead);

  } catch (e) {}
}

// --- Coin Types (drawn as real coins, not emoji) ---
const COIN_TYPES = [
  { type: 'bronze', value: 1, weight: 60, colors: ['#CD7F32', '#A0522D', '#8B4513'], label: '1' },
  { type: 'silver', value: 5, weight: 25, colors: ['#C0C0C0', '#A8A8A8', '#808080'], label: '5' },
  { type: 'gold',   value: 10, weight: 15, colors: ['#FFD700', '#DAA520', '#B8860B'], label: '10' }
];

function drawCoin(x, y, size, coinType, time) {
  const r = size / 2;
  // Shimmer effect
  const shimmer = 0.08 * Math.sin(time * 5 + x * 0.1);

  // Outer ring (darker)
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fillStyle = coinType.colors[2];
  ctx.fill();
  ctx.closePath();

  // Inner face (main color + shimmer)
  ctx.beginPath();
  ctx.arc(x, y, r * 0.85, 0, Math.PI * 2);
  const grad = ctx.createRadialGradient(x - r * 0.2, y - r * 0.2, 0, x, y, r * 0.85);
  grad.addColorStop(0, lightenColor(coinType.colors[0], 0.3 + shimmer));
  grad.addColorStop(0.7, coinType.colors[0]);
  grad.addColorStop(1, coinType.colors[1]);
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.closePath();

  // Shine highlight (top-left)
  ctx.beginPath();
  ctx.arc(x - r * 0.25, y - r * 0.25, r * 0.3, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,' + (0.4 + shimmer) + ')';
  ctx.fill();
  ctx.closePath();

  // Value text
  ctx.font = 'bold ' + (r * 1.1) + 'px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = coinType.colors[2];
  ctx.fillText(coinType.label, x + 1, y + 1); // shadow
  ctx.fillStyle = '#fff';
  ctx.fillText(coinType.label, x, y);
  ctx.textBaseline = 'alphabetic'; // restore default
}

function lightenColor(hex, amount) {
  const num = parseInt(hex.slice(1), 16);
  let r = Math.min(255, ((num >> 16) & 0xFF) + Math.floor(255 * amount));
  let g = Math.min(255, ((num >> 8) & 0xFF) + Math.floor(255 * amount));
  let b = Math.min(255, (num & 0xFF) + Math.floor(255 * amount));
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}

// --- Special item types (emoji-based, rarer, higher value) ---
const SPECIAL_TYPES = [
  { type: 'bill', emoji: '💵', value: 20, size: 42 },
  { type: 'moneybag', emoji: '💰', value: 30, size: 48 }
];

function pickCoinType() {
  if (!game.levelConfig) return COIN_TYPES[0];
  const cfg = game.levelConfig;
  const roll = Math.random();
  if (roll < cfg.goldChance) return COIN_TYPES[2];
  if (roll < cfg.goldChance + cfg.billChance) return COIN_TYPES[1];
  return COIN_TYPES[0];
}

function spawnObject() {
  const cfg = game.levelConfig;
  const fallSpeed = cfg ? cfg.fallSpeed : 150;
  const bombChance = cfg ? cfg.bombChance : 0.05;

  if (Math.random() < bombChance) {
    const size = 40;
    objects.push({
      type: 'bomb',
      x: Math.random() * (WIDTH - size) + size / 2,
      y: -size / 2,
      width: size,
      height: size,
      speed: fallSpeed * 1.6,
      emoji: '\u{1F4A3}',
      value: 0
    });
    return;
  }

  // Corn for fart refill (only when farts < max)
  if (fartCharges < MAX_FARTS && Math.random() < 0.06) {
    const cornSize = 36;
    objects.push({
      type: 'corn',
      emoji: '\u{1F33D}',
      x: Math.random() * (WIDTH - cornSize) + cornSize / 2,
      y: -cornSize / 2,
      width: cornSize,
      height: cornSize,
      speed: fallSpeed * 0.8,
      value: 0
    });
    return;
  }

  // Rare special items: bill (💵 +20) and moneybag (💰 +30)
  const lvl = game.level || 1;
  const specialRoll = Math.random();
  const moneybagChance = lvl >= 3 ? Math.min(0.04, 0.01 + lvl * 0.004) : 0;
  const billChanceSpecial = lvl >= 2 ? Math.min(0.08, 0.03 + lvl * 0.006) : 0;

  if (specialRoll < moneybagChance) {
    const sp = SPECIAL_TYPES[1]; // moneybag
    objects.push({
      type: 'special',
      specialType: sp,
      x: Math.random() * (WIDTH - sp.size) + sp.size / 2,
      y: -sp.size / 2,
      width: sp.size, height: sp.size,
      speed: fallSpeed * 0.7, // falls slower - it's heavy!
      emoji: sp.emoji,
      value: sp.value
    });
    return;
  }
  if (specialRoll < moneybagChance + billChanceSpecial) {
    const sp = SPECIAL_TYPES[0]; // bill
    objects.push({
      type: 'special',
      specialType: sp,
      x: Math.random() * (WIDTH - sp.size) + sp.size / 2,
      y: -sp.size / 2,
      width: sp.size, height: sp.size,
      speed: fallSpeed * 0.85, // floats a bit
      emoji: sp.emoji,
      value: sp.value
    });
    return;
  }

  const coinType = pickCoinType();
  const size = coinType.value >= 10 ? 40 : (coinType.value >= 5 ? 36 : 30);
  objects.push({
    type: 'coin',
    coinType: coinType,
    x: Math.random() * (WIDTH - size) + size / 2,
    y: -size / 2,
    width: size,
    height: size,
    speed: fallSpeed,
    emoji: null,
    value: coinType.value
  });
}

function playButcherLatch() {
  try {
    const ctx = getAudioContext();
    const t = ctx.currentTime;
    // Metallic knife sharpening sound
    const noise = ctx.createBufferSource();
    const bufSize = ctx.sampleRate * 0.4;
    const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.sin(i / bufSize * Math.PI);
    }
    noise.buffer = buf;
    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.setValueAtTime(3000, t);
    bp.frequency.linearRampToValueAtTime(1500, t + 0.3);
    bp.Q.value = 8;
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.2, t);
    gain.gain.linearRampToValueAtTime(0, t + 0.4);
    noise.connect(bp);
    bp.connect(gain);
    gain.connect(ctx.destination);
    noise.start(t);
    noise.stop(t + 0.4);

    // Low menacing tone
    const osc = ctx.createOscillator();
    const oGain = ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(120, t);
    osc.frequency.linearRampToValueAtTime(80, t + 0.5);
    oGain.gain.setValueAtTime(0.15, t);
    oGain.gain.linearRampToValueAtTime(0, t + 0.5);
    osc.connect(oGain);
    oGain.connect(ctx.destination);
    osc.start(t);
    osc.stop(t + 0.5);
  } catch(e) {}
}

function playKnifeSound() {
  try {
    const ctx = getAudioContext();
    const t = ctx.currentTime;
    // Quick metallic "shink"
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(2000, t);
    osc.frequency.linearRampToValueAtTime(4000, t + 0.03);
    osc.frequency.linearRampToValueAtTime(1000, t + 0.08);
    gain.gain.setValueAtTime(0.08, t);
    gain.gain.linearRampToValueAtTime(0, t + 0.08);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(t);
    osc.stop(t + 0.08);
  } catch(e) {}
}

// --- Level Management ---
function startLevel() {
  const cfg = getLevelConfig(game.level);
  game.levelConfig = cfg;
  game.levelTimer = cfg.duration;
  game.devilsSpawned = 0;
  game.cracks = 0;
  game.latchedDevil = null;
  game.lastScore = game.score;

  // Calculate devil spawn schedule - start early, come in waves!
  game.devilSchedule = [];
  if (cfg.devilCount > 0) {
    const availableTime = cfg.duration - 3; // start after just 3 seconds
    const interval = availableTime / (cfg.devilCount + 1);
    for (let i = 1; i <= cfg.devilCount; i++) {
      // Add some randomness so devils don't come perfectly evenly
      const jitter = (Math.random() - 0.5) * interval * 0.4;
      const spawnAt = cfg.duration - (3 + interval * i) + jitter;
      game.devilSchedule.push(Math.max(1, spawnAt));
    }
    game.devilSchedule.sort((a, b) => b - a); // sort descending (highest time first)
  }

  // Calculate butcher spawn schedule - butchers appear from level 2+
  game.butcherSchedule = [];
  if (game.level >= 2) {
    const butcherCount = Math.max(0, Math.floor(game.level / 2)); // 1 at level 2-3, 2 at level 4-5, etc.
    if (butcherCount > 0) {
      const availableTime = cfg.duration - 8;
      const interval = availableTime / (butcherCount + 1);
      for (let i = 1; i <= butcherCount; i++) {
        const jitter = (Math.random() - 0.5) * interval * 0.3;
        const spawnAt = cfg.duration - (8 + interval * i) + jitter;
        game.butcherSchedule.push(Math.max(2, spawnAt));
      }
      game.butcherSchedule.sort((a, b) => b - a);
    }
  }

  // Reset fart state
  fartCharges = MAX_FARTS; // refill farts each level
  fartClouds.length = 0;
  chokingDevils.length = 0;
  fartCooldown = 0;

  // Clear everything
  objects.length = 0;
  ejectedCoins.length = 0;
  particles.length = 0;
  scorePopups.length = 0;
  spawnTimer = 0;
  flashTimer = 0;
  lastShakeKey = null;
  squealTimer = 0;
  successFlashTimer = 0;
  shakeHintTimer = 0;
  shakeVisualOffset = 0;
  shakeVisualTimer = 0;
  screenShake.intensity = 0;
  screenShake.duration = 0;
  piggyDamageTimer = 0;
  scoreBounceFactor = 0;
  player.x = WIDTH / 2;
  player.facing = 0;
  player.facingSmooth = 0;

  game.screen = 'playing';
  startMusic();
}

  }
  keys[e.key] = true;

  if (game.latchedDevil && game.screen === 'playing') {
    if (e.key === 'ArrowUp' && lastShakeKey !== 'up') {
      game.latchedDevil.shakeProgress++;
      lastShakeKey = 'up';
      shakeVisualOffset = -5;
      shakeVisualTimer = 0.08;

    } else if (e.key === 'ArrowDown' && lastShakeKey !== 'down') {

      lastShakeKey = 'down';
      shakeVisualOffset = 5;
      shakeVisualTimer = 0.08;

  }

  // Fart mechanic - SPACE during gameplay
  if (e.key === ' ' && game.screen === 'playing') {

      fartCharges--;
      fartCooldown = 0.5; // half second cooldown

        introTextOpacity = 0;
        introFadeOut = 0;

      playOink();

      game.level = 1;
      startLevel();
    } else if (game.screen === 'gameOver') {
      game.score = 0;

// --- AABB Collision ---
function aabb(a, b) {
  return (
    a.x - a.width / 2 < b.x + b.width / 2 &&
    a.x + a.width / 2 > b.x - b.width / 2 &&
    a.y - a.height / 2 < b.y + b.height / 2 &&
    a.y + a.height / 2 > b.y - b.height / 2
  );
}

// --- Update ---
function triggerDamage(fromBomb) {
  game.cracks++;
  game.score = Math.max(0, game.score - 5);
  flashTimer = 0.3;
  flashColor = '#ff0000';
  piggyDamageTimer = 0.3;
  spawnScorePopup(player.x, player.y - 40, '-5', '#ff4444');

  if (fromBomb) {
    // Bomb explosion particles
    const explosionEmojis = ['\u{1F4A5}', '\u{1F525}', '\u{1F4A5}', '\u{1F525}'];
    for (let i = 0; i < 7; i++) {
      spawnParticles(player.x, player.y, explosionEmojis[i % explosionEmojis.length], 1, 300);
    }
    triggerScreenShake(8, 0.3);
    playBombExplosion();
  }

  if (game.cracks >= 3) {
    game.screen = 'gameOver';
    gameOverTimer = 0;
    stopMusic();
    playGameOver();
  }
}

function update(dt) {
  // Always update clouds
  updateClouds(dt);

  // Update intro cutscene
  if (game.screen === 'intro') {
    playIntroMusic(introScene);
    introTimer += dt;
    introSkipHint += dt;
    // Auto-advance after 10 seconds
    if (introTimer >= 10) {
      if (introScene >= 5) {
        stopIntroMusic();
        game.screen = 'title';
        introScene = 0;
      } else {
        introScene++;
        introTimer = 0;
        introTextOpacity = 0;
        introFadeOut = 0;
      }
    }
    return;
  }

  // Update title screen background coins
  if (game.screen === 'title') {
    titleCoinTimer += dt;
    if (titleCoinTimer >= 0.5) {
      titleCoinTimer -= 0.5;
      const emojis = ['\u{1FA99}', '\u{1F4B5}', '\u{1F4B0}'];
      titleCoins.push({
        x: Math.random() * WIDTH,
        y: -20,
        emoji: emojis[Math.floor(Math.random() * emojis.length)],
        speed: 60 + Math.random() * 40,
        alpha: 0.3 + Math.random() * 0.2
      });
    }
    for (let i = titleCoins.length - 1; i >= 0; i--) {
      titleCoins[i].y += titleCoins[i].speed * dt;
      if (titleCoins[i].y > HEIGHT + 30) {
        titleCoins.splice(i, 1);
      }
    }
    return;
  }

  // Update particles on level complete screen too
  if (game.screen === 'levelComplete') {
    levelCompleteTimer += dt;
    updateParticles(dt);
    return;
  }

  // Update game over animation
  if (game.screen === 'gameOver') {
    gameOverTimer += dt;
    return;
  }

  if (game.screen !== 'playing') return;

  // Piggy bob timer
  piggyBobTimer += dt;

  // Beat tracking for music oinks
  if (musicPlaying) {
    beatTimer += dt;
    if (beatTimer >= BEAT_DURATION) {
      beatTimer -= BEAT_DURATION;
      beatCount++;
      if (beatCount % 8 === 0) {
        playDoubleOink();
      } else if (beatCount % 4 === 0) {
        playOink();
      }
    }
  }

  // Flash timer countdown
  if (flashTimer > 0) flashTimer -= dt;
  if (successFlashTimer > 0) successFlashTimer -= dt;
  if (piggyDamageTimer > 0) piggyDamageTimer -= dt;
  if (scoreBounceFactor > 0) scoreBounceFactor -= dt * 4;
  if (shakeVisualTimer > 0) {
    shakeVisualTimer -= dt;
    if (shakeVisualTimer <= 0) shakeVisualOffset = 0;
  }

  // Update screen shake
  updateScreenShake(dt);

  // Update particles
  updateParticles(dt);

  // Update score pop-ups
  updateScorePopups(dt);

  // Level timer countdown
  game.levelTimer -= dt;
  if (game.levelTimer <= 0) {
    game.levelTimer = 0;
    objects.length = 0;
    ejectedCoins.length = 0;
    if (game.latchedDevil) {
      game.latchedDevil = null;
      lastShakeKey = null;
      squealTimer = 0;
      shakeHintTimer = 0;
      devilTypeIndicator = null;
    }
    game.screen = 'levelComplete';
    levelCompleteTimer = 0;
    stopMusic();
    playLevelComplete();
    // Level complete confetti particles
    const confettiEmojis = ['\u{1F389}', '\u{1F38A}', '\u2728', '\u{1F389}', '\u{1F38A}', '\u2728'];
    for (let i = 0; i < 18; i++) {
      spawnParticles(
        WIDTH * 0.2 + Math.random() * WIDTH * 0.6,
        HEIGHT * 0.3 + Math.random() * 50,
        confettiEmojis[i % confettiEmojis.length],
        1, 350
      );
    }
    return;
  }

  // Player movement
  if (keys['ArrowLeft']) {
    player.x -= player.speed * dt;
    player.facing = -1;
  }
  if (keys['ArrowRight']) {
    player.x += player.speed * dt;
    player.facing = 1;
  }
  if (!keys['ArrowLeft'] && !keys['ArrowRight']) {
    player.facing = 0;
  }
  player.facingSmooth += (player.facing - player.facingSmooth) * 8 * dt;
  const halfW = player.width / 2;
  if (player.x < halfW) player.x = halfW;
  if (player.x > WIDTH - halfW) player.x = WIDTH - halfW;

  // Spawn timer
  const spawnRate = game.levelConfig ? game.levelConfig.spawnRate : 1.0;
  spawnTimer += dt;
  if (spawnTimer >= spawnRate) {
    spawnTimer -= spawnRate;
    spawnObject();
  }

  // Devil spawn from schedule
  if (game.devilSchedule.length > 0) {
    const nextDevilTime = game.devilSchedule[0];
    if (game.levelTimer <= nextDevilTime) {
      game.devilSchedule.shift();
      game.devilsSpawned++;
      spawnDevil();
    }
  }

  // Butcher spawn from schedule
  if (game.butcherSchedule && game.butcherSchedule.length > 0) {
    const nextButcherTime = game.butcherSchedule[0];
    if (game.levelTimer <= nextButcherTime) {
      game.butcherSchedule.shift();
      spawnButcher();
    }
  }

  // Update fart cooldown
  if (fartCooldown > 0) fartCooldown -= dt;

  // Update fart clouds
  for (let i = fartClouds.length - 1; i >= 0; i--) {
    const cloud = fartClouds[i];
    cloud.y += cloud.vy * dt;              // fly upward
    cloud.wobble += dt * 4;                 // wobble side to side
    cloud.x += Math.sin(cloud.wobble) * 30 * dt;
    cloud.scale += dt * 0.5;                // grows bigger as it rises
    cloud.life -= dt;
    cloud.opacity = Math.min(0.8, cloud.life / 1.0);

    if (cloud.life <= 0) {
      fartClouds.splice(i, 1);
      continue;
    }

    // Check collision with falling devils
    for (let j = objects.length - 1; j >= 0; j--) {
      const obj = objects[j];
      if ((obj.type === 'devil' || obj.type === 'butcher') && !obj.latched && !obj.flyAway) {
        // Wide hitbox for the cloud
        const cloudW = cloud.width * cloud.scale;
        const cloudH = cloud.height * cloud.scale;
        if (Math.abs(cloud.x - obj.x) < (cloudW + obj.width) / 2 &&
            Math.abs(cloud.y - obj.y) < (cloudH + obj.height) / 2) {
          // Devil got FARTED ON!
          chokingDevils.push({
            emoji: obj.emoji,
            x: obj.x,
            y: obj.y,
            width: obj.width,
            timer: 1.5,          // choking animation duration
            coughTimer: 0,
            opacity: 1.0,
            greenTint: 1.0        // turns green from the stink
          });
          objects.splice(j, 1);
          playChokingSound();
          spawnParticles(obj.x, obj.y, '\u{1F922}', 3, 100);
          spawnParticles(obj.x, obj.y, '\u{1F480}', 2, 80);
          spawnScorePopup(obj.x, obj.y, '\u2620\uFE0F', '#44ff44');
          break; // one devil per cloud
        }
      }
    }
  }

  // Update choking devils
  for (let i = chokingDevils.length - 1; i >= 0; i--) {
    const cd = chokingDevils[i];
    cd.timer -= dt;
    cd.coughTimer += dt;
    cd.opacity = Math.max(0, cd.timer / 1.0);
    cd.y -= 20 * dt; // slowly floats up while dying
    if (cd.timer <= 0) {
      chokingDevils.splice(i, 1);
    }
  }

  // Update latched devil
  if (game.latchedDevil) {
    const devil = game.latchedDevil;
    devil.x = player.x;
    devil.y = player.y - 40;
    devil.hammerTimer += dt;
    devil.hammerAnimTimer += dt;
    shakeHintTimer += dt;

    // Continuous screen shake while devil is latched (subtle; heavy/butcher shakes harder)
    if (screenShake.duration <= 0) {
      const shakeIntensity = (devil.devilType === 'heavy' || devil.devilType === 'butcher') ? 4 : 3;
      triggerScreenShake(shakeIntensity, 0.1);
    }

    // Squeal timer - butcher alternates squeal and knife sound faster
    squealTimer += dt;
    if (devil.devilType === 'butcher') {
      if (squealTimer >= 0.4) {
        squealTimer -= 0.4;
        // Alternate between squeal and knife sound
        if (Math.floor(devil.hammerAnimTimer / 0.4) % 2 === 0) {
          playSqueal();
        } else {
          playKnifeSound();
        }
      }
    } else {
      if (squealTimer >= 0.5) {
        squealTimer -= 0.5;
        playSqueal();
      }
    }

    // Thief devil steals coins every 0.5s
    if (devil.devilType === 'thief') {
      devil.stealTimer += dt;
      if (devil.stealTimer >= 0.5) {
        devil.stealTimer -= 0.5;
        game.score = Math.max(0, game.score - 2);
        spawnScorePopup(
          player.x + (Math.random() - 0.5) * 30,
          player.y - 60 - Math.random() * 20,
          '-2', '#cc44ff'
        );
      }
    }

    // Update devil type indicator timer
    if (devilTypeIndicator) {
      devilTypeIndicator.timer -= dt;
      if (devilTypeIndicator.timer <= 0) devilTypeIndicator = null;
    }

    // Shake success
    if (devil.shakeProgress >= devil.shakeRequired) {
      const flyDirection = (Math.random() < 0.5 ? -1 : 1);
      ejectedCoins.push({
        x: player.x,
        y: player.y - 20,
        startY: player.y - 20,
        targetX: devil.x,
        targetY: devil.y,
        phase: 'rising',
        timer: 0,
        riseDuration: 0.25,
        devilFlyX: flyDirection * (200 + Math.random() * 150),
        devilFlyY: -(200 + Math.random() * 100),
        devilEmoji: devil.emoji,
        devilW: devil.width,
        devilH: devil.height,
        devilAngle: 0,
        hitTimer: 0
      });

      game.score = Math.max(0, game.score - 3);
      spawnScorePopup(player.x, player.y - 50, '-3', '#ff4444');
      // Sparkle particles for devil knock-off
      for (let i = 0; i < 5; i++) {
        spawnParticles(player.x, player.y - 30, '\u2B50', 1, 180);
      }
      playShakeSuccess();

      game.latchedDevil = null;
      lastShakeKey = null;
      squealTimer = 0;
      shakeHintTimer = 0;
      successFlashTimer = 0.4;
      devilTypeIndicator = null;
    }
  }

  // Devil hammer timer expired
  if (game.latchedDevil) {
    const devil = game.latchedDevil;
    if (devil.hammerTimer >= devil.hammerTimeout) {
      triggerDamage(false);
      objects.push({
        type: devil.devilType === 'butcher' ? 'butcher' : 'devil',
        devilType: devil.devilType,
        emoji: devil.emoji,
        x: devil.x,
        y: devil.y,
        width: devil.width,
        height: devil.height,
        speed: 0,
        flyAway: true,
        flyAwayTimer: 0.5
      });
      game.latchedDevil = null;
      lastShakeKey = null;
      squealTimer = 0;
      shakeHintTimer = 0;
      devilTypeIndicator = null;
    }
  }

  // Update ejected coin animations
  for (let i = ejectedCoins.length - 1; i >= 0; i--) {
    const ec = ejectedCoins[i];
    ec.timer += dt;
    if (ec.phase === 'rising') {
      const t = Math.min(ec.timer / ec.riseDuration, 1.0);
      ec.y = ec.startY + t * (ec.targetY - ec.startY);
      if (t >= 1.0) {
        ec.phase = 'hit';
        ec.hitTimer = 0;
        ec.hitX = ec.x;
        ec.hitY = ec.targetY;
      }
    } else if (ec.phase === 'hit') {
      ec.hitTimer += dt;
      ec.devilAngle += dt * 10;
      ec.hitX += ec.devilFlyX * dt;
      ec.hitY += ec.devilFlyY * dt;
      if (ec.hitTimer > 0.6) {
        ejectedCoins.splice(i, 1);
      }
    }
  }

  // Update falling objects
  for (let i = objects.length - 1; i >= 0; i--) {
    const obj = objects[i];
    obj.y += obj.speed * dt;

    // Zigzag movement for devils
    if ((obj.type === 'devil' || obj.type === 'butcher') && !obj.latched && !obj.flyAway && obj.zigzagSpeed) {
      obj.zigzagTime += dt;
      // Unpredictable swerving using combined sine waves
      const swerve = Math.sin(obj.zigzagTime * obj.zigzagFreq + obj.zigzagPhase)
                    + 0.5 * Math.sin(obj.zigzagTime * obj.zigzagFreq * 2.3 + obj.zigzagPhase * 1.7);
      obj.x += swerve * obj.zigzagSpeed * dt;
      // Keep within canvas bounds
      if (obj.x < obj.width / 2) obj.x = obj.width / 2;
      if (obj.x > WIDTH - obj.width / 2) obj.x = WIDTH - obj.width / 2;
    }

    // Fly-away devils
    if (obj.flyAway) {
      obj.flyAwayTimer -= dt;
      obj.y -= 300 * dt;
      obj.x += 150 * dt;
      if (obj.flyAwayTimer <= 0) {
        objects.splice(i, 1);
      }
      continue;
    }

    // Collision with player
    if (aabb(player, obj)) {
      if (obj.type === 'bomb') {
        triggerDamage(true);
        objects.splice(i, 1);
        continue;
      } else if (obj.type === 'devil') {
        if (!game.latchedDevil) {
          obj.latched = true;
          game.latchedDevil = {
            emoji: obj.emoji,
            devilType: obj.devilType || 'fast',
            x: player.x,
            y: player.y - 40,
            width: obj.width,
            height: obj.height,
            hammerTimer: 0,
            shakeProgress: 0,
            shakeRequired: obj.shakeRequired || 8,
            hammerTimeout: obj.hammerTimeout || 5,
            hammerAnimTimer: 0,
            stealTimer: 0
          };
          lastShakeKey = null;
          squealTimer = 0;
          shakeHintTimer = 0;
          playDevilLatch();
          // Show devil type indicator
          const dt = obj.devilType || 'fast';
          if (dt === 'fast') {
            devilTypeIndicator = { text: '\u26A1 BRZI!', color: '#ffff00', timer: 1.5 };
          } else if (dt === 'heavy') {
            devilTypeIndicator = { text: '\u{1F4AA} TE\u0160KI!', color: '#ff4444', timer: 1.5 };
          } else if (dt === 'thief') {
            devilTypeIndicator = { text: '\u{1F911} LOPOV!', color: '#cc44ff', timer: 1.5 };
          }
        }
        objects.splice(i, 1);
        continue;
      } else if (obj.type === 'butcher') {
        if (!game.latchedDevil) {
          obj.latched = true;
          game.latchedDevil = {
            emoji: obj.emoji,
            devilType: 'butcher',
            x: player.x,
            y: player.y - 45,
            width: obj.width,
            height: obj.height,
            hammerTimer: 0,
            shakeProgress: 0,
            shakeRequired: obj.shakeRequired || 10,
            hammerTimeout: obj.hammerTimeout || 6,
            hammerAnimTimer: 0,
            stealTimer: 0
          };
          lastShakeKey = null;
          squealTimer = 0;
          shakeHintTimer = 0;
          playButcherLatch();
          devilTypeIndicator = { text: '\u{1F52A} KASAPIN!', color: '#cc0000', timer: 2.0 };
        }
        objects.splice(i, 1);
        continue;
      } else if (obj.type === 'corn') {
        fartCharges = Math.min(MAX_FARTS, fartCharges + 1);
        spawnParticles(obj.x, obj.y, '\u{1F33D}', 3, 100);
        spawnScorePopup(obj.x, obj.y - 10, '\u{1F4A8}+1', '#88cc44');
        playCoinCollect(); // reuse coin sound
        objects.splice(i, 1);
        continue;
      } else {
        // Coin collected
        game.score += obj.value;
        scoreBounceFactor = 1.0;

        // Particles + sound based on value
        if (obj.value === 1) {
          spawnParticles(obj.x, obj.y, '\u2728', 3, 120);
          spawnScorePopup(obj.x, obj.y - 10, '+1', '#ffffff');
          playCoinCollect();
        } else if (obj.value === 5) {
          spawnParticles(obj.x, obj.y, '\u2728', 4, 150);
          spawnScorePopup(obj.x, obj.y - 10, '+5', '#44dd44');
          playBillCollect();
        } else if (obj.value === 10) {
          spawnParticles(obj.x, obj.y, '\u2728', 5, 180);
          spawnScorePopup(obj.x, obj.y - 10, '+10', '#ffd700');
          playGoldCollect();
        } else if (obj.value === 20) {
          spawnParticles(obj.x, obj.y, '\u{1F4B5}', 4, 200);
          spawnParticles(obj.x, obj.y, '\u2728', 5, 160);
          spawnScorePopup(obj.x, obj.y - 10, '+20', '#22cc55');
          playGoldCollect();
        } else if (obj.value === 30) {
          spawnParticles(obj.x, obj.y, '\u{1F4B0}', 3, 200);
          spawnParticles(obj.x, obj.y, '\u2728', 8, 220);
          spawnScorePopup(obj.x, obj.y - 10, '+30', '#ff6600');
          playGoldCollect();
          // Extra flash for moneybag!
          flashTimer = 0.15;
          flashColor = 'rgba(255,215,0,';
        }

        objects.splice(i, 1);
        continue;
      }
    }

    // Off screen
    if (obj.y > HEIGHT + obj.height) {
      objects.splice(i, 1);
    }
  }
}

// --- Draw ---
function drawBackground() {
  // Vertical sky gradient
  const grad = ctx.createLinearGradient(0, 0, 0, HEIGHT);
  grad.addColorStop(0, '#87CEEB');
  grad.addColorStop(1, '#5BA3CF');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, WIDTH, HEIGHT);

  // Draw clouds
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (const c of clouds) {
    ctx.globalAlpha = 0.6;
    ctx.font = c.size + 'px sans-serif';
    ctx.fillText('\u2601\uFE0F', c.x, c.y);
  }
  ctx.globalAlpha = 1.0;
}

function drawGround() {
  const groundY = HEIGHT - 40;
  const groundHeight = 40;
  // Base green
  ctx.fillStyle = '#4CAF50';
  ctx.fillRect(0, groundY, WIDTH, groundHeight);
  // Darker stripe pattern for grass
  ctx.fillStyle = '#43A047';
  for (let x = 0; x < WIDTH; x += 20) {
    if ((x / 20) % 2 === 0) {
      ctx.fillRect(x, groundY, 10, groundHeight);
    }
  }
  // Scattered grass emoji
  ctx.font = '14px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.globalAlpha = 0.5;
  for (let x = 15; x < WIDTH; x += 55) {
    ctx.fillText('\u{1F33F}', x, groundY + 6);
  }
  ctx.globalAlpha = 1.0;
}

function drawPiggySprite(x, y, facing, state) {
  ctx.save();
  ctx.translate(x, y);

  // Flip based on direction (default faces right)
  const dir = facing >= 0 ? 1 : -1;
  ctx.scale(dir, 1);

  // State-based modifiers
  let bodyColor = '#FFB6C1';
  let bodyDark = '#FF9CAD';
  if (state === 'scared') {
    bodyColor = '#FFD0D0';
  } else if (state === 'happy') {
    bodyColor = '#FFB0D0';
  } else if (state === 'farting') {
    bodyColor = '#CCFF99';
  }

  // BODY - oval shape
  ctx.fillStyle = bodyColor;
  ctx.beginPath();
  ctx.ellipse(0, 0, 28, 20, 0, 0, Math.PI * 2);
  ctx.fill();
  // Darker bottom half for 3D effect
  ctx.fillStyle = bodyDark;
  ctx.beginPath();
  ctx.ellipse(0, 5, 26, 12, 0, 0, Math.PI);
  ctx.fill();

  // COIN SLOT on top
  ctx.fillStyle = '#333';
  ctx.fillRect(-8, -22, 16, 3);
  ctx.fillStyle = '#555';
  ctx.fillRect(-6, -21, 12, 1);

  // LEGS (2 front, 2 back - offset for depth)
  ctx.fillStyle = '#FF9CAD';
  // Back legs (slightly behind)
  ctx.fillRect(-15, 12, 7, 12);
  ctx.fillRect(8, 12, 7, 12);
  // Front legs (slightly in front, darker)
  ctx.fillStyle = bodyDark;
  ctx.fillRect(-18, 14, 7, 12);
  ctx.fillRect(11, 14, 7, 12);
  // Hooves
  ctx.fillStyle = '#8B4513';
  ctx.fillRect(-18, 24, 7, 3);
  ctx.fillRect(11, 24, 7, 3);
  ctx.fillRect(-15, 22, 7, 3);
  ctx.fillRect(8, 22, 7, 3);

  // TAIL (curly!) - at the back
  ctx.strokeStyle = '#FF9CAD';
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-28, -5);
  ctx.quadraticCurveTo(-35, -15, -30, -18);
  ctx.quadraticCurveTo(-25, -21, -32, -12);
  ctx.stroke();

  // HEAD/SNOUT - protruding from front
  ctx.fillStyle = bodyColor;
  ctx.beginPath();
  ctx.arc(25, -5, 14, 0, Math.PI * 2);
  ctx.fill();

  // Snout (protruding oval)
  ctx.fillStyle = '#FFa0b0';
  ctx.beginPath();
  ctx.ellipse(35, -2, 9, 7, 0, 0, Math.PI * 2);
  ctx.fill();
  // Nostrils
  ctx.fillStyle = '#c06070';
  ctx.beginPath();
  ctx.ellipse(33, -3, 2, 2.5, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(37, -3, 2, 2.5, 0, 0, Math.PI * 2);
  ctx.fill();

  // EYES
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(28, -10, 5, 0, Math.PI * 2);
  ctx.fill();
  // Black pupil (moves slightly with facing)
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(29 + dir * 1, -10, 2.5, 0, Math.PI * 2);
  ctx.fill();
  // Eye highlight
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(30, -11.5, 1, 0, Math.PI * 2);
  ctx.fill();

  // Scared state: sweat drop, wider eyes
  if (state === 'scared') {
    ctx.fillStyle = '#66ccff';
    ctx.beginPath();
    ctx.moveTo(22, -18);
    ctx.quadraticCurveTo(20, -13, 22, -12);
    ctx.quadraticCurveTo(24, -13, 22, -18);
    ctx.fill();
  }

  // EARS - pointed triangles on top of head
  ctx.fillStyle = bodyColor;
  ctx.beginPath();
  ctx.moveTo(19, -16);
  ctx.lineTo(17, -28);
  ctx.lineTo(25, -18);
  ctx.closePath();
  ctx.fill();
  // Inner ear
  ctx.fillStyle = '#FF8CA0';
  ctx.beginPath();
  ctx.moveTo(20, -17);
  ctx.lineTo(18.5, -25);
  ctx.lineTo(24, -18);
  ctx.closePath();
  ctx.fill();

  // Second ear (behind, slightly visible)
  ctx.fillStyle = bodyDark;
  ctx.beginPath();
  ctx.moveTo(22, -16);
  ctx.lineTo(22, -27);
  ctx.lineTo(28, -17);
  ctx.closePath();
  ctx.fill();

  ctx.restore();
}

function drawPiggy() {
  const bobOffset = Math.sin(piggyBobTimer * 3) * 2; // subtle idle bob
  const drawY = player.y + shakeVisualOffset + bobOffset;

  ctx.save();
  ctx.translate(player.x, drawY);

  // Wobble for 2 cracks
  if (game.cracks >= 2) {
    const wobble = Math.sin(Date.now() / 80) * 0.06;
    ctx.rotate(wobble);
  }

  // Scale pulse on damage
  let scale = 1.0;
  if (piggyDamageTimer > 0) {
    scale = 1.0 + 0.15 * Math.sin(piggyDamageTimer / 0.3 * Math.PI);
  }
  ctx.scale(scale, scale);

  // Red tint overlay for damage
  if (piggyDamageTimer > 0) {
    ctx.globalAlpha = 0.7;
  }

  // Determine piggy state
  const piggyState = game.latchedDevil ? 'scared' : piggyDamageTimer > 0 ? 'scared' : 'normal';

  // Draw the hand-drawn piggy sprite
  drawPiggySprite(0, 0, player.facingSmooth, piggyState);
  ctx.globalAlpha = 1.0;

  // Draw crack lines
  if (game.cracks >= 1) {
    ctx.strokeStyle = '#555';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-8, -12);
    ctx.lineTo(10, 10);
    ctx.stroke();
  }
  if (game.cracks >= 2) {
    ctx.strokeStyle = '#444';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(8, -14);
    ctx.lineTo(-6, 8);
    ctx.stroke();
  }

  ctx.restore();

  // Red tint flash on damage
  if (piggyDamageTimer > 0) {
    ctx.globalAlpha = piggyDamageTimer / 0.3 * 0.3;
    ctx.fillStyle = '#ff0000';
    ctx.beginPath();
    ctx.arc(player.x, drawY, 28, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1.0;
  }
}

function drawHUD() {
  // --- HUD with drop shadows and polished styling ---

  // Helper for drop shadow text
  function hudText(text, x, y, font, color, align) {
    ctx.textAlign = align || 'left';
    ctx.textBaseline = 'top';
    ctx.font = font;
    // Drop shadow
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fillText(text, x + 1, y + 2);
    // Main text
    ctx.fillStyle = color;
    ctx.fillText(text, x, y);
  }

  // Top-left: Score with bouncing coin icon
  const coinBounce = Math.sin(Math.max(0, scoreBounceFactor) * Math.PI) * 5;
  hudText('\u{1FA99}', 15, 12 - coinBounce, 'bold 24px sans-serif', '#fff', 'left');
  hudText(' Score: ' + game.score, 38, 14, 'bold 22px sans-serif', '#fff', 'left');

  // Top-center: Level with rounded background
  ctx.textAlign = 'center';
  const levelText = 'Level ' + game.level;
  ctx.font = 'bold 22px sans-serif';
  const levelTextW = ctx.measureText(levelText).width;
  // Rounded background pill
  const pillX = WIDTH / 2 - levelTextW / 2 - 14;
  const pillY = 8;
  const pillW = levelTextW + 28;
  const pillH = 28;
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.roundRect(pillX, pillY, pillW, pillH, 14);
  ctx.fill();
  hudText(levelText, WIDTH / 2, 10, 'bold 22px sans-serif', '#fff', 'center');

  // Timer bar below level text
  if (game.levelConfig) {
    const timerBarWidth = 160;
    const timerBarHeight = 10;
    const timerBarX = WIDTH / 2 - timerBarWidth / 2;
    const timerBarY = 40;
    const timerFill = Math.max(0, game.levelTimer / game.levelConfig.duration);

    ctx.fillStyle = '#333';
    ctx.beginPath();
    ctx.roundRect(timerBarX, timerBarY, timerBarWidth, timerBarHeight, 5);
    ctx.fill();

    let barColor;
    if (timerFill > 0.5) barColor = '#44cc44';
    else if (timerFill > 0.2) barColor = '#cccc44';
    else barColor = '#cc4444';

    ctx.fillStyle = barColor;
    ctx.beginPath();
    ctx.roundRect(timerBarX, timerBarY, timerBarWidth * timerFill, timerBarHeight, 5);
    ctx.fill();

    ctx.strokeStyle = 'rgba(0,0,0,0.3)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.roundRect(timerBarX, timerBarY, timerBarWidth, timerBarHeight, 5);
    ctx.stroke();

    // Time remaining
    hudText(Math.ceil(game.levelTimer) + 's', WIDTH / 2, 54, '14px sans-serif', 'rgba(255,255,255,0.8)', 'center');
  }

  // Top-right: Crack indicator with piggy icons
  ctx.textAlign = 'right';
  ctx.textBaseline = 'top';
  const crackStartX = WIDTH - 15;
  ctx.font = '22px sans-serif';
  for (let i = 0; i < 3; i++) {
    const cx = crackStartX - (2 - i) * 28;
    if (i < game.cracks) {
      // Cracked piggy (broken heart)
      ctx.globalAlpha = 0.9;
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.fillText('\u{1F494}', cx + 1, 16);
      ctx.fillText('\u{1F494}', cx, 14);
    } else {
      // Healthy piggy
      ctx.globalAlpha = 0.9;
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.fillText('\u{1F437}', cx + 1, 16);
      ctx.fillText('\u{1F437}', cx, 14);
    }
  }
  ctx.globalAlpha = 1.0;

  // Fart meter (below score)
  const fartY = 48;
  hudText('\u{1F4A8} ', 15, fartY, '20px sans-serif', '#88cc44', 'left');
  for (let i = 0; i < MAX_FARTS; i++) {
    const fx = 42 + i * 22;
    if (i < fartCharges) {
      // Full charge - green cloud
      ctx.fillStyle = '#66cc33';
      ctx.beginPath();
      ctx.arc(fx, fartY + 10, 8, 0, Math.PI * 2);
      ctx.fill();
      ctx.font = '12px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('\u{1F4A8}', fx, fartY + 10);
    } else {
      // Empty - gray circle
      ctx.fillStyle = 'rgba(100,100,100,0.4)';
      ctx.beginPath();
      ctx.arc(fx, fartY + 10, 8, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  // Show corn hint when low on farts
  if (fartCharges === 0) {
    const blink = Math.sin(Date.now() / 300) > 0;
    if (blink) {
      hudText('Uhvati \u{1F33D}!', 155, fartY + 2, 'bold 16px sans-serif', '#ffcc00', 'left');
    }
  }
}

function draw() {
  if (game.screen === 'intro') {
    drawIntro();
    return;
  }

  drawBackground();

  if (game.screen === 'title') {
    drawTitle();
  } else if (game.screen === 'playing') {
    drawPlayingScene();
  } else if (game.screen === 'levelComplete') {
    drawLevelComplete();
  } else if (game.screen === 'gameOver') {
    drawGameOver();
  }
}

    }
  ];

  const scene = sceneData[introScene] || sceneData[0];

  // Draw title (large, centered, top)
  if (introScene < 5) {
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    // Title
    const titleAlpha = Math.min(1, t * 3);
    ctx.globalAlpha = titleAlpha;
    ctx.font = 'bold 42px sans-serif';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 4;
    ctx.strokeText(scene.title, WIDTH / 2, 50);
    ctx.fillStyle = '#fff';
    ctx.fillText(scene.title, WIDTH / 2, 50);
    ctx.lineWidth = 1;

    // Body text - fade in line by line
    ctx.font = '22px sans-serif';
    for (let i = 0; i < scene.lines.length; i++) {
      const lineDelay = 0.5 + i * 1.0;
      const lineAlpha = Math.min(1, Math.max(0, (t - lineDelay) * 2));
      ctx.globalAlpha = lineAlpha;
      ctx.strokeStyle = 'rgba(0,0,0,0.5)';
      ctx.lineWidth = 3;
      ctx.strokeText(scene.lines[i], WIDTH / 2, HEIGHT - 80 + i * 30);
      ctx.fillStyle = '#fff';
      ctx.fillText(scene.lines[i], WIDTH / 2, HEIGHT - 80 + i * 30);
    }
    ctx.lineWidth = 1;
    ctx.restore();
  }

  // "Click for sound" hint if audio not unlocked yet
  if (!audioUnlocked) {
    const soundPulse = 0.5 + 0.5 * Math.abs(Math.sin(Date.now() / 400));
    ctx.globalAlpha = soundPulse;
    ctx.font = 'bold 20px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 3;
    ctx.strokeText('\u{1F50A} Klikni za zvuk!', WIDTH / 2, HEIGHT - 10);
    ctx.fillStyle = '#ffcc00';
    ctx.fillText('\u{1F50A} Klikni za zvuk!', WIDTH / 2, HEIGHT - 10);
    ctx.lineWidth = 1;
    ctx.globalAlpha = 1.0;
  }

  // Skip hint at bottom-right (after 2 seconds)
  if (t > 2 && introScene < 5 && audioUnlocked) {
    const hintAlpha = Math.min(0.7, (t - 2) * 2);
    ctx.globalAlpha = hintAlpha;
    ctx.font = '16px sans-serif';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'bottom';
    ctx.fillStyle = '#fff';
    ctx.fillText('SPACE \u25B6', WIDTH - 20, HEIGHT - 10);
    ctx.globalAlpha = 1.0;
  }

  // Fade-to-black transition
  if (introFadeOut > 0) {
    ctx.fillStyle = 'rgba(0, 0, 0, ' + Math.min(1, introFadeOut / 0.3) + ')';
    ctx.fillRect(0, 0, WIDTH, HEIGHT);
  }
}

// --- Level-End Animation System ---
function getLevelEndText(level) {
  const texts = {
    1: { main: 'JUHUU! Jo\u0161 sam \u017Eiva! \u{1F389}', sub: 'Mislio sam da ne\u0107u pre\u017Eiveti ni prvi dan...' },
    2: { main: 'Pre\u017Eivesmo i ovo! *prrrrc* \u{1F4A8}', sub: 'Izvini za smrad, od straha je...' },
    3: { main: 'Ha! Prevarila sam ih! \u{1F92A}', sub: 'Glumila sam mrtvu, a oni poverovali!' },
    4: { main: 'Ko je car? JA sam car! \u{1F451}', sub: 'Neka mi neko da krunu!' },
    5: { main: 'Moji dragi nov\u010Di\u0107i... \u{1F495}', sub: 'Ne brinite, ja \u0107u vas \u010Duvati!' },
    6: { main: 'Njanjanja! Nisi me uhvatio! \u{1F61D}', sub: 'Be\u017Ei kasapine, be\u017Ei!' },
  };
  const lvl7plus = [
    { main: 'L-E-G-E-N-D-A! \u{1F3C6}', sub: 'Ovo ni Chuck Norris ne bi pre\u017Eiveo!' },
    { main: 'NEUNI\u0160TIVA! \u{1F4AA}', sub: 'Kasica za predsednika!' },
    { main: 'BESMRTNA! \u2B50', sub: 'Ovo zaslu\u017Euje Oskara!' },
    { main: 'NEPOKOLEBLJIVA! \u{1F525}', sub: '\u010Cak se i \u0111avoli pla\u0161e mene!' },
  ];
  if (texts[level]) return texts[level];
  return lvl7plus[(level - 7) % lvl7plus.length];
}

function drawLevelEndAnimation(level, timer) {
  const pigX = WIDTH / 2;
  const pigY = HEIGHT / 2 + 30;

  switch (level) {
    case 1: {
      // Bouncing piggy
      const bounceY = -Math.abs(Math.sin(timer * 4)) * (20 + timer * 5);
      drawPiggySprite(pigX, pigY + bounceY, 0, 'happy');
      break;
    }
    case 2: {
      // Farting piggy with growing green cloud
      drawPiggySprite(pigX, pigY, 0, 'farting');
      // Growing green cloud
      const cloudSize = Math.min(timer * 40, 120);
      const cloudGrad = ctx.createRadialGradient(pigX, pigY + 10, 0, pigX, pigY + 10, cloudSize);
      cloudGrad.addColorStop(0, 'rgba(80, 180, 30, 0.4)');
      cloudGrad.addColorStop(0.6, 'rgba(100, 200, 40, 0.2)');
      cloudGrad.addColorStop(1, 'rgba(120, 220, 50, 0)');
      ctx.fillStyle = cloudGrad;
      ctx.beginPath();
      ctx.arc(pigX - 20, pigY + 10, cloudSize, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(pigX + 15, pigY + 15, cloudSize * 0.8, 0, Math.PI * 2);
      ctx.fill();
      // Stink lines
      ctx.font = '20px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      for (let i = 0; i < 4; i++) {
        const angle = timer * 2 + i * 1.5;
        ctx.globalAlpha = 0.5;
        ctx.fillText('\u{1F4A8}', pigX - 30 + Math.cos(angle) * cloudSize * 0.5, pigY + Math.sin(angle) * cloudSize * 0.3);
      }
      ctx.globalAlpha = 1.0;
      break;
    }
    case 3: {
      // Play dead then spring up
      if (timer < 1.5) {
        // Lying on side with X eyes
        ctx.save();
        ctx.translate(pigX, pigY);
        ctx.rotate(Math.PI / 2);
        drawPiggySprite(0, 0, 0, 'normal');
        ctx.restore();
        // X eyes
        ctx.font = 'bold 16px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillStyle = '#000';
        ctx.fillText('X  X', pigX + 5, pigY - 10);
      } else {
        // Spring up!
        const springT = timer - 1.5;
        const springY = -Math.abs(Math.sin(springT * 6)) * 30;
        const springAngle = Math.sin(springT * 8) * 0.2;
        ctx.save();
        ctx.translate(pigX, pigY + springY);
        ctx.rotate(springAngle);
        drawPiggySprite(0, 0, 0, 'happy');
        ctx.restore();
        // Surprise effect
        if (springT < 0.5) {
          ctx.font = '30px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('\u2757', pigX + 30, pigY - 40 + springY);
        }
      }
      break;
    }
    case 4: {
      // Victory dance - sway left and right
      const swayX = Math.sin(timer * 3) * 30;
      const scalePulse = 1 + Math.sin(timer * 6) * 0.1;
      ctx.save();
      ctx.translate(pigX + swayX, pigY);
      ctx.scale(scalePulse, scalePulse);
      drawPiggySprite(0, 0, Math.sin(timer * 3), 'happy');
      ctx.restore();
      // Crown
      ctx.font = '30px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('\u{1F451}', pigX + swayX, pigY - 40);
      break;
    }
    case 5: {
      // Hugging coins
      drawPiggySprite(pigX, pigY, 1, 'happy');
      // Pile of coins
      ctx.font = '24px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const coinEmojis = ['\u{1FA99}', '\u{1F4B0}', '\u{1F4B5}', '\u{1FA99}', '\u{1FA99}'];
      for (let i = 0; i < coinEmojis.length; i++) {
        const cx = pigX + 40 + (i % 3) * 15 - 10;
        const cy = pigY + 10 - Math.floor(i / 3) * 20;
        ctx.fillText(coinEmojis[i], cx, cy);
      }
      // Hearts
      if (timer > 0.5) {
        ctx.font = '18px sans-serif';
        for (let i = 0; i < 3; i++) {
          const hx = pigX + 20 + Math.sin(timer * 2 + i * 2) * 20;
          const hy = pigY - 30 - i * 15 - timer * 5;
          ctx.globalAlpha = Math.max(0, 1 - timer * 0.15 + i * 0.1);
          ctx.fillText('\u2764\uFE0F', hx, hy);
        }
        ctx.globalAlpha = 1.0;
      }
      break;
    }
    case 6: {
      // Tongue out at butcher
      drawPiggySprite(pigX - 30, pigY, -1, 'happy');
      // Tongue
      ctx.fillStyle = '#ff6666';
      ctx.beginPath();
      ctx.ellipse(pigX - 65, pigY + 2, 6, 10, 0.2, 0, Math.PI * 2);
      ctx.fill();
      // Tiny butcher running away
      const butcherX = pigX + 80 + timer * 40;
      ctx.font = '24px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.globalAlpha = Math.max(0, 1 - timer * 0.2);
      ctx.fillText('\u{1F9D1}\u200D\u{1F373}', butcherX, pigY);
      ctx.font = '12px sans-serif';
      ctx.fillText('\u{1F4A8}', butcherX - 20, pigY);
      ctx.globalAlpha = 1.0;
      break;
    }
    default: {
      // Level 7+: Epic celebration - spinning piggy with confetti
      ctx.save();
      ctx.translate(pigX, pigY);
      ctx.rotate(timer * 3);
      const epicScale = 1 + Math.sin(timer * 5) * 0.15;
      ctx.scale(epicScale, epicScale);
      drawPiggySprite(0, 0, 0, 'happy');
      ctx.restore();
      // Extra confetti
      ctx.font = '18px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const confettiChars = ['\u{1F389}', '\u{1F38A}', '\u2728', '\u2B50', '\u{1F451}', '\u{1F4AB}'];
      for (let i = 0; i < 15; i++) {
        const angle = timer * 1.5 + i * 0.42;
        const dist = 60 + i * 10 + Math.sin(timer * 2 + i) * 20;
        const cx = pigX + Math.cos(angle) * dist;
        const cy = pigY + Math.sin(angle) * dist * 0.6;
        ctx.globalAlpha = 0.6 + 0.4 * Math.sin(timer * 4 + i);
        ctx.fillText(confettiChars[i % confettiChars.length], cx, cy);
      }
      ctx.globalAlpha = 1.0;
      break;
    }
  }
}

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = '28px sans-serif';
  for (const coin of titleCoins) {
    ctx.globalAlpha = coin.alpha;
    ctx.fillText(coin.emoji, coin.x, coin.y);
  }
  ctx.globalAlpha = 1.0;

  // Title
  ctx.font = 'bold 52px sans-serif';
  ctx.fillStyle = '#2d2d2d';
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 4;
  ctx.strokeText('\u{1F437} Kasica Prasica \u{1F437}', WIDTH / 2, HEIGHT / 2 - 50);
  ctx.fillText('\u{1F437} Kasica Prasica \u{1F437}', WIDTH / 2, HEIGHT / 2 - 50);

  // Serbian subtitle
  ctx.font = '22px sans-serif';
  ctx.fillStyle = '#555';
  ctx.lineWidth = 1;
  ctx.fillText('Hvataj nov\u010di\u0107e! Izbegavaj bombe!', WIDTH / 2, HEIGHT / 2 + 10);

  // Start prompt (pulsing)
