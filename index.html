function resizeCanvas() {
  const isMobile = 'ontouchstart' in window || window.innerWidth < 800;
  const touchH = isMobile ? 110 : 0; // reserve space for touch controls at bottom
  const availW = window.innerWidth;
  const availH = window.innerHeight - touchH;

  if (isMobile) {
    // Mobile: fill available width, scale height proportionally
    canvas.style.width = availW + 'px';
    const proportionalH = availW * HEIGHT / WIDTH;
    // If proportional height fits, use it; otherwise fill available height
    if (proportionalH <= availH) {
      canvas.style.height = proportionalH + 'px';
    } else {
      canvas.style.height = availH + 'px';
      canvas.style.width = (availH * WIDTH / HEIGHT) + 'px';
    }
  } else {
    // Desktop: fit within window preserving aspect ratio
    const scale = Math.min(availW / WIDTH, availH / HEIGHT);
    canvas.style.width = (WIDTH * scale) + 'px';
    canvas.style.height = (HEIGHT * scale) + 'px';
  }
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);
window.addEventListener('orientationchange', () => { setTimeout(resizeCanvas, 100); });

function toggleFullscreen() {
  const elem = document.documentElement;
  if (!document.fullscreenElement && !document.webkitFullscreenElement) {
    // Try standard Fullscreen API first
    if (elem.requestFullscreen) {
      elem.requestFullscreen().catch(() => {});
    } else if (elem.webkitRequestFullscreen) {
      // Safari/iOS older versions
      elem.webkitRequestFullscreen();
    }
  } else {
    if (document.exitFullscreen) {
      document.exitFullscreen().catch(() => {});
    } else if (document.webkitExitFullscreen) {
      document.webkitExitFullscreen();
    }
  }
}

// Fullscreen button - use touchend for mobile (required for user gesture)
const fsBtn = document.getElementById('fullscreenBtn');
fsBtn.addEventListener('touchend', function(e) {
  e.preventDefault();
  e.stopPropagation();
  toggleFullscreen();
}, { passive: false });
fsBtn.addEventListener('click', function(e) {
  // Desktop click fallback (touchend already handles mobile)
  if (!('ontouchstart' in window)) toggleFullscreen();
});

// --- Level Configuration (with difficulty tuning) ---
function getLevelConfig(level) {
  // HARD MODE: tons of devils, fast bombs, chaos!
  let spawnRate, fallSpeed, devilCount, bombChance, billChance, goldChance, duration;

  if (level === 1) {
    duration = 30;
    fallSpeed = 154;
    spawnRate = 0.65;
    devilCount = 3;
    bombChance = 0.12;
    billChance = 0.10;
    goldChance = 0.03;
  } else if (level === 2) {
    duration = 35;
    fallSpeed = 189;
    spawnRate = 0.52;
    devilCount = 6;
    bombChance = 0.18;
    billChance = 0.15;
    goldChance = 0.05;
  } else if (level === 3) {
    duration = 35;
    fallSpeed = 224;
    spawnRate = 0.455;
    devilCount = 9;
    bombChance = 0.22;
    billChance = 0.20;
    goldChance = 0.07;
  } else if (level === 4) {
    duration = 40;
    fallSpeed = 259;
    spawnRate = 0.364;
    devilCount = 12;
    bombChance = 0.28;
    billChance = 0.20;
    goldChance = 0.08;
  } else if (level === 5) {
    duration = 40;
    fallSpeed = 294;
    spawnRate = 0.286;
    devilCount = 15;
    bombChance = 0.32;
    billChance = 0.25;
    goldChance = 0.10;
  } else if (level === 6) {
    duration = 45;
    fallSpeed = 329;
    spawnRate = 0.234;
    devilCount = 18;
    bombChance = 0.35;
    billChance = 0.25;
    goldChance = 0.10;
  } else if (level === 7) {
    duration = 45;
    fallSpeed = 364;
    spawnRate = 0.195;
    devilCount = 22;
    bombChance = 0.38;
    billChance = 0.25;
    goldChance = 0.12;
  } else {
    // Level 8+: ABSOLUTE CHAOS
    duration = 40 + level * 3;
    fallSpeed = (480 + level * 35) * 0.7;
    spawnRate = Math.max(0.13, 0.195 - (level - 7) * 0.013);
    devilCount = Math.floor((25 + level * 3) * 0.75);
    bombChance = Math.min(0.50, 0.35 + (level - 7) * 0.03);
    billChance = 0.25;
    goldChance = 0.12;
  }

  return { duration, fallSpeed, spawnRate, devilCount, bombChance, billChance, goldChance };
}

// --- Particle System ---
const particles = [];
const MAX_PARTICLES = 100;

function spawnParticles(x, y, emoji, count, spread) {
  for (let i = 0; i < count; i++) {
    if (particles.length >= MAX_PARTICLES) break;
    particles.push({
      x, y,
      emoji: emoji,
      size: 12 + Math.random() * 8,
      vx: (Math.random() - 0.5) * (spread || 200),
      vy: -Math.random() * 250 - 50,
      gravity: 400,
      life: 1.0,
      decay: 0.8 + Math.random() * 0.5
    });
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt;
    p.vy += p.gravity * dt;
    p.y += p.vy * dt;
    p.life -= p.decay * dt;
    if (p.life <= 0) {
      particles.splice(i, 1);
    }
  }
}

function drawParticles() {
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.font = p.size + 'px sans-serif';
    ctx.fillText(p.emoji, p.x, p.y);
  }
  ctx.globalAlpha = 1.0;
}

// --- Screen Shake ---
let screenShake = { intensity: 0, duration: 0 };
function triggerScreenShake(intensity, duration) {
  screenShake.intensity = intensity;
  screenShake.duration = duration;
}

function updateScreenShake(dt) {
  if (screenShake.duration > 0) {
    screenShake.duration -= dt;
    if (screenShake.duration <= 0) {
      screenShake.intensity = 0;
      screenShake.duration = 0;
    }
  }
}

function applyScreenShake() {
  if (screenShake.intensity > 0 && screenShake.duration > 0) {
    const offsetX = (Math.random() - 0.5) * 2 * screenShake.intensity;
    const offsetY = (Math.random() - 0.5) * 2 * screenShake.intensity;
    ctx.translate(offsetX, offsetY);
    return true;
  }
  return false;
}

    p.y += p.vy * dt;
    p.life -= 0.8 * dt;
    if (p.life <= 0) {
      scorePopups.splice(i, 1);
    }
  }
}

function drawScorePopups() {
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (const p of scorePopups) {
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.font = 'bold 22px sans-serif';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 3;
    ctx.strokeText(p.text, p.x, p.y);
    ctx.fillStyle = p.color;
    ctx.fillText(p.text, p.x, p.y);
  }
  ctx.globalAlpha = 1.0;
  ctx.lineWidth = 1;
}

function generateLightningSegments(startX, startY, endY) {
  const segments = [];
  let x = startX;
  let y = startY;
  const step = 30;
  while (y < endY) {
    const nextX = x + (Math.random() - 0.5) * 40;
    const nextY = Math.min(y + step, endY);
    segments.push({ x1: x, y1: y, x2: nextX, y2: nextY });
    x = nextX;
    y = nextY;
  }
  return segments;
}

function updateClouds(dt) {
  for (const cloud of skyClouds) {
    cloud.x += cloud.speed * dt;
    if (cloud.x > WIDTH + cloud.w) cloud.x = -cloud.w;
  }
}

// --- Audio ---
let audioCtx = null;
let audioUnlocked = false;
function getAudioContext() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
// Unlock audio on ANY user interaction (click, touch, key)
function unlockAudio() {
  if (audioUnlocked) return;
  const ctx = getAudioContext();
  if (ctx.state === 'suspended') ctx.resume();
  // Play a silent buffer to fully unlock
  const buf = ctx.createBuffer(1, 1, 22050);
  const src = ctx.createBufferSource();
  src.buffer = buf;
  src.connect(ctx.destination);
  src.start(0);
  audioUnlocked = true;
}
document.addEventListener('click', unlockAudio);
document.addEventListener('touchstart', unlockAudio);
document.addEventListener('keydown', unlockAudio, { once: false });

// --- Intro Scene Music ---
function stopIntroMusic() {
  currentIntroMusic = -1;
  if (introMusicTimeout) { clearTimeout(introMusicTimeout); introMusicTimeout = null; }
  introMusicNodes.forEach(n => { try { n.stop(); } catch(e) {} });
  introMusicNodes = [];
}

function scheduleIntroLoop(sceneIndex, duration) {
  introMusicTimeout = setTimeout(() => {
    if (currentIntroMusic === sceneIndex) {
      introMusicNodes.forEach(n => { try { n.stop(); } catch(e) {} });
      introMusicNodes = [];
      currentIntroMusic = -1;
      playIntroMusic(sceneIndex);
    }
  }, duration * 1000 - 50);
}

function playHappyFarmTheme(actx, now, nodes, master) {
  master.gain.value = 0.08;
  const duration = 8;
  const beatLen = 0.5;

  // Sine pad: soft C major chord (C4+E4+G4)
  [261.6, 329.6, 392.0].forEach(freq => {
    const pad = actx.createOscillator();
    pad.type = 'sine';
    pad.frequency.value = freq;
    const padGain = actx.createGain();
    padGain.gain.value = 0.15;
    pad.connect(padGain);
    padGain.connect(master);
    pad.start(now);
    pad.stop(now + duration);
    nodes.push(pad);
  });

  // Triangle wave melody: bouncy C major arpeggio
  const melodyNotes = [523.3, 659.3, 784.0, 1046.5, 784.0, 659.3, 523.3, 659.3,
                       784.0, 1046.5, 784.0, 659.3, 523.3, 784.0, 1046.5, 784.0];
  const melOsc = actx.createOscillator();
  melOsc.type = 'triangle';
  const melGain = actx.createGain();
  melGain.gain.value = 0.25;
  melOsc.connect(melGain);
  melGain.connect(master);
  for (let i = 0; i < melodyNotes.length; i++) {
    const t = now + i * beatLen;
    melOsc.frequency.setValueAtTime(melodyNotes[i], t);
    melGain.gain.setValueAtTime(0.25, t);
    melGain.gain.linearRampToValueAtTime(0.12, t + beatLen * 0.8);
  }
  melOsc.start(now);
  melOsc.stop(now + duration);
  nodes.push(melOsc);

  // Bird chirps
  for (let i = 0; i < 8; i++) {
    const chirpTime = now + 0.5 + i * 0.9 + Math.sin(i * 3.7) * 0.3;
    const chirpFreq = 2500 + Math.sin(i * 2.1) * 800;
    const chirp = actx.createOscillator();
    chirp.type = 'sine';
    chirp.frequency.setValueAtTime(chirpFreq, chirpTime);
    chirp.frequency.linearRampToValueAtTime(chirpFreq * 1.3, chirpTime + 0.04);
    chirp.frequency.linearRampToValueAtTime(chirpFreq * 0.9, chirpTime + 0.08);
    const chirpGain = actx.createGain();
    chirpGain.gain.setValueAtTime(0, chirpTime);
    chirpGain.gain.linearRampToValueAtTime(0.15, chirpTime + 0.01);
    chirpGain.gain.linearRampToValueAtTime(0, chirpTime + 0.1);
    chirp.connect(chirpGain);
    chirpGain.connect(master);
    chirp.start(chirpTime);
    chirp.stop(chirpTime + 0.12);
    nodes.push(chirp);
  }

  scheduleIntroLoop(0, duration);
}

function playDarkTheme(actx, now, nodes, master) {
  master.gain.value = 0.07;

  // Square wave low drone: alternating C2 and Db2
  const drone = actx.createOscillator();

  }
  drone.start(now);
  drone.stop(now + duration);

  // Sawtooth slow melody: Eb3-Db3-C3-B2 descending chromatic

  melOsc.start(now);
  melOsc.stop(now + duration);

  // Low rumble noise bursts
  for (let i = 0; i < 4; i++) {

    lpf.connect(nGain);
    nGain.connect(master);
    noise.start(rumbleTime);
    noise.stop(rumbleTime + 0.5);

  // Heartbeat: two quick low thumps every 2 seconds
  for (let i = 0; i < 4; i++) {

      kickGain.connect(master);
      kick.start(thumpTime);
      kick.stop(thumpTime + 0.2);
      nodes.push(kick);

function playHopeTheme(actx, now, nodes, master) {
  master.gain.value = 0.08;
  const duration = 8;

  // Triangle melody: minor to major transition
  // First half: C4-Eb4-G4-C5 (minor feel), second half: C4-E4-G4-C5 (major!)
  const hopeNotes = [
    261.6, 311.1, 392.0, 523.3,  // C minor arpeggio
    261.6, 329.6, 392.0, 523.3,  // C major arpeggio!
    329.6, 392.0, 523.3, 659.3,  // ascending higher
    392.0, 523.3, 659.3, 784.0   // even higher - rising hope
  ];
  const noteDur = duration / hopeNotes.length;
  const melOsc = actx.createOscillator();
  melOsc.type = 'triangle';
  const melGain = actx.createGain();
  melOsc.connect(melGain);
  melGain.connect(master);
  for (let i = 0; i < hopeNotes.length; i++) {
    const t = now + i * noteDur;
    melOsc.frequency.setValueAtTime(hopeNotes[i], t);
    // Crescendo effect: volume builds over time
    const vol = 0.15 + (i / hopeNotes.length) * 0.15;
    melGain.gain.setValueAtTime(vol, t);
  }
  melOsc.start(now);
  melOsc.stop(now + duration);
  nodes.push(melOsc);

  // Sine pad: builds up, adds notes over time
  const padFreqs = [261.6, 329.6, 392.0];
  padFreqs.forEach((freq, idx) => {
    const pad = actx.createOscillator();
    pad.type = 'sine';
    pad.frequency.value = freq;
    const padGain = actx.createGain();
    // Each note fades in later for building effect
    padGain.gain.setValueAtTime(0, now);
    padGain.gain.linearRampToValueAtTime(0.12, now + idx * 1.5 + 1.5);
    pad.connect(padGain);
    padGain.connect(master);
    pad.start(now);
    pad.stop(now + duration);
    nodes.push(pad);
  });

  // Light percussion: soft hi-hat every beat, tempo accelerates
  for (let i = 0; i < 16; i++) {
    // Tempo: starts at ~100 BPM (0.6s), accelerates to ~130 BPM (0.46s)
    const beatTime = now + i * (0.6 - i * 0.009);
    if (beatTime >= now + duration) break;
    const hhBuf = actx.createBuffer(1, actx.sampleRate * 0.03, actx.sampleRate);
    const hhData = hhBuf.getChannelData(0);
    for (let s = 0; s < hhData.length; s++) hhData[s] = (Math.random() * 2 - 1) * (1 - s / hhData.length);
    const hh = actx.createBufferSource();
    hh.buffer = hhBuf;
    const hhFilter = actx.createBiquadFilter();
    hhFilter.type = 'highpass';
    hhFilter.frequency.value = 7000;
    const hhGain = actx.createGain();
    hhGain.gain.setValueAtTime(0.3 + i * 0.02, beatTime);
    hhGain.gain.linearRampToValueAtTime(0, beatTime + 0.03);
    hh.connect(hhFilter);
    hhFilter.connect(hhGain);
    hhGain.connect(master);
    hh.start(beatTime);
    hh.stop(beatTime + 0.03);
    nodes.push(hh);
  }

  scheduleIntroLoop(currentIntroMusic, duration);
}

function forceRestartIntroMusic() {
  // Called after user gesture unlocks audio - force music for current scene
  currentIntroMusic = -1; // reset so playIntroMusic won't skip
}

function playIntroMusic(sceneIndex) {
  if (currentIntroMusic === sceneIndex) return;
  stopIntroMusic();
  if (!audioUnlocked) return; // browser hasn't had user gesture yet
  currentIntroMusic = sceneIndex;

  try {
    const actx = getAudioContext();
    const now = actx.currentTime;
    const nodes = [];
    const master = actx.createGain();
    master.connect(actx.destination);

    switch(sceneIndex) {
      case 0: playHappyFarmTheme(actx, now, nodes, master); break;
      case 1: playDarkTheme(actx, now, nodes, master); break;
      case 2: playSadTheme(actx, now, nodes, master); break;
      case 3: case 4: playHopeTheme(actx, now, nodes, master); break;
      case 5: playTutorialTheme(actx, now, nodes, master); break;
    }

    introMusicNodes = nodes;
  } catch(e) {}
}

function playSqueal() {
  try {
  const actx = getAudioContext();
  const t = actx.currentTime;
  const duration = 0.5;

  // Layer 1: Main vocal scream - starts at 600Hz, sweeps to 1500Hz
  const osc1 = actx.createOscillator();
  osc1.type = 'sawtooth';
  osc1.frequency.setValueAtTime(600, t);
  osc1.frequency.linearRampToValueAtTime(1500, t + 0.08);
  osc1.frequency.linearRampToValueAtTime(1200, t + 0.2);
  osc1.frequency.linearRampToValueAtTime(1800, t + 0.35);
  osc1.frequency.linearRampToValueAtTime(700, t + duration);

  // Formant filter for vocal/animal quality
  const formant1 = actx.createBiquadFilter();
  formant1.type = 'bandpass';
  formant1.frequency.value = 1200;
  formant1.Q.value = 4;

  // Amplitude tremolo (fast volume oscillation for screaming quality)
  const tremolo = actx.createOscillator();
  tremolo.frequency.value = 25;
  const tremoloGain = actx.createGain();
  tremoloGain.gain.value = 0.15;
  tremolo.connect(tremoloGain);

  const gain1 = actx.createGain();
  gain1.gain.setValueAtTime(0, t);
  gain1.gain.linearRampToValueAtTime(0.35, t + 0.02);
  gain1.gain.setValueAtTime(0.35, t + 0.15);
  gain1.gain.linearRampToValueAtTime(0.2, t + 0.35);
  gain1.gain.linearRampToValueAtTime(0, t + duration);
  tremoloGain.connect(gain1.gain);

  osc1.connect(formant1);
  formant1.connect(gain1);
  gain1.connect(actx.destination);
  osc1.start(t);
  osc1.stop(t + duration);
  tremolo.start(t);
  tremolo.stop(t + duration);

  // Layer 2: Higher harmonic for piercing screech
  const osc2 = actx.createOscillator();
  osc2.type = 'square';
  osc2.frequency.setValueAtTime(1200, t);
  osc2.frequency.linearRampToValueAtTime(2400, t + 0.06);
  osc2.frequency.linearRampToValueAtTime(1800, t + 0.2);
  osc2.frequency.linearRampToValueAtTime(2800, t + 0.4);
  osc2.frequency.linearRampToValueAtTime(1000, t + duration);

  const formant2 = actx.createBiquadFilter();
  formant2.type = 'bandpass';
  formant2.frequency.value = 2200;
  formant2.Q.value = 3;

  const gain2 = actx.createGain();
  gain2.gain.setValueAtTime(0, t);
  gain2.gain.linearRampToValueAtTime(0.18, t + 0.03);
  gain2.gain.linearRampToValueAtTime(0.12, t + 0.3);
  gain2.gain.linearRampToValueAtTime(0, t + duration);

  osc2.connect(formant2);
  formant2.connect(gain2);
  gain2.connect(actx.destination);
  osc2.start(t);
  osc2.stop(t + duration);

  // Layer 3: Sub-harmonic growl underneath
  const osc3 = actx.createOscillator();
  osc3.type = 'sawtooth';
  osc3.frequency.setValueAtTime(300, t);
  osc3.frequency.linearRampToValueAtTime(500, t + 0.1);
  osc3.frequency.linearRampToValueAtTime(350, t + duration);
  const gain3 = actx.createGain();
  gain3.gain.setValueAtTime(0.1, t);
  gain3.gain.linearRampToValueAtTime(0.05, t + 0.3);
  gain3.gain.linearRampToValueAtTime(0, t + duration);
  osc3.connect(gain3);
  gain3.connect(actx.destination);
  osc3.start(t);
  osc3.stop(t + duration);

  // Noise burst for breathy texture
  const bufferSize = actx.sampleRate * 0.4;
  const buffer = actx.createBuffer(1, bufferSize, actx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) {
    data[i] = (Math.random() * 2 - 1) * 0.3;
  }
  const noise = actx.createBufferSource();
  noise.buffer = buffer;
  const hpFilter = actx.createBiquadFilter();
  hpFilter.type = 'highpass';
  hpFilter.frequency.value = 2500;
  const noiseGain = actx.createGain();
  noiseGain.gain.setValueAtTime(0.1, t);
  noiseGain.gain.linearRampToValueAtTime(0.05, t + 0.2);
  noiseGain.gain.linearRampToValueAtTime(0, t + 0.4);
  noise.connect(hpFilter);
  hpFilter.connect(noiseGain);
  noiseGain.connect(actx.destination);
  noise.start(t);
  noise.stop(t + 0.4);
  } catch (e) {}
}

    osc1.frequency.linearRampToValueAtTime(40, t + 0.4);
    // Vibrato for the "flapping" quality
    const vibrato = ctx.createOscillator();
    vibrato.frequency.value = 25; // fast wobble
    const vibGain = ctx.createGain();
    vibGain.gain.value = 30;
    vibrato.connect(vibGain);
    vibGain.connect(osc1.frequency);

    gain1.gain.setValueAtTime(0.3, t);
    gain1.gain.linearRampToValueAtTime(0.4, t + 0.08);
    gain1.gain.linearRampToValueAtTime(0.2, t + 0.25);
    gain1.gain.linearRampToValueAtTime(0, t + 0.45);

    // Low pass filter for muffled quality
    const lpf = ctx.createBiquadFilter();
    lpf.type = 'lowpass';
    lpf.frequency.value = 400;

    osc1.connect(lpf);
    lpf.connect(gain1);
    gain1.connect(ctx.destination);
    vibrato.start(t);
    osc1.start(t);
    osc1.stop(t + 0.45);
    vibrato.stop(t + 0.45);

    // Noise burst for the "pffft" texture
    const bufSize = ctx.sampleRate * 0.3;
    const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) {
      data[i] = (Math.random() * 2 - 1) * (1 - i/bufSize) * 0.5;
    }
    const noise = ctx.createBufferSource();
    noise.buffer = buf;
    const nGain = ctx.createGain();
    nGain.gain.setValueAtTime(0.15, t);
    nGain.gain.linearRampToValueAtTime(0, t + 0.3);
    const nFilter = ctx.createBiquadFilter();
    nFilter.type = 'lowpass';
    nFilter.frequency.value = 300;
    noise.connect(nFilter);
    nFilter.connect(nGain);
    nGain.connect(ctx.destination);
    noise.start(t);
    noise.stop(t + 0.3);

    // High pitched squeak at the end (like a real fart ending)
    const squeak = ctx.createOscillator();
    const squeakGain = ctx.createGain();
    squeak.type = 'sine';
    squeak.frequency.setValueAtTime(600, t + 0.3);
    squeak.frequency.linearRampToValueAtTime(900, t + 0.38);
    squeakGain.gain.setValueAtTime(0, t + 0.3);
    squeakGain.gain.linearRampToValueAtTime(0.08, t + 0.33);
    squeakGain.gain.linearRampToValueAtTime(0, t + 0.4);
    squeak.connect(squeakGain);
    squeakGain.connect(ctx.destination);
    squeak.start(t + 0.3);
    squeak.stop(t + 0.4);
  } catch(e) {}
}

// --- Background Music System ---
let musicPlaying = false;
let musicNodes = null;
let beatCount = 0;
let beatTimer = 0;
const BPM = 140;
const BEAT_DURATION = 60 / BPM;
let musicLoopTimeout = null;

function playOink(delay) {
  try {
    const actx = getAudioContext();
    const t = actx.currentTime + (delay || 0);
    const duration = 0.25;

    // Main vocal - sawtooth for richness
    const voice = actx.createOscillator();
    voice.type = 'sawtooth';
    voice.frequency.setValueAtTime(180, t);
    voice.frequency.linearRampToValueAtTime(280, t + 0.06);
    voice.frequency.linearRampToValueAtTime(200, t + 0.15);
    voice.frequency.linearRampToValueAtTime(150, t + duration);

    // Vibrato for organic feel
    const vibrato = actx.createOscillator();
    vibrato.frequency.value = 6;
    const vibratoGain = actx.createGain();
    vibratoGain.gain.value = 15;
    vibrato.connect(vibratoGain);
    vibratoGain.connect(voice.frequency);

    // Nasal resonance filter
    const nasal = actx.createBiquadFilter();
    nasal.type = 'bandpass';
    nasal.frequency.value = 1000;
    nasal.Q.value = 3;

    // Envelope
    const env = actx.createGain();
    env.gain.setValueAtTime(0, t);
    env.gain.linearRampToValueAtTime(0.25, t + 0.02);
    env.gain.setValueAtTime(0.25, t + 0.08);
    env.gain.linearRampToValueAtTime(0, t + duration);

    // Oink master gain (louder than music)
    const oinkMaster = actx.createGain();
    oinkMaster.gain.value = 0.5;

    voice.connect(nasal);
    nasal.connect(env);
    env.connect(oinkMaster);
    oinkMaster.connect(actx.destination);
    vibrato.start(t);
    voice.start(t);
    voice.stop(t + duration);
    vibrato.stop(t + duration);
  } catch (e) {}
}

function playDoubleOink() {
  playOink(0);
  playOink(0.18);
}

function startMusic() {
  if (musicPlaying) return;
  musicPlaying = true;
  beatCount = 0;
  beatTimer = 0;
  scheduleMusicalBar();
}

function stopMusic() {
  musicPlaying = false;
  if (musicLoopTimeout) {
    clearTimeout(musicLoopTimeout);
    musicLoopTimeout = null;
  }
  if (musicNodes) {
    musicNodes.forEach(n => { try { n.stop(); } catch(e) {} });
    musicNodes = null;
  }
}

function scheduleMusicalBar() {
  if (!musicPlaying) return;
  try {
    const actx = getAudioContext();
    const now = actx.currentTime;
    const nodes = [];
    const masterGain = actx.createGain();
    masterGain.gain.value = 0.12;
    masterGain.connect(actx.destination);

    const beatLen = BEAT_DURATION;
    const barLen = beatLen * 4;
    const totalBars = 4;
    const totalDuration = barLen * totalBars;

    // --- Bass line (square wave, low) ---
    // 4 bars: C2-C2-Eb2-G2 | Ab1-Ab1-G1-F1 | C2-C2-Eb2-G2 | Ab1-Ab1-G1-F1
    const bassNotes = [
      65.41, 65.41, 77.78, 98.00,
      51.91, 51.91, 49.00, 43.65,
      65.41, 65.41, 77.78, 98.00,
      51.91, 51.91, 49.00, 43.65
    ];
    const bassOsc = actx.createOscillator();
    bassOsc.type = 'square';
    const bassGain = actx.createGain();
    bassGain.gain.value = 0.35;
    bassOsc.connect(bassGain);
    bassGain.connect(masterGain);
    for (let i = 0; i < bassNotes.length; i++) {
      const t = now + i * beatLen;
      bassOsc.frequency.setValueAtTime(bassNotes[i], t);
    }
    bassOsc.start(now);
    bassOsc.stop(now + totalDuration);
    nodes.push(bassOsc);

    // --- Melody (triangle wave, higher octave) ---
    // 8th notes = beatLen/2, 32 notes total for 4 bars
    const melodyNotes = [
      // Bar 1: C4-Eb4-G4-C5 ascending playful
      261.6, 311.1, 392.0, 523.3, 392.0, 311.1, 261.6, 311.1,
      // Bar 2: Bb3-G3-Eb4-C4
      233.1, 196.0, 311.1, 261.6, 311.1, 392.0, 523.3, 392.0,
      // Bar 3: Ab3-Bb3-C4-Eb4
      207.7, 233.1, 261.6, 311.1, 392.0, 523.3, 392.0, 311.1,
      // Bar 4: G3-Eb3-C4-G3 resolution
      196.0, 155.6, 261.6, 196.0, 261.6, 311.1, 261.6, 196.0
    ];
    const melOsc = actx.createOscillator();
    melOsc.type = 'triangle';
    const melGain = actx.createGain();
    melGain.gain.value = 0.25;
    melOsc.connect(melGain);
    melGain.connect(masterGain);
    const eighthNote = beatLen / 2;
    for (let i = 0; i < melodyNotes.length; i++) {
      const t = now + i * eighthNote;
      melOsc.frequency.setValueAtTime(melodyNotes[i], t);
      // Add slight volume pulse per note for bounce
      melGain.gain.setValueAtTime(0.25, t);
      melGain.gain.linearRampToValueAtTime(0.15, t + eighthNote * 0.8);
    }
    melOsc.start(now);
    melOsc.stop(now + totalDuration);
    nodes.push(melOsc);

    // --- Percussion ---
    // Kick on beats 1,3 - low noise burst
    // Snare on beats 2,4 - mid noise burst
    // Hi-hat on every beat - high noise short
    for (let bar = 0; bar < totalBars; bar++) {
      for (let beat = 0; beat < 4; beat++) {
        const t = now + (bar * 4 + beat) * beatLen;

        // Hi-hat (every beat)
        const hhBuf = actx.createBuffer(1, actx.sampleRate * 0.03, actx.sampleRate);
        const hhData = hhBuf.getChannelData(0);
        for (let s = 0; s < hhData.length; s++) hhData[s] = (Math.random() * 2 - 1) * (1 - s / hhData.length);
        const hh = actx.createBufferSource();
        hh.buffer = hhBuf;
        const hhFilter = actx.createBiquadFilter();
        hhFilter.type = 'highpass';
        hhFilter.frequency.value = 7000;
        const hhGain = actx.createGain();
        hhGain.gain.setValueAtTime(0.6, t);
        hhGain.gain.linearRampToValueAtTime(0, t + 0.03);
        hh.connect(hhFilter);
        hhFilter.connect(hhGain);
        hhGain.connect(masterGain);
        hh.start(t);
        hh.stop(t + 0.03);
        nodes.push(hh);

        if (beat === 0 || beat === 2) {
          // Kick
          const kickOsc = actx.createOscillator();
          kickOsc.type = 'sine';
          kickOsc.frequency.setValueAtTime(150, t);
          kickOsc.frequency.linearRampToValueAtTime(40, t + 0.1);
          const kickGain = actx.createGain();
          kickGain.gain.setValueAtTime(0.7, t);
          kickGain.gain.linearRampToValueAtTime(0, t + 0.1);
          kickOsc.connect(kickGain);
          kickGain.connect(masterGain);
          kickOsc.start(t);
          kickOsc.stop(t + 0.1);
          nodes.push(kickOsc);
        }

        if (beat === 1 || beat === 3) {
          // Snare
          const snBuf = actx.createBuffer(1, actx.sampleRate * 0.08, actx.sampleRate);
          const snData = snBuf.getChannelData(0);
          for (let s = 0; s < snData.length; s++) snData[s] = (Math.random() * 2 - 1) * (1 - s / snData.length);
          const sn = actx.createBufferSource();
          sn.buffer = snBuf;
          const snFilter = actx.createBiquadFilter();
          snFilter.type = 'bandpass';
          snFilter.frequency.value = 3000;
          snFilter.Q.value = 1;
          const snGain = actx.createGain();
          snGain.gain.setValueAtTime(0.5, t);
          snGain.gain.linearRampToValueAtTime(0, t + 0.08);
          sn.connect(snFilter);
          snFilter.connect(snGain);
          snGain.connect(masterGain);
          sn.start(t);
          sn.stop(t + 0.08);
          nodes.push(sn);
        }
      }
    }

    // Store nodes so we can stop them
    if (musicNodes) {
      musicNodes.forEach(n => { try { n.stop(); } catch(e) {} });
    }
    musicNodes = nodes;

    // Schedule next bar slightly before current ends
    const scheduleAhead = totalDuration * 1000 - 100;
    musicLoopTimeout = setTimeout(() => {
      if (musicPlaying) scheduleMusicalBar();
    }, scheduleAhead);

  } catch (e) {}
}

// --- Coin Types (drawn as real coins, not emoji) ---
const COIN_TYPES = [
  { type: 'bronze', value: 1, weight: 60, colors: ['#CD7F32', '#A0522D', '#8B4513'], label: '1' },
  { type: 'silver', value: 5, weight: 25, colors: ['#C0C0C0', '#A8A8A8', '#808080'], label: '5' },
  { type: 'gold',   value: 10, weight: 15, colors: ['#FFD700', '#DAA520', '#B8860B'], label: '10' }
];

function drawCoin(x, y, size, coinType, time) {
  const r = size / 2;
  // Shimmer effect
  const shimmer = 0.08 * Math.sin(time * 5 + x * 0.1);

  // Outer ring (darker)
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fillStyle = coinType.colors[2];
  ctx.fill();
  ctx.closePath();

  // Inner face (main color + shimmer)
  ctx.beginPath();
  ctx.arc(x, y, r * 0.85, 0, Math.PI * 2);
  const grad = ctx.createRadialGradient(x - r * 0.2, y - r * 0.2, 0, x, y, r * 0.85);
  grad.addColorStop(0, lightenColor(coinType.colors[0], 0.3 + shimmer));
  grad.addColorStop(0.7, coinType.colors[0]);
  grad.addColorStop(1, coinType.colors[1]);
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.closePath();

  // Shine highlight (top-left)
  ctx.beginPath();
  ctx.arc(x - r * 0.25, y - r * 0.25, r * 0.3, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,' + (0.4 + shimmer) + ')';
  ctx.fill();
  ctx.closePath();

  // Value text
  ctx.font = 'bold ' + (r * 1.1) + 'px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = coinType.colors[2];
  ctx.fillText(coinType.label, x + 1, y + 1); // shadow
  ctx.fillStyle = '#fff';
  ctx.fillText(coinType.label, x, y);
  ctx.textBaseline = 'alphabetic'; // restore default
}

function lightenColor(hex, amount) {
  const num = parseInt(hex.slice(1), 16);
  let r = Math.min(255, ((num >> 16) & 0xFF) + Math.floor(255 * amount));
  let g = Math.min(255, ((num >> 8) & 0xFF) + Math.floor(255 * amount));
  let b = Math.min(255, (num & 0xFF) + Math.floor(255 * amount));
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}

// --- Special item types (emoji-based, rarer, higher value) ---
const SPECIAL_TYPES = [
  { type: 'bill', emoji: '💵', value: 20, size: 42 },
  { type: 'moneybag', emoji: '💰', value: 30, size: 48 }
];

function pickCoinType() {
  if (!game.levelConfig) return COIN_TYPES[0];
  const cfg = game.levelConfig;
  const roll = Math.random();
  if (roll < cfg.goldChance) return COIN_TYPES[2];
  if (roll < cfg.goldChance + cfg.billChance) return COIN_TYPES[1];
  return COIN_TYPES[0];
}

function spawnObject() {
  const cfg = game.levelConfig;

  }

  // Corn for fart refill (only when farts < max)

    });

  // Rare special items: bill (💵 +20) and moneybag (💰 +30)

    objects.push({

      x: Math.random() * (WIDTH - sp.size) + sp.size / 2,
      y: -sp.size / 2,
      width: sp.size, height: sp.size,
      speed: fallSpeed * 0.7, // falls slower - it's heavy!
      emoji: sp.emoji,
      value: sp.value
    });
    return;
  }
  if (specialRoll < moneybagChance + billChanceSpecial) {
    const sp = SPECIAL_TYPES[0]; // bill
    objects.push({
      type: 'special',
      specialType: sp,
      x: Math.random() * (WIDTH - sp.size) + sp.size / 2,
      y: -sp.size / 2,
      width: sp.size, height: sp.size,
      speed: fallSpeed * 0.85, // floats a bit
      emoji: sp.emoji,
      value: sp.value

  }

function playKnifeSound() {

    osc.type = 'square';
    osc.frequency.setValueAtTime(2000, t);
    osc.frequency.linearRampToValueAtTime(4000, t + 0.03);

    osc.start(t);
    osc.stop(t + 0.08);
  } catch(e) {}
}

// --- Level Management ---
function startLevel() {
  const cfg = getLevelConfig(game.level);
  game.levelConfig = cfg;
  game.levelTimer = cfg.duration;
  game.devilsSpawned = 0;
  game.cracks = 0;
  game.latchedDevil = null;
  game.lastScore = game.score;

  // Calculate devil spawn schedule - start early, come in waves!
  game.devilSchedule = [];
  if (cfg.devilCount > 0) {
    const availableTime = cfg.duration - 3; // start after just 3 seconds
    const interval = availableTime / (cfg.devilCount + 1);
    for (let i = 1; i <= cfg.devilCount; i++) {
      // Add some randomness so devils don't come perfectly evenly
      const jitter = (Math.random() - 0.5) * interval * 0.4;
      const spawnAt = cfg.duration - (3 + interval * i) + jitter;
      game.devilSchedule.push(Math.max(1, spawnAt));
    }
    game.devilSchedule.sort((a, b) => b - a); // sort descending (highest time first)
  }

  // Calculate butcher spawn schedule - butchers appear from level 2+
  game.butcherSchedule = [];
  if (game.level >= 2) {
    const butcherCount = Math.max(0, Math.floor(game.level / 2)); // 1 at level 2-3, 2 at level 4-5, etc.
    if (butcherCount > 0) {
      const availableTime = cfg.duration - 8;
      const interval = availableTime / (butcherCount + 1);
      for (let i = 1; i <= butcherCount; i++) {
        const jitter = (Math.random() - 0.5) * interval * 0.3;
        const spawnAt = cfg.duration - (8 + interval * i) + jitter;
        game.butcherSchedule.push(Math.max(2, spawnAt));
      }
      game.butcherSchedule.sort((a, b) => b - a);
    }
  }

  // Reset fart state
  fartCharges = MAX_FARTS; // refill farts each level
  // Reset per-level power-ups (shield persists)
  scoreMultiplier = 1;
  turboFart = false;
  megaPoop = false;
  fartClouds.length = 0;
  chokingDevils.length = 0;
  fartCooldown = 0;

  // Clear everything
  objects.length = 0;
  ejectedCoins.length = 0;
  particles.length = 0;
  scorePopups.length = 0;
  spawnTimer = 0;
  flashTimer = 0;
  lastShakeKey = null;
  squealTimer = 0;
  successFlashTimer = 0;
  shakeHintTimer = 0;
  shakeVisualOffset = 0;
  shakeVisualTimer = 0;
  screenShake.intensity = 0;
  screenShake.duration = 0;
  lightningBolts.length = 0;
  lightningWarning = null;
  lightningSpawnTimer = 5;
  groundEnemies.length = 0;
  groundEnemySpawnTimer = 3;
  poops.length = 0;
  poopCooldown = 0;
  isPooping = false;
  poopAnimTimer = 0;
  vegan = null;
  veganDeathAnim = null;
  if (game.level >= 2 && Math.random() < 0.10) {
    vegan = {
      x: WIDTH / 2 + (Math.random() - 0.5) * 200,
      y: HEIGHT - 50,
      width: 40, height: 50,
      hp: 3, maxHp: 3,
      dir: 1, speed: 80,
      state: 'patrol',
      blockTimer: 0,
      auraTimer: 0
    };
  }
  piggyDamageTimer = 0;
  scoreBounceFactor = 0;
  player.x = WIDTH / 2;
  player.y = player.groundY;
  player.vy = 0;
  player.grounded = true;
  player.facing = 0;
  player.facingSmooth = 0;

  isPaused = false;
  game.screen = 'playing';
  startMusic();
}

// --- Input ---
const keys = {};
window.addEventListener('keydown', (e) => {
  // Don't process game keys during name input or shop
  if (game.screen === 'nameInput' || game.screen === 'shop') return;
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' '].includes(e.key)) {
    e.preventDefault();
  }

  // Pause toggle
  if ((e.key === 'p' || e.key === 'P' || e.key === 'Escape') && game.screen === 'playing') {
    isPaused = !isPaused;
    e.preventDefault();
    return;
  }

  // Don't process gameplay keys while paused
  if (isPaused) return;

  keys[e.key] = true;

  // Jump (only when grounded and no latched devil)
  if (e.key === 'ArrowUp' && game.screen === 'playing' && player.grounded && !game.latchedDevil) {
    player.vy = player.jumpForce;
    player.grounded = false;
  }

  // Shake detection when devil is latched
  if (game.latchedDevil && game.screen === 'playing') {
    if (e.key === 'ArrowUp' && lastShakeKey !== 'up') {
      game.latchedDevil.shakeProgress++;
      lastShakeKey = 'up';
      shakeVisualOffset = -5;
      shakeVisualTimer = 0.08;
      playShakeSound();
    } else if (e.key === 'ArrowDown' && lastShakeKey !== 'down') {
      game.latchedDevil.shakeProgress++;
      lastShakeKey = 'down';
      shakeVisualOffset = 5;
      shakeVisualTimer = 0.08;
      playShakeSound();
    }
  }

  // Fart mechanic - SPACE during gameplay
  if (e.key === ' ' && game.screen === 'playing') {
    if (fartCharges > 0 && fartCooldown <= 0) {
      fartCharges--;
      fartCooldown = 0.5; // half second cooldown
      // Spawn fart cloud at piggy's butt (behind/below the piggy)
      const fartScale = turboFart ? 1.5 : 1.0;
      fartClouds.push({
        x: player.x,
        y: player.y + 15,  // starts at butt level
        width: 50 * fartScale,
        height: 40 * fartScale,
        vy: -250,           // flies upward fast
        life: 2.0,          // lasts 2 seconds
        opacity: 0.8,
        scale: 1.0,
        wobble: 0            // for wobbly movement
      });
      playFartSound();
      // Spawn green stink particles at butt
      spawnParticles(player.x, player.y + 20, '\u{1F4A8}', 5, 80);
      spawnParticles(player.x, player.y + 15, '\u{1F49A}', 3, 60);
      // Small screen shake for comedy
      triggerScreenShake(3, 0.15);
    }
    e.preventDefault();
    return; // don't fall through to title/gameover handlers
  }

  if (e.key === ' ') {
    if (game.screen === 'intro') {
      // First key press: just unlock audio and start music
      if (!audioUnlocked) {
        unlockAudio();
        forceRestartIntroMusic();
        return;
      }
      if (introScene >= 5) {
        stopIntroMusic();
        game.screen = 'title';
        introScene = 0;
      } else {
        introScene++;
        introTimer = 0;
        introTextOpacity = 0;
        introFadeOut = 0;
        forceRestartIntroMusic();
      }
      return;
    }
    if (game.screen === 'title') {
      playOink();
      game.score = 0;
      game.level = 1;
      playerBTC = 0;
      scoreMultiplier = 1; hasShield = false; turboFart = false; megaPoop = false;
      startLevel();
    } else if (game.screen === 'gameOver') {
      game.score = 0;
      game.level = 1;
      game.screen = 'title';
    } else if (game.screen === 'levelComplete') {
      game.screen = 'shop';
    } else if (game.screen === 'victory') {
      stopVictoryMusic();
      game.screen = 'title';
    }
  }
});

// --- Mobile Touch Controls ---
const isMobile = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
const touchControlsEl = document.getElementById('touchControls');
if (isMobile) touchControlsEl.classList.add('visible');

// Track active touches per button
const activeTouches = {};

function simulateKeyDown(keyName) {
  // Don't process gameplay keys while paused
  if (isPaused) return;
  // Simulate the same keydown event the keyboard handler uses
  const fakeEvent = { key: keyName, preventDefault: () => {} };
  // Set key state
  keys[keyName] = true;

  // Jump (only when grounded and no latched devil) - touch controls
  if (keyName === 'ArrowUp' && game.screen === 'playing' && player.grounded && !game.latchedDevil) {
    player.vy = player.jumpForce;
    player.grounded = false;
  }

  // Handle shake detection for latched devil
  if (game.latchedDevil && game.screen === 'playing') {
    if (keyName === 'ArrowUp' && lastShakeKey !== 'up') {
      game.latchedDevil.shakeProgress++;
      lastShakeKey = 'up';
      shakeVisualOffset = -5;
      shakeVisualTimer = 0.08;
      playShakeSound();
    } else if (keyName === 'ArrowDown' && lastShakeKey !== 'down') {
      game.latchedDevil.shakeProgress++;
      lastShakeKey = 'down';
      shakeVisualOffset = 5;
      shakeVisualTimer = 0.08;
      playShakeSound();
    }
  }

  // Handle fart on space
  if (keyName === ' ' && game.screen === 'playing') {
    if (fartCharges > 0 && fartCooldown <= 0) {
      fartCharges--;
      fartCooldown = 0.5;
      var tfs = turboFart ? 1.5 : 1.0;
      fartClouds.push({
        x: player.x, y: player.y + 15,

      });
      playFartSound();
      spawnParticles(player.x, player.y + 20, '\u{1F4A8}', 5, 80);
      spawnParticles(player.x, player.y + 15, '\u{1F49A}', 3, 60);
      triggerScreenShake(3, 0.15);
    }
  }
}

function simulateKeyUp(keyName) {
  keys[keyName] = false;
}

// Setup touch handlers for each button
document.querySelectorAll('.touch-btn').forEach(btn => {
  const keyName = btn.dataset.key;

  btn.addEventListener('touchstart', (e) => {
    e.preventDefault();
    unlockAudio();
    // Track this touch
    for (const touch of e.changedTouches) {
      activeTouches[touch.identifier] = keyName;
    }
    btn.classList.add('active');
    simulateKeyDown(keyName);
  }, { passive: false });

  btn.addEventListener('touchend', (e) => {
    e.preventDefault();
    for (const touch of e.changedTouches) {
      delete activeTouches[touch.identifier];
    }
    // Only release key if no other touch is holding this button
    const stillHeld = Object.values(activeTouches).includes(keyName);
    if (!stillHeld) {
      btn.classList.remove('active');
      simulateKeyUp(keyName);
    }
  }, { passive: false });

  btn.addEventListener('touchcancel', (e) => {
    e.preventDefault();
    for (const touch of e.changedTouches) {
      delete activeTouches[touch.identifier];
    }
    btn.classList.remove('active');
    simulateKeyUp(keyName);
  }, { passive: false });
});

// Also handle tapping the canvas on mobile for menu navigation
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  unlockAudio();
  if (game.screen !== 'playing') {
    // Simulate a click for menu screens
    canvas.dispatchEvent(new MouseEvent('click'));
  }
}, { passive: false });

// --- AABB Collision ---
function aabb(a, b) {
  return (
    a.x - a.width / 2 < b.x + b.width / 2 &&
    a.x + a.width / 2 > b.x - b.width / 2 &&
    a.y - a.height / 2 < b.y + b.height / 2 &&
    a.y + a.height / 2 > b.y - b.height / 2
  );
}

// --- Update ---
function triggerDamage(fromBomb) {
  if (hasShield) {
    hasShield = false;
    spawnParticles(player.x, player.y, '\uD83D\uDEE1\uFE0F', 4, 150);
    spawnScorePopup(player.x, player.y - 30, '\uD83D\uDEE1\uFE0F Blocked!', '#4488ff');
    triggerScreenShake(3, 0.15);
    return;
  }
  game.cracks++;
  game.score = Math.max(0, game.score - 5);
  flashTimer = 0.3;
  flashColor = '#ff0000';
  piggyDamageTimer = 0.3;
  spawnScorePopup(player.x, player.y - 40, '-5', '#ff4444');

  if (fromBomb) {
    // Bomb explosion particles
    const explosionEmojis = ['\u{1F4A5}', '\u{1F525}', '\u{1F4A5}', '\u{1F525}'];
    for (let i = 0; i < 7; i++) {
      spawnParticles(player.x, player.y, explosionEmojis[i % explosionEmojis.length], 1, 300);
    }
    triggerScreenShake(8, 0.3);
    playBombExplosion();
  }

  if (game.cracks >= 3) {
    isPaused = false;
    game.screen = 'gameOver';
    gameOverTimer = 0;
    stopMusic();
    playGameOver();
    saveToLeaderboard();
    // Initialize laughing devils
    gameOverDevils = [];
    for (let i = 0; i < 4; i++) {
      gameOverDevils.push({
        x: WIDTH * 0.2 + i * (WIDTH * 0.2),
        y: HEIGHT / 2 + 80,
        emoji: i % 2 === 0 ? '\u{1F608}' : '\u{1F47F}',
        phase: Math.random() * Math.PI * 2,
        laughTimer: Math.random() * 2,
        laughing: false,
        fleeing: false,
        fleeX: 0,
        fleeSpeed: 0
      });
    }
    resurrectionCost = 50 * game.level;
    const canAfford = game.score >= resurrectionCost;
    const angelChance = resurrectionCount === 0 ? 1.0 : 0.5;
    const angelAppears = resurrectionCount < 2 && Math.random() < angelChance;
    if (angelAppears && canAfford) {
      resurrectionState = 'waiting';
    } else if (angelAppears && !canAfford) {
      resurrectionState = 'waiting_sad';
    } else {
      resurrectionState = 'done';
    }
    resurrectionTimer = 0;
    angelY = -50;
  }
}

function update(dt) {
  // nameInput and shop screens don't need updates
  if (game.screen === 'nameInput' || game.screen === 'shop') return;

  // Always update clouds
  updateClouds(dt);

  // Update intro cutscene
  if (game.screen === 'intro') {
    playIntroMusic(introScene);
    introTimer += dt;
    introSkipHint += dt;
    // Auto-advance after 10 seconds
    if (introTimer >= 10) {
      if (introScene >= 5) {
        stopIntroMusic();
        game.screen = 'title';
        introScene = 0;
      } else {
        introScene++;
        introTimer = 0;
        introTextOpacity = 0;
        introFadeOut = 0;
      }
    }
    return;
  }

  // Update title screen background coins
  if (game.screen === 'title') {
    titleCoinTimer += dt;
    if (titleCoinTimer >= 0.5) {
      titleCoinTimer -= 0.5;
      const emojis = ['\u{1FA99}', '\u{1F4B5}', '\u{1F4B0}'];
      titleCoins.push({
        x: Math.random() * WIDTH,
        y: -20,
        emoji: emojis[Math.floor(Math.random() * emojis.length)],
        speed: 60 + Math.random() * 40,
        alpha: 0.3 + Math.random() * 0.2
      });
    }
    for (let i = titleCoins.length - 1; i >= 0; i--) {
      titleCoins[i].y += titleCoins[i].speed * dt;
      if (titleCoins[i].y > HEIGHT + 30) {
        titleCoins.splice(i, 1);
      }
    }
    return;
  }

  // Update particles on level complete screen too
  if (game.screen === 'levelComplete') {
    levelCompleteTimer += dt;
    updateParticles(dt);
    return;
  }

  // Update victory screen
  if (game.screen === 'victory') {
    victoryTimer += dt;

    // Update piglets (bounce and wander)
    for (const p of victoryPiglets) {
      p.x += p.vx * dt;
      p.bouncePhase += dt * 5;
      if (p.x < 100 || p.x > WIDTH - 100) p.vx *= -1;
    }

    // Update vegans (hearts)
    for (const v of victoryVegans) {
      v.heartTimer -= dt;
      if (v.heartTimer <= 0) {
        v.heartTimer = 1.5 + Math.random();
      }
    }

    // Update angels (occasional firing)
    for (const a of victoryAngels) {
      a.fireTimer -= dt;
      if (a.firing) {
        a.fireAnim -= dt;
        if (a.fireAnim <= 0) a.firing = false;
      }
      if (a.fireTimer <= 0 && !a.firing) {
        a.firing = true;
        a.fireAnim = 0.3;
        a.fireTimer = 4 + Math.random() * 8;
        playGunshotSound();
      }
    }

    // Replay music every 5 seconds
    victoryIntruderTimer += dt;
    if (victoryIntruderTimer > 5) {
      victoryIntruderTimer = 0;
      playVictoryMusic();
    }
    return;
  }

  // Update game over animation
  if (game.screen === 'gameOver') {
    gameOverTimer += dt;

    // Update laughing devils
    for (const d of gameOverDevils) {
      d.laughTimer -= dt;
      if (d.laughTimer <= 0 && !d.fleeing) {
        d.laughing = true;
        d.laughTimer = 1 + Math.random() * 2;
      }
      if (d.laughing && d.laughTimer > 0.5) d.laughing = false;
      if (d.fleeing) {
        d.x += d.fleeSpeed * dt;
      }
    }

    // Resurrection sequence
    if (resurrectionState === 'waiting' && gameOverTimer > 3.0) {
      resurrectionState = 'angel_descend';
      resurrectionTimer = 0;
    }
    if (resurrectionState === 'waiting_sad' && gameOverTimer > 3.0) {
      resurrectionState = 'angel_descend_sad';
      resurrectionTimer = 0;
    }

    if (resurrectionState === 'angel_descend' || resurrectionState === 'angel_descend_sad') {
      resurrectionTimer += dt;
      angelY = Math.min(HEIGHT / 2 - 80, -50 + resurrectionTimer * 100);
      if (angelY >= HEIGHT / 2 - 80) {
        if (resurrectionState === 'angel_descend') {
          resurrectionState = 'scatter_devils';
          resurrectionTimer = 0;
          for (const d of gameOverDevils) {
            d.fleeing = true;
            d.laughing = false;
            d.fleeSpeed = (d.x < WIDTH / 2 ? -1 : 1) * (300 + Math.random() * 200);
          }
        } else {
          resurrectionState = 'angel_sad';
          resurrectionTimer = 0;
        }
      }
    }

    if (resurrectionState === 'scatter_devils') {
      resurrectionTimer += dt;
      if (resurrectionTimer > 2.0) {
        resurrectionState = 'resurrect';
        resurrectionTimer = 0;
      }
    }

    if (resurrectionState === 'resurrect') {
      resurrectionTimer += dt;
      if (resurrectionTimer > 2.0) {
        game.score -= resurrectionCost;
        game.cracks = 0;
        resurrectionCount++;
        game.screen = 'playing';
        player.y = player.groundY;
        player.vy = 0;
        player.grounded = true;
        game.latchedDevil = null;
        resurrectionState = 'done';
        startMusic();
      }
    }

    if (resurrectionState === 'angel_sad') {
      resurrectionTimer += dt;
      if (resurrectionTimer > 3.0) {
        angelY -= 100 * dt;
      }
      if (resurrectionTimer > 5.0) {
        resurrectionState = 'done';
      }
    }

    return;
  }

  if (game.screen !== 'playing') return;

  // Don't update gameplay while paused
  if (isPaused) return;

  // Piggy bob timer
  piggyBobTimer += dt;

  // Beat tracking for music oinks
  if (musicPlaying) {
    beatTimer += dt;
    if (beatTimer >= BEAT_DURATION) {
      beatTimer -= BEAT_DURATION;
      beatCount++;
      if (beatCount % 8 === 0) {
        playDoubleOink();
      } else if (beatCount % 4 === 0) {
        playOink();
      }
    }
  }

  // Flash timer countdown
  if (flashTimer > 0) flashTimer -= dt;
  if (successFlashTimer > 0) successFlashTimer -= dt;
  if (piggyDamageTimer > 0) piggyDamageTimer -= dt;
  if (scoreBounceFactor > 0) scoreBounceFactor -= dt * 4;
  if (shakeVisualTimer > 0) {
    shakeVisualTimer -= dt;
    if (shakeVisualTimer <= 0) shakeVisualOffset = 0;
  }

  // Update screen shake
  updateScreenShake(dt);

  // Update particles
  updateParticles(dt);

  // Update score pop-ups
  updateScorePopups(dt);

  // Level timer countdown
  game.levelTimer -= dt;
  if (game.levelTimer <= 0) {
    game.levelTimer = 0;
    objects.length = 0;
    ejectedCoins.length = 0;
    if (game.latchedDevil) {
      game.latchedDevil = null;
      lastShakeKey = null;
      squealTimer = 0;
      shakeHintTimer = 0;
      devilTypeIndicator = null;
    }
    stopMusic();
    if (game.level >= 10) {
      game.screen = 'victory';
      if (game.cracks === 0) { playerBTC += 5; }
      saveToLeaderboard();
      initVictoryScene();
    } else {
      game.screen = 'levelComplete';
      levelCompleteTimer = 0;
      playLevelComplete();
      // Flawless level bonus
      if (game.cracks === 0) {
        playerBTC += 5;
        spawnScorePopup(WIDTH / 2, HEIGHT / 2, '+5 \u20BF Flawless!', '#F7931A');
      }
      // Level complete confetti particles
      const confettiEmojis = ['\u{1F389}', '\u{1F38A}', '\u2728', '\u{1F389}', '\u{1F38A}', '\u2728'];
      for (let i = 0; i < 18; i++) {
        spawnParticles(
          WIDTH * 0.2 + Math.random() * WIDTH * 0.6,
          HEIGHT * 0.3 + Math.random() * 50,
          confettiEmojis[i % confettiEmojis.length],
          1, 350
        );
      }
    }
    return;
  }

  // Player movement
  if (keys['ArrowLeft']) {
    player.x -= player.speed * dt;
    player.facing = -1;
  }
  if (keys['ArrowRight']) {
    player.x += player.speed * dt;
    player.facing = 1;
  }
  if (!keys['ArrowLeft'] && !keys['ArrowRight']) {
    player.facing = 0;
  }
  player.facingSmooth += (player.facing - player.facingSmooth) * 8 * dt;
  const halfW = player.width / 2;
  if (player.x < halfW) player.x = halfW;
  if (player.x > WIDTH - halfW) player.x = WIDTH - halfW;

  // Jump physics
  if (!player.grounded) {
    const grav = keys['ArrowDown'] ? player.slamGravity : player.gravity;
    player.vy += grav * dt;
    player.y += player.vy * dt;
    if (player.y >= player.groundY) {
      player.y = player.groundY;
      player.vy = 0;
      player.grounded = true;
    }
  } else {
    player.y = player.groundY;
  }

  // Spawn timer
  const spawnRate = game.levelConfig ? game.levelConfig.spawnRate : 1.0;
  spawnTimer += dt;
  if (spawnTimer >= spawnRate) {
    spawnTimer -= spawnRate;
    spawnObject();
  }

  // Devil spawn from schedule
  if (game.devilSchedule.length > 0) {
    const nextDevilTime = game.devilSchedule[0];
    if (game.levelTimer <= nextDevilTime) {
      game.devilSchedule.shift();
      game.devilsSpawned++;
      spawnDevil();
    }
  }

  // Butcher spawn from schedule
  if (game.butcherSchedule && game.butcherSchedule.length > 0) {
    const nextButcherTime = game.butcherSchedule[0];
    if (game.levelTimer <= nextButcherTime) {
      game.butcherSchedule.shift();
      spawnButcher();
    }
  }

  // Update fart cooldown
  if (fartCooldown > 0) fartCooldown -= dt;

  // Poop: both LEFT and RIGHT held simultaneously while grounded (or mobile Poop button)
  if ((keys['ArrowLeft'] && keys['ArrowRight'] || keys['Poop']) && player.grounded && poopCooldown <= 0 && !isPooping) {
    isPooping = true;
    poopAnimTimer = 0.6;
  }

  if (isPooping) {
    poopAnimTimer -= dt;
    if (poopAnimTimer <= 0) {
      isPooping = false;
      poopCooldown = POOP_COOLDOWN;
      var poopScale = megaPoop ? 1.5 : 1.0;
      poops.push({
        x: player.x,
        y: HEIGHT - 35,
        width: 30 * poopScale,
        height: 25 * poopScale,
        life: POOP_DURATION,
        stinkTimer: 0
      });
      playPoopSound();
      spawnParticles(player.x, HEIGHT - 35, '\u{1F4A9}', 3, 50);
      triggerScreenShake(4, 0.2);
    }
  }
  poopCooldown = Math.max(0, poopCooldown - dt);

  // Update fart clouds
  for (let i = fartClouds.length - 1; i >= 0; i--) {
    const cloud = fartClouds[i];
    cloud.y += cloud.vy * dt;              // fly upward
    cloud.wobble += dt * 4;                 // wobble side to side
    cloud.x += Math.sin(cloud.wobble) * 30 * dt;
    cloud.scale += dt * 0.5;                // grows bigger as it rises
    cloud.life -= dt;
    cloud.opacity = Math.min(0.8, cloud.life / 1.0);

    if (cloud.life <= 0) {
      fartClouds.splice(i, 1);
      continue;
    }

    // Check collision with falling devils
    for (let j = objects.length - 1; j >= 0; j--) {
      const obj = objects[j];
      if ((obj.type === 'devil' || obj.type === 'butcher') && !obj.latched && !obj.flyAway) {
        // Wide hitbox for the cloud
        const cloudW = cloud.width * cloud.scale;
        const cloudH = cloud.height * cloud.scale;
        if (Math.abs(cloud.x - obj.x) < (cloudW + obj.width) / 2 &&
            Math.abs(cloud.y - obj.y) < (cloudH + obj.height) / 2) {
          // Devil got FARTED ON!
          chokingDevils.push({
            emoji: obj.emoji,
            x: obj.x,
            y: obj.y,
            width: obj.width,
            timer: 1.5,          // choking animation duration
            coughTimer: 0,
            opacity: 1.0,
            greenTint: 1.0        // turns green from the stink
          });
          objects.splice(j, 1);
          playChokingSound();
          spawnParticles(obj.x, obj.y, '\u{1F922}', 3, 100);
          spawnParticles(obj.x, obj.y, '\u{1F480}', 2, 80);
          spawnScorePopup(obj.x, obj.y, '\u2620\uFE0F', '#44ff44');
          playerBTC += 1;
          spawnScorePopup(obj.x, obj.y - 20, '+1 \u20BF', '#F7931A');
          break; // one devil per cloud
        }
      }
    }
  }

  // Update choking devils
  for (let i = chokingDevils.length - 1; i >= 0; i--) {
    const cd = chokingDevils[i];
    cd.timer -= dt;
    cd.coughTimer += dt;
    cd.opacity = Math.max(0, cd.timer / 1.0);
    cd.y -= 20 * dt; // slowly floats up while dying
    if (cd.timer <= 0) {
      chokingDevils.splice(i, 1);
    }
  }

  // Update latched devil
  if (game.latchedDevil) {
    const devil = game.latchedDevil;
    devil.x = player.x;
    devil.y = player.y - 40;
    devil.hammerTimer += dt;
    devil.hammerAnimTimer += dt;
    shakeHintTimer += dt;

    // Continuous screen shake while devil is latched (subtle; heavy/butcher shakes harder)
    if (screenShake.duration <= 0) {
      const shakeIntensity = (devil.devilType === 'heavy' || devil.devilType === 'butcher') ? 4 : 3;
      triggerScreenShake(shakeIntensity, 0.1);
    }

    // Squeal timer - butcher alternates squeal and knife sound faster
    squealTimer += dt;
    if (devil.devilType === 'butcher') {
      if (squealTimer >= 0.4) {
        squealTimer -= 0.4;
        // Alternate between squeal and knife sound
        if (Math.floor(devil.hammerAnimTimer / 0.4) % 2 === 0) {
          playSqueal();
        } else {
          playKnifeSound();
        }
      }
    } else {
      if (squealTimer >= 0.5) {
        squealTimer -= 0.5;
        playSqueal();
      }
    }

    // Thief devil steals coins every 0.5s
    if (devil.devilType === 'thief') {
      devil.stealTimer += dt;
      if (devil.stealTimer >= 0.5) {
        devil.stealTimer -= 0.5;
        game.score = Math.max(0, game.score - 2);
        spawnScorePopup(
          player.x + (Math.random() - 0.5) * 30,
          player.y - 60 - Math.random() * 20,
          '-2', '#cc44ff'
        );
      }
    }

    // Update devil type indicator timer
    if (devilTypeIndicator) {
      devilTypeIndicator.timer -= dt;
      if (devilTypeIndicator.timer <= 0) devilTypeIndicator = null;
    }

    // Shake success
    if (devil.shakeProgress >= devil.shakeRequired) {
      const flyDirection = (Math.random() < 0.5 ? -1 : 1);
      ejectedCoins.push({
        x: player.x,
        y: player.y - 20,
        startY: player.y - 20,
        targetX: devil.x,
        targetY: devil.y,
        phase: 'rising',
        timer: 0,
        riseDuration: 0.25,
        devilFlyX: flyDirection * (200 + Math.random() * 150),
        devilFlyY: -(200 + Math.random() * 100),
        devilEmoji: devil.emoji,
        devilW: devil.width,
        devilH: devil.height,
        devilAngle: 0,
        hitTimer: 0
      });

      game.score = Math.max(0, game.score - 3);
      spawnScorePopup(player.x, player.y - 50, '-3', '#ff4444');
      // Sparkle particles for devil knock-off
      for (let i = 0; i < 5; i++) {
        spawnParticles(player.x, player.y - 30, '\u2B50', 1, 180);
      }
      playShakeSuccess();

      game.latchedDevil = null;
      lastShakeKey = null;
      squealTimer = 0;
      shakeHintTimer = 0;
      successFlashTimer = 0.4;
      devilTypeIndicator = null;
    }
  }

  // Devil hammer timer expired
  if (game.latchedDevil) {
    const devil = game.latchedDevil;
    if (devil.hammerTimer >= devil.hammerTimeout) {
      triggerDamage(false);
      objects.push({
        type: devil.devilType === 'butcher' ? 'butcher' : 'devil',
        devilType: devil.devilType,
        emoji: devil.emoji,
        x: devil.x,
        y: devil.y,
        width: devil.width,
        height: devil.height,
        speed: 0,
        flyAway: true,
        flyAwayTimer: 0.5
      });
      game.latchedDevil = null;
      lastShakeKey = null;
      squealTimer = 0;
      shakeHintTimer = 0;
      devilTypeIndicator = null;
    }
  }

  // Update ejected coin animations
  for (let i = ejectedCoins.length - 1; i >= 0; i--) {
    const ec = ejectedCoins[i];
    ec.timer += dt;
    if (ec.phase === 'rising') {
      const t = Math.min(ec.timer / ec.riseDuration, 1.0);
      ec.y = ec.startY + t * (ec.targetY - ec.startY);
      if (t >= 1.0) {
        ec.phase = 'hit';
        ec.hitTimer = 0;
        ec.hitX = ec.x;
        ec.hitY = ec.targetY;
      }
    } else if (ec.phase === 'hit') {
      ec.hitTimer += dt;
      ec.devilAngle += dt * 10;
      ec.hitX += ec.devilFlyX * dt;
      ec.hitY += ec.devilFlyY * dt;
      if (ec.hitTimer > 0.6) {
        ejectedCoins.splice(i, 1);
      }
    }
  }

  // Update falling objects
  for (let i = objects.length - 1; i >= 0; i--) {
    const obj = objects[i];
    obj.y += obj.speed * dt;

    // Zigzag movement for devils
    if ((obj.type === 'devil' || obj.type === 'butcher') && !obj.latched && !obj.flyAway && obj.zigzagSpeed) {
      obj.zigzagTime += dt;
      // Unpredictable swerving using combined sine waves
      const swerve = Math.sin(obj.zigzagTime * obj.zigzagFreq + obj.zigzagPhase)
                    + 0.5 * Math.sin(obj.zigzagTime * obj.zigzagFreq * 2.3 + obj.zigzagPhase * 1.7);
      obj.x += swerve * obj.zigzagSpeed * dt;
      // Keep within canvas bounds
      if (obj.x < obj.width / 2) obj.x = obj.width / 2;
      if (obj.x > WIDTH - obj.width / 2) obj.x = WIDTH - obj.width / 2;
    }

    // Fly-away devils
    if (obj.flyAway) {
      obj.flyAwayTimer -= dt;
      obj.y -= 300 * dt;
      obj.x += 150 * dt;
      if (obj.flyAwayTimer <= 0) {
        objects.splice(i, 1);
      }
      continue;
    }

    // Collision with player
    if (aabb(player, obj)) {
      if (obj.type === 'bomb') {
        triggerDamage(true);
        objects.splice(i, 1);
        continue;
      } else if (obj.type === 'devil') {
        if (!game.latchedDevil) {
          obj.latched = true;
          game.latchedDevil = {
            emoji: obj.emoji,
            devilType: obj.devilType || 'fast',
            x: player.x,
            y: player.y - 40,
            width: obj.width,
            height: obj.height,
            hammerTimer: 0,
            shakeProgress: 0,
            shakeRequired: obj.shakeRequired || 8,
            hammerTimeout: obj.hammerTimeout || 5,
            hammerAnimTimer: 0,
            stealTimer: 0
          };
          lastShakeKey = null;
          squealTimer = 0;
          shakeHintTimer = 0;
          playDevilLatch();
          // Show devil type indicator
          const dt = obj.devilType || 'fast';
          if (dt === 'fast') {
            devilTypeIndicator = { text: '\u26A1 BRZI!', color: '#ffff00', timer: 1.5 };
          } else if (dt === 'heavy') {
            devilTypeIndicator = { text: '\u{1F4AA} TE\u0160KI!', color: '#ff4444', timer: 1.5 };
          } else if (dt === 'thief') {
            devilTypeIndicator = { text: '\u{1F911} LOPOV!', color: '#cc44ff', timer: 1.5 };
          }
        }
        objects.splice(i, 1);
        continue;
      } else if (obj.type === 'butcher') {
        if (!game.latchedDevil) {
          obj.latched = true;
          game.latchedDevil = {
            emoji: obj.emoji,
            devilType: 'butcher',
            x: player.x,
            y: player.y - 45,
            width: obj.width,
            height: obj.height,
            hammerTimer: 0,
            shakeProgress: 0,
            shakeRequired: obj.shakeRequired || 10,
            hammerTimeout: obj.hammerTimeout || 6,
            hammerAnimTimer: 0,
            stealTimer: 0
          };
          lastShakeKey = null;
          squealTimer = 0;
          shakeHintTimer = 0;
          playButcherLatch();
          devilTypeIndicator = { text: '\u{1F52A} KASAPIN!', color: '#cc0000', timer: 2.0 };
        }
        objects.splice(i, 1);
        continue;
      } else if (obj.type === 'corn') {
        fartCharges = Math.min(MAX_FARTS, fartCharges + 1);
        spawnParticles(obj.x, obj.y, '\u{1F33D}', 3, 100);
        spawnScorePopup(obj.x, obj.y - 10, '\u{1F4A8}+1', '#88cc44');
        playCoinCollect(); // reuse coin sound
        objects.splice(i, 1);
        continue;
      } else {
        // Coin collected
        game.score += obj.value * scoreMultiplier;
        scoreBounceFactor = 1.0;

        // Particles + sound based on value
        if (obj.value === 1) {
          spawnParticles(obj.x, obj.y, '\u2728', 3, 120);
          spawnScorePopup(obj.x, obj.y - 10, '+1', '#ffffff');
          playCoinCollect();
        } else if (obj.value === 5) {
          spawnParticles(obj.x, obj.y, '\u2728', 4, 150);
          spawnScorePopup(obj.x, obj.y - 10, '+5', '#44dd44');
          playBillCollect();
        } else if (obj.value === 10) {
          spawnParticles(obj.x, obj.y, '\u2728', 5, 180);
          spawnScorePopup(obj.x, obj.y - 10, '+10', '#ffd700');
          playGoldCollect();
        } else if (obj.value === 20) {
          spawnParticles(obj.x, obj.y, '\u{1F4B5}', 4, 200);
          spawnParticles(obj.x, obj.y, '\u2728', 5, 160);
          spawnScorePopup(obj.x, obj.y - 10, '+20', '#22cc55');
          playGoldCollect();
        } else if (obj.value === 30) {
          spawnParticles(obj.x, obj.y, '\u{1F4B0}', 3, 200);
          spawnParticles(obj.x, obj.y, '\u2728', 8, 220);
          spawnScorePopup(obj.x, obj.y - 10, '+30', '#ff6600');
          playGoldCollect();
          // Extra flash for moneybag!
          flashTimer = 0.15;
          flashColor = 'rgba(255,215,0,';
        }

        objects.splice(i, 1);
        continue;
      }
    }

    // Off screen
    if (obj.y > HEIGHT + obj.height) {
      objects.splice(i, 1);
    }
  }

  // --- Lightning System (Level 4+) ---
  if (game.level >= 4) {
    lightningSpawnTimer -= dt;
    if (lightningSpawnTimer <= 0 && !lightningWarning) {
      lightningSpawnTimer = 5 + Math.random() * 3;
      const cloud = skyClouds[Math.floor(Math.random() * skyClouds.length)];
      lightningWarning = { x: cloud.x + cloud.w * 0.25, y: cloud.y + 20, timer: 1.5 };
    }

    if (lightningWarning) {
      lightningWarning.timer -= dt;
      if (lightningWarning.timer <= 0) {
        lightningBolts.push({
          x: lightningWarning.x,
          y: lightningWarning.y,
          bottomY: lightningWarning.y,
          width: 20,
          height: 30,
          speed: 560,
          segments: generateLightningSegments(lightningWarning.x, lightningWarning.y, HEIGHT - 30),
          life: 0.3,
          flash: 1.0
        });
        lightningWarning = null;
        triggerScreenShake(5, 0.2);
      }
    }

    // Update lightning bolts
    for (let i = lightningBolts.length - 1; i >= 0; i--) {
      const bolt = lightningBolts[i];
      bolt.life -= dt;
      bolt.flash -= dt * 3;

      // Collision with player (check if any segment is near player)
      if (bolt.life > 0.15) { // Only damage on initial strike
        const boltHitbox = { x: bolt.x, y: HEIGHT - 50, width: 30, height: 60 };
        if (aabb(player, boltHitbox)) {
          triggerDamage(true);
          bolt.life = 0.1; // Prevent double damage
        }
      }

      if (bolt.life <= 0) lightningBolts.splice(i, 1);
    }
  }

  // --- Ground Enemies ---
  if (game.level >= 3) {
    groundEnemySpawnTimer -= dt;
    if (groundEnemySpawnTimer <= 0) {
      groundEnemySpawnTimer = Math.max(3.0, (5.5 - game.level * 0.3) * 1.33);
      const available = Object.entries(GROUND_ENEMY_TYPES)
        .filter(([_, t]) => game.level >= t.fromLevel);
      const [key, type] = available[Math.floor(Math.random() * available.length)];
      // Wolves spawn half as often — skip and retry soon
      if (key === 'wolf' && Math.random() < 0.7) {
        groundEnemySpawnTimer = 0.5;
      } else {
        const fromLeft = Math.random() > 0.5;
        groundEnemies.push({
          type: key,
          emoji: type.emoji,
          x: fromLeft ? -30 : WIDTH + 30,
          y: HEIGHT - 45,
          width: type.size,
          height: type.size,
          speed: type.speed,
          dir: fromLeft ? 1 : -1,
          ai: type.ai,
          pauseTimer: 0,
          animTimer: 0
        });
      }
    }
  }

  for (let i = groundEnemies.length - 1; i >= 0; i--) {
    const e = groundEnemies[i];
    e.animTimer += dt;

    switch (e.ai) {
      case 'straight':
        e.x += e.speed * e.dir * dt;
        break;
      case 'chase':
        e.dir = player.x > e.x ? 1 : -1;
        e.x += e.speed * e.dir * dt;
        break;
      case 'cunning':
        if (e.pauseTimer > 0) {
          e.pauseTimer -= dt;
        } else {
          e.x += e.speed * e.dir * dt;
          if (Math.random() < 0.005) {
            e.pauseTimer = 0.3 + Math.random() * 0.5;
            e.dir *= -1;
          }
        }
        break;
      case 'relentless':
        e.dir = player.x > e.x ? 1 : -1;
        e.x += e.speed * e.dir * dt;
        break;
    }

    // Remove if off-screen (only for straight runners, others stay)
    if (e.ai === 'straight' && (e.x < -80 || e.x > WIDTH + 80)) {
      groundEnemies.splice(i, 1);
      continue;
    }
    // Clamp chase/relentless/cunning enemies to screen bounds
    if (e.ai !== 'straight') {
      e.x = Math.max(-20, Math.min(WIDTH + 20, e.x));
    }

    // Collision with player - ONLY if player is on or near ground level
    // (player can jump OVER them)
    if (player.grounded && aabb(player, e)) {
      triggerDamage(false);
      groundEnemies.splice(i, 1);
      spawnParticles(player.x, player.y, '\u{1F4A5}', 4, 80);
    }
  }

  // Update poops and check collision with ground enemies
  for (let p = poops.length - 1; p >= 0; p--) {
    const poop = poops[p];
    poop.life -= dt;
    poop.stinkTimer += dt;
    if (poop.life <= 0) { poops.splice(p, 1); continue; }

    for (let e = groundEnemies.length - 1; e >= 0; e--) {
      if (aabb(poop, groundEnemies[e])) {
        const enemy = groundEnemies[e];
        chokingDevils.push({
          emoji: enemy.emoji,
          x: enemy.x, y: enemy.y,
          width: enemy.width,
          timer: 2.0, coughTimer: 0,
          opacity: 1.0, greenTint: 1.0
        });
        groundEnemies.splice(e, 1);
        playChokingSound();
        spawnParticles(enemy.x, enemy.y, '\u{1F922}', 4, 100);
        spawnParticles(enemy.x, enemy.y, '\u{1F4A9}', 2, 60);
        spawnScorePopup(enemy.x, enemy.y, '\u{1F480}\u{1F4A9}', '#885500');
        playerBTC += 3;
        spawnScorePopup(enemy.x, enemy.y - 20, '+3 \u20BF', '#F7931A');
      }
    }
  }

  // --- Vegan Ally Update ---
  if (vegan && vegan.state !== 'dead') {
    vegan.auraTimer += dt;

    // Find nearest meat-eating threat near player
    let nearestThreat = null;
    let nearestDist = 200;
    for (const e of groundEnemies) {
      if (e.type === 'carnivore' || e.type === 'farmer') {
        const dist = Math.abs(e.x - player.x);
        if (dist < nearestDist) {
          nearestDist = dist;
          nearestThreat = e;
        }
      }
    }

    if (nearestThreat) {
      vegan.state = 'defend';
      vegan.dir = nearestThreat.x > vegan.x ? 1 : -1;
      vegan.x += vegan.speed * 2 * vegan.dir * dt;
      if (Math.abs(vegan.x - nearestThreat.x) < 30) {
        vegan.blockTimer -= dt;
        if (vegan.blockTimer <= 0) {
          vegan.hp--;
          vegan.blockTimer = 1.5;
          spawnParticles(vegan.x, vegan.y, '✌️', 3, 80);
          const idx = groundEnemies.indexOf(nearestThreat);
          if (idx >= 0) groundEnemies.splice(idx, 1);
          if (vegan.hp <= 0) killVegan('enemy');
        }
      }
    } else {
      vegan.state = 'patrol';
      const targetX = player.x + Math.sin(Date.now() / 1000) * 100;
      vegan.dir = targetX > vegan.x ? 1 : -1;
      vegan.x += vegan.speed * vegan.dir * dt;
    }

    if (vegan) vegan.x = Math.max(30, Math.min(WIDTH - 30, vegan.x));

    // Poop collision - kills vegan!
    for (const poop of poops) {
      if (vegan && aabb(vegan, poop)) {
        killVegan('poop');
        break;
      }
    }

    // Bomb/devil collision from falling objects
    for (let i = objects.length - 1; i >= 0; i--) {
      const obj = objects[i];
      if (vegan && (obj.type === 'bomb' || obj.type === 'devil') && aabb(vegan, obj)) {
        killVegan(obj.type === 'bomb' ? 'bomb' : 'devil');
        objects.splice(i, 1);
        break;
      }
    }
  }

  // Vegan death animation update
  if (veganDeathAnim) {
    veganDeathAnim.timer -= dt;
    veganDeathAnim.y -= 40 * dt;
    veganDeathAnim.wingSpread = Math.min(1, veganDeathAnim.wingSpread + dt * 2);
    veganDeathAnim.haloSize = Math.min(1, veganDeathAnim.haloSize + dt * 1.5);
    veganDeathAnim.opacity = Math.max(0, veganDeathAnim.timer / 2.0);
    if (veganDeathAnim.timer <= 0) veganDeathAnim = null;
  }
}

function killVegan(cause) {
  if (!vegan) return;
  const msg = cause === 'poop'
    ? 'O ne, USRAO si vegana! \u{1F4A9}\u{1F607}'
    : 'O ne, ubio si vegana! \u{1F607}';
  veganDeathAnim = {
    x: vegan.x, y: vegan.y,
    timer: 4.0,
    msg: msg,
    wingSpread: 0,
    haloSize: 0,
    opacity: 1.0
  };
  vegan = null;
  playVeganDeathSound();
  spawnParticles(veganDeathAnim.x, veganDeathAnim.y, '\u{1F607}', 5, 100);
}

function playVeganDeathSound() {
  try {
    const ctx = getAudioContext();
    const now = ctx.currentTime;
    // Sad minor chord progression
    [261, 311, 370].forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.15, now + i * 0.2);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 2.0 + i * 0.2);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now + i * 0.2);
      osc.stop(now + 2.5);
    });
  } catch(e) {}
}

// --- Draw ---
function drawBackground() {
  // Vertical sky gradient
  const grad = ctx.createLinearGradient(0, 0, 0, HEIGHT);
  grad.addColorStop(0, '#87CEEB');
  grad.addColorStop(1, '#5BA3CF');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, WIDTH, HEIGHT);

  // Draw fluffy clouds (3 overlapping circles each)
  for (const cloud of skyClouds) {
    ctx.fillStyle = `rgba(255, 255, 255, ${cloud.opacity})`;
    ctx.beginPath();
    ctx.arc(cloud.x, cloud.y, cloud.w * 0.25, 0, Math.PI * 2);
    ctx.arc(cloud.x + cloud.w * 0.25, cloud.y - cloud.w * 0.12, cloud.w * 0.3, 0, Math.PI * 2);
    ctx.arc(cloud.x + cloud.w * 0.5, cloud.y, cloud.w * 0.22, 0, Math.PI * 2);
    ctx.fill();
  }

  // Sun in top-right corner with rotating rays
  ctx.fillStyle = '#FFD700';
  ctx.beginPath();
  ctx.arc(WIDTH - 60, 50, 30, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#FFD700';
  ctx.lineWidth = 2;
  for (let i = 0; i < 8; i++) {
    const angle = (i / 8) * Math.PI * 2 + Date.now() / 3000;
    ctx.beginPath();
    ctx.moveTo(WIDTH - 60 + Math.cos(angle) * 35, 50 + Math.sin(angle) * 35);
    ctx.lineTo(WIDTH - 60 + Math.cos(angle) * 48, 50 + Math.sin(angle) * 48);
    ctx.stroke();
  }
}

function drawGround() {
  const groundY = HEIGHT - 40;
  const groundHeight = 40;
  // Base green
  ctx.fillStyle = '#4CAF50';
  ctx.fillRect(0, groundY, WIDTH, groundHeight);
  // Darker stripe pattern for grass
  ctx.fillStyle = '#43A047';
  for (let x = 0; x < WIDTH; x += 20) {
    if ((x / 20) % 2 === 0) {
      ctx.fillRect(x, groundY, 10, groundHeight);
    }
  }
  // Scattered grass emoji
  ctx.font = '14px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.globalAlpha = 0.5;
  for (let x = 15; x < WIDTH; x += 55) {
    ctx.fillText('\u{1F33F}', x, groundY + 6);
  }
  ctx.globalAlpha = 1.0;
}

// --- Hand-drawn Wolf ---
function drawWolf(x, y, dir, animTimer) {
  ctx.save();
  ctx.translate(x, y);
  if (dir < 0) ctx.scale(-1, 1);

  const legPhase = animTimer * 10;

  // Body - gray oval
  ctx.fillStyle = '#666';
  ctx.beginPath();
  ctx.ellipse(0, -8, 28, 14, 0, 0, Math.PI * 2);
  ctx.fill();

  // Darker back
  ctx.fillStyle = '#555';
  ctx.beginPath();
  ctx.ellipse(0, -12, 24, 8, 0, Math.PI, 0);
  ctx.fill();

  // Head
  ctx.fillStyle = '#777';
  ctx.beginPath();
  ctx.arc(24, -14, 12, 0, Math.PI * 2);
  ctx.fill();

  // Snout
  ctx.fillStyle = '#888';
  ctx.beginPath();
  ctx.ellipse(34, -12, 7, 5, 0, 0, Math.PI * 2);
  ctx.fill();

  // Eye - menacing red
  ctx.fillStyle = '#ff0000';
  ctx.beginPath();
  ctx.arc(28, -17, 3, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(28.5, -17, 1.5, 0, Math.PI * 2);
  ctx.fill();

  // Ears - pointed
  ctx.fillStyle = '#555';
  ctx.beginPath();
  ctx.moveTo(20, -22);
  ctx.lineTo(16, -34);
  ctx.lineTo(24, -24);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(26, -22);
  ctx.lineTo(24, -33);
  ctx.lineTo(30, -23);
  ctx.fill();

  // Teeth
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.moveTo(36, -9);
  ctx.lineTo(34, -5);
  ctx.lineTo(38, -5);
  ctx.fill();

  // Tail - bushy
  ctx.fillStyle = '#555';
  ctx.beginPath();
  ctx.moveTo(-28, -10);
  ctx.quadraticCurveTo(-38, -25, -32, -28);
  ctx.quadraticCurveTo(-28, -22, -26, -12);
  ctx.fill();

  // Legs - animated walking
  ctx.fillStyle = '#555';
  const frontLeg1 = Math.sin(legPhase) * 8;
  const frontLeg2 = Math.sin(legPhase + Math.PI) * 8;
  const backLeg1 = Math.sin(legPhase + Math.PI / 2) * 8;
  const backLeg2 = Math.sin(legPhase + Math.PI * 1.5) * 8;

  // Front legs
  ctx.fillRect(12 + frontLeg1, 2, 5, 16);
  ctx.fillRect(18 + frontLeg2, 2, 5, 16);
  // Back legs
  ctx.fillRect(-14 + backLeg1, 2, 5, 16);
  ctx.fillRect(-8 + backLeg2, 2, 5, 16);

  // Paws
  ctx.fillStyle = '#444';
  ctx.fillRect(11 + frontLeg1, 16, 7, 3);
  ctx.fillRect(17 + frontLeg2, 16, 7, 3);
  ctx.fillRect(-15 + backLeg1, 16, 7, 3);
  ctx.fillRect(-9 + backLeg2, 16, 7, 3);

  ctx.restore();
}

// --- Hand-drawn Vegan ---
function drawVeganSprite(x, y, dir, animTimer, state) {
  ctx.save();
  ctx.translate(x, y);
  if (dir < 0) ctx.scale(-1, 1);

  const walkPhase = animTimer * 6;

  // Legs - walking animation
  ctx.fillStyle = '#2E7D32';
  const leg1 = Math.sin(walkPhase) * 6;
  const leg2 = Math.sin(walkPhase + Math.PI) * 6;
  ctx.fillRect(-6 + leg1, 8, 6, 20);
  ctx.fillRect(2 + leg2, 8, 6, 20);
  // Shoes
  ctx.fillStyle = '#4CAF50';
  ctx.fillRect(-7 + leg1, 26, 8, 4);
  ctx.fillRect(1 + leg2, 26, 8, 4);

  // Body - green shirt
  ctx.fillStyle = '#4CAF50';
  ctx.fillRect(-10, -15, 22, 25);

  // Arms
  const armSwing = Math.sin(walkPhase) * 10;
  ctx.fillStyle = '#4CAF50';
  ctx.fillRect(-14, -12, 5, 18 + armSwing * 0.3);
  ctx.fillRect(11, -12, 5, 18 - armSwing * 0.3);

  // Hands - skin color
  ctx.fillStyle = '#FDBCB4';
  ctx.beginPath();
  ctx.arc(-12, 8 + armSwing * 0.3, 4, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(13, 8 - armSwing * 0.3, 4, 0, Math.PI * 2);

  ctx.textAlign = 'center';

  // Head
  ctx.fillStyle = '#FDBCB4';
  ctx.beginPath();
  ctx.arc(1, -22, 10, 0, Math.PI * 2);

  ctx.fillStyle = '#2E7D32';
  ctx.beginPath();
  ctx.arc(1, -26, 10, Math.PI, 0);

  ctx.beginPath();
  ctx.arc(-2, -23, 2, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(5, -23, 2, 0, Math.PI * 2);
  ctx.fill();

  // Smile

  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(1, -19, 5, 0.1, Math.PI - 0.1);
