// --- Hand-drawn Devil Sprite ---
function drawDevilSprite(x, y, size, animTimer, devilType) {
  ctx.save();
  ctx.translate(x, y);

  // Size scaling based on devilType
  let baseSize = 36;
  if (devilType === 'fast') baseSize = 32;
  else if (devilType === 'heavy') baseSize = 44;
  else if (devilType === 'thief') baseSize = 40;
  const sc = (size / 36) * (baseSize / 36);

  ctx.scale(sc, sc);

  const wingFlutter = Math.sin(animTimer * 8) * 0.3;
  const legAnim = Math.sin(animTimer * 6) * 3;
  const hammerPhase = animTimer * 4;
  const hammerSwing = Math.sin(hammerPhase) * 0.6;

  // Color scheme per type
  let bodyColor = '#CC0000';
  let bodyDark = '#990000';
  let wingColor = '#880000';
  let hornColor = '#440000';
  let legColor = '#660000';

  if (devilType === 'fast') {
    bodyColor = '#FF3333';
    bodyDark = '#CC1111';
    wingColor = '#BB2222';
    hornColor = '#552222';
    legColor = '#882222';
  } else if (devilType === 'heavy') {
    bodyColor = '#880000';
    bodyDark = '#550000';
    wingColor = '#660000';
    hornColor = '#330000';
    legColor = '#440000';
  } else if (devilType === 'thief') {
    bodyColor = '#993399';
    bodyDark = '#662266';
    wingColor = '#772277';
    hornColor = '#441144';
    legColor = '#553355';
  }

  // === Speed lines for fast devil ===
  if (devilType === 'fast') {
    ctx.globalAlpha = 0.3;
    ctx.strokeStyle = '#FF6666';
    ctx.lineWidth = 1.5;
    for (let i = 0; i < 3; i++) {
      const ly = -5 + i * 8;
      ctx.beginPath();
      ctx.moveTo(-22 - i * 6, ly);
      ctx.lineTo(-14 - i * 3, ly);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(22 + i * 6, ly);
      ctx.lineTo(14 + i * 3, ly);
      ctx.stroke();
    }
    ctx.globalAlpha = 1.0;
  }

  // === Thin spindly legs ===
  ctx.strokeStyle = legColor;
  ctx.lineWidth = 2;
  // Left leg
  ctx.beginPath();
  ctx.moveTo(-6, 10);
  ctx.lineTo(-9 + legAnim, 22);
  ctx.lineTo(-12 + legAnim, 24);
  ctx.stroke();
  // Right leg
  ctx.beginPath();
  ctx.moveTo(6, 10);
  ctx.lineTo(9 - legAnim, 22);
  ctx.lineTo(12 - legAnim, 24);
  ctx.stroke();
  // Tiny hooves
  ctx.fillStyle = '#222';
  ctx.beginPath();
  ctx.ellipse(-12 + legAnim, 24, 3, 1.5, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(12 - legAnim, 24, 3, 1.5, 0, 0, Math.PI * 2);
  ctx.fill();

  // === Devil tail ===
  ctx.strokeStyle = bodyDark;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-2, 8);
  ctx.quadraticCurveTo(-18, 12, -24, 2);
  ctx.quadraticCurveTo(-28, -4, -22, -6);
  ctx.stroke();
  // Arrow/spade tip
  ctx.fillStyle = bodyDark;
  ctx.beginPath();
  ctx.moveTo(-22, -6);
  ctx.lineTo(-28, -10);
  ctx.lineTo(-24, -4);
  ctx.lineTo(-28, -2);
  ctx.closePath();
  ctx.fill();

  // === Bat-like wings ===
  ctx.save();
  // Left wing
  ctx.save();
  ctx.translate(-12, -6);
  ctx.rotate(-0.4 + wingFlutter);
  ctx.fillStyle = wingColor;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(-10, -16);
  ctx.lineTo(-6, -8);
  ctx.lineTo(-16, -12);
  ctx.lineTo(-8, -4);
  ctx.lineTo(-18, -6);
  ctx.lineTo(-10, 0);
  ctx.closePath();
  ctx.fill();
  // Wing membrane lines
  ctx.strokeStyle = hornColor;
  ctx.lineWidth = 0.8;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(-10, -16);
  ctx.moveTo(0, 0);
  ctx.lineTo(-16, -12);
  ctx.moveTo(0, 0);
  ctx.lineTo(-18, -6);
  ctx.stroke();
  ctx.restore();

  // Right wing
  ctx.save();
  ctx.translate(12, -6);
  ctx.rotate(0.4 - wingFlutter);
  ctx.fillStyle = wingColor;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(10, -16);
  ctx.lineTo(6, -8);
  ctx.lineTo(16, -12);
  ctx.lineTo(8, -4);
  ctx.lineTo(18, -6);
  ctx.lineTo(10, 0);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = hornColor;
  ctx.lineWidth = 0.8;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(10, -16);
  ctx.moveTo(0, 0);
  ctx.lineTo(16, -12);
  ctx.moveTo(0, 0);
  ctx.lineTo(18, -6);
  ctx.stroke();
  ctx.restore();
  ctx.restore();

  // === Round body ===
  ctx.fillStyle = bodyColor;
  ctx.beginPath();
  ctx.ellipse(0, 0, 14, 12, 0, 0, Math.PI * 2);
  ctx.fill();
  // Darker belly shadow
  ctx.fillStyle = bodyDark;
  ctx.beginPath();
  ctx.ellipse(0, 4, 10, 6, 0, 0, Math.PI);
  ctx.fill();

  // === Horns ===
  const hornThick = devilType === 'heavy' ? 4 : 2.5;
  ctx.strokeStyle = hornColor;
  ctx.lineWidth = hornThick;
  ctx.lineCap = 'round';
  // Left horn
  ctx.beginPath();
  ctx.moveTo(-6, -10);
  ctx.quadraticCurveTo(-12, -22, -8, -26);
  ctx.stroke();
  // Right horn
  ctx.beginPath();
  ctx.moveTo(6, -10);
  ctx.quadraticCurveTo(12, -22, 8, -26);
  ctx.stroke();
  // Horn tips
  ctx.fillStyle = '#111';
  ctx.beginPath();
  ctx.arc(-8, -26, hornThick * 0.6, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(8, -26, hornThick * 0.6, 0, Math.PI * 2);
  ctx.fill();

  // === Evil face ===
  // Glowing yellow eyes
  ctx.fillStyle = '#FFDD00';
  ctx.shadowColor = '#FFDD00';
  ctx.shadowBlur = 4;
  ctx.beginPath();
  ctx.ellipse(-5, -4, 3.5, 3, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(5, -4, 3.5, 3, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
  // Slit pupils
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(-5, -4, 1.2, 2.5, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(5, -4, 1.2, 2.5, 0, 0, Math.PI * 2);
  ctx.fill();
  // Angry eyebrows
  ctx.strokeStyle = '#440000';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-8, -8);
  ctx.lineTo(-3, -7);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(8, -8);
  ctx.lineTo(3, -7);
  ctx.stroke();

  // Sharp grin with teeth
  ctx.strokeStyle = '#220000';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-8, 3);
  ctx.quadraticCurveTo(0, 10, 8, 3);
  ctx.stroke();
  // Teeth
  ctx.fillStyle = '#fff';
  for (let t = -6; t <= 6; t += 3) {
    ctx.beginPath();
    ctx.moveTo(t, 3 + Math.abs(t) * 0.15);
    ctx.lineTo(t + 1.5, 3 + Math.abs(t) * 0.15);
    ctx.lineTo(t + 0.75, 6 + Math.abs(t) * 0.1);
    ctx.closePath();
    ctx.fill();
  }

  // === Hammer (held in right hand) ===
  ctx.save();
  ctx.translate(14, -2);
  ctx.rotate(hammerSwing);
  // Handle
  ctx.fillStyle = '#8B6914';
  ctx.fillRect(-1.5, 0, 3, 16);
  // Hammer head
  const hammerSize = devilType === 'heavy' ? 1.4 : 1.0;
  ctx.fillStyle = '#666';
  ctx.fillRect(-5 * hammerSize, 14, 10 * hammerSize, 6 * hammerSize);
  ctx.fillStyle = '#888';
  ctx.fillRect(-5 * hammerSize, 14, 10 * hammerSize, 2);
  ctx.restore();

  // === Thief: bag of coins ===
  if (devilType === 'thief') {
    ctx.save();
    ctx.translate(-14, 2);
    // Small sack
    ctx.fillStyle = '#8B7355';
    ctx.beginPath();
    ctx.ellipse(0, 2, 6, 7, 0, 0, Math.PI * 2);
    ctx.fill();
    // Sack tie
    ctx.strokeStyle = '#654321';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-3, -4);
    ctx.lineTo(0, -6);
    ctx.lineTo(3, -4);
    ctx.stroke();
    // $ sign
    ctx.fillStyle = '#FFD700';
    ctx.font = 'bold 8px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('$', 0, 3);
    ctx.restore();
  }

  ctx.restore();
}

  // Cleaver edge

  // Hat band

  ctx.fill();
  if (mouthOpen > 1) {
    ctx.fillStyle = '#fff';
    for (let t = -3; t <= 3; t += 2) {
      ctx.fillRect(t, -18, 1.5, 2);
    }
  }

  ctx.restore();
}

function drawPiggySprite(x, y, facing, state) {
  ctx.save();
  ctx.translate(x, y);

  // Flip based on direction (default faces right)
  const dir = facing >= 0 ? 1 : -1;
  ctx.scale(dir, 1);

  // State-based modifiers
  let bodyColor = '#FFB6C1';
  let bodyDark = '#FF9CAD';
  if (state === 'scared') {
    bodyColor = '#FFD0D0';
  } else if (state === 'happy') {
    bodyColor = '#FFB0D0';
  } else if (state === 'farting') {
    bodyColor = '#CCFF99';
  }

  // BODY - oval shape
  ctx.fillStyle = bodyColor;
  ctx.beginPath();
  ctx.ellipse(0, 0, 28, 20, 0, 0, Math.PI * 2);
  ctx.fill();
  // Darker bottom half for 3D effect
  ctx.fillStyle = bodyDark;
  ctx.beginPath();
  ctx.ellipse(0, 5, 26, 12, 0, 0, Math.PI);
  ctx.fill();

  // COIN SLOT on top
  ctx.fillStyle = '#333';
  ctx.fillRect(-8, -22, 16, 3);
  ctx.fillStyle = '#555';
  ctx.fillRect(-6, -21, 12, 1);

  // LEGS (2 front, 2 back - offset for depth)
  // Tuck legs when airborne (60% height)
  const legH = player.grounded ? 12 : 7;
  const legOff = player.grounded ? 0 : 2; // pull up slightly when airborne
  ctx.fillStyle = '#FF9CAD';
  // Back legs (slightly behind)
  ctx.fillRect(-15, 12 + legOff, 7, legH);
  ctx.fillRect(8, 12 + legOff, 7, legH);
  // Front legs (slightly in front, darker)
  ctx.fillStyle = bodyDark;
  ctx.fillRect(-18, 14 + legOff, 7, legH);
  ctx.fillRect(11, 14 + legOff, 7, legH);
  // Hooves
  ctx.fillStyle = '#8B4513';
  ctx.fillRect(-18, 14 + legOff + legH - 1, 7, 3);
  ctx.fillRect(11, 14 + legOff + legH - 1, 7, 3);
  ctx.fillRect(-15, 12 + legOff + legH - 1, 7, 3);
  ctx.fillRect(8, 12 + legOff + legH - 1, 7, 3);

  // TAIL (curly!) - at the back
  ctx.strokeStyle = '#FF9CAD';
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-28, -5);
  ctx.quadraticCurveTo(-35, -15, -30, -18);
  ctx.quadraticCurveTo(-25, -21, -32, -12);
  ctx.stroke();

  // HEAD/SNOUT - protruding from front
  ctx.fillStyle = bodyColor;
  ctx.beginPath();
  ctx.arc(25, -5, 14, 0, Math.PI * 2);
  ctx.fill();

  // Snout (protruding oval)
  ctx.fillStyle = '#FFa0b0';
  ctx.beginPath();
  ctx.ellipse(35, -2, 9, 7, 0, 0, Math.PI * 2);
  ctx.fill();
  // Nostrils
  ctx.fillStyle = '#c06070';
  ctx.beginPath();
  ctx.ellipse(33, -3, 2, 2.5, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(37, -3, 2, 2.5, 0, 0, Math.PI * 2);
  ctx.fill();

  // EYES
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(28, -10, 5, 0, Math.PI * 2);
  ctx.fill();
  // Black pupil (moves slightly with facing)
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(29 + dir * 1, -10, 2.5, 0, Math.PI * 2);
  ctx.fill();
  // Eye highlight
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(30, -11.5, 1, 0, Math.PI * 2);
  ctx.fill();

  // Scared state: sweat drop, wider eyes
  if (state === 'scared') {
    ctx.fillStyle = '#66ccff';
    ctx.beginPath();
    ctx.moveTo(22, -18);
    ctx.quadraticCurveTo(20, -13, 22, -12);
    ctx.quadraticCurveTo(24, -13, 22, -18);
    ctx.fill();
  }

  // EARS - pointed triangles on top of head
  ctx.fillStyle = bodyColor;
  ctx.beginPath();
  ctx.moveTo(19, -16);
  ctx.lineTo(17, -28);
  ctx.lineTo(25, -18);
  ctx.closePath();
  ctx.fill();
  // Inner ear
  ctx.fillStyle = '#FF8CA0';
  ctx.beginPath();
  ctx.moveTo(20, -17);
  ctx.lineTo(18.5, -25);
  ctx.lineTo(24, -18);
  ctx.closePath();
  ctx.fill();

  // Second ear (behind, slightly visible)
  ctx.fillStyle = bodyDark;
  ctx.beginPath();
  ctx.moveTo(22, -16);
  ctx.lineTo(22, -27);
  ctx.lineTo(28, -17);
  ctx.closePath();
  ctx.fill();

  ctx.restore();
}

function drawBoss() {
  if (!boss) return;
  const t = Date.now() / 1000;
  const shk = boss.shakeTimer > 0 ? (Math.random() - 0.5) * 8 : 0;
  const bx = boss.x + shk;
  const by = boss.y;
  const breath = 1 + Math.sin(t * 2.5) * 0.04;

  ctx.save();

  // Death animation: fade + shrink + spin
  if (boss.state === 'dying') {
    const dp = boss.deathTimer / 3;
    ctx.globalAlpha = 1 - dp;
    ctx.translate(bx, by);
    ctx.rotate(dp * Math.PI);
    ctx.scale(1 - dp * 0.5, 1 - dp * 0.5);
    ctx.translate(-bx, -by);
  }

  // ====== Big bold aura - fully opaque so it's visible against any sky ======
  const auraR = boss.size * (boss.phaseTwo ? 1.45 : 1.15) * breath;
  // Outer dark ring (solid, not gradient) so the boss never blends into clouds
  ctx.fillStyle = boss.phaseTwo ? 'rgba(40,0,0,0.85)' : 'rgba(20,15,5,0.85)';
  ctx.beginPath();
  ctx.arc(bx, by + 6, auraR, 0, Math.PI * 2);
  ctx.fill();
  // Glowing accent rim (pulsing)
  const pulse = 0.55 + 0.45 * Math.abs(Math.sin(t * 3));
  ctx.strokeStyle = boss.accent || '#FF3333';
  ctx.lineWidth = 6;
  ctx.shadowColor = boss.accent || '#FF3333';
  ctx.shadowBlur = 25 * pulse;
  ctx.beginPath();
  ctx.arc(bx, by + 6, auraR - 4, 0, Math.PI * 2);
  ctx.stroke();
  ctx.shadowBlur = 0;

  // ====== Spike crown around the boss (radiating menace) ======
  const spikeCount = 14;
  ctx.fillStyle = boss.phaseTwo ? '#FF3300' : '#222';
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 2;
  for (let i = 0; i < spikeCount; i++) {
    const ang = (i / spikeCount) * Math.PI * 2 + t * 0.4;
    const r1 = auraR - 2;
    const r2 = auraR + 22 + Math.sin(t * 2 + i) * 4;
    const aw = 0.18; // half-width angle of spike base
    const x1 = bx + Math.cos(ang - aw) * r1;
    const y1 = by + 6 + Math.sin(ang - aw) * r1;
    const x2 = bx + Math.cos(ang + aw) * r1;
    const y2 = by + 6 + Math.sin(ang + aw) * r1;
    const x3 = bx + Math.cos(ang) * r2;
    const y3 = by + 6 + Math.sin(ang) * r2;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x3, y3);
    ctx.lineTo(x2, y2);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  }

  // ====== Solid body silhouette so the boss is never transparent ======
  const bodyR = boss.size * 0.55 * breath;
  // Body fill - bold colored circle
  const bodyGrad = ctx.createRadialGradient(bx - bodyR * 0.3, by - bodyR * 0.3, bodyR * 0.2, bx, by, bodyR);
  bodyGrad.addColorStop(0, lightenColor(boss.color, 30));
  bodyGrad.addColorStop(1, boss.color);
  ctx.fillStyle = bodyGrad;
  ctx.beginPath();
  ctx.arc(bx, by, bodyR, 0, Math.PI * 2);
  ctx.fill();
  // Heavy black outline so it pops against ANY background
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 5;
  ctx.stroke();

  // Hit flash white overlay (when hit by fart)
  if (boss.hitFlash > 0) {
    ctx.fillStyle = 'rgba(255,255,255,' + (boss.hitFlash / 0.2 * 0.7) + ')';
    ctx.beginPath();
    ctx.arc(bx, by, bodyR, 0, Math.PI * 2);
    ctx.fill();
  }

  // ====== Glowing red eyes - always visible, very menacing ======
  const eyeY = by - bodyR * 0.15;
  const eyeOff = bodyR * 0.32;
  const eyeR = bodyR * 0.13;
  for (const ex of [bx - eyeOff, bx + eyeOff]) {
    // Glow
    ctx.shadowColor = boss.accent || '#FF2222';
    ctx.shadowBlur = 18;
    ctx.fillStyle = boss.accent || '#FF2222';
    ctx.beginPath();
    ctx.arc(ex, eyeY, eyeR, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    // Pupil
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(ex, eyeY, eyeR * 0.45, 0, Math.PI * 2);
    ctx.fill();
  }

  // Angry eyebrows (V shape)
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 6;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(bx - eyeOff - eyeR, eyeY - eyeR * 1.7);
  ctx.lineTo(bx - eyeOff + eyeR, eyeY - eyeR * 0.6);
  ctx.moveTo(bx + eyeOff + eyeR, eyeY - eyeR * 1.7);
  ctx.lineTo(bx + eyeOff - eyeR, eyeY - eyeR * 0.6);
  ctx.stroke();
  ctx.lineCap = 'butt';

  // ====== Boss emoji on top, but with an outline so it stands out ======
  const fsize = boss.size * 0.55;
  ctx.font = fsize + 'px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  // Dark drop shadow under emoji
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillText(boss.emoji, bx + 3, by + 5 + bodyR * 0.15);
  ctx.fillStyle = '#fff';
  ctx.fillText(boss.emoji, bx, by + bodyR * 0.15);

  // Jagged angry mouth/teeth at bottom of body
  ctx.fillStyle = '#fff';
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 2;
  const mouthY = by + bodyR * 0.45;
  const mouthW = bodyR * 0.7;
  ctx.beginPath();
  ctx.moveTo(bx - mouthW, mouthY);
  for (let tooth = 0; tooth < 6; tooth++) {
    const tx = bx - mouthW + (tooth + 0.5) * (mouthW * 2) / 6;
    ctx.lineTo(tx, mouthY + 10);
    ctx.lineTo(bx - mouthW + (tooth + 1) * (mouthW * 2) / 6, mouthY);
  }
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // Phase 2 fire crown
  if (boss.phaseTwo) {
    ctx.font = '28px sans-serif';
    for (let i = 0; i < 6; i++) {
      const fx = bx + Math.sin(t * 3 + i * 1.05) * (bodyR * 0.9);
      const fy = by - bodyR * 0.85 + Math.sin(t * 4 + i) * 8;
      ctx.fillText('\u{1F525}', fx, fy);
    }
  }

  // ====== Bright red HP bar (huge, top of screen so it's never missed) ======
  const barW = Math.min(WIDTH - 60, boss.size * 2.5);
  const barH = 18;
  const barX = WIDTH / 2 - barW / 2;
  const barY = 10;
  // Background frame
  ctx.fillStyle = 'rgba(0,0,0,0.85)';
  ctx.fillRect(barX - 4, barY - 4, barW + 8, barH + 8);
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2;
  ctx.strokeRect(barX - 4, barY - 4, barW + 8, barH + 8);
  // HP fill
  const hpPct = Math.max(0, boss.hp / boss.maxHp);
  const hpColor = hpPct > 0.5 ? '#44FF44' : hpPct > 0.25 ? '#FFAA00' : '#FF2222';
  ctx.fillStyle = hpColor;
  ctx.fillRect(barX, barY, barW * hpPct, barH);
  // Segment ticks
  ctx.strokeStyle = 'rgba(0,0,0,0.4)';
  ctx.lineWidth = 1;
  const segs = boss.maxHp;
  for (let s = 1; s < segs; s++) {
    const sx = barX + (barW / segs) * s;
    ctx.beginPath();
    ctx.moveTo(sx, barY);
    ctx.lineTo(sx, barY + barH);
    ctx.stroke();
  }
  // Boss name above HP bar
  ctx.font = 'bold 22px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillStyle = '#000';
  ctx.fillText('☠️ ' + boss.name + ' ☠️', WIDTH / 2 + 2, barY + barH + 22);
  ctx.fillStyle = '#FF3333';
  ctx.fillText('☠️ ' + boss.name + ' ☠️', WIDTH / 2, barY + barH + 20);
  // HP numeric
  ctx.font = 'bold 14px sans-serif';
  ctx.fillStyle = '#fff';
  ctx.fillText(Math.ceil(boss.hp) + ' / ' + boss.maxHp, WIDTH / 2, barY + barH / 2 + 5);
  ctx.lineWidth = 1;

  // Floating arrow pointing to boss so it's never missed
  if (boss.state === 'fighting') {
    const arrowY = by - bodyR - 30 - Math.abs(Math.sin(t * 4)) * 6;
    ctx.fillStyle = '#FFEE00';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(bx, arrowY + 18);
    ctx.lineTo(bx - 12, arrowY);
    ctx.lineTo(bx - 5, arrowY);
    ctx.lineTo(bx - 5, arrowY - 12);
    ctx.lineTo(bx + 5, arrowY - 12);
    ctx.lineTo(bx + 5, arrowY);
    ctx.lineTo(bx + 12, arrowY);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  }

  ctx.restore();
}

// Helper: lighten a hex color toward white by `pct` (0-100)
function lightenColor(hex, pct) {
  if (!hex || hex[0] !== '#' || hex.length < 7) return hex || '#888';
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  const f = pct / 100;
  const nr = Math.min(255, Math.round(r + (255 - r) * f));
  const ng = Math.min(255, Math.round(g + (255 - g) * f));
  const nb = Math.min(255, Math.round(b + (255 - b) * f));
  return 'rgb(' + nr + ',' + ng + ',' + nb + ')';
}

// Dashed trajectory line showing where the wet fart will go
function drawAimTrajectory() {
  const speed = 560;
  const useArc = aimAngle > 0.05;
  const vx0 = Math.cos(aimAngle) * speed * aimDir;
  const vy0 = -Math.sin(aimAngle) * speed;
  const g = useArc ? 380 : 0;

  ctx.save();
  ctx.strokeStyle = 'rgba(255, 240, 60, 0.95)';
  ctx.fillStyle = 'rgba(255, 240, 60, 0.95)';
  ctx.lineWidth = 3;
  ctx.setLineDash([8, 8]);
  ctx.lineDashOffset = -((Date.now() / 60) % 16);
  ctx.shadowColor = 'rgba(255, 200, 0, 0.8)';
  ctx.shadowBlur = 8;

  ctx.beginPath();
  let px = player.x + aimDir * 30;
  let py = player.y - 8;
  ctx.moveTo(px, py);
  // simulate up to 1.6 seconds of travel
  const steps = 30;
  const dt = 0.05;
  let lastX = px, lastY = py;
  for (let i = 0; i < steps; i++) {
    const tt = i * dt;
    const x = px + vx0 * tt;
    const y = py + vy0 * tt + 0.5 * g * tt * tt;
    if (x < -20 || x > WIDTH + 20 || y > HEIGHT - 50) break;
    ctx.lineTo(x, y);
    lastX = x; lastY = y;
  }
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.shadowBlur = 0;

  // Arrow head at the end
  const headAng = Math.atan2(lastY - py - vy0 * 0.0, lastX - px) || 0;
  ctx.translate(lastX, lastY);
  ctx.rotate(headAng);
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(-12, -6);
  ctx.lineTo(-8, 0);
  ctx.lineTo(-12, 6);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  // Aim angle readout next to player
  ctx.save();
  ctx.font = 'bold 14px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillStyle = '#000';
  ctx.fillText('🎯 ' + Math.round(aimAngle * 180 / Math.PI) + '°', player.x + 2, player.y - 60 + 1);
  ctx.fillStyle = '#FFEE00';
  ctx.fillText('🎯 ' + Math.round(aimAngle * 180 / Math.PI) + '°', player.x, player.y - 60);
  ctx.restore();
}

// Big banner at the start of the boss fight explaining what to do
function drawBossBanner(timeLeft) {
  const totalDur = 6.0;
  const t = (totalDur - timeLeft) / totalDur;
  // Fade in for first 0.4s, hold, fade out at end
  const alpha = timeLeft < 0.6 ? Math.max(0, timeLeft / 0.6) : Math.min(1, t * 4);

  ctx.save();
  ctx.globalAlpha = alpha;

  // Dark background panel across the screen
  const panelH = 230;
  const panelY = HEIGHT / 2 - panelH / 2;
  ctx.fillStyle = 'rgba(0,0,0,0.78)';
  ctx.fillRect(0, panelY, WIDTH, panelH);
  ctx.strokeStyle = '#FF2222';
  ctx.lineWidth = 4;
  ctx.strokeRect(2, panelY + 2, WIDTH - 4, panelH - 4);
  ctx.strokeStyle = '#FFEE00';
  ctx.lineWidth = 1;
  ctx.strokeRect(8, panelY + 8, WIDTH - 16, panelH - 16);

  // Title - pulsing
  const pulse = 1 + Math.sin(Date.now() / 150) * 0.04;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = 'bold ' + Math.round(36 * pulse) + 'px sans-serif';
  ctx.fillStyle = '#000';
  ctx.fillText('⚠️  BOSS BORBA  ⚠️', WIDTH / 2 + 2, panelY + 38 + 2);
  ctx.fillStyle = '#FF3333';
  ctx.fillText('⚠️  BOSS BORBA  ⚠️', WIDTH / 2, panelY + 38);

  // Main instruction
  ctx.font = 'bold 26px sans-serif';
  ctx.fillStyle = '#FFEE00';
  ctx.fillText('UBIJ BOSA da pređeš nivo!', WIDTH / 2, panelY + 82);

  // How-to lines
  ctx.font = 'bold 20px sans-serif';
  ctx.fillStyle = '#FFFFFF';
  const lines = isMobile
    ? [
        '💨  Tapni PRDNI i skači — prdež leti gore i pogađa bosa',
        '💦  Tapni PRDNI brzo 2x = vlažni prdež (jači!)',
        '🎯  Drži PRDNI duže i pomeri prst gore/dole = nišani'
      ]
    : [
        '💨  SPACE  = obični prdež (skoči pa prdni)',
        '💦  Q / E  = vlažni prdež levo / desno (jači, +3 dmg)',
        '🎯  CTRL + ↑/↓ = nišani vlažni prdež (žuta linija)',
        '⬅️➡️  CTRL + ←/→ = okreni smer nišanjenja'
      ];
  for (let i = 0; i < lines.length; i++) {
    ctx.fillStyle = '#000';
    ctx.fillText(lines[i], WIDTH / 2 + 1, panelY + 118 + i * 26 + 1);
    ctx.fillStyle = '#FFFFFF';
    ctx.fillText(lines[i], WIDTH / 2, panelY + 118 + i * 26);
  }

  ctx.restore();
}

// Small persistent reminder during boss fight
function drawBossHint() {
  const pulse = 0.7 + 0.3 * Math.abs(Math.sin(bossHintPulse * 2));
  const text = isMobile
    ? 'UBIJ BOSA! 💨 prdni  ·  💦 vlažni prdež'
    : 'UBIJ BOSA! 💨 SPACE  ·  💦 Q/E  ·  🎯 CTRL+↑↓';
  ctx.save();
  ctx.font = 'bold 16px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  const tw = ctx.measureText(text).width;
  const padX = 14, padY = 6;
  const bx = WIDTH / 2 - tw / 2 - padX;
  const by = 56;
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(bx, by, tw + padX * 2, 26);
  ctx.strokeStyle = 'rgba(255, 60, 60, ' + pulse + ')';
  ctx.lineWidth = 2;
  ctx.strokeRect(bx, by, tw + padX * 2, 26);
  ctx.fillStyle = '#FFEE55';
  ctx.fillText(text, WIDTH / 2, by + padY);
  ctx.restore();
}

function drawPiggy() {
  const bobOffset = Math.sin(piggyBobTimer * 3) * 2; // subtle idle bob
  const poopSquat = isPooping ? 8 : 0; // squat down when pooping
  const drawY = player.y + shakeVisualOffset + bobOffset + poopSquat;

  ctx.save();
  // Invisibility effect
  if (hasPowerUp('invisibility')) {
    ctx.globalAlpha = 0.3 + Math.sin(Date.now() / 200) * 0.1;
  }
  // Speed boost trail
  if (hasPowerUp('speedBoost')) {
    ctx.globalAlpha = 0.2;
    ctx.font = '30px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(player.emoji, player.x - player.facing * 20, drawY);
    ctx.fillText(player.emoji, player.x - player.facing * 40, drawY);
    ctx.globalAlpha = hasPowerUp('invisibility') ? 0.3 : 1;
  }
  ctx.translate(player.x, drawY);

  // Wobble for 2 cracks
  if (game.cracks >= 2) {
    const wobble = Math.sin(Date.now() / 80) * 0.06;
    ctx.rotate(wobble);
  }

  // Scale pulse on damage + mobile scale
  let scale = MOBILE_SCALE;
  if (piggyDamageTimer > 0) {
    scale = MOBILE_SCALE * (1.0 + 0.15 * Math.sin(piggyDamageTimer / 0.3 * Math.PI));
  }
  ctx.scale(scale, scale);

  // Red tint overlay for damage
  if (piggyDamageTimer > 0) {
    ctx.globalAlpha = 0.7;
  }

  // Strained red tint when pooping
  if (isPooping) {
    ctx.globalAlpha = 0.85;
  }

  // Determine piggy state
  const piggyState = game.latchedDevil ? 'scared' : piggyDamageTimer > 0 ? 'scared' : isPooping ? 'scared' : 'normal';

  // Draw the hand-drawn piggy sprite
  drawPiggySprite(0, 0, player.facingSmooth, piggyState);
  ctx.globalAlpha = 1.0;

  // Red strain overlay when pooping
  if (isPooping) {
    ctx.globalAlpha = 0.25;
    ctx.fillStyle = '#cc3300';
    ctx.beginPath();
    ctx.arc(0, 0, 24, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1.0;
  }

  // Draw crack lines
  if (game.cracks >= 1) {
    ctx.strokeStyle = '#555';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-8, -12);
    ctx.lineTo(10, 10);
    ctx.stroke();
  }
  if (game.cracks >= 2) {
    ctx.strokeStyle = '#444';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(8, -14);
    ctx.lineTo(-6, 8);
    ctx.stroke();
  }

  ctx.restore();

  // Red tint flash on damage
  if (piggyDamageTimer > 0) {
    ctx.globalAlpha = piggyDamageTimer / 0.3 * 0.3;
    ctx.fillStyle = '#ff0000';
    ctx.beginPath();
    ctx.arc(player.x, drawY, 28, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1.0;
  }
}

function drawHUD() {
  // --- HUD with drop shadows and polished styling ---

  // Helper for drop shadow text
  function hudText(text, x, y, font, color, align) {
    ctx.textAlign = align || 'left';
    ctx.textBaseline = 'top';
    ctx.font = font;
    // Drop shadow
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fillText(text, x + 1, y + 2);
    // Main text
    ctx.fillStyle = color;
    ctx.fillText(text, x, y);
  }

  // Mobile-adaptive font sizes
  const mHud = isMobile;
  const scoreFont = mHud ? 'bold 32px sans-serif' : 'bold 22px sans-serif';
  const scoreLabelFont = mHud ? 'bold 32px sans-serif' : 'bold 24px sans-serif';
  const levelFont = mHud ? 'bold 32px sans-serif' : 'bold 22px sans-serif';
  const timerFont = mHud ? '20px sans-serif' : '14px sans-serif';
  const lifeFont = mHud ? '32px sans-serif' : '22px sans-serif';
  const fartFont = mHud ? '28px sans-serif' : '20px sans-serif';
  const btcFont = mHud ? 'bold 20px sans-serif' : 'bold 14px sans-serif';

  // Top-left: Score with bouncing coin icon
  const coinBounce = Math.sin(Math.max(0, scoreBounceFactor) * Math.PI) * 5;
  hudText('\u{1FA99}', 15, 12 - coinBounce, scoreLabelFont, '#fff', 'left');
  hudText(' Score: ' + game.score, mHud ? 48 : 38, 14, scoreFont, '#fff', 'left');

  // Top-center: Level with rounded background
  ctx.textAlign = 'center';
  const levelText = 'Level ' + game.level + (bossActive ? ' \u26A0\uFE0F BOSS' : ' - ' + currentBiome.name);
  ctx.font = levelFont;
  const levelTextW = ctx.measureText(levelText).width;
  // Rounded background pill
  const pillX = WIDTH / 2 - levelTextW / 2 - 14;
  const pillY = 8;
  const pillW = levelTextW + 28;
  const pillH = mHud ? 38 : 28;
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.roundRect(pillX, pillY, pillW, pillH, 14);
  ctx.fill();
  hudText(levelText, WIDTH / 2, 10, levelFont, '#fff', 'center');

  // Timer bar below level text
  if (game.levelConfig) {
    const timerBarWidth = 160;
    const timerBarHeight = 10;
    const timerBarX = WIDTH / 2 - timerBarWidth / 2;
    const timerBarY = 40;
    const timerFill = Math.max(0, game.levelTimer / game.levelConfig.duration);

    ctx.fillStyle = '#333';
    ctx.beginPath();
    ctx.roundRect(timerBarX, timerBarY, timerBarWidth, timerBarHeight, 5);
    ctx.fill();

    let barColor;
    if (timerFill > 0.5) barColor = '#44cc44';
    else if (timerFill > 0.2) barColor = '#cccc44';
    else barColor = '#cc4444';

    ctx.fillStyle = barColor;
    ctx.beginPath();
    ctx.roundRect(timerBarX, timerBarY, timerBarWidth * timerFill, timerBarHeight, 5);
    ctx.fill();

    ctx.strokeStyle = 'rgba(0,0,0,0.3)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.roundRect(timerBarX, timerBarY, timerBarWidth, timerBarHeight, 5);
    ctx.stroke();

    // Time remaining
    hudText(Math.ceil(game.levelTimer) + 's', WIDTH / 2, mHud ? 58 : 54, timerFont, 'rgba(255,255,255,0.8)', 'center');
  }

  // Top-right: Crack indicator with piggy icons
  ctx.textAlign = 'right';
  ctx.textBaseline = 'top';
  const crackStartX = WIDTH - 15;
  ctx.font = lifeFont;
  const crackSpacing = mHud ? 36 : 28;
  const maxCr = game.maxCracks || 3;
  for (let i = 0; i < maxCr; i++) {
    const cx = crackStartX - (maxCr - 1 - i) * crackSpacing;
    if (i < game.cracks) {
      // Cracked piggy (broken heart)
      ctx.globalAlpha = 0.9;
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.fillText('\u{1F494}', cx + 1, 16);
      ctx.fillText('\u{1F494}', cx, 14);
    } else {
      // Healthy piggy
      ctx.globalAlpha = 0.9;
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.fillText('\u{1F437}', cx + 1, 16);
      ctx.fillText('\u{1F437}', cx, 14);
    }
  }
  ctx.globalAlpha = 1.0;

  // Fart meter (below score)
  const fartY = mHud ? 56 : 48;
  hudText('\u{1F4A8} ', 15, fartY, fartFont, '#88cc44', 'left');
  for (let i = 0; i < MAX_FARTS; i++) {
    const fx = 42 + i * 22;
    if (i < fartCharges) {
      // Full charge - green cloud
      ctx.fillStyle = '#66cc33';
      ctx.beginPath();
      ctx.arc(fx, fartY + 10, 8, 0, Math.PI * 2);
      ctx.fill();
      ctx.font = '12px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('\u{1F4A8}', fx, fartY + 10);
    } else {
      // Empty - gray circle
      ctx.fillStyle = 'rgba(100,100,100,0.4)';
      ctx.beginPath();
      ctx.arc(fx, fartY + 10, 8, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  // Show corn hint when low on farts
  if (fartCharges === 0) {
    const blink = Math.sin(Date.now() / 300) > 0;
    if (blink) {
      hudText('Uhvati \u{1F33D}!', 155, fartY + 2, 'bold 16px sans-serif', '#ffcc00', 'left');
    }
  }

  // Wet fart charges display
  const wfX = 180;
  ctx.font = mHud ? 'bold 18px sans-serif' : 'bold 14px sans-serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  const wfText = '\u{1F4A6}\u{1F4A8} x' + wetFartCharges;
  ctx.strokeStyle = 'rgba(0,0,0,0.6)';
  ctx.lineWidth = 3;
  ctx.strokeText(wfText, wfX, fartY);
  ctx.fillStyle = wetFartCharges > 0 ? '#886600' : '#666';
  ctx.fillText(wfText, wfX, fartY);

  // Building materials display
  const matY = mHud ? 110 : 95;
  ctx.font = mHud ? '18px sans-serif' : '14px sans-serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.fillText('🌾 ' + materials.straw + '/5', 16, matY + 1);
  ctx.fillStyle = '#DAA520';
  ctx.fillText('🌾 ' + materials.straw + '/5', 15, matY);
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.fillText('🪵 ' + materials.logs + '/7', 86, matY + 1);
  ctx.fillStyle = '#8B4513';
  ctx.fillText('🪵 ' + materials.logs + '/7', 85, matY);
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.fillText('🧱 ' + materials.bricks + '/10', 156, matY + 1);
  ctx.fillStyle = '#B22222';
  ctx.fillText('🧱 ' + materials.bricks + '/10', 155, matY);
  // House status indicator
  if (houses.length > 0) {
    const h = houses[0];
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fillText('🏠 ' + h.hp + '/' + h.maxHp, 246, matY + 1);
    ctx.fillStyle = '#FFD700';
    ctx.fillText('🏠 ' + h.hp + '/' + h.maxHp, 245, matY);
  }

  // Poop cooldown indicator
  if (poopCooldown > 0) {
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(WIDTH - 90, 95, 80, 12);
    ctx.fillStyle = '#886600';
    ctx.fillRect(WIDTH - 90, 95, 80 * (1 - poopCooldown / POOP_COOLDOWN), 12);
    ctx.font = '10px sans-serif';
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('\u{1F4A9} ' + Math.ceil(poopCooldown) + 's', WIDTH - 50, 101);
  } else if (game.level >= 3) {
    // Show ready indicator when poop is available (from level 3+)
    ctx.font = '10px sans-serif';
    ctx.fillStyle = '#886600';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('\u{1F4A9} OK', WIDTH - 50, 101);
  }

  // BTC display (below fart meter)
  const btcY = mHud ? 90 : 75;
  ctx.font = btcFont;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.fillText('\u20BF ' + playerBTC, 16, btcY + 1);
  ctx.fillStyle = '#F7931A';
  ctx.fillText('\u20BF ' + playerBTC, 15, btcY);

  // Player name (top-right, below crack indicators)
  if (playerName) {
    ctx.font = '12px sans-serif';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'top';
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fillText(playerName, WIDTH - 16, 46);
    ctx.fillStyle = '#aaa';
    ctx.fillText(playerName, WIDTH - 15, 45);
  }

  // Active shield indicator
  if (hasShield) {
    ctx.font = '18px sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillText('\uD83D\uDEE1\uFE0F', 155, 73);
  }
}

function drawShop() {
  // Dark background
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0, 0, WIDTH, HEIGHT);

  // Title
  ctx.font = 'bold 36px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#FFD700';
  ctx.fillText('\uD83C\uDFEA BANKA & SHOP', WIDTH / 2, 45);

  // BTC balance
  ctx.font = 'bold 24px sans-serif';
  ctx.fillStyle = '#F7931A';
  ctx.fillText('\u20BF ' + playerBTC + ' Bitcoin', WIDTH / 2, 80);

  // Item cards - bigger on mobile for easier tapping
  var cardW = isMobile ? 180 : 140;
  var cardH = isMobile ? 210 : 160;
  var cardGap = isMobile ? 15 : 10;
  var startX = (WIDTH - SHOP_ITEMS.length * (cardW + cardGap)) / 2;
  var cardY = isMobile ? 115 : 110;

  for (var i = 0; i < SHOP_ITEMS.length; i++) {
    var item = SHOP_ITEMS[i];
    var x = startX + i * (cardW + cardGap);
    var y = cardY;
    var canBuy = playerBTC >= item.cost;

    // Card background
    ctx.fillStyle = canBuy ? 'rgba(255,255,255,0.1)' : 'rgba(255,255,255,0.03)';
    ctx.beginPath();
    ctx.roundRect(x, y, cardW, cardH, 10);
    ctx.fill();
    ctx.strokeStyle = canBuy ? '#FFD700' : '#333';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Icon
    ctx.font = `${isMobile ? 44 : 36}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(item.icon, x + cardW / 2, y + (isMobile ? 45 : 40));

    // Name
    ctx.font = `bold ${isMobile ? 16 : 13}px sans-serif`;
    ctx.fillStyle = canBuy ? '#fff' : '#555';
    ctx.fillText(item.name, x + cardW / 2, y + (isMobile ? 80 : 65));

    // Description
    ctx.font = `${isMobile ? 13 : 11}px sans-serif`;
    ctx.fillStyle = canBuy ? '#aaa' : '#444';
    ctx.fillText(item.desc, x + cardW / 2, y + (isMobile ? 100 : 82));

    // Price
    ctx.font = `bold ${isMobile ? 20 : 16}px sans-serif`;
    ctx.fillStyle = canBuy ? '#F7931A' : '#553300';
    ctx.fillText('\u20BF ' + item.cost, x + cardW / 2, y + (isMobile ? 130 : 110));

    // Buy button - much bigger on mobile
    var buyBtnH = isMobile ? 45 : 28;
    var buyBtnY = y + (isMobile ? 150 : 125);
    var buyBtnX = x + (isMobile ? 10 : 20);
    var buyBtnW = cardW - (isMobile ? 20 : 40);
    var isMaxed = (item.id === 'extraLife' && game.maxCracks >= 6);
    if (isMaxed) {
      ctx.fillStyle = '#555';
      ctx.beginPath();
      ctx.roundRect(buyBtnX, buyBtnY, buyBtnW, buyBtnH, 8);
      ctx.fill();
      ctx.fillStyle = '#aaa';
      ctx.font = `bold ${isMobile ? 18 : 13}px sans-serif`;
      ctx.fillText('MAX', x + cardW / 2, buyBtnY + buyBtnH / 2);
    } else if (canBuy) {
      ctx.fillStyle = '#F7931A';
      ctx.beginPath();
      ctx.roundRect(buyBtnX, buyBtnY, buyBtnW, buyBtnH, 8);
      ctx.fill();
      ctx.fillStyle = '#000';
      ctx.font = `bold ${isMobile ? 18 : 13}px sans-serif`;
      ctx.fillText('KUPI', x + cardW / 2, buyBtnY + buyBtnH / 2);
    }

    // Store rect for click detection - entire card is tappable on mobile
    if (isMobile) {
      item._rect = { x: x, y: y, w: cardW, h: cardH };
    } else {
      item._rect = { x: buyBtnX, y: buyBtnY, w: buyBtnW, h: buyBtnH };
    }
  }

  // Skip button - BIG TAP BUTTON for mobile
  var skipBtnW = isMobile ? 450 : 300;
  var skipBtnH = isMobile ? 70 : 40;
  var skipBtnX = WIDTH / 2 - skipBtnW / 2;
  var skipY = HEIGHT - (isMobile ? 100 : 65);
  var skipPulse = 0.7 + 0.3 * Math.abs(Math.sin(Date.now() / 400));
  ctx.fillStyle = `rgba(76, 175, 80, ${0.3 + skipPulse * 0.2})`;
  ctx.strokeStyle = `rgba(76, 255, 80, ${0.4 + skipPulse * 0.3})`;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.roundRect(skipBtnX, skipY, skipBtnW, skipBtnH, 12);
  ctx.fill();
  ctx.stroke();
  ctx.font = `bold ${isMobile ? 28 : 20}px sans-serif`;
  ctx.fillStyle = '#fff';
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 2;
  const nextBiome = getBiomeForLevel(game.level + 1);
  const nextBossKey = getBossForLevel(game.level + 1);
  let skipLabel = '\u25B6 Level ' + (game.level + 1) + ' - ' + nextBiome.name;
  if (nextBossKey) skipLabel += ' \u26A0\uFE0F BOSS!';
  ctx.strokeText(skipLabel, WIDTH / 2, skipY + skipBtnH / 2);
  ctx.fillText(skipLabel, WIDTH / 2, skipY + skipBtnH / 2);
  ctx.lineWidth = 1;
  shopSkipRect = { x: skipBtnX, y: skipY, w: skipBtnW, h: skipBtnH };

  // Active power-ups display
  ctx.font = '14px sans-serif';
  ctx.fillStyle = '#aaa';
  ctx.textAlign = 'center';
  var activeText = 'Aktivno: ';
  if (scoreMultiplier > 1) activeText += '2x Score ';
  if (hasShield) activeText += '\uD83D\uDEE1\uFE0F ';
  if (turboFart) activeText += '\uD83D\uDCA8\uD83D\uDCA8 ';
  if (megaPoop) activeText += '\uD83D\uDCA9\uD83D\uDCA9 ';
  if (activeText === 'Aktivno: ') activeText += 'ni\u0161ta';
  ctx.fillText(activeText, WIDTH / 2, HEIGHT - 25);

  // ESC hint
  ctx.font = '13px sans-serif';
  ctx.textAlign = 'right';
  ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
  ctx.fillText('ESC - pravila i komande', WIDTH - 10, 15);
}

function handleShopClick(e) {
  var rect = canvas.getBoundingClientRect();
  var clickX = (e.clientX - rect.left) * (WIDTH / rect.width);
  var clickY = (e.clientY - rect.top) * (HEIGHT / rect.height);

  // Check item buy buttons
  for (var si = 0; si < SHOP_ITEMS.length; si++) {
    var item = SHOP_ITEMS[si];
    if (item._rect && playerBTC >= item.cost) {
      // Block only when already at absolute max
      if (item.id === 'extraLife' && game.maxCracks >= 6) continue;
      var r = item._rect;
      if (clickX >= r.x && clickX <= r.x + r.w && clickY >= r.y && clickY <= r.y + r.h) {
        playerBTC -= item.cost;
        item.effect();
        return;
      }
    }
  }

  // Check skip button - on mobile, the entire bottom area works as skip
  if (shopSkipRect) {
    var sr = shopSkipRect;
    var hitSkip = (clickX >= sr.x && clickX <= sr.x + sr.w && clickY >= sr.y && clickY <= sr.y + sr.h);
    // On mobile: tap below cards area (y > 340) also works as skip
    if (isMobile && clickY > 340) hitSkip = true;
    if (hitSkip) {
      game.level++;
      startLevel();
    }
  }
}

canvas.addEventListener('click', function(e) {
  if (game.screen === 'shop') {
    handleShopClick(e);
  }
});

function draw() {
  if (game.screen === 'nameInput') {
    // nameInput uses HTML overlay, just draw dark background
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, 0, WIDTH, HEIGHT);
    return;
  }
  if (game.screen === 'intro') {
    drawIntro();
    return;
  }

  drawBackground();

  if (game.screen === 'title') {
    drawTitle();
  } else if (game.screen === 'playing') {
    drawPlayingScene();
  } else if (game.screen === 'levelComplete') {
    drawLevelComplete();
  } else if (game.screen === 'gameOver') {
    drawGameOver();
  } else if (game.screen === 'victory') {
    drawVictory();
  } else if (game.screen === 'shop') {
    drawShop();
  }

  // Pause overlay (drawn on top of everything)
  drawPauseMenu();

  // Help overlay (drawn on top of pause)
  if (showHelp) drawHelpScreen();
}

function drawLetterbox() {

function drawVignette(intensity) {

  g.addColorStop(0, 'rgba(0,0,0,0)');

function drawDetailedPig(x, y, scale, facing, opts) {
  opts = opts || {};
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(scale * facing, scale);
  // Shadow on ground
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  ctx.beginPath();
  ctx.ellipse(0, 18, 22, 5, 0, 0, Math.PI * 2);
  ctx.fill();
  // Body
  ctx.fillStyle = opts.bodyColor || '#FFB6C1';
  ctx.beginPath();
  ctx.ellipse(0, 0, 24, 18, 0, 0, Math.PI * 2);
  ctx.fill();
  // Body shading
  const bodyGrad = ctx.createRadialGradient(-5, -5, 2, 0, 0, 24);
  bodyGrad.addColorStop(0, 'rgba(255,255,255,0.2)');
  bodyGrad.addColorStop(1, 'rgba(0,0,0,0.1)');
  ctx.fillStyle = bodyGrad;
  ctx.beginPath();
  ctx.ellipse(0, 0, 24, 18, 0, 0, Math.PI * 2);
  ctx.fill();
  // Legs
  ctx.fillStyle = opts.bodyColor || '#FFB6C1';
  for (const lx of [-12, -5, 5, 12]) {
    ctx.fillRect(lx - 3, 12, 6, 10);
    ctx.fillStyle = '#E8909A';
    ctx.fillRect(lx - 3.5, 20, 7, 3);
    ctx.fillStyle = opts.bodyColor || '#FFB6C1';
  }
  // Curly tail
  ctx.strokeStyle = '#FF9CAD';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(-22, -2);
  ctx.bezierCurveTo(-28, -10, -34, 0, -28, 5);
  ctx.stroke();
  // Head
  ctx.fillStyle = opts.bodyColor || '#FFB6C1';
  ctx.beginPath();
  ctx.arc(18, -10, 16, 0, Math.PI * 2);
  ctx.fill();
  // Head shading
  const headGrad = ctx.createRadialGradient(16, -14, 2, 18, -10, 16);
  headGrad.addColorStop(0, 'rgba(255,255,255,0.25)');
  headGrad.addColorStop(1, 'rgba(0,0,0,0.05)');
  ctx.fillStyle = headGrad;
  ctx.beginPath();
  ctx.arc(18, -10, 16, 0, Math.PI * 2);
  ctx.fill();
  // Ears
  ctx.fillStyle = '#FF8CA0';
  ctx.beginPath();
  ctx.moveTo(10, -22);
  ctx.quadraticCurveTo(5, -40, 14, -28);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(22, -24);
  ctx.quadraticCurveTo(28, -42, 26, -26);
  ctx.fill();
  // Inner ear
  ctx.fillStyle = '#FFB0C0';
  ctx.beginPath();
  ctx.moveTo(11, -24);
  ctx.quadraticCurveTo(8, -36, 14, -28);
  ctx.fill();
  // Snout
  ctx.fillStyle = '#FFa0b0';
  ctx.beginPath();
  ctx.ellipse(30, -8, 9, 6, 0, 0, Math.PI * 2);
  ctx.fill();
  // Nostrils
  ctx.fillStyle = '#D07080';
  ctx.beginPath();
  ctx.ellipse(28, -8, 2, 1.5, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(32, -8, 2, 1.5, 0, 0, Math.PI * 2);
  ctx.fill();
  // Eyes
  if (opts.sad) {
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(16, -15, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(15, -16, 1, 0, Math.PI * 2);
    ctx.fill();
    // Sad eyebrow
    ctx.strokeStyle = '#8B4513';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(12, -20);
    ctx.lineTo(20, -19);
    ctx.stroke();
  } else if (opts.happy) {
    // Closed happy eyes
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(16, -14, 4, Math.PI, 0);
    ctx.stroke();
    // Blush
    ctx.fillStyle = 'rgba(255,100,100,0.3)';
    ctx.beginPath();
    ctx.ellipse(24, -6, 6, 4, 0, 0, Math.PI * 2);
    ctx.fill();
  } else if (opts.scared) {
    // Wide scared eyes
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(16, -15, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(16, -14, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(15, -15.5, 1.5, 0, Math.PI * 2);
    ctx.fill();
  } else {
    // Normal eyes
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(16, -15, 4.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#222';
    ctx.beginPath();
    ctx.arc(17, -15, 2.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(16, -16, 1.2, 0, Math.PI * 2);
    ctx.fill();
  }
  // Mouth
  if (opts.happy) {
    ctx.strokeStyle = '#c06070';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(24, -4, 4, 0, Math.PI);
    ctx.stroke();
  }
  // Accessory
  if (opts.hat) {
    ctx.fillStyle = '#3a2010';
    ctx.beginPath();
    ctx.ellipse(18, -26, 18, 4, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillRect(10, -40, 16, 16);
    ctx.fillStyle = '#5a3820';
    ctx.fillRect(10, -40, 16, 3);
  }
  if (opts.apron) {
    ctx.fillStyle = '#fff';
    ctx.fillRect(-10, -2, 20, 18);
    ctx.strokeStyle = '#ddd';
    ctx.lineWidth = 1;
    ctx.strokeRect(-10, -2, 20, 18);
    // Apron strings
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-10, -2);
    ctx.lineTo(-16, -8);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(10, -2);
    ctx.lineTo(16, -8);
    ctx.stroke();
  }
  if (opts.necklace) {
    ctx.strokeStyle = '#FFD700';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(10, -2, 12, -0.3, Math.PI + 0.3);
    ctx.stroke();
    for (let i = 0; i < 5; i++) {
      const a = -0.3 + (Math.PI + 0.6) * i / 4;
      ctx.fillStyle = '#FFD700';
      ctx.beginPath();
      ctx.arc(10 + Math.cos(a) * 12, -2 + Math.sin(a) * 12, 2, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.restore();
}

function drawIntroScene0(t) {

  ctx.translate(panX, panY);

  // Sky - golden hour gradient

  skyGrad.addColorStop(0, '#4A90D9');
  skyGrad.addColorStop(0.3, '#87CEEB');
  skyGrad.addColorStop(0.6, '#FFE4B5');
  skyGrad.addColorStop(0.8, '#FFD700');
  skyGrad.addColorStop(1, '#90EE90');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(-20, -20, WIDTH + 40, HEIGHT + 40);

  // Distant mountains (parallax layer 1)
  ctx.fillStyle = '#7B9EBF';
  ctx.beginPath();
  ctx.moveTo(-20, HEIGHT - 200);

    ctx.lineTo(x, HEIGHT - 200 - Math.sin(x * 0.005) * 50 - Math.cos(x * 0.008) * 30);

  ctx.lineTo(-20, HEIGHT);

  ctx.lineTo(-20, HEIGHT);

  // Trees on hillside
  for (let i = 0; i < 12; i++) {

  ctx.beginPath();
  ctx.moveTo(-20, HEIGHT - 110);

  // Floating pollen/dandelion seeds
  for (let i = 0; i < 20; i++) {
    const px = (i * 67 + t * 15) % (WIDTH + 40) - 20;
    const py = 60 + (i * 43 + Math.sin(t * 0.5 + i) * 40) % (HEIGHT - 160);
    ctx.fillStyle = `rgba(255,255,220,${0.3 + Math.sin(t + i) * 0.15})`;
    ctx.beginPath();
    ctx.arc(px, py, 1.5, 0, Math.PI * 2);
    ctx.fill();
  }

  // Butterflies
  for (let i = 0; i < 3; i++) {
    const bx = 200 + i * 120 + Math.sin(t * 1.5 + i * 2) * 50;
    const by = HEIGHT - 160 + Math.sin(t * 2 + i * 3) * 20;
    const wing = Math.sin(t * 8 + i * 4) * 0.3;
    ctx.fillStyle = ['#FF69B4', '#FFD700', '#87CEEB'][i];
    ctx.save();
    ctx.translate(bx, by);
    ctx.beginPath();
    ctx.ellipse(-4, 0, 5, 3 + wing * 3, wing, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(4, 0, 5, 3 + wing * 3, -wing, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#333';
    ctx.fillRect(-0.5, -2, 1, 5);
    ctx.restore();
  }

  // Mama pig
  drawDetailedPig(240, HEIGHT - 150, 1.3, 1, { happy: true, apron: true, necklace: true });
  // Tata pig
  drawDetailedPig(150, HEIGHT - 155, 1.4, 1, { happy: true, hat: true });

  // 13 piglets
  const pigletPos = [
    [310, HEIGHT-138], [350, HEIGHT-132], [390, HEIGHT-140],
    [195, HEIGHT-128], [260, HEIGHT-130], [430, HEIGHT-135],
    [470, HEIGHT-130], [330, HEIGHT-122], [370, HEIGHT-125],
    [175, HEIGHT-125], [280, HEIGHT-118], [410, HEIGHT-120],
    [450, HEIGHT-123]
  ];
  for (let i = 0; i < pigletPos.length; i++) {
    const px = pigletPos[i][0], py = pigletPos[i][1];
    const jump = (i % 3 === 0) ? -Math.abs(Math.sin(t * 3 + i)) * 12 : 0;
    const sc = 0.55 + (i % 4) * 0.05;
    drawDetailedPig(px, py + jump, sc, (i % 2 === 0) ? 1 : -1, { happy: i % 2 === 0 });
  }

  // Mud puddle with playing piglets
  ctx.fillStyle = '#8B6C42';
  ctx.beginPath();
  ctx.ellipse(340, HEIGHT - 108, 40, 10, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#705530';
  ctx.beginPath();
  ctx.ellipse(340, HEIGHT - 108, 35, 7, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore(); // pan

  drawVignette(0.25);
  drawLetterbox();
}

function drawIntroScene1(t) {
  // Scene 1: "Crni dan" - The butcher arrives
  // Sky transitions from purple to blood red
  const skyGrad = ctx.createLinearGradient(0, 0, 0, HEIGHT);
  const redShift = Math.min(1, t / 6);
  skyGrad.addColorStop(0, `rgb(${40 + redShift * 60}, ${20 - redShift * 10}, ${50 - redShift * 30})`);
  skyGrad.addColorStop(0.5, `rgb(${60 + redShift * 80}, ${20}, ${20})`);
  skyGrad.addColorStop(1, `rgb(${30 + redShift * 40}, ${40 - redShift * 20}, ${30 - redShift * 15})`);
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, WIDTH, HEIGHT);

  // Ominous clouds
  for (let i = 0; i < 6; i++) {
    const cx = (i * 200 + t * 10) % (WIDTH + 200) - 100;
    ctx.fillStyle = `rgba(40, 10, 10, ${0.4 + Math.sin(t + i) * 0.1})`;
    ctx.beginPath();
    ctx.arc(cx, 60 + i * 15, 50 + i * 10, 0, Math.PI * 2);
    ctx.arc(cx + 40, 55 + i * 15, 40 + i * 8, 0, Math.PI * 2);
    ctx.arc(cx - 30, 65 + i * 15, 35 + i * 6, 0, Math.PI * 2);
    ctx.fill();
  }

  // Lightning flashes
  if (Math.sin(t * 4) > 0.95 || (t > 3 && Math.sin(t * 7) > 0.97)) {
    ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
    ctx.fillRect(0, 0, WIDTH, HEIGHT);
  }

  // Dark ground
  ctx.fillStyle = '#2A3A20';
  ctx.fillRect(0, HEIGHT - 120, WIDTH, 120);
  // Dead grass patches
  ctx.fillStyle = '#3A4A2A';
  for (let x = 0; x < WIDTH; x += 30) {
    ctx.fillRect(x, HEIGHT - 120, 15, 5);
  }

  // Farm in shadow (left side)
  ctx.fillStyle = '#3A2010';
  ctx.fillRect(60, HEIGHT - 230, 180, 110);
  ctx.fillStyle = '#661111';
  ctx.beginPath();
  ctx.moveTo(40, HEIGHT - 230);
  ctx.lineTo(150, HEIGHT - 300);
  ctx.lineTo(260, HEIGHT - 230);
  ctx.closePath();
  ctx.fill();
  // Frightened eyes in windows
  ctx.fillStyle = '#FFE080';
  ctx.fillRect(90, HEIGHT - 195, 30, 22);
  ctx.fillRect(170, HEIGHT - 195, 30, 22);
  // Eyes peeking
  const eyeBlink = Math.sin(t * 5) > 0.3 ? 1 : 0;
  if (eyeBlink) {
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(100, HEIGHT - 186, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(110, HEIGHT - 186, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(180, HEIGHT - 188, 2.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(188, HEIGHT - 188, 2.5, 0, Math.PI * 2);
    ctx.fill();
  }

  // Crows flying away
  ctx.strokeStyle = '#111';
  ctx.lineWidth = 2;
  for (let i = 0; i < 7; i++) {
    const cx = 150 + i * 40 - t * 30 - i * 15;
    const cy = 100 + i * 20 - t * 15;
    const wingFlap = Math.sin(t * 6 + i * 2) * 5;
    ctx.beginPath();
    ctx.moveTo(cx - 8, cy + wingFlap);
    ctx.quadraticCurveTo(cx, cy - 3, cx + 8, cy + wingFlap);
    ctx.stroke();
  }

  // Ground fog rolling in from right
  for (let i = 0; i < 10; i++) {
    const fogX = WIDTH - t * 40 + i * 80 + Math.sin(t + i) * 30;
    const fogY = HEIGHT - 100 + Math.sin(i * 1.3) * 15;
    ctx.fillStyle = `rgba(60, 30, 30, ${0.2 + Math.sin(t * 0.5 + i) * 0.08})`;
    ctx.beginPath();
    ctx.ellipse(fogX, fogY, 60 + i * 5, 15, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  // BUTCHER - menacing silhouette approaching from right
  const butcherX = Math.min(WIDTH * 0.65, WIDTH + 80 - t * 65);
  const butcherScale = 1.5 + Math.min(0.5, t * 0.05);
  ctx.save();
  ctx.translate(butcherX, HEIGHT - 170);
  ctx.scale(butcherScale, butcherScale);
  // Dark body silhouette
  ctx.fillStyle = '#0A0A0A';
  ctx.beginPath();
  ctx.ellipse(0, 0, 30, 40, 0, 0, Math.PI * 2);
  ctx.fill();
  // Head
  ctx.beginPath();
  ctx.arc(0, -45, 20, 0, Math.PI * 2);
  ctx.fill();
  // Glowing red eyes
  ctx.fillStyle = '#FF0000';
  ctx.shadowColor = '#FF0000';
  ctx.shadowBlur = 15;
  ctx.beginPath();
  ctx.arc(-6, -48, 3, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(6, -48, 3, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
  // Crossed knives
  ctx.strokeStyle = '#888';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(-25, -60);
  ctx.lineTo(25, -20);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(25, -60);
  ctx.lineTo(-25, -20);
  ctx.stroke();
  // Knife blades gleam
  ctx.strokeStyle = '#DDD';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(-24, -58);
  ctx.lineTo(0, -40);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(24, -58);
  ctx.lineTo(0, -40);
  ctx.stroke();
  // Dripping blood
  for (let d = 0; d < 3; d++) {
    const dropY = -20 + ((t * 40 + d * 30) % 40);
    ctx.fillStyle = '#880000';
    ctx.beginPath();
    ctx.arc(-15 + d * 15, dropY, 2, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();

  // Red screen flash when butcher is close
  if (t > 3 && t < 4) {
    ctx.fillStyle = `rgba(150, 0, 0, ${Math.sin((t - 3) * Math.PI) * 0.25})`;
    ctx.fillRect(0, 0, WIDTH, HEIGHT);
  }
  if (t > 5) {
    // Blood splatters on edges
    ctx.fillStyle = `rgba(120, 0, 0, ${Math.min(0.4, (t - 5) * 0.15)})`;
    ctx.beginPath();
    ctx.arc(30, HEIGHT / 2 - 50, 40, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(WIDTH - 40, HEIGHT / 2 + 30, 35, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(60, HEIGHT - 80, 25, 0, Math.PI * 2);
    ctx.fill();
  }

  drawVignette(0.5 + Math.min(0.2, t * 0.03));
  drawLetterbox();
}

function drawIntroScene2(t) {
  // Scene 2: "Sama na svetu" - alone in the rain
  // Desaturated dark sky
  ctx.fillStyle = '#1A1A2A';
  ctx.fillRect(0, 0, WIDTH, HEIGHT);

  // Wet dark ground with puddle reflections
  const groundGrad = ctx.createLinearGradient(0, HEIGHT - 100, 0, HEIGHT);
  groundGrad.addColorStop(0, '#1A2A1A');
  groundGrad.addColorStop(1, '#0A1A0A');
  ctx.fillStyle = groundGrad;
  ctx.fillRect(0, HEIGHT - 100, WIDTH, 100);

  // Puddles
  for (let i = 0; i < 8; i++) {
    const px = 80 + i * 140 + Math.sin(i * 3.7) * 40;
    const py = HEIGHT - 70 + (i % 3) * 15;
    ctx.fillStyle = 'rgba(40, 50, 70, 0.5)';
    ctx.beginPath();
    ctx.ellipse(px, py, 25 + i * 3, 5, 0, 0, Math.PI * 2);
    ctx.fill();
    // Ripple from rain
    const ripple = (t * 2 + i) % 2;
    if (ripple < 1.5) {
      ctx.strokeStyle = `rgba(80, 100, 130, ${0.3 - ripple * 0.2})`;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.ellipse(px + Math.sin(t + i) * 5, py, 5 + ripple * 10, 2 + ripple * 2, 0, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  // Lightning flash
  if (Math.sin(t * 3.7) > 0.97) {
    ctx.fillStyle = 'rgba(180, 190, 220, 0.2)';
    ctx.fillRect(0, 0, WIDTH, HEIGHT);
  }

  // Heavy cinematic rain
  ctx.lineWidth = 1.5;
  for (let i = 0; i < 120; i++) {
    const rx = (i * 37 + t * 120) % (WIDTH + 40) - 20;
    const ry = (i * 53 + t * 350) % (HEIGHT + 40) - 20;
    const len = 15 + (i % 5) * 3;
    ctx.strokeStyle = `rgba(150, 170, 200, ${0.15 + (i % 3) * 0.08})`;
    ctx.beginPath();
    ctx.moveTo(rx, ry);
    ctx.lineTo(rx - 3, ry + len);
    ctx.stroke();
  }

  // 12 ghostly siblings fading away behind
  for (let i = 0; i < 12; i++) {
    const angle = (i / 12) * Math.PI * 1.2 + Math.PI * 0.9;
    const dist = 80 + Math.sin(i * 1.7) * 20;
    const sx = WIDTH / 2 + Math.cos(angle) * dist;
    const sy = HEIGHT / 2 + 30 + Math.sin(angle) * 25 + 10;
    const fadeOut = Math.max(0, 0.4 - t * 0.04);
    ctx.globalAlpha = fadeOut;
    drawDetailedPig(sx, sy, 0.5, (i % 2 === 0) ? 1 : -1, { sad: true, bodyColor: '#CCAABB' });
    ctx.globalAlpha = 1;
  }

  // Broken photo frame on ground
  if (t > 1) {
    const frameAlpha = Math.min(0.8, (t - 1) * 0.5);
    ctx.globalAlpha = frameAlpha;
    const fx = WIDTH / 2 - 100, fy = HEIGHT / 2 + 80;
    // Frame
    ctx.strokeStyle = '#8B6914';
    ctx.lineWidth = 3;
    ctx.strokeRect(fx, fy, 40, 30);
    // Cracked glass line
    ctx.strokeStyle = 'rgba(200,200,200,0.4)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(fx + 5, fy + 2);
    ctx.lineTo(fx + 25, fy + 28);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(fx + 35, fy + 5);
    ctx.lineTo(fx + 15, fy + 20);
    ctx.stroke();
    // Faded family inside
    ctx.fillStyle = 'rgba(255,182,193,0.3)';
    ctx.beginPath();
    ctx.arc(fx + 15, fy + 12, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(fx + 25, fy + 14, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  // Dead flowers
  ctx.strokeStyle = '#4A3A2A';
  ctx.lineWidth = 1.5;
  for (let i = 0; i < 5; i++) {
    const dx = WIDTH / 2 + 80 + i * 25;
    const dy = HEIGHT / 2 + 70;
    ctx.beginPath();
    ctx.moveTo(dx, dy + 15);
    ctx.quadraticCurveTo(dx + 3, dy, dx - 2, dy - 8);
    ctx.stroke();
    ctx.fillStyle = '#5A4A3A';
    ctx.beginPath();
    ctx.arc(dx - 2, dy - 10, 3, 0, Math.PI * 2);
    ctx.fill();
  }

  // Central piglet - large, detailed, shivering
  const shiver = Math.sin(t * 12) * 1.5;
  const cx = WIDTH / 2 + shiver, cy = HEIGHT / 2 + 25;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(2, 2);
  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.beginPath();
  ctx.ellipse(0, 20, 24, 5, 0, 0, Math.PI * 2);
  ctx.fill();
  // Body
  ctx.fillStyle = '#EAAAB5';
  ctx.beginPath();
  ctx.ellipse(0, 0, 22, 16, 0, 0, Math.PI * 2);
  ctx.fill();
  // Head
  ctx.beginPath();
  ctx.arc(0, -18, 16, 0, Math.PI * 2);
  ctx.fill();
  // Huge sad eyes
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(-7, -22, 6, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(7, -22, 6, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#3366AA';
  ctx.beginPath();
  ctx.arc(-6, -21, 3.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(8, -21, 3.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(-6, -21, 2, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(8, -21, 2, 0, Math.PI * 2);
  ctx.fill();
  // Eye reflections
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(-7, -23, 1.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(7, -23, 1.5, 0, Math.PI * 2);
  ctx.fill();
  // Tears streaming
  ctx.fillStyle = '#66BBEE';
  for (let tear = 0; tear < 3; tear++) {
    const ty = -16 + ((t * 30 + tear * 20) % 35);
    const to = Math.max(0, 0.7 - ty * 0.015);
    ctx.globalAlpha = to;
    ctx.beginPath();
    ctx.arc(-8, ty, 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(9, ty + 5, 1.8, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  // Snout
  ctx.fillStyle = '#E09BA5';
  ctx.beginPath();
  ctx.ellipse(0, -14, 8, 5, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#C08090';
  ctx.beginPath();
  ctx.arc(-2.5, -14, 1.8, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(2.5, -14, 1.8, 0, Math.PI * 2);
  ctx.fill();
  // Sad mouth
  ctx.strokeStyle = '#B07080';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(0, -8, 5, Math.PI + 0.3, -0.3);
  ctx.stroke();
  // Ears drooping
  ctx.fillStyle = '#E09BAA';
  ctx.beginPath();
  ctx.moveTo(-11, -30);
  ctx.quadraticCurveTo(-20, -28, -18, -20);
  ctx.quadraticCurveTo(-14, -25, -11, -30);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(11, -30);
  ctx.quadraticCurveTo(20, -28, 18, -20);
  ctx.quadraticCurveTo(14, -25, 11, -30);
  ctx.fill();
  ctx.restore();

  // Color grading: desaturate
  ctx.fillStyle = 'rgba(20, 20, 40, 0.15)';
  ctx.fillRect(0, 0, WIDTH, HEIGHT);

  drawVignette(0.6);
  drawLetterbox();
}

function drawIntroScene3(t) {
  // Scene 3: "Nada" - Epic sunrise, hope
  // Sky transition
  const skyGrad = ctx.createLinearGradient(0, 0, 0, HEIGHT);
  const dawn = Math.min(1, t / 5);
  skyGrad.addColorStop(0, `rgb(${20 + dawn * 50}, ${20 + dawn * 40}, ${60 + dawn * 120})`);
  skyGrad.addColorStop(0.3, `rgb(${50 + dawn * 180}, ${30 + dawn * 80}, ${40 + dawn * 30})`);
  skyGrad.addColorStop(0.55, `rgb(${100 + dawn * 155}, ${80 + dawn * 135}, ${0 + dawn * 60})`);
  skyGrad.addColorStop(0.75, `rgb(${60 + dawn * 90}, ${120 + dawn * 110}, ${30 + dawn * 70})`);
  skyGrad.addColorStop(1, '#4CAF50');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, WIDTH, HEIGHT);

  // Mountain silhouettes
  ctx.fillStyle = '#1A1A3A';
  ctx.beginPath();
  ctx.moveTo(-20, HEIGHT - 150);
  ctx.lineTo(150, HEIGHT - 300);
  ctx.lineTo(300, HEIGHT - 220);
  ctx.lineTo(450, HEIGHT - 340);
  ctx.lineTo(600, HEIGHT - 250);
  ctx.lineTo(750, HEIGHT - 310);
  ctx.lineTo(900, HEIGHT - 230);
  ctx.lineTo(1050, HEIGHT - 280);
  ctx.lineTo(WIDTH + 20, HEIGHT - 200);
  ctx.lineTo(WIDTH + 20, HEIGHT);
  ctx.lineTo(-20, HEIGHT);
  ctx.fill();

  // Sun rising from behind mountains
  const sunY = HEIGHT - 200 - Math.min(80, t * 12);
  const sunR = 40 + Math.min(20, t * 3);
  // Volumetric light beams
  ctx.save();
  ctx.globalAlpha = 0.08 + Math.min(0.12, t * 0.015);
  for (let i = 0; i < 16; i++) {
    const angle = (i / 16) * Math.PI - Math.PI / 2;
    const spread = 0.015 + Math.sin(t * 0.3 + i) * 0.005;
    ctx.fillStyle = `rgba(255, ${200 + i * 3}, ${50 + i * 10}, 1)`;
    ctx.beginPath();
    ctx.moveTo(WIDTH / 2, sunY);
    ctx.lineTo(WIDTH / 2 + Math.cos(angle - spread) * 800, sunY + Math.sin(angle - spread) * 800);
    ctx.lineTo(WIDTH / 2 + Math.cos(angle + spread) * 800, sunY + Math.sin(angle + spread) * 800);
    ctx.fill();
  }
  ctx.restore();
  // Sun glow
  const glow = ctx.createRadialGradient(WIDTH / 2, sunY, 0, WIDTH / 2, sunY, sunR * 3);
  glow.addColorStop(0, 'rgba(255,240,200,0.8)');
  glow.addColorStop(0.3, 'rgba(255,200,50,0.3)');
  glow.addColorStop(0.7, 'rgba(255,150,0,0.1)');
  glow.addColorStop(1, 'rgba(255,100,0,0)');
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(WIDTH / 2, sunY, sunR * 3, 0, Math.PI * 2);
  ctx.fill();
  // Sun disc
  ctx.fillStyle = '#FFF5CC';
  ctx.beginPath();
  ctx.arc(WIDTH / 2, sunY, sunR, 0, Math.PI * 2);
  ctx.fill();
  // Lens flare
  if (t > 2) {
    const flareAlpha = Math.min(0.3, (t - 2) * 0.05);
    ctx.globalAlpha = flareAlpha;
    ctx.fillStyle = '#FFD700';
    ctx.beginPath();
    ctx.arc(WIDTH / 2 + 80, sunY + 40, 8, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,200,100,0.5)';
    ctx.beginPath();
    ctx.arc(WIDTH / 2 + 150, sunY + 70, 15, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  // Green hill foreground
  ctx.fillStyle = '#4CAF50';
  ctx.beginPath();
  ctx.moveTo(-20, HEIGHT - 100);
  for (let x = -20; x <= WIDTH + 20; x += 20) {
    ctx.lineTo(x, HEIGHT - 100 - Math.sin(x * 0.006) * 30);
  }
  ctx.lineTo(WIDTH + 20, HEIGHT);
  ctx.lineTo(-20, HEIGHT);
  ctx.fill();

  // Birds in V formation
  if (t > 1.5) {
    ctx.strokeStyle = '#222';
    ctx.lineWidth = 1.5;
    const birdX = WIDTH / 2 - 40 + (t - 1.5) * 30;
    const birdY = sunY - 40 - (t - 1.5) * 8;
    for (let i = 0; i < 5; i++) {
      const bx = birdX - i * 15 - (i > 2 ? (i - 2) * 15 : 0);
      const by = birdY + Math.abs(i - 2) * 12;
      const wing = Math.sin(t * 5 + i) * 4;
      ctx.beginPath();
      ctx.moveTo(bx - 6, by + wing);
      ctx.quadraticCurveTo(bx, by - 2, bx + 6, by + wing);
      ctx.stroke();
    }
  }

  // Flowers blooming as light reaches them
  if (t > 2) {
    const bloomProgress = Math.min(1, (t - 2) / 3);
    for (let i = 0; i < 15; i++) {
      const fx = 100 + i * 70 + Math.sin(i * 2.1) * 20;
      const fy = HEIGHT - 95 + Math.sin(fx * 0.01) * 10;
      const bloomSize = bloomProgress * (3 + (i % 3));
      const bloomDelay = i * 0.15;
      const bs = Math.max(0, Math.min(1, (t - 2 - bloomDelay) * 2)) * bloomSize;
      if (bs > 0) {
        ctx.fillStyle = ['#FF6B8A', '#FFD700', '#FF69B4', '#FF9F43', '#E879F9'][i % 5];
        ctx.beginPath();
        ctx.arc(fx, fy, bs, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#3D8B3D';
        ctx.fillRect(fx - 0.5, fy, 1, 8);
      }
    }
  }

  // Rainbow (faint)
  if (t > 3) {
    const rainbowAlpha = Math.min(0.2, (t - 3) * 0.04);
    ctx.globalAlpha = rainbowAlpha;
    const colors = ['#FF0000', '#FF7F00', '#FFFF00', '#00FF00', '#0000FF', '#8B00FF'];
    for (let i = 0; i < colors.length; i++) {
      ctx.strokeStyle = colors[i];
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(WIDTH / 2, HEIGHT + 50, 280 + i * 6, Math.PI, 0);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  // Piglet on hilltop
  const pigHillX = WIDTH / 2 - 60, pigHillY = HEIGHT - 140;
  // Wind effect on ears
  const earWind = Math.sin(t * 3) * 0.2;
  ctx.save();
  ctx.translate(pigHillX, pigHillY);
  ctx.scale(1.8, 1.8);
  drawDetailedPig(0, 0, 1, 1, { happy: t > 4 });
  ctx.restore();

  // Golden coins raining from sky
  ctx.font = '24px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (let i = 0; i < 10; i++) {
    const cx = (WIDTH / 2 + 80 + i * 50 + Math.sin(i * 1.7) * 60) % WIDTH;
    const cy = 50 + ((t * 50 + i * 60) % (HEIGHT - 160));
    const sparkle = Math.sin(t * 4 + i * 2) * 0.3 + 0.7;
    ctx.globalAlpha = sparkle * 0.7;
    ctx.fillText('\u{1FA99}', cx, cy);
    // Trailing particle
    ctx.fillStyle = 'rgba(255,215,0,0.3)';
    ctx.beginPath();
    ctx.arc(cx, cy - 10, 3, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  drawVignette(0.2);
  drawLetterbox();
}

    const slideX = (1 - entryProgress) * 30;

    ctx.save();
    ctx.globalAlpha = entryProgress;

    // Hover glow on current entry

  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#fff';
  ctx.fillText('\u25B6 Klikni za po\u010Detak!', WIDTH / 2, btnY);
}

function drawIntro() {
  const t = introTimer;

  // Draw scene-specific content
  switch (introScene) {
    case 0: drawIntroScene0(t); break;
    case 1: drawIntroScene1(t); break;
    case 2: drawIntroScene2(t); break;
    case 3: drawIntroScene3(t); break;

      ]
    },

    // Body text - fade in line by line
    ctx.font = '22px sans-serif';
    for (let i = 0; i < scene.lines.length; i++) {
      const lineDelay = 0.5 + i * 1.0;
      const lineAlpha = Math.min(1, Math.max(0, (t - lineDelay) * 2));
      ctx.globalAlpha = lineAlpha;

      ctx.fillText(scene.lines[i], WIDTH / 2, HEIGHT - 80 + i * 30);
    }
    ctx.lineWidth = 1;
    ctx.restore();
  }

  // "Click for sound" hint if audio not unlocked yet
  if (!audioUnlocked) {
    const soundPulse = 0.5 + 0.5 * Math.abs(Math.sin(Date.now() / 400));
    ctx.globalAlpha = soundPulse;
    ctx.font = 'bold 20px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 3;
    ctx.strokeText('\u{1F50A} Klikni za zvuk!', WIDTH / 2, HEIGHT - 10);

    ctx.globalAlpha = 1.0;

  // Skip hint at bottom-right (after 2 seconds)
  if (t > 2 && introScene < 5 && audioUnlocked) {
    const hintAlpha = Math.min(0.7, (t - 2) * 2);
    ctx.globalAlpha = hintAlpha;
    ctx.font = '16px sans-serif';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'bottom';
    ctx.fillStyle = '#fff';
    ctx.fillText('SPACE \u25B6', WIDTH - 20, HEIGHT - 10);

  // Fade-to-black transition

    ctx.fillStyle = 'rgba(0, 0, 0, ' + Math.min(1, introFadeOut / 0.3) + ')';
    ctx.fillRect(0, 0, WIDTH, HEIGHT);
  }
}

function getLevelEndText(level) {
  const texts = {
    1: { main: 'JUHUU! Jo\u0161 sam \u017Eiva! \u{1F389}', sub: 'Mislio sam da ne\u0107u pre\u017Eiveti ni prvi dan...' },
    2: { main: 'Pre\u017Eivesmo i ovo! *prrrrc* \u{1F4A8}', sub: 'Izvini za smrad, od straha je...' },
    3: { main: 'Ha! Prevarila sam ih! \u{1F92A}', sub: 'Glumila sam mrtvu, a oni poverovali!' },
    4: { main: 'Ko je car? JA sam car! \u{1F451}', sub: 'Neka mi neko da krunu!' },
    5: { main: 'Moji dragi nov\u010Di\u0107i... \u{1F495}', sub: 'Ne brinite, ja \u0107u vas \u010Duvati!' },
    6: { main: 'Njanjanja! Nisi me uhvatio! \u{1F61D}', sub: 'Be\u017Ei kasapine, be\u017Ei!' },
  };
  const lvl7plus = [
    { main: 'L-E-G-E-N-D-A! \u{1F3C6}', sub: 'Ovo ni Chuck Norris ne bi pre\u017Eiveo!' },

function drawLevelEndAnimation(level, timer) {
  const pigX = WIDTH / 2;
  const pigY = HEIGHT / 2 + 30;

  switch (level) {
    case 1: {
      // Bouncing piggy
      const bounceY = -Math.abs(Math.sin(timer * 4)) * (20 + timer * 5);
      drawPiggySprite(pigX, pigY + bounceY, 0, 'happy');
      break;
    }
    case 2: {
      // Farting piggy with growing green cloud
      drawPiggySprite(pigX, pigY, 0, 'farting');
      // Growing green cloud
      const cloudSize = Math.min(timer * 40, 120);
      const cloudGrad = ctx.createRadialGradient(pigX, pigY + 10, 0, pigX, pigY + 10, cloudSize);
      cloudGrad.addColorStop(0, 'rgba(80, 180, 30, 0.4)');
      cloudGrad.addColorStop(0.6, 'rgba(100, 200, 40, 0.2)');
      cloudGrad.addColorStop(1, 'rgba(120, 220, 50, 0)');
      ctx.fillStyle = cloudGrad;
      ctx.beginPath();
      ctx.arc(pigX - 20, pigY + 10, cloudSize, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(pigX + 15, pigY + 15, cloudSize * 0.8, 0, Math.PI * 2);
      ctx.fill();
      // Stink lines
      ctx.font = '20px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      for (let i = 0; i < 4; i++) {
        const angle = timer * 2 + i * 1.5;
        ctx.globalAlpha = 0.5;
        ctx.fillText('\u{1F4A8}', pigX - 30 + Math.cos(angle) * cloudSize * 0.5, pigY + Math.sin(angle) * cloudSize * 0.3);
      }
      ctx.globalAlpha = 1.0;
      break;
    }
    case 3: {
      // Play dead then spring up
      if (timer < 1.5) {
        // Lying on side with X eyes
        ctx.save();
        ctx.translate(pigX, pigY);
        ctx.rotate(Math.PI / 2);
        drawPiggySprite(0, 0, 0, 'normal');
        ctx.restore();
        // X eyes
        ctx.font = 'bold 16px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillStyle = '#000';
        ctx.fillText('X  X', pigX + 5, pigY - 10);
      } else {
        // Spring up!
        const springT = timer - 1.5;
        const springY = -Math.abs(Math.sin(springT * 6)) * 30;
        const springAngle = Math.sin(springT * 8) * 0.2;
        ctx.save();
        ctx.translate(pigX, pigY + springY);
        ctx.rotate(springAngle);
        drawPiggySprite(0, 0, 0, 'happy');
        ctx.restore();
        // Surprise effect
        if (springT < 0.5) {
          ctx.font = '30px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('\u2757', pigX + 30, pigY - 40 + springY);
        }
      }
      break;
    }
    case 4: {
      // Victory dance - sway left and right
      const swayX = Math.sin(timer * 3) * 30;
      const scalePulse = 1 + Math.sin(timer * 6) * 0.1;
      ctx.save();
      ctx.translate(pigX + swayX, pigY);
      ctx.scale(scalePulse, scalePulse);
      drawPiggySprite(0, 0, Math.sin(timer * 3), 'happy');
      ctx.restore();
      // Crown
      ctx.font = '30px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('\u{1F451}', pigX + swayX, pigY - 40);
      break;
    }
    case 5: {
      // Hugging coins
      drawPiggySprite(pigX, pigY, 1, 'happy');
      // Pile of coins
      ctx.font = '24px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const coinEmojis = ['\u{1FA99}', '\u{1F4B0}', '\u{1F4B5}', '\u{1FA99}', '\u{1FA99}'];
      for (let i = 0; i < coinEmojis.length; i++) {
        const cx = pigX + 40 + (i % 3) * 15 - 10;
        const cy = pigY + 10 - Math.floor(i / 3) * 20;
        ctx.fillText(coinEmojis[i], cx, cy);
      }
      // Hearts
      if (timer > 0.5) {
        ctx.font = '18px sans-serif';
        for (let i = 0; i < 3; i++) {
          const hx = pigX + 20 + Math.sin(timer * 2 + i * 2) * 20;
          const hy = pigY - 30 - i * 15 - timer * 5;
          ctx.globalAlpha = Math.max(0, 1 - timer * 0.15 + i * 0.1);
          ctx.fillText('\u2764\uFE0F', hx, hy);
        }
        ctx.globalAlpha = 1.0;
      }
      break;
    }
    case 6: {
      // Tongue out at butcher
      drawPiggySprite(pigX - 30, pigY, -1, 'happy');
      // Tongue
      ctx.fillStyle = '#ff6666';
      ctx.beginPath();
      ctx.ellipse(pigX - 65, pigY + 2, 6, 10, 0.2, 0, Math.PI * 2);
      ctx.fill();
      // Tiny butcher running away
      const butcherX = pigX + 80 + timer * 40;
      ctx.font = '24px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.globalAlpha = Math.max(0, 1 - timer * 0.2);
      ctx.fillText('\u{1F9D1}\u200D\u{1F373}', butcherX, pigY);
      ctx.font = '12px sans-serif';
      ctx.fillText('\u{1F4A8}', butcherX - 20, pigY);
      ctx.globalAlpha = 1.0;
      break;
    }
    default: {
      // Level 7+: Epic celebration - spinning piggy with confetti
      ctx.save();
      ctx.translate(pigX, pigY);
      ctx.rotate(timer * 3);
      const epicScale = 1 + Math.sin(timer * 5) * 0.15;
      ctx.scale(epicScale, epicScale);
      drawPiggySprite(0, 0, 0, 'happy');
      ctx.restore();
      // Extra confetti
      ctx.font = '18px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const confettiChars = ['\u{1F389}', '\u{1F38A}', '\u2728', '\u2B50', '\u{1F451}', '\u{1F4AB}'];
      for (let i = 0; i < 15; i++) {
        const angle = timer * 1.5 + i * 0.42;
        const dist = 60 + i * 10 + Math.sin(timer * 2 + i) * 20;
        const cx = pigX + Math.cos(angle) * dist;
        const cy = pigY + Math.sin(angle) * dist * 0.6;
        ctx.globalAlpha = 0.6 + 0.4 * Math.sin(timer * 4 + i);
        ctx.fillText(confettiChars[i % confettiChars.length], cx, cy);
      }
      ctx.globalAlpha = 1.0;
      break;
    }
  }
}

function drawTitle() {
  // Background falling coins
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = '28px sans-serif';
  for (const coin of titleCoins) {
    ctx.globalAlpha = coin.alpha;
    ctx.fillText(coin.emoji, coin.x, coin.y);
  }
  ctx.globalAlpha = 1.0;

  // Title
  ctx.font = 'bold 52px sans-serif';
  ctx.fillStyle = '#2d2d2d';
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 4;
  ctx.strokeText('\u{1F437} Kasica Prasica \u{1F437}', WIDTH / 2, HEIGHT / 2 - 50);
  ctx.fillText('\u{1F437} Kasica Prasica \u{1F437}', WIDTH / 2, HEIGHT / 2 - 50);

  ctx.fillStyle = '#555';

  // Start prompt - BIG TAP BUTTON

  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.roundRect(btnX, btnY, btnW, btnH, 15);
  ctx.fill();
  ctx.stroke();
  ctx.font = `bold ${isMobile ? 34 : 26}px sans-serif`;
  ctx.fillStyle = '#fff';
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 3;
  ctx.strokeText(isMobile ? '\uD83D\uDC46 IGRAJ!' : 'Klikni ili pritisni SPACE', WIDTH / 2, btnY + btnH / 2);
  ctx.fillText(isMobile ? '\uD83D\uDC46 IGRAJ!' : 'Klikni ili pritisni SPACE', WIDTH / 2, btnY + btnH / 2);

  // Leaderboard
  var lb = JSON.parse(localStorage.getItem('kasicaLeaderboard') || '[]');

    ctx.fillStyle = '#FFD700';
    ctx.textAlign = 'center';
    ctx.fillText('\uD83C\uDFC6 TOP IGRA\u010CI', WIDTH / 2, HEIGHT - 170);

    ctx.font = '14px sans-serif';
