// --- Level Configuration (with difficulty tuning) ---
function getLevelConfig(level) {
  // HARD MODE: tons of devils, fast bombs, chaos!
  let spawnRate, fallSpeed, devilCount, bombChance, billChance, goldChance, duration;

  if (level === 1) {
    duration = 30;
    fallSpeed = 220;
    spawnRate = 0.5;
    devilCount = 5;
    bombChance = 0.12;
    billChance = 0.10;
    goldChance = 0.03;
  } else if (level === 2) {
    duration = 35;
    fallSpeed = 270;
    spawnRate = 0.4;
    devilCount = 8;
    bombChance = 0.18;
    billChance = 0.15;
    goldChance = 0.05;
  } else if (level === 3) {
    duration = 35;
    fallSpeed = 320;
    spawnRate = 0.35;
    devilCount = 12;
    bombChance = 0.22;
    billChance = 0.20;
    goldChance = 0.07;
  } else if (level === 4) {
    duration = 40;
    fallSpeed = 370;
    spawnRate = 0.28;
    devilCount = 16;
    bombChance = 0.28;
    billChance = 0.20;
    goldChance = 0.08;
  } else if (level === 5) {
    duration = 40;
    fallSpeed = 420;
    spawnRate = 0.22;
    devilCount = 20;
    bombChance = 0.32;
    billChance = 0.25;
    goldChance = 0.10;
  } else if (level === 6) {
    duration = 45;
    fallSpeed = 470;
    spawnRate = 0.18;
    devilCount = 25;
    bombChance = 0.35;
    billChance = 0.25;
    goldChance = 0.10;
  } else if (level === 7) {
    duration = 45;
    fallSpeed = 520;
    spawnRate = 0.15;
    devilCount = 30;
    bombChance = 0.38;
    billChance = 0.25;
    goldChance = 0.12;
  } else {
    // Level 8+: ABSOLUTE CHAOS
    duration = 40 + level * 3;
    fallSpeed = 480 + level * 35;
    spawnRate = Math.max(0.10, 0.15 - (level - 7) * 0.01);
    devilCount = 25 + level * 3;
    bombChance = Math.min(0.50, 0.35 + (level - 7) * 0.03);
    billChance = 0.25;
    goldChance = 0.12;
  }

  return { duration, fallSpeed, spawnRate, devilCount, bombChance, billChance, goldChance };
}

// --- Particle System ---
const particles = [];
const MAX_PARTICLES = 100;

function spawnParticles(x, y, emoji, count, spread) {
  for (let i = 0; i < count; i++) {
    if (particles.length >= MAX_PARTICLES) break;
    particles.push({
      x, y,
      emoji: emoji,
      size: 12 + Math.random() * 8,
      vx: (Math.random() - 0.5) * (spread || 200),
      vy: -Math.random() * 250 - 50,
      gravity: 400,
      life: 1.0,
      decay: 0.8 + Math.random() * 0.5
    });
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt;
    p.vy += p.gravity * dt;
    p.y += p.vy * dt;
    p.life -= p.decay * dt;
    if (p.life <= 0) {
      particles.splice(i, 1);
    }
  }
}

function drawParticles() {
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.font = p.size + 'px sans-serif';
    ctx.fillText(p.emoji, p.x, p.y);
  }
  ctx.globalAlpha = 1.0;
}

// --- Screen Shake ---
let screenShake = { intensity: 0, duration: 0 };
function triggerScreenShake(intensity, duration) {
  screenShake.intensity = intensity;
  screenShake.duration = duration;
}

function updateScreenShake(dt) {
  if (screenShake.duration > 0) {
    screenShake.duration -= dt;
    if (screenShake.duration <= 0) {
      screenShake.intensity = 0;
      screenShake.duration = 0;
    }
  }
}

function applyScreenShake() {
  if (screenShake.intensity > 0 && screenShake.duration > 0) {
    const offsetX = (Math.random() - 0.5) * 2 * screenShake.intensity;
    const offsetY = (Math.random() - 0.5) * 2 * screenShake.intensity;
    ctx.translate(offsetX, offsetY);
    return true;
  }
  return false;
}

// --- Score Pop-ups ---
const scorePopups = [];

function spawnScorePopup(x, y, text, color) {
  scorePopups.push({
    x, y,
    text: text,
    color: color,
    life: 1.0,
    vy: -80
  });
}

function updateScorePopups(dt) {
  for (let i = scorePopups.length - 1; i >= 0; i--) {
    const p = scorePopups[i];
    p.y += p.vy * dt;
    p.life -= 0.8 * dt;
    if (p.life <= 0) {
      scorePopups.splice(i, 1);
    }
  }
}

function drawScorePopups() {
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (const p of scorePopups) {
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.font = 'bold 22px sans-serif';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 3;
    ctx.strokeText(p.text, p.x, p.y);
    ctx.fillStyle = p.color;
    ctx.fillText(p.text, p.x, p.y);
  }
  ctx.globalAlpha = 1.0;
  ctx.lineWidth = 1;
}

// --- Audio ---
let audioCtx = null;
let audioUnlocked = false;
function getAudioContext() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
// Unlock audio on ANY user interaction (click, touch, key)
function unlockAudio() {
  if (audioUnlocked) return;
  const ctx = getAudioContext();
  if (ctx.state === 'suspended') ctx.resume();
  // Play a silent buffer to fully unlock
  const buf = ctx.createBuffer(1, 1, 22050);
  const src = ctx.createBufferSource();
  src.buffer = buf;
  src.connect(ctx.destination);
  src.start(0);
  audioUnlocked = true;
}
document.addEventListener('click', unlockAudio);
document.addEventListener('touchstart', unlockAudio);
document.addEventListener('keydown', unlockAudio, { once: false });

function playSqueal() {
  try {
  const actx = getAudioContext();
  const t = actx.currentTime;
  const duration = 0.5;

  // Layer 1: Main vocal scream - starts at 600Hz, sweeps to 1500Hz
  const osc1 = actx.createOscillator();
  osc1.type = 'sawtooth';
  osc1.frequency.setValueAtTime(600, t);
  osc1.frequency.linearRampToValueAtTime(1500, t + 0.08);
  osc1.frequency.linearRampToValueAtTime(1200, t + 0.2);
  osc1.frequency.linearRampToValueAtTime(1800, t + 0.35);
  osc1.frequency.linearRampToValueAtTime(700, t + duration);

  // Formant filter for vocal/animal quality
  const formant1 = actx.createBiquadFilter();
  formant1.type = 'bandpass';
  formant1.frequency.value = 1200;
  formant1.Q.value = 4;

  // Amplitude tremolo (fast volume oscillation for screaming quality)
  const tremolo = actx.createOscillator();
  tremolo.frequency.value = 25;
  const tremoloGain = actx.createGain();
  tremoloGain.gain.value = 0.15;
  tremolo.connect(tremoloGain);

  const gain1 = actx.createGain();
  gain1.gain.setValueAtTime(0, t);
  gain1.gain.linearRampToValueAtTime(0.35, t + 0.02);
  gain1.gain.setValueAtTime(0.35, t + 0.15);
  gain1.gain.linearRampToValueAtTime(0.2, t + 0.35);
  gain1.gain.linearRampToValueAtTime(0, t + duration);
  tremoloGain.connect(gain1.gain);

  osc1.connect(formant1);
  formant1.connect(gain1);
  gain1.connect(actx.destination);
  osc1.start(t);
  osc1.stop(t + duration);
  tremolo.start(t);
  tremolo.stop(t + duration);

  // Layer 2: Higher harmonic for piercing screech
  const osc2 = actx.createOscillator();
  osc2.type = 'square';
  osc2.frequency.setValueAtTime(1200, t);
  osc2.frequency.linearRampToValueAtTime(2400, t + 0.06);
  osc2.frequency.linearRampToValueAtTime(1800, t + 0.2);
  osc2.frequency.linearRampToValueAtTime(2800, t + 0.4);
  osc2.frequency.linearRampToValueAtTime(1000, t + duration);

  const formant2 = actx.createBiquadFilter();
  formant2.type = 'bandpass';
  formant2.frequency.value = 2200;
  formant2.Q.value = 3;

  const gain2 = actx.createGain();
  gain2.gain.setValueAtTime(0, t);
  gain2.gain.linearRampToValueAtTime(0.18, t + 0.03);
  gain2.gain.linearRampToValueAtTime(0.12, t + 0.3);
  gain2.gain.linearRampToValueAtTime(0, t + duration);

  osc2.connect(formant2);
  formant2.connect(gain2);
  gain2.connect(actx.destination);
  osc2.start(t);
  osc2.stop(t + duration);

  // Layer 3: Sub-harmonic growl underneath
  const osc3 = actx.createOscillator();
  osc3.type = 'sawtooth';
  osc3.frequency.setValueAtTime(300, t);
  osc3.frequency.linearRampToValueAtTime(500, t + 0.1);
  osc3.frequency.linearRampToValueAtTime(350, t + duration);
  const gain3 = actx.createGain();
  gain3.gain.setValueAtTime(0.1, t);
  gain3.gain.linearRampToValueAtTime(0.05, t + 0.3);
  gain3.gain.linearRampToValueAtTime(0, t + duration);
  osc3.connect(gain3);
  gain3.connect(actx.destination);
  osc3.start(t);
  osc3.stop(t + duration);

  // Noise burst for breathy texture
  const bufferSize = actx.sampleRate * 0.4;
  const buffer = actx.createBuffer(1, bufferSize, actx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) {
    data[i] = (Math.random() * 2 - 1) * 0.3;
  }
  const noise = actx.createBufferSource();
  noise.buffer = buffer;
  const hpFilter = actx.createBiquadFilter();
  hpFilter.type = 'highpass';
  hpFilter.frequency.value = 2500;
  const noiseGain = actx.createGain();
  noiseGain.gain.setValueAtTime(0.1, t);
  noiseGain.gain.linearRampToValueAtTime(0.05, t + 0.2);
  noiseGain.gain.linearRampToValueAtTime(0, t + 0.4);
  noise.connect(hpFilter);
  hpFilter.connect(noiseGain);
  noiseGain.connect(actx.destination);
  noise.start(t);
  noise.stop(t + 0.4);
  } catch (e) {}
}

// --- Background Music System ---
let musicPlaying = false;
let musicNodes = null;
let beatCount = 0;
let beatTimer = 0;
const BPM = 140;
const BEAT_DURATION = 60 / BPM;
let musicLoopTimeout = null;

function playOink(delay) {
  try {
    const actx = getAudioContext();
    const t = actx.currentTime + (delay || 0);
    const duration = 0.25;

    // Main vocal - sawtooth for richness
    const voice = actx.createOscillator();
    voice.type = 'sawtooth';
    voice.frequency.setValueAtTime(180, t);
    voice.frequency.linearRampToValueAtTime(280, t + 0.06);
    voice.frequency.linearRampToValueAtTime(200, t + 0.15);
    voice.frequency.linearRampToValueAtTime(150, t + duration);

    // Vibrato for organic feel
    const vibrato = actx.createOscillator();
    vibrato.frequency.value = 6;
    const vibratoGain = actx.createGain();
    vibratoGain.gain.value = 15;
    vibrato.connect(vibratoGain);
    vibratoGain.connect(voice.frequency);

    // Nasal resonance filter
    const nasal = actx.createBiquadFilter();
    nasal.type = 'bandpass';
    nasal.frequency.value = 1000;
    nasal.Q.value = 3;

    // Envelope
    const env = actx.createGain();
    env.gain.setValueAtTime(0, t);
    env.gain.linearRampToValueAtTime(0.25, t + 0.02);
    env.gain.setValueAtTime(0.25, t + 0.08);
    env.gain.linearRampToValueAtTime(0, t + duration);

    // Oink master gain (louder than music)
    const oinkMaster = actx.createGain();
    oinkMaster.gain.value = 0.5;

    voice.connect(nasal);
    nasal.connect(env);
    env.connect(oinkMaster);
    oinkMaster.connect(actx.destination);
    vibrato.start(t);
    voice.start(t);
    voice.stop(t + duration);
    vibrato.stop(t + duration);
  } catch (e) {}
}

function playDoubleOink() {
  playOink(0);
  playOink(0.18);
}

function startMusic() {
  if (musicPlaying) return;
  musicPlaying = true;
  beatCount = 0;
  beatTimer = 0;
  scheduleMusicalBar();
}

function stopMusic() {
  musicPlaying = false;
  if (musicLoopTimeout) {
    clearTimeout(musicLoopTimeout);
    musicLoopTimeout = null;
  }
  if (musicNodes) {
    musicNodes.forEach(n => { try { n.stop(); } catch(e) {} });
    musicNodes = null;
  }
}

function scheduleMusicalBar() {
  if (!musicPlaying) return;
  try {
    const actx = getAudioContext();
    const now = actx.currentTime;
    const nodes = [];
    const masterGain = actx.createGain();
    masterGain.gain.value = 0.12;
    masterGain.connect(actx.destination);

    const beatLen = BEAT_DURATION;
    const barLen = beatLen * 4;
    const totalBars = 4;
    const totalDuration = barLen * totalBars;

    // --- Bass line (square wave, low) ---
    // 4 bars: C2-C2-Eb2-G2 | Ab1-Ab1-G1-F1 | C2-C2-Eb2-G2 | Ab1-Ab1-G1-F1
    const bassNotes = [
      65.41, 65.41, 77.78, 98.00,
      51.91, 51.91, 49.00, 43.65,
      65.41, 65.41, 77.78, 98.00,
      51.91, 51.91, 49.00, 43.65
    ];
    const bassOsc = actx.createOscillator();
    bassOsc.type = 'square';
    const bassGain = actx.createGain();
    bassGain.gain.value = 0.35;
    bassOsc.connect(bassGain);
    bassGain.connect(masterGain);
    for (let i = 0; i < bassNotes.length; i++) {
      const t = now + i * beatLen;
      bassOsc.frequency.setValueAtTime(bassNotes[i], t);
    }
    bassOsc.start(now);
    bassOsc.stop(now + totalDuration);
    nodes.push(bassOsc);

    // --- Melody (triangle wave, higher octave) ---
    // 8th notes = beatLen/2, 32 notes total for 4 bars
    const melodyNotes = [
      // Bar 1: C4-Eb4-G4-C5 ascending playful
      261.6, 311.1, 392.0, 523.3, 392.0, 311.1, 261.6, 311.1,
      // Bar 2: Bb3-G3-Eb4-C4
      233.1, 196.0, 311.1, 261.6, 311.1, 392.0, 523.3, 392.0,
      // Bar 3: Ab3-Bb3-C4-Eb4
      207.7, 233.1, 261.6, 311.1, 392.0, 523.3, 392.0, 311.1,
      // Bar 4: G3-Eb3-C4-G3 resolution
      196.0, 155.6, 261.6, 196.0, 261.6, 311.1, 261.6, 196.0
    ];
    const melOsc = actx.createOscillator();
    melOsc.type = 'triangle';
    const melGain = actx.createGain();
    melGain.gain.value = 0.25;
    melOsc.connect(melGain);
    melGain.connect(masterGain);
    const eighthNote = beatLen / 2;
    for (let i = 0; i < melodyNotes.length; i++) {
      const t = now + i * eighthNote;
      melOsc.frequency.setValueAtTime(melodyNotes[i], t);
      // Add slight volume pulse per note for bounce
      melGain.gain.setValueAtTime(0.25, t);
      melGain.gain.linearRampToValueAtTime(0.15, t + eighthNote * 0.8);
    }
    melOsc.start(now);
    melOsc.stop(now + totalDuration);
    nodes.push(melOsc);

    // --- Percussion ---
    // Kick on beats 1,3 - low noise burst
    // Snare on beats 2,4 - mid noise burst
    // Hi-hat on every beat - high noise short
    for (let bar = 0; bar < totalBars; bar++) {
      for (let beat = 0; beat < 4; beat++) {
        const t = now + (bar * 4 + beat) * beatLen;

        // Hi-hat (every beat)
        const hhBuf = actx.createBuffer(1, actx.sampleRate * 0.03, actx.sampleRate);
        const hhData = hhBuf.getChannelData(0);
        for (let s = 0; s < hhData.length; s++) hhData[s] = (Math.random() * 2 - 1) * (1 - s / hhData.length);
        const hh = actx.createBufferSource();
        hh.buffer = hhBuf;
        const hhFilter = actx.createBiquadFilter();
        hhFilter.type = 'highpass';
        hhFilter.frequency.value = 7000;
        const hhGain = actx.createGain();
        hhGain.gain.setValueAtTime(0.6, t);
        hhGain.gain.linearRampToValueAtTime(0, t + 0.03);
        hh.connect(hhFilter);
        hhFilter.connect(hhGain);
        hhGain.connect(masterGain);
        hh.start(t);
        hh.stop(t + 0.03);
        nodes.push(hh);

        if (beat === 0 || beat === 2) {
          // Kick
          const kickOsc = actx.createOscillator();
          kickOsc.type = 'sine';
          kickOsc.frequency.setValueAtTime(150, t);
          kickOsc.frequency.linearRampToValueAtTime(40, t + 0.1);
          const kickGain = actx.createGain();
          kickGain.gain.setValueAtTime(0.7, t);
          kickGain.gain.linearRampToValueAtTime(0, t + 0.1);
          kickOsc.connect(kickGain);
          kickGain.connect(masterGain);
          kickOsc.start(t);
          kickOsc.stop(t + 0.1);
          nodes.push(kickOsc);
        }

        if (beat === 1 || beat === 3) {
          // Snare
          const snBuf = actx.createBuffer(1, actx.sampleRate * 0.08, actx.sampleRate);
          const snData = snBuf.getChannelData(0);
          for (let s = 0; s < snData.length; s++) snData[s] = (Math.random() * 2 - 1) * (1 - s / snData.length);
          const sn = actx.createBufferSource();
          sn.buffer = snBuf;
          const snFilter = actx.createBiquadFilter();
          snFilter.type = 'bandpass';
          snFilter.frequency.value = 3000;
          snFilter.Q.value = 1;
          const snGain = actx.createGain();
          snGain.gain.setValueAtTime(0.5, t);
          snGain.gain.linearRampToValueAtTime(0, t + 0.08);
          sn.connect(snFilter);
          snFilter.connect(snGain);
          snGain.connect(masterGain);
          sn.start(t);
          sn.stop(t + 0.08);
          nodes.push(sn);
        }
      }
    }

    // Store nodes so we can stop them
    if (musicNodes) {
      musicNodes.forEach(n => { try { n.stop(); } catch(e) {} });
    }
    musicNodes = nodes;

    // Schedule next bar slightly before current ends
    const scheduleAhead = totalDuration * 1000 - 100;
    musicLoopTimeout = setTimeout(() => {
      if (musicPlaying) scheduleMusicalBar();
    }, scheduleAhead);

  } catch (e) {}
}

// --- Coin Types (drawn as real coins, not emoji) ---
const COIN_TYPES = [
  { type: 'bronze', value: 1, weight: 60, colors: ['#CD7F32', '#A0522D', '#8B4513'], label: '1' },
  { type: 'silver', value: 5, weight: 25, colors: ['#C0C0C0', '#A8A8A8', '#808080'], label: '5' },
  { type: 'gold',   value: 10, weight: 15, colors: ['#FFD700', '#DAA520', '#B8860B'], label: '10' }
];

function drawCoin(x, y, size, coinType, time) {
  const r = size / 2;
  // Shimmer effect
  const shimmer = 0.08 * Math.sin(time * 5 + x * 0.1);

  // Outer ring (darker)
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fillStyle = coinType.colors[2];
  ctx.fill();
  ctx.closePath();

  // Inner face (main color + shimmer)
  ctx.beginPath();
  ctx.arc(x, y, r * 0.85, 0, Math.PI * 2);
  const grad = ctx.createRadialGradient(x - r * 0.2, y - r * 0.2, 0, x, y, r * 0.85);
  grad.addColorStop(0, lightenColor(coinType.colors[0], 0.3 + shimmer));
  grad.addColorStop(0.7, coinType.colors[0]);
  grad.addColorStop(1, coinType.colors[1]);
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.closePath();

  // Shine highlight (top-left)
  ctx.beginPath();
  ctx.arc(x - r * 0.25, y - r * 0.25, r * 0.3, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,' + (0.4 + shimmer) + ')';
  ctx.fill();
  ctx.closePath();

  // Value text
  ctx.font = 'bold ' + (r * 1.1) + 'px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = coinType.colors[2];
  ctx.fillText(coinType.label, x + 1, y + 1); // shadow
  ctx.fillStyle = '#fff';
  ctx.fillText(coinType.label, x, y);
  ctx.textBaseline = 'alphabetic'; // restore default
}

function lightenColor(hex, amount) {
  const num = parseInt(hex.slice(1), 16);
  let r = Math.min(255, ((num >> 16) & 0xFF) + Math.floor(255 * amount));
  let g = Math.min(255, ((num >> 8) & 0xFF) + Math.floor(255 * amount));
  let b = Math.min(255, (num & 0xFF) + Math.floor(255 * amount));
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}

// --- Special item types (emoji-based, rarer, higher value) ---
const SPECIAL_TYPES = [
  { type: 'bill', emoji: '💵', value: 20, size: 42 },
  { type: 'moneybag', emoji: '💰', value: 30, size: 48 }
];

function pickCoinType() {
  if (!game.levelConfig) return COIN_TYPES[0];
  const cfg = game.levelConfig;
  const roll = Math.random();
  if (roll < cfg.goldChance) return COIN_TYPES[2];
  if (roll < cfg.goldChance + cfg.billChance) return COIN_TYPES[1];
  return COIN_TYPES[0];
}

function spawnObject() {
  const cfg = game.levelConfig;
  const fallSpeed = cfg ? cfg.fallSpeed : 150;
  const bombChance = cfg ? cfg.bombChance : 0.05;

  if (Math.random() < bombChance) {
    const size = 40;
    objects.push({
      type: 'bomb',
      x: Math.random() * (WIDTH - size) + size / 2,
      y: -size / 2,
      width: size,
      height: size,
      speed: fallSpeed * 1.6,
      emoji: '\u{1F4A3}',
      value: 0
    });
    return;
  }

  // Rare special items: bill (💵 +20) and moneybag (💰 +30)
  const lvl = game.level || 1;
  const specialRoll = Math.random();
  const moneybagChance = lvl >= 3 ? Math.min(0.04, 0.01 + lvl * 0.004) : 0;
  const billChanceSpecial = lvl >= 2 ? Math.min(0.08, 0.03 + lvl * 0.006) : 0;

  if (specialRoll < moneybagChance) {
    const sp = SPECIAL_TYPES[1]; // moneybag
    objects.push({
      type: 'special',
      specialType: sp,
      x: Math.random() * (WIDTH - sp.size) + sp.size / 2,
      y: -sp.size / 2,
      width: sp.size, height: sp.size,
      speed: fallSpeed * 0.7, // falls slower - it's heavy!
      emoji: sp.emoji,
      value: sp.value
    });
    return;
  }
  if (specialRoll < moneybagChance + billChanceSpecial) {
    const sp = SPECIAL_TYPES[0]; // bill
    objects.push({
      type: 'special',
      specialType: sp,
      x: Math.random() * (WIDTH - sp.size) + sp.size / 2,
      y: -sp.size / 2,
      width: sp.size, height: sp.size,
      speed: fallSpeed * 0.85, // floats a bit
      emoji: sp.emoji,
      value: sp.value
    });
    return;
  }

  const coinType = pickCoinType();
  const size = coinType.value >= 10 ? 40 : (coinType.value >= 5 ? 36 : 30);
  objects.push({
    type: 'coin',
    coinType: coinType,
    x: Math.random() * (WIDTH - size) + size / 2,
    y: -size / 2,
    width: size,
    height: size,
    speed: fallSpeed,
    emoji: null,
    value: coinType.value
  });
}

function spawnDevil() {
  const cfg = game.levelConfig;
  const baseSpeed = cfg ? cfg.fallSpeed * 0.95 : 150;

  // Choose devil type based on level - appear earlier!
  const types = ['fast']; // always available
  if (game.level >= 2) types.push('heavy');
  if (game.level >= 3) types.push('thief');

  const devilType = types[Math.floor(Math.random() * types.length)];

  let emoji, speed, shakeRequired, hammerTimeout, size;

  switch (devilType) {
    case 'fast':
      emoji = '\u{1F608}'; speed = baseSpeed * 1.4; shakeRequired = 6;
      hammerTimeout = 4; size = 38;
      break;
    case 'heavy':
      emoji = '\u{1F47F}'; speed = baseSpeed * 0.85; shakeRequired = 14;
      hammerTimeout = 6; size = 48;
      break;
    case 'thief':
      emoji = '\u{1F479}'; speed = baseSpeed * 1.1; shakeRequired = 8;
      hammerTimeout = 4; size = 42;
      break;
  }

  // Zigzag parameters - unpredictable side-to-side movement
  const zigzagSpeed = 80 + Math.random() * 120; // how fast they swerve
  const zigzagFreq = 1.5 + Math.random() * 3;   // how often they change direction
  const zigzagPhase = Math.random() * Math.PI * 2; // random start phase

  objects.push({
    type: 'devil',
    devilType: devilType,
    emoji, x: Math.random() * (WIDTH - size) + size / 2, y: -size,
    width: size, height: size, speed,
    latched: false, hammerTimer: 0, shakeProgress: 0,
    shakeRequired, hammerTimeout, hammerAnimTimer: 0,
    stealTimer: 0,
    zigzagSpeed, zigzagFreq, zigzagPhase,
    zigzagTime: 0 // tracks time for zigzag calculation
  });
}

// --- Level Management ---
function startLevel() {
  const cfg = getLevelConfig(game.level);
  game.levelConfig = cfg;
  game.levelTimer = cfg.duration;
  game.devilsSpawned = 0;
  game.cracks = 0;
  game.latchedDevil = null;
  game.lastScore = game.score;

  // Calculate devil spawn schedule - start early, come in waves!
  game.devilSchedule = [];
  if (cfg.devilCount > 0) {
    const availableTime = cfg.duration - 3; // start after just 3 seconds
    const interval = availableTime / (cfg.devilCount + 1);
    for (let i = 1; i <= cfg.devilCount; i++) {
      // Add some randomness so devils don't come perfectly evenly
      const jitter = (Math.random() - 0.5) * interval * 0.4;
      const spawnAt = cfg.duration - (3 + interval * i) + jitter;
      game.devilSchedule.push(Math.max(1, spawnAt));
    }
    game.devilSchedule.sort((a, b) => b - a); // sort descending (highest time first)
  }

  // Clear everything
  objects.length = 0;
  ejectedCoins.length = 0;
  particles.length = 0;
  scorePopups.length = 0;
  spawnTimer = 0;
  flashTimer = 0;
  lastShakeKey = null;
  squealTimer = 0;
  successFlashTimer = 0;
  shakeHintTimer = 0;
  shakeVisualOffset = 0;
  shakeVisualTimer = 0;
  screenShake.intensity = 0;
  screenShake.duration = 0;
  piggyDamageTimer = 0;
  scoreBounceFactor = 0;
  player.x = WIDTH / 2;

  game.screen = 'playing';
  startMusic();
}

// --- Input ---
const keys = {};
window.addEventListener('keydown', (e) => {
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' '].includes(e.key)) {
    e.preventDefault();
  }
  keys[e.key] = true;

  // Shake detection when devil is latched
  if (game.latchedDevil && game.screen === 'playing') {
    if (e.key === 'ArrowUp' && lastShakeKey !== 'up') {
      game.latchedDevil.shakeProgress++;
      lastShakeKey = 'up';
      shakeVisualOffset = -5;
      shakeVisualTimer = 0.08;
      playShakeSound();
    } else if (e.key === 'ArrowDown' && lastShakeKey !== 'down') {
      game.latchedDevil.shakeProgress++;
      lastShakeKey = 'down';
      shakeVisualOffset = 5;
      shakeVisualTimer = 0.08;
      playShakeSound();
    }
  }

  if (e.key === ' ') {
    if (game.screen === 'title') {
      playOink();
      game.score = 0;
      game.level = 1;
      startLevel();
    } else if (game.screen === 'gameOver') {
      game.score = 0;
      game.level = 1;
      game.screen = 'title';
    } else if (game.screen === 'levelComplete') {
      game.level++;
      startLevel();
    }
  }
});

// Click/touch on canvas also starts/restarts game (and unlocks audio!)
canvas.addEventListener('click', () => {
  unlockAudio();
  if (game.screen === 'title') {
    playOink();
    game.score = 0;
    game.level = 1;
    startLevel();
  } else if (game.screen === 'gameOver') {
    game.score = 0;
    game.level = 1;
    game.screen = 'title';
  } else if (game.screen === 'levelComplete') {
    game.level++;
    startLevel();
  }
});

window.addEventListener('keyup', (e) => {
  keys[e.key] = false;
});

// --- AABB Collision ---
function aabb(a, b) {
  return (
    a.x - a.width / 2 < b.x + b.width / 2 &&
    a.x + a.width / 2 > b.x - b.width / 2 &&
    a.y - a.height / 2 < b.y + b.height / 2 &&
    a.y + a.height / 2 > b.y - b.height / 2
  );
}

// --- Update ---
function triggerDamage(fromBomb) {
  game.cracks++;
  game.score = Math.max(0, game.score - 5);
  flashTimer = 0.3;
  flashColor = '#ff0000';
  piggyDamageTimer = 0.3;
  spawnScorePopup(player.x, player.y - 40, '-5', '#ff4444');

  if (fromBomb) {
    // Bomb explosion particles
    const explosionEmojis = ['\u{1F4A5}', '\u{1F525}', '\u{1F4A5}', '\u{1F525}'];
    for (let i = 0; i < 7; i++) {
      spawnParticles(player.x, player.y, explosionEmojis[i % explosionEmojis.length], 1, 300);
    }
    triggerScreenShake(8, 0.3);
    playBombExplosion();
  }

  if (game.cracks >= 3) {
    game.screen = 'gameOver';
    stopMusic();
    playGameOver();
  }
}

function update(dt) {
  // Always update clouds
  updateClouds(dt);

  // Update title screen background coins
  if (game.screen === 'title') {
    titleCoinTimer += dt;
    if (titleCoinTimer >= 0.5) {
      titleCoinTimer -= 0.5;
      const emojis = ['\u{1FA99}', '\u{1F4B5}', '\u{1F4B0}'];
      titleCoins.push({
        x: Math.random() * WIDTH,
        y: -20,
        emoji: emojis[Math.floor(Math.random() * emojis.length)],
        speed: 60 + Math.random() * 40,
        alpha: 0.3 + Math.random() * 0.2
      });
    }
    for (let i = titleCoins.length - 1; i >= 0; i--) {
      titleCoins[i].y += titleCoins[i].speed * dt;
      if (titleCoins[i].y > HEIGHT + 30) {
        titleCoins.splice(i, 1);
      }
    }
    return;
  }

  // Update particles on level complete screen too
  if (game.screen === 'levelComplete') {
    updateParticles(dt);
    return;
  }

  if (game.screen !== 'playing') return;

  // Piggy bob timer
  piggyBobTimer += dt;

  // Beat tracking for music oinks
  if (musicPlaying) {
    beatTimer += dt;
    if (beatTimer >= BEAT_DURATION) {
      beatTimer -= BEAT_DURATION;
      beatCount++;
      if (beatCount % 8 === 0) {
        playDoubleOink();
      } else if (beatCount % 4 === 0) {
        playOink();
      }
    }
  }

  // Flash timer countdown
  if (flashTimer > 0) flashTimer -= dt;
  if (successFlashTimer > 0) successFlashTimer -= dt;
  if (piggyDamageTimer > 0) piggyDamageTimer -= dt;
  if (scoreBounceFactor > 0) scoreBounceFactor -= dt * 4;
  if (shakeVisualTimer > 0) {
    shakeVisualTimer -= dt;
    if (shakeVisualTimer <= 0) shakeVisualOffset = 0;
  }

  // Update screen shake
  updateScreenShake(dt);

  // Update particles
  updateParticles(dt);

  // Update score pop-ups
  updateScorePopups(dt);

  // Level timer countdown
  game.levelTimer -= dt;
  if (game.levelTimer <= 0) {
    game.levelTimer = 0;
    objects.length = 0;
    ejectedCoins.length = 0;
    if (game.latchedDevil) {
      game.latchedDevil = null;
      lastShakeKey = null;
      squealTimer = 0;
      shakeHintTimer = 0;
      devilTypeIndicator = null;
    }
    game.screen = 'levelComplete';
    stopMusic();
    playLevelComplete();
    // Level complete confetti particles
    const confettiEmojis = ['\u{1F389}', '\u{1F38A}', '\u2728', '\u{1F389}', '\u{1F38A}', '\u2728'];
    for (let i = 0; i < 18; i++) {
      spawnParticles(
        WIDTH * 0.2 + Math.random() * WIDTH * 0.6,
        HEIGHT * 0.3 + Math.random() * 50,
        confettiEmojis[i % confettiEmojis.length],
        1, 350
      );
    }
    return;
  }

  // Player movement
  if (keys['ArrowLeft']) {
    player.x -= player.speed * dt;
  }
  if (keys['ArrowRight']) {
    player.x += player.speed * dt;
  }
  const halfW = player.width / 2;
  if (player.x < halfW) player.x = halfW;
  if (player.x > WIDTH - halfW) player.x = WIDTH - halfW;

  // Spawn timer
  const spawnRate = game.levelConfig ? game.levelConfig.spawnRate : 1.0;
  spawnTimer += dt;
  if (spawnTimer >= spawnRate) {
    spawnTimer -= spawnRate;
    spawnObject();
  }

  // Devil spawn from schedule
  if (game.devilSchedule.length > 0) {
    const nextDevilTime = game.devilSchedule[0];
    if (game.levelTimer <= nextDevilTime) {
      game.devilSchedule.shift();
      game.devilsSpawned++;
      spawnDevil();
    }
  }

  // Update latched devil
  if (game.latchedDevil) {
    const devil = game.latchedDevil;
    devil.x = player.x;
    devil.y = player.y - 45;
    devil.hammerTimer += dt;
    devil.hammerAnimTimer += dt;
    shakeHintTimer += dt;

    // Continuous screen shake while devil is latched (subtle; heavy shakes harder)
    if (screenShake.duration <= 0) {
      const shakeIntensity = devil.devilType === 'heavy' ? 5 : 3;
      triggerScreenShake(shakeIntensity, 0.1);
    }

    // Squeal timer
    squealTimer += dt;
    if (squealTimer >= 0.5) {
      squealTimer -= 0.5;
      playSqueal();
    }

    // Thief devil steals coins every 0.5s
    if (devil.devilType === 'thief') {
      devil.stealTimer += dt;
      if (devil.stealTimer >= 0.5) {
        devil.stealTimer -= 0.5;
        game.score = Math.max(0, game.score - 2);
        spawnScorePopup(
          player.x + (Math.random() - 0.5) * 30,
          player.y - 60 - Math.random() * 20,
          '-2', '#cc44ff'
        );
      }
    }

    // Update devil type indicator timer
    if (devilTypeIndicator) {
      devilTypeIndicator.timer -= dt;
      if (devilTypeIndicator.timer <= 0) devilTypeIndicator = null;
    }

    // Shake success
    if (devil.shakeProgress >= devil.shakeRequired) {
      const flyDirection = (Math.random() < 0.5 ? -1 : 1);
      ejectedCoins.push({
        x: player.x,
        y: player.y - 20,
        startY: player.y - 20,
        targetX: devil.x,
        targetY: devil.y,
        phase: 'rising',
        timer: 0,
        riseDuration: 0.25,
        devilFlyX: flyDirection * (200 + Math.random() * 150),
        devilFlyY: -(200 + Math.random() * 100),
        devilEmoji: devil.emoji,
        devilW: devil.width,
        devilH: devil.height,
        devilAngle: 0,
        hitTimer: 0
      });

      game.score = Math.max(0, game.score - 3);
      spawnScorePopup(player.x, player.y - 50, '-3', '#ff4444');
      // Sparkle particles for devil knock-off
      for (let i = 0; i < 5; i++) {
        spawnParticles(player.x, player.y - 30, '\u2B50', 1, 180);
      }
      playShakeSuccess();

      game.latchedDevil = null;
      lastShakeKey = null;
      squealTimer = 0;
      shakeHintTimer = 0;
      successFlashTimer = 0.4;
      devilTypeIndicator = null;
    }
  }

  // Devil hammer timer expired
  if (game.latchedDevil) {
    const devil = game.latchedDevil;
    if (devil.hammerTimer >= devil.hammerTimeout) {
      triggerDamage(false);
      objects.push({
        type: 'devil',
        devilType: devil.devilType,
        emoji: devil.emoji,
        x: devil.x,
        y: devil.y,
        width: devil.width,
        height: devil.height,
        speed: 0,
        flyAway: true,
        flyAwayTimer: 0.5
      });
      game.latchedDevil = null;
      lastShakeKey = null;
      squealTimer = 0;
      shakeHintTimer = 0;
      devilTypeIndicator = null;
    }
  }

  // Update ejected coin animations
  for (let i = ejectedCoins.length - 1; i >= 0; i--) {
    const ec = ejectedCoins[i];
    ec.timer += dt;
    if (ec.phase === 'rising') {
      const t = Math.min(ec.timer / ec.riseDuration, 1.0);
      ec.y = ec.startY + t * (ec.targetY - ec.startY);
      if (t >= 1.0) {
        ec.phase = 'hit';
        ec.hitTimer = 0;
        ec.hitX = ec.x;
        ec.hitY = ec.targetY;
      }
    } else if (ec.phase === 'hit') {
      ec.hitTimer += dt;
      ec.devilAngle += dt * 10;
      ec.hitX += ec.devilFlyX * dt;
      ec.hitY += ec.devilFlyY * dt;
      if (ec.hitTimer > 0.6) {
        ejectedCoins.splice(i, 1);
      }
    }
  }

  // Update falling objects
  for (let i = objects.length - 1; i >= 0; i--) {
    const obj = objects[i];
    obj.y += obj.speed * dt;

    // Zigzag movement for devils
    if (obj.type === 'devil' && !obj.latched && !obj.flyAway && obj.zigzagSpeed) {
      obj.zigzagTime += dt;
      // Unpredictable swerving using combined sine waves
      const swerve = Math.sin(obj.zigzagTime * obj.zigzagFreq + obj.zigzagPhase)
                    + 0.5 * Math.sin(obj.zigzagTime * obj.zigzagFreq * 2.3 + obj.zigzagPhase * 1.7);
      obj.x += swerve * obj.zigzagSpeed * dt;
      // Keep within canvas bounds
      if (obj.x < obj.width / 2) obj.x = obj.width / 2;
      if (obj.x > WIDTH - obj.width / 2) obj.x = WIDTH - obj.width / 2;
    }

    // Fly-away devils
    if (obj.flyAway) {
      obj.flyAwayTimer -= dt;
      obj.y -= 300 * dt;
      obj.x += 150 * dt;
      if (obj.flyAwayTimer <= 0) {
        objects.splice(i, 1);
      }
      continue;
    }

    // Collision with player
    if (aabb(player, obj)) {
      if (obj.type === 'bomb') {
        triggerDamage(true);
        objects.splice(i, 1);
        continue;
      } else if (obj.type === 'devil') {
        if (!game.latchedDevil) {
          obj.latched = true;
          game.latchedDevil = {
            emoji: obj.emoji,
            devilType: obj.devilType || 'fast',
            x: player.x,
            y: player.y - 45,
            width: obj.width,
            height: obj.height,
            hammerTimer: 0,
            shakeProgress: 0,
            shakeRequired: obj.shakeRequired || 8,
            hammerTimeout: obj.hammerTimeout || 5,
            hammerAnimTimer: 0,
            stealTimer: 0
          };
          lastShakeKey = null;
          squealTimer = 0;
          shakeHintTimer = 0;
          playDevilLatch();
          // Show devil type indicator
          const dt = obj.devilType || 'fast';
          if (dt === 'fast') {
            devilTypeIndicator = { text: '\u26A1 BRZI!', color: '#ffff00', timer: 1.5 };
          } else if (dt === 'heavy') {
            devilTypeIndicator = { text: '\u{1F4AA} TE\u0160KI!', color: '#ff4444', timer: 1.5 };
          } else if (dt === 'thief') {
            devilTypeIndicator = { text: '\u{1F911} LOPOV!', color: '#cc44ff', timer: 1.5 };
          }
        }
        objects.splice(i, 1);
        continue;
      } else {
        // Coin collected
        game.score += obj.value;
        scoreBounceFactor = 1.0;

        // Particles + sound based on value
        if (obj.value === 1) {
          spawnParticles(obj.x, obj.y, '\u2728', 3, 120);
          spawnScorePopup(obj.x, obj.y - 10, '+1', '#ffffff');
          playCoinCollect();
        } else if (obj.value === 5) {
          spawnParticles(obj.x, obj.y, '\u2728', 4, 150);
          spawnScorePopup(obj.x, obj.y - 10, '+5', '#44dd44');
          playBillCollect();
        } else if (obj.value === 10) {
          spawnParticles(obj.x, obj.y, '\u2728', 5, 180);
          spawnScorePopup(obj.x, obj.y - 10, '+10', '#ffd700');
          playGoldCollect();
        } else if (obj.value === 20) {
          spawnParticles(obj.x, obj.y, '\u{1F4B5}', 4, 200);
          spawnParticles(obj.x, obj.y, '\u2728', 5, 160);
          spawnScorePopup(obj.x, obj.y - 10, '+20', '#22cc55');
          playGoldCollect();
        } else if (obj.value === 30) {
          spawnParticles(obj.x, obj.y, '\u{1F4B0}', 3, 200);
          spawnParticles(obj.x, obj.y, '\u2728', 8, 220);
          spawnScorePopup(obj.x, obj.y - 10, '+30', '#ff6600');
          playGoldCollect();
          // Extra flash for moneybag!
          flashTimer = 0.15;
          flashColor = 'rgba(255,215,0,';
        }

        objects.splice(i, 1);
        continue;
      }
    }

    // Off screen
    if (obj.y > HEIGHT + obj.height) {
      objects.splice(i, 1);
    }
  }
}

// --- Draw ---
function drawBackground() {
  // Vertical sky gradient
  const grad = ctx.createLinearGradient(0, 0, 0, HEIGHT);
  grad.addColorStop(0, '#87CEEB');
  grad.addColorStop(1, '#5BA3CF');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, WIDTH, HEIGHT);

  // Draw clouds
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (const c of clouds) {
    ctx.globalAlpha = 0.6;
    ctx.font = c.size + 'px sans-serif';
    ctx.fillText('\u2601\uFE0F', c.x, c.y);
  }
  ctx.globalAlpha = 1.0;
}

function drawGround() {
  const groundY = HEIGHT - 40;
  const groundHeight = 40;
  // Base green
  ctx.fillStyle = '#4CAF50';
  ctx.fillRect(0, groundY, WIDTH, groundHeight);
  // Darker stripe pattern for grass
  ctx.fillStyle = '#43A047';
  for (let x = 0; x < WIDTH; x += 20) {
    if ((x / 20) % 2 === 0) {
      ctx.fillRect(x, groundY, 10, groundHeight);
    }
  }
  // Scattered grass emoji
  ctx.font = '14px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.globalAlpha = 0.5;
  for (let x = 15; x < WIDTH; x += 55) {
    ctx.fillText('\u{1F33F}', x, groundY + 6);
  }
  ctx.globalAlpha = 1.0;
}

function drawPiggy() {
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  const bobOffset = Math.sin(piggyBobTimer * 3) * 2; // subtle idle bob
  const drawY = player.y + shakeVisualOffset + bobOffset;

  ctx.save();
  ctx.translate(player.x, drawY);

  // Wobble for 2 cracks
  if (game.cracks >= 2) {
    const wobble = Math.sin(Date.now() / 80) * 0.06;
    ctx.rotate(wobble);
  }

  // Scale pulse on damage
  let scale = 1.0;
  if (piggyDamageTimer > 0) {
    scale = 1.0 + 0.15 * Math.sin(piggyDamageTimer / 0.3 * Math.PI);
  }
  ctx.scale(scale, scale);

  // Red tint overlay for damage
  if (piggyDamageTimer > 0) {
    ctx.globalAlpha = 0.7;
  }

  ctx.font = '48px sans-serif';
  ctx.fillText(player.emoji, 0, 0);
  ctx.globalAlpha = 1.0;

  // Draw crack lines
  if (game.cracks >= 1) {
    ctx.strokeStyle = '#555';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-8, -12);
    ctx.lineTo(10, 10);
    ctx.stroke();
  }
  if (game.cracks >= 2) {
    ctx.strokeStyle = '#444';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(8, -14);
    ctx.lineTo(-6, 8);
    ctx.stroke();
  }

  ctx.restore();

  // Red tint flash on damage
  if (piggyDamageTimer > 0) {
    ctx.globalAlpha = piggyDamageTimer / 0.3 * 0.3;
    ctx.fillStyle = '#ff0000';
    ctx.beginPath();
    ctx.arc(player.x, drawY, 28, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1.0;
  }
}

function drawHUD() {
  // --- HUD with drop shadows and polished styling ---

  // Helper for drop shadow text
  function hudText(text, x, y, font, color, align) {
    ctx.textAlign = align || 'left';
    ctx.textBaseline = 'top';
    ctx.font = font;
    // Drop shadow
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fillText(text, x + 1, y + 2);
    // Main text
    ctx.fillStyle = color;
    ctx.fillText(text, x, y);
  }

  // Top-left: Score with bouncing coin icon
  const coinBounce = Math.sin(Math.max(0, scoreBounceFactor) * Math.PI) * 5;
  hudText('\u{1FA99}', 15, 12 - coinBounce, 'bold 24px sans-serif', '#fff', 'left');
  hudText(' Score: ' + game.score, 38, 14, 'bold 22px sans-serif', '#fff', 'left');

  // Top-center: Level with rounded background
  ctx.textAlign = 'center';
  const levelText = 'Level ' + game.level;
  ctx.font = 'bold 22px sans-serif';
  const levelTextW = ctx.measureText(levelText).width;
  // Rounded background pill
  const pillX = WIDTH / 2 - levelTextW / 2 - 14;
  const pillY = 8;
  const pillW = levelTextW + 28;
  const pillH = 28;
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.roundRect(pillX, pillY, pillW, pillH, 14);
  ctx.fill();
  hudText(levelText, WIDTH / 2, 10, 'bold 22px sans-serif', '#fff', 'center');

  // Timer bar below level text
  if (game.levelConfig) {
    const timerBarWidth = 160;
    const timerBarHeight = 10;
    const timerBarX = WIDTH / 2 - timerBarWidth / 2;
    const timerBarY = 40;
    const timerFill = Math.max(0, game.levelTimer / game.levelConfig.duration);

    ctx.fillStyle = '#333';
    ctx.beginPath();
    ctx.roundRect(timerBarX, timerBarY, timerBarWidth, timerBarHeight, 5);
    ctx.fill();

    let barColor;
    if (timerFill > 0.5) barColor = '#44cc44';
    else if (timerFill > 0.2) barColor = '#cccc44';
    else barColor = '#cc4444';

    ctx.fillStyle = barColor;
    ctx.beginPath();
    ctx.roundRect(timerBarX, timerBarY, timerBarWidth * timerFill, timerBarHeight, 5);
    ctx.fill();

    ctx.strokeStyle = 'rgba(0,0,0,0.3)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.roundRect(timerBarX, timerBarY, timerBarWidth, timerBarHeight, 5);
    ctx.stroke();

    // Time remaining
    hudText(Math.ceil(game.levelTimer) + 's', WIDTH / 2, 54, '14px sans-serif', 'rgba(255,255,255,0.8)', 'center');
  }

  // Top-right: Crack indicator with piggy icons
  ctx.textAlign = 'right';
  ctx.textBaseline = 'top';
  const crackStartX = WIDTH - 15;
  ctx.font = '22px sans-serif';
  for (let i = 0; i < 3; i++) {
    const cx = crackStartX - (2 - i) * 28;
    if (i < game.cracks) {
      // Cracked piggy (broken heart)
      ctx.globalAlpha = 0.9;
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.fillText('\u{1F494}', cx + 1, 16);
      ctx.fillText('\u{1F494}', cx, 14);
    } else {
      // Healthy piggy
      ctx.globalAlpha = 0.9;
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.fillText('\u{1F437}', cx + 1, 16);
      ctx.fillText('\u{1F437}', cx, 14);
    }
  }
  ctx.globalAlpha = 1.0;
}

function draw() {
  drawBackground();

  if (game.screen === 'title') {
    drawTitle();
  } else if (game.screen === 'playing') {
    drawPlayingScene();
  } else if (game.screen === 'levelComplete') {
    drawLevelComplete();
  } else if (game.screen === 'gameOver') {
    drawGameOver();
  }
}

function drawTitle() {
  // Background falling coins
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = '28px sans-serif';
  for (const coin of titleCoins) {
    ctx.globalAlpha = coin.alpha;
    ctx.fillText(coin.emoji, coin.x, coin.y);
  }
  ctx.globalAlpha = 1.0;

  // Title
  ctx.font = 'bold 52px sans-serif';
  ctx.fillStyle = '#2d2d2d';
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 4;
  ctx.strokeText('\u{1F437} Kasica Prasica \u{1F437}', WIDTH / 2, HEIGHT / 2 - 50);
  ctx.fillText('\u{1F437} Kasica Prasica \u{1F437}', WIDTH / 2, HEIGHT / 2 - 50);

  // Serbian subtitle
  ctx.font = '22px sans-serif';
  ctx.fillStyle = '#555';
  ctx.lineWidth = 1;
  ctx.fillText('Hvataj nov\u010di\u0107e! Izbegavaj bombe!', WIDTH / 2, HEIGHT / 2 + 10);

  // Start prompt (pulsing)
  const pulse = 0.5 + 0.5 * Math.abs(Math.sin(Date.now() / 500));
  ctx.globalAlpha = pulse;
  ctx.font = 'bold 26px sans-serif';
  ctx.fillStyle = '#333';
  ctx.fillText('Klikni ili pritisni SPACE', WIDTH / 2, HEIGHT / 2 + 60);
  ctx.globalAlpha = 1.0;
}

function drawPlayingScene() {
  ctx.save();
  // Apply screen shake
  applyScreenShake();

  drawGround();

  // Falling objects
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const now = performance.now() / 1000;
  for (const obj of objects) {
    if (obj.type === 'coin' && obj.coinType) {
      // Draw custom coin graphics
      drawCoin(obj.x, obj.y, obj.width, obj.coinType, now);
    } else if (obj.type === 'special') {
      // Bills and moneybags - emoji with golden glow
      const sz = obj.width || 42;
      ctx.font = sz + 'px sans-serif';
      // Glowing aura
      const glowPulse = 12 + 6 * Math.sin(now * 6 + obj.x);
      ctx.shadowColor = obj.value >= 30 ? '#ff8800' : '#44cc44';
      ctx.shadowBlur = glowPulse;
      // Slight floating bob
      const bob = Math.sin(now * 3 + obj.x * 0.05) * 3;
      ctx.fillText(obj.emoji, obj.x, obj.y + bob);
      ctx.shadowBlur = 0;
    } else if (obj.type === 'bomb') {
      ctx.font = '36px sans-serif';
      // Pulsing glow on bombs
      const pulseR = 20 + 5 * Math.sin(now * 10);
      ctx.shadowColor = '#ff4400';
      ctx.shadowBlur = pulseR;
      ctx.fillText(obj.emoji, obj.x, obj.y);
      ctx.shadowBlur = 0;
    } else if (obj.type === 'devil') {
      const dSize = obj.width || 38;
      ctx.font = dSize + 'px sans-serif';
      ctx.fillText(obj.emoji, obj.x, obj.y);
    } else {
      ctx.font = '32px sans-serif';
      ctx.fillText(obj.emoji || '', obj.x, obj.y);
    }
  }

  // Player (piggy with visual states)
  drawPiggy();

  // Latched devil on top of player
  if (game.latchedDevil) {
    const devil = game.latchedDevil;
    const devilFontSize = devil.devilType === 'heavy' ? 44 : (devil.devilType === 'thief' ? 40 : 36);
    ctx.font = devilFontSize + 'px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    // Visual flair per type
    if (devil.devilType === 'fast') {
      // Speed lines behind fast devil
      ctx.globalAlpha = 0.3;
      ctx.font = '14px sans-serif';
      for (let sl = 0; sl < 3; sl++) {
        ctx.fillText('\u2014', devil.x - 22 - sl * 8, devil.y - 5 + sl * 7 + shakeVisualOffset);
        ctx.fillText('\u2014', devil.x + 22 + sl * 8, devil.y - 5 + sl * 7 + shakeVisualOffset);
      }
      ctx.globalAlpha = 1.0;
      ctx.font = devilFontSize + 'px sans-serif';
    }

    ctx.fillText(devil.emoji, devil.x, devil.y + shakeVisualOffset);

    // Thief: show coin being stolen periodically
    if (devil.devilType === 'thief' && devil.stealTimer < 0.25) {
      ctx.font = '16px sans-serif';
      ctx.fillText('\u{1F4B0}', devil.x + 20, devil.y - 10 + shakeVisualOffset);
    }

    // Hammer animation (heavy has slower swing)
    const hammerRate = devil.devilType === 'heavy' ? 0.5 : 0.3;
    const hammerSide = Math.floor(devil.hammerAnimTimer / hammerRate) % 2 === 0 ? -1 : 1;
    ctx.font = '24px sans-serif';
    ctx.fillText('\u{1F528}', devil.x + hammerSide * 25, devil.y - 15 + shakeVisualOffset);

    // Danger bar (red) - uses dynamic hammerTimeout
    const barWidth = 60;
    const barHeight = 8;
    const barX = player.x - barWidth / 2;
    const barY = player.y - 80;
    const fill = Math.min(devil.hammerTimer / devil.hammerTimeout, 1.0);

    ctx.fillStyle = '#333';
    ctx.fillRect(barX, barY, barWidth, barHeight);

    let barAlpha = 1.0;
    if (fill > 0.8) {
      barAlpha = 0.5 + 0.5 * Math.abs(Math.sin(Date.now() / 100));
    }
    ctx.globalAlpha = barAlpha;
    ctx.fillStyle = '#ff2222';
    ctx.fillRect(barX, barY, barWidth * fill, barHeight);
    ctx.globalAlpha = 1.0;

    ctx.strokeStyle = '#000';
    ctx.lineWidth = 1;
    ctx.strokeRect(barX, barY, barWidth, barHeight);

    // Shake progress bar (green) - reflects different shakeRequired
    const shakeBarY = barY + barHeight + 3;
    const shakeFill = Math.min(devil.shakeProgress / devil.shakeRequired, 1.0);

    ctx.fillStyle = '#333';
    ctx.fillRect(barX, shakeBarY, barWidth, barHeight);
    ctx.fillStyle = '#44ff44';
    ctx.fillRect(barX, shakeBarY, barWidth * shakeFill, barHeight);
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 1;
    ctx.strokeRect(barX, shakeBarY, barWidth, barHeight);

    // Shake hint text
    const hintAlpha = 0.5 + 0.5 * Math.abs(Math.sin(Date.now() / 200));
    ctx.globalAlpha = hintAlpha;
    ctx.font = 'bold 18px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffff00';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 3;
    ctx.strokeText('\u2B06\u2B07 SHAKE!', player.x, player.y - 95);
    ctx.fillText('\u2B06\u2B07 SHAKE!', player.x, player.y - 95);
    ctx.globalAlpha = 1.0;
    ctx.lineWidth = 1;

    // Devil type indicator
    if (devilTypeIndicator) {
      const indAlpha = Math.min(1.0, devilTypeIndicator.timer / 0.3);
      ctx.globalAlpha = indAlpha;
      ctx.font = 'bold 26px sans-serif';
      ctx.textAlign = 'center';
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 4;
      ctx.strokeText(devilTypeIndicator.text, player.x, player.y - 115);
      ctx.fillStyle = devilTypeIndicator.color;
      ctx.fillText(devilTypeIndicator.text, player.x, player.y - 115);
      ctx.globalAlpha = 1.0;
      ctx.lineWidth = 1;
    }
  }

  // Ejected coin animations
  for (const ec of ejectedCoins) {
    if (ec.phase === 'rising') {
      ctx.font = '28px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('\u{1FA99}', ec.x, ec.y);
    } else if (ec.phase === 'hit') {
      ctx.save();
      ctx.translate(ec.hitX, ec.hitY);
      ctx.rotate(ec.devilAngle);
      ctx.font = '36px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.globalAlpha = Math.max(0, 1.0 - ec.hitTimer / 0.6);
      ctx.fillText(ec.devilEmoji, 0, 0);
      ctx.restore();
      ctx.globalAlpha = 1.0;
    }
  }

  // Particles
  drawParticles();

  // Score pop-ups
  drawScorePopups();

  // Success flash (green)
  if (successFlashTimer > 0) {
    ctx.globalAlpha = successFlashTimer / 0.4 * 0.25;
    ctx.fillStyle = '#00ff00';
    ctx.fillRect(0, 0, WIDTH, HEIGHT);
    ctx.globalAlpha = 1.0;
  }

  // Flash overlay (red for damage, gold for moneybag)
  if (flashTimer > 0) {
    ctx.globalAlpha = flashTimer / 0.3 * 0.4;
    ctx.fillStyle = flashColor || '#ff0000';
    ctx.fillRect(0, 0, WIDTH, HEIGHT);
    ctx.globalAlpha = 1.0;
  }

  ctx.restore(); // restore screen shake transform

  // HUD drawn outside shake transform so it stays stable
  drawHUD();
}

function drawLevelComplete() {
  // Celebratory background
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  // Sparkle effect
  const sparkleCount = 12;
  ctx.font = '20px sans-serif';
  for (let i = 0; i < sparkleCount; i++) {
    const angle = (Date.now() / 1000 + i * (Math.PI * 2 / sparkleCount));
    const radius = 120 + Math.sin(Date.now() / 300 + i) * 30;
    const sx = WIDTH / 2 + Math.cos(angle) * radius;
    const sy = HEIGHT / 2 - 30 + Math.sin(angle) * radius * 0.5;
    ctx.globalAlpha = 0.4 + 0.3 * Math.sin(Date.now() / 200 + i);
    ctx.fillText('\u2728', sx, sy);
  }
  ctx.globalAlpha = 1.0;

  // Particles (confetti)
  drawParticles();

  ctx.font = 'bold 48px sans-serif';
  ctx.fillStyle = '#2d2d2d';
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 3;
  ctx.strokeText('Level ' + game.level + ' Complete! \u2728', WIDTH / 2, HEIGHT / 2 - 50);
  ctx.fillText('Level ' + game.level + ' Complete! \u2728', WIDTH / 2, HEIGHT / 2 - 50);
  ctx.lineWidth = 1;

  ctx.font = '32px sans-serif';
  ctx.fillStyle = '#444';
  ctx.fillText('\u{1FA99} Score: ' + game.score, WIDTH / 2, HEIGHT / 2 + 10);

  const pulse = 0.5 + 0.5 * Math.abs(Math.sin(Date.now() / 500));
  ctx.globalAlpha = pulse;
  ctx.font = 'bold 24px sans-serif';
  ctx.fillStyle = '#333';
  ctx.fillText('Klikni za Level ' + (game.level + 1), WIDTH / 2, HEIGHT / 2 + 60);
  ctx.globalAlpha = 1.0;
}

function drawGameOver() {
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  ctx.font = 'bold 48px sans-serif';
  ctx.fillStyle = '#2d2d2d';
  ctx.fillText('\u{1F494} Game Over! \u{1F494}', WIDTH / 2, HEIGHT / 2 - 60);

  ctx.font = '28px sans-serif';
  ctx.fillStyle = '#444';
  ctx.fillText('Level: ' + game.level, WIDTH / 2, HEIGHT / 2);

  ctx.font = '32px sans-serif';
  ctx.fillStyle = '#444';
  ctx.fillText('\u{1FA99} Final Score: ' + game.score, WIDTH / 2, HEIGHT / 2 + 40);

  const pulse = 0.5 + 0.5 * Math.abs(Math.sin(Date.now() / 500));
  ctx.globalAlpha = pulse;
  ctx.font = 'bold 24px sans-serif';
  ctx.fillStyle = '#666';
  ctx.fillText('Klikni za novu igru', WIDTH / 2, HEIGHT / 2 + 90);
  ctx.globalAlpha = 1.0;
}

// --- Game Loop ---
let lastTime = 0;
function gameLoop(timestamp) {
  let dt = (timestamp - lastTime) / 1000;
  if (dt > 0.1) dt = 0.1;
  lastTime = timestamp;

  update(dt);
  draw();
  requestAnimationFrame(gameLoop);
}

requestAnimationFrame((timestamp) => {
  lastTime = timestamp;
  gameLoop(timestamp);
});
</script>
